<script>
/* Crawlers never run this. They read the meta above and stop.
   A human gets moved straight into the app with the sender
   and the kind carried across untouched. */
(function(){
  try{
    var qs = window.location.search || '';
    window.location.replace('/' + (qs ? qs : '?k=invite'));
  }catch(e){}
})();
</script>

<style>
  :root{--ink:#15130E;--ivory:#F6F3EB;--forest:#1F4B3A;--sage:#A0B0A4}

       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .card{max-width:560px;text-align:center}

  .micro{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--sage);margin-bottom:18px}
  h1{font-size:clamp(2.1rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.04}

  p{color:rgba(246,243,235,.66);font-size:15px;line-height:1.6;margin-top:18px}

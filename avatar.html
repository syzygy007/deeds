<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEDS · Dress your avatar</title>
<style>

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bone);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .frame{display:grid;grid-template-columns:1fr 360px;height:100vh;height:100dvh}
  .stage{position:relative;min-width:0;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  canvas:active{cursor:grabbing}
  canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--forest)}
  .rail{padding:40px 32px 36px;border-left:1px solid var(--mist);overflow:auto;min-height:0;display:flex;flex-direction:column}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--quiet);margin:0 0 12px}
  h1{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:.95;margin:0 0 14px}
  .coin{font-size:15px;margin:0 0 22px;min-height:1.4em}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px;margin:0 -4px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;background:none;border:1px solid var(--mist);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bone)}
  .tabs button:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  .rows{display:flex;flex-direction:column;margin-top:6px}
  .rows button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--mist);padding:12px 0;font:inherit;font-size:17px;color:var(--ink);text-align:left;cursor:pointer;letter-spacing:-.01em}
  .rows button:last-child{border-bottom:1px solid var(--mist)}
  .rows button span{display:flex;align-items:center;gap:10px}
  .rows button i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.14);flex:0 0 auto}
  .rows button em{font-style:normal;font-size:12px;color:var(--quiet);letter-spacing:.02em;text-align:right;flex:0 0 auto}
  .rows button.wearing{color:var(--forest);font-weight:700}
  .rows button.wearing em{color:var(--forest)}
  .rows button.locked{color:var(--quiet)}
  .rows button.confirm em{color:var(--ink);font-weight:700}
  .rows button:focus-visible{outline:2px solid var(--forest);outline-offset:-2px}
  .rows button[disabled]{cursor:default;opacity:.6}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);margin:22px 0 8px}
  .sw{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
  .sw button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.14);padding:0;cursor:pointer;transition:box-shadow .15s}
  .sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--forest)}
  .sw button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--ink)}
  .note{font-size:13px;color:var(--quiet);margin:10px 0 0}
  .foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hint{font-size:13px;color:var(--quiet);margin:0}
.back{display:inline-block;font-size:13px;color:var(--quiet);text-decoration:none;margin-bottom:16px}.back:hover{color:var(--ink)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.done{background:var(--forest);color:#F6F3EB;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
  .zoom{background:none;border:1px solid var(--mist);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
  .zoom:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  .toast{position:fixed;right:32px;bottom:88px;width:296px;background:var(--ink);color:var(--bone);font-size:14px;padding:10px 14px;border-radius:6px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
  .toast small{display:block;margin-top:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.35;color:rgba(255,255,255,.72);word-break:break-word}
  .toast.on{opacity:1;transform:none}
  @media (max-width:900px){
    .frame{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
    .rail{border-left:0;border-top:1px solid var(--mist);padding:18px 20px 28px}
    h1{font-size:32px;margin-bottom:8px}
    .coin{margin-bottom:12px}
    .foot{padding-top:18px}
    .toast{left:20px;right:20px;bottom:76px;width:auto}
  }
  @media (prefers-reduced-motion:reduce){.sw button,.toast{transition:none}}
</style>

      BUSY = false;
      if (r.error){ toast(fail(r.error, 'Could not put it on.'), raw(r.error)); paint(); return; }
      EQ[it.slot] = it.id; if (it.slot === 'back' && it.id === 'back.none') EQ.attach = 'attach.none';
      CONFIRM = null; build(); paint(); portrait();
      loadMine();
    }).catch(function(e){ BUSY = false; toast('Could not put it on.', raw(e) || String(e)); paint(); });
  }
  function buy(it){
    BUSY = true; paint();
    door('avatar_buy', it.id).then(function(r){
      BUSY = false; CONFIRM = null;
      if (r.error){ toast(fail(r.error, 'Could not buy it.'), raw(r.error)); paint(); return; }
      OWNED[it.id] = true; GC = Math.max(0, GC - it.price); paint();
      toast('Yours for ' + it.price.toLocaleString() + ' gardencoin.');
      wear(it);
    }).catch(function(e){ BUSY = false; CONFIRM = null; toast('Could not buy it.', raw(e) || String(e)); paint(); });
  }

  // ---------- the live wardrobe ----------
  function goLive(){
    try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { return; }
    Promise.resolve(sb.from('avatar_items').select('*').eq('active', true)).then(function(r){
      if (!r.error && r.data && r.data.length){ setCatalog(r.data); if (!LIVE){ EQ = defaults(); OWNED = ownedDefault(); } build(); paint(); }
    }).catch(function(){});
    sb.auth.getSession().then(function(r){
      var s = r.data && r.data.session; if (!s){ paint(); return; }
      ME = s.user.id; LIVE = true; paint(); return loadMine();
    }).catch(function(){});
  }
  function loadMine(){
    if (!sb || !ME) return Promise.resolve();
    return Promise.all([
      Promise.resolve(sb.from('avatar_equipped').select('slot,item_id,colorway').eq('profile_id', ME)),
      Promise.resolve(sb.from('avatar_inventory').select('*').eq('profile_id', ME)),
      Promise.resolve(sb.from('garden_wallets').select('balance').eq('profile_id', ME).limit(1))
    ]).then(function(rs){
      if (rs[0].error || rs[1].error){ toast('Your wardrobe could not load.'); return; }
      var eq = defaults();
      (rs[0].data || []).forEach(function(row){ if (row.slot && row.item_id && CAT[row.item_id]) eq[row.slot] = row.item_id; if (row.item_id && row.colorway) COLORWAY[row.item_id] = row.colorway; });
      try { localStorage.setItem('avatar_colorway', JSON.stringify(COLORWAY)); } catch (e) {}
      EQ = eq; OWNED = {};
      (rs[1].data || []).forEach(function(row){ var id = row.item_id || row.item; if (id) OWNED[id] = true; });
      if (!rs[2].error && rs[2].data && rs[2].data[0]) GC = +rs[2].data[0].balance || 0;
      build(); paint();
      if (!BASE){ BASE = {eq:JSON.parse(JSON.stringify(EQ)), cw:JSON.parse(JSON.stringify(COLORWAY))}; portrait(); }
      undoState();
    }).catch(function(){ toast('Your wardrobe could not load.'); });
  }
  var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; sc.onload = goLive; sc.onerror = function(){}; document.head.appendChild(sc);

  // ---------- undo: back to what you walked in wearing ----------
  function changed(){
    if (!BASE) return false;
    var slots = Object.keys(BASE.eq);
    for (var i = 0; i < slots.length; i++){ var s = slots[i], id = EQ[s]; if (id !== BASE.eq[s]) return true; if (W.colorways[id] && (COLORWAY[id] || '') !== (BASE.cw[id] || '')) return true; }
    return false;
  }
  function undoState(){ var u = document.getElementById('undo'); if (u) u.hidden = !changed(); }
  function undoAll(){
    if (!BASE || BUSY || !LIVE) return;
    var order = ['body', 'skin', 'hair', 'head', 'torso', 'legs', 'feet', 'neck', 'ears', 'hands', 'back', 'attach', 'topper'];
    var todo = order.filter(function(s){ var id = EQ[s], want = BASE.eq[s]; return want && (id !== want || (W.colorways[want] && (COLORWAY[want] || '') !== (BASE.cw[want] || ''))); });
    if (!todo.length) return;
    BUSY = true; paint();
    var p = Promise.resolve();
    todo.forEach(function(s){ p = p.then(function(){ var want = BASE.eq[s]; return door('avatar_equip', want, {p_colorway: BASE.cw[want] || null}).then(function(r){ if (!r.error){ EQ[s] = want; if (BASE.cw[want]) COLORWAY[want] = BASE.cw[want]; else delete COLORWAY[want]; } }); }); });
    p.then(function(){ BUSY = false; try { localStorage.setItem('avatar_colorway', JSON.stringify(COLORWAY)); } catch (e) {} build(); paint(); undoState(); portrait(); }).catch(function(){ BUSY = false; paint(); });
  }
  var undoBtn = document.getElementById('undo'); if (undoBtn) undoBtn.addEventListener('click', undoAll);
  // ---------- the portrait: a head shot saved to your profile after every change ----------
  function portrait(){ undoState(); if (!LIVE || !sb || !ME) return; clearTimeout(PT); PT = setTimeout(shootPortrait, 1200); }
  // a blank capture (some browsers hand back an empty canvas) must never overwrite a good portrait
  function looksLikeAFace(src){
    try {
      var cv = document.createElement('canvas'); cv.width = 32; cv.height = 32; var g = cv.getContext('2d'); g.drawImage(src, 0, 0, 32, 32);
      var px = g.getImageData(0, 0, 32, 32).data, r0 = px[0], g0 = px[1], b0 = px[2], diff = 0, opaque = 0;
      for (var i = 0; i < px.length; i += 4){ if (px[i + 3] > 10) opaque++; if (Math.abs(px[i] - r0) + Math.abs(px[i + 1] - g0) + Math.abs(px[i + 2] - b0) > 40) diff++; }
      return opaque > 900 && diff > 60;
    } catch (e) { return true; }
  }
  // the shot is always the same pose whatever you left the figure turned to: face square to the camera, head centred, a touch from above
  var SHOT_TURN = 0;
  function shotCam(){ var cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(0, 0.55, 8.0); cam.lookAt(0, 0.1, 0); return cam; }
  function shootPortrait(){
    if (!LIVE || !sb || !ME) return;
    var S = 320, rot = root.rotation.y, url = null;
    try {
      var cam = shotCam();
      root.rotation.y = SHOT_TURN; renderer.setSize(S, S, false); renderer.render(scene, cam); url = looksLikeAFace(canvas) ? canvas.toDataURL('image/png') : null;
    } catch (e) { url = null; }
    root.rotation.y = rot; size(); dirty = true;
    if (!url) return;
    fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      return Promise.resolve(sb.storage.from('avatars').upload(ME + '.png', blob, {upsert:true, contentType:'image/png', cacheControl:'0'}));
    }).then(function(r){
      if (r && r.error) throw r.error;
      return Promise.resolve(sb.from('avatar_portraits').upsert({profile_id: ME, updated_at: new Date().toISOString()}, {onConflict:'profile_id'}));
    }).catch(function(){});
  }

  build(); paint(); loop();
  window.__avatar = {
    set: function(slot, id){ EQ[slot] = id; build(); paint(); },
    color: function(id, c){ COLORWAY[id] = c; build(); paint(); },
    zoom: function(z){ ZOOM = z; zoomBtn.textContent = ZOOM === 'full' ? 'Head.' : 'Everything.'; size(); },
    turn: function(r){ root.rotation.y = r; dirty = true; },
    look: function(y, dist, up){ camera.position.set(0, y + (up || 0), dist); camera.lookAt(0, y, 0); camera.updateProjectionMatrix(); dirty = true; },
    face: function(o){ FACE = o || {}; build(); },
    portrait: function(){ var S = 320, rot = root.rotation.y, cam = shotCam(); root.rotation.y = SHOT_TURN; renderer.setSize(S, S, false); renderer.render(scene, cam); var ok = looksLikeAFace(canvas), u = canvas.toDataURL('image/png'); root.rotation.y = rot; size(); dirty = true; return ok ? u : 'BLANK'; },
    tab: function(s){ ACTIVE = s; paint(); },
    state: function(){ return {EQ:EQ, OWNED:OWNED, GC:GC, LIVE:LIVE, ME:ME}; },
    ready: true
  };
})();
</script>
</body>
</html>

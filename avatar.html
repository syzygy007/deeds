<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEDS · Dress your avatar</title>
<style>
  :root{--bone:#EFEAE0;--ink:#1A1A17;--forest:#244233;--mist:#D9D3C6;--quiet:#7A7568}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bone);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .frame{display:grid;grid-template-columns:1fr 360px;height:100vh;height:100dvh}
  .stage{position:relative;min-width:0;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
  canvas:active{cursor:grabbing}
  canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--forest)}
  .rail{padding:40px 32px 36px;border-left:1px solid var(--mist);overflow:auto;min-height:0;display:flex;flex-direction:column}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--quiet);margin:0 0 12px}
  h1{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:.95;margin:0 0 14px}
  .coin{font-size:15px;margin:0 0 22px;min-height:1.4em}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -4px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;background:none;border:1px solid var(--mist);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bone)}
  .tabs button:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  .rows{display:flex;flex-direction:column;margin-top:6px}
  .rows button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--mist);padding:12px 0;font:inherit;font-size:17px;color:var(--ink);text-align:left;cursor:pointer;letter-spacing:-.01em}
  .rows button:last-child{border-bottom:1px solid var(--mist)}
  .rows button span{display:flex;align-items:center;gap:10px}
  .rows button i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.14);flex:0 0 auto}
  .rows button em{font-style:normal;font-size:12px;color:var(--quiet);letter-spacing:.02em;text-align:right;flex:0 0 auto}
  .rows button.wearing{color:var(--forest);font-weight:700}
  .rows button.wearing em{color:var(--forest)}
  .rows button.locked{color:var(--quiet)}
  .rows button.confirm em{color:var(--ink);font-weight:700}
  .rows button:focus-visible{outline:2px solid var(--forest);outline-offset:-2px}
  .rows button[disabled]{cursor:default;opacity:.6}
  .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);margin:22px 0 8px}
  .sw{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
  .sw button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.14);padding:0;cursor:pointer;transition:box-shadow .15s}
  .sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--forest)}
  .sw button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bone),0 0 0 5px var(--ink)}
  .note{font-size:13px;color:var(--quiet);margin:10px 0 0}
  .foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hint{font-size:13px;color:var(--quiet);margin:0}
  .zoom{background:none;border:1px solid var(--mist);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
  .zoom:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
  .toast{position:absolute;left:24px;bottom:24px;max-width:min(80%,420px);background:var(--ink);color:var(--bone);font-size:14px;padding:10px 14px;border-radius:6px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  @media (max-width:900px){
    .frame{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
    .rail{border-left:0;border-top:1px solid var(--mist);padding:18px 20px 28px}
    h1{font-size:32px;margin-bottom:8px}
    .coin{margin-bottom:12px}
    .foot{padding-top:18px}
  }
  @media (prefers-reduced-motion:reduce){.sw button,.toast{transition:none}}
</style>
</head>

    rowsEl.innerHTML = '';
    (BYSLOT[ACTIVE] || []).forEach(function(it){
      var st = stateOf(it), b = document.createElement('button'); b.type = 'button'; b.className = st.cls; b.dataset.id = it.id;
      var span = document.createElement('span');
      var dot = (ACTIVE === 'skin' && W.skins[it.id]) || (ACTIVE === 'hair' && W.hairs[it.id]);
      if (dot){ var i = document.createElement('i'); i.style.background = dot; span.appendChild(i); }
      span.appendChild(document.createTextNode(it.name + '.'));
      var em = document.createElement('em'); em.textContent = st.em;
      b.appendChild(span); b.appendChild(em);
      if (BUSY) b.disabled = true;
      b.addEventListener('click', function(){ tap(it); });
      rowsEl.appendChild(b);
    });
    var worn = EQ[ACTIVE], cw = worn && W.colorways[worn];
    if (cw){
      colorBox.hidden = false; colorsEl.innerHTML = '';
      var cur = COLORWAY[worn] || W.defaultColorway[worn];
      cw.forEach(function(c){
        var s = document.createElement('button'); s.type = 'button'; s.title = c.name; s.setAttribute('aria-label', c.name); s.style.background = c.hex;
        s.setAttribute('aria-pressed', String(c.id === cur));
        s.addEventListener('click', function(){ COLORWAY[worn] = c.id; try { localStorage.setItem('avatar_colorway', JSON.stringify(COLORWAY)); } catch (e) {} build(); paint(); });
        colorsEl.appendChild(s);
      });
      colorNote.textContent = (cw.filter(function(c){ return c.id === cur; })[0] || cw[0]).name + '. Colors save with the next patch.';
    } else colorBox.hidden = true;
  }
  function tap(it){
    if (BUSY) return;
    if (EQ[it.slot] === it.id) return;
    if (OWNED[it.id]){ wear(it); return; }
    if (!LIVE){ toast('Sign in on DEEDS to wear and buy.'); return; }
    if (it.sold_in === 'wardrobe'){
      if (CONFIRM !== it.id){ CONFIRM = it.id; paint(); return; }
      buy(it); return;
    }
    if (it.sold_in === 'garden') toast('Sold at the garden stall.');
    else if (it.sold_in === 'chest') toast('Found in the woodland chest.');
    else toast((it.source || 'A starting look') + '.');
  }
  function fail(err, fallback){
    var m = String((err && err.message) || '');
    if (/not owned/i.test(m)) return 'Not in your wardrobe yet.';
    if (/not_enough|not enough/i.test(m)) return 'Not enough gardencoin.';
    if (/already owned/i.test(m)) return 'Already yours.';
    if (/sold in the garden/i.test(m)) return 'Sold at the garden stall.';
    if (/found in the chest/i.test(m)) return 'Found in the woodland chest.';
    if (/wear a pack first/i.test(m)) return 'Wear a pack first.';
    if (/locked/i.test(m)) return 'Locked for now.';
    if (/unknown item/i.test(m)) return 'The wardrobe does not know that one.';
    return fallback;
  }
  var ARGS = ['p_item', 'p_item_id', 'p_id', 'item'];
  function door(fn, id, k){
    k = k || 0; var args = {}; args[ARGS[k]] = id;
    return Promise.resolve(sb.rpc(fn, args)).then(function(r){
      if (r.error && k < ARGS.length - 1 && /could not find|schema cache|does not exist/i.test(String(r.error.message || ''))) return door(fn, id, k + 1);
      return r;
    });
  }
  function wear(it){
    if (!LIVE){ toast('Sign in on DEEDS to wear and buy.'); return; }
    BUSY = true; paint();
    door('avatar_equip', it.id).then(function(r){
      BUSY = false;
      if (r.error){ toast(fail(r.error, 'Could not put it on.')); paint(); return; }
      EQ[it.slot] = it.id; if (it.slot === 'back' && it.id === 'back.none') EQ.attach = 'attach.none';
      CONFIRM = null; build(); paint(); toast('Wearing the ' + it.name.toLowerCase() + '.');
      loadMine();
    }).catch(function(){ BUSY = false; toast('Could not put it on.'); paint(); });
  }
  function buy(it){
    BUSY = true; paint();
    door('avatar_buy', it.id).then(function(r){
      BUSY = false; CONFIRM = null;
      if (r.error){ toast(fail(r.error, 'Could not buy it.')); paint(); return; }
      OWNED[it.id] = true; GC = Math.max(0, GC - it.price); paint();
      toast('Yours for ' + it.price.toLocaleString() + ' gardencoin.');
      wear(it);
    }).catch(function(){ BUSY = false; CONFIRM = null; toast('Could not buy it.'); paint(); });
  }

  // ---------- the live wardrobe ----------
  function goLive(){
    try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) { return; }
    Promise.resolve(sb.from('avatar_items').select('*').eq('active', true)).then(function(r){
      if (!r.error && r.data && r.data.length){ setCatalog(r.data); if (!LIVE){ EQ = defaults(); OWNED = ownedDefault(); } build(); paint(); }
    }).catch(function(){});
    sb.auth.getSession().then(function(r){
      var s = r.data && r.data.session; if (!s){ paint(); return; }
      ME = s.user.id; LIVE = true; paint(); return loadMine();
    }).catch(function(){});
  }
  function loadMine(){
    if (!sb || !ME) return Promise.resolve();
    return Promise.all([
      Promise.resolve(sb.from('avatar_equipped').select('slot,item_id').eq('profile_id', ME)),
      Promise.resolve(sb.from('avatar_inventory').select('*').eq('profile_id', ME)),
      Promise.resolve(sb.from('garden_wallets').select('balance').eq('profile_id', ME).limit(1))
    ]).then(function(rs){
      if (rs[0].error || rs[1].error){ toast('Your wardrobe could not load.'); return; }
      var eq = defaults();
      (rs[0].data || []).forEach(function(row){ if (row.slot && row.item_id && CAT[row.item_id]) eq[row.slot] = row.item_id; });
      EQ = eq; OWNED = {};
      (rs[1].data || []).forEach(function(row){ var id = row.item_id || row.item; if (id) OWNED[id] = true; });
      if (!rs[2].error && rs[2].data && rs[2].data[0]) GC = +rs[2].data[0].balance || 0;
      build(); paint();
    }).catch(function(){ toast('Your wardrobe could not load.'); });
  }
  var sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; sc.onload = goLive; sc.onerror = function(){}; document.head.appendChild(sc);

  build(); paint(); loop();
  window.__avatar = {
    set: function(slot, id){ EQ[slot] = id; build(); paint(); },
    color: function(id, c){ COLORWAY[id] = c; build(); paint(); },
    zoom: function(z){ ZOOM = z; zoomBtn.textContent = ZOOM === 'full' ? 'Head.' : 'Everything.'; size(); },
    turn: function(r){ root.rotation.y = r; dirty = true; },
    tab: function(s){ ACTIVE = s; paint(); },
    state: function(){ return {EQ:EQ, OWNED:OWNED, GC:GC, LIVE:LIVE, ME:ME}; },
    ready: true
  };
})();
</script>
</body>
</html>

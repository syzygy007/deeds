<style>
:root{--ivory:#F6F3EB;--ink:#15130E;--forest:#1F4B3A;--sage:#A0B0A4;--muted:#6E6A5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
.word{font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}

h1{font-weight:800;font-size:clamp(2.6rem,9vw,6.8rem);line-height:.95;letter-spacing:-.03em;max-width:12ch}
h1 b{color:var(--forest)}
p{margin-top:20px;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.45;color:var(--muted);max-width:32ch}
.cta{display:inline-block;margin-top:32px;background:var(--forest);color:var(--ivory);text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.14em;padding:16px 30px;border-radius:999px}
.cta:hover{background:var(--ink)}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (min-width:900px){
 main{flex-direction:row;text-align:left;gap:56px;padding:0 8vw 64px}
 .pic{height:auto;width:min(48vh,420px);margin:0;order:2}
 .copy{order:1}
 h1{max-width:9ch}
}

</head>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEDS. The Art of Doing Good</title>
<meta name="theme-color" content="#0E1A14">
<meta property="og:title" content="The Art of Doing Good.">
<meta property="og:description" content="Not for recognition.">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" as="image" href="/nebula.webp">
<style>
:root{
  --ink:#0E1A14; --ivory:#F6F3EB; --sage:#A0B0A4; --gold:#C9A659; --forest:#1F4B3A;
  --pad: clamp(22px, 6vw, 84px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--ivory); overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
#stage{position:fixed; inset:0; overflow:hidden}

/* every layer is oversized so it can pan without ever showing an edge */
.layer{position:absolute; left:-7%; top:-7%; width:114%; height:114%; will-change:transform}
.layer img{width:100%; height:100%; object-fit:cover; object-position:50% 50%; display:block}
#stars{position:absolute; inset:0; width:100%; height:100%}

/* legibility floor for the copy column */
.scrim{position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(180deg, rgba(14,26,20,.50) 0%, rgba(14,26,20,0) 22%),
    linear-gradient(0deg,   rgba(14,26,20,.70) 0%, rgba(14,26,20,.10) 52%);
}
@media (min-width:1024px){
  .layer img{object-position:50% 50%}
  .scrim{background:
    linear-gradient(90deg, rgba(14,26,20,.80) 0%, rgba(14,26,20,.46) 38%, rgba(14,26,20,0) 64%),
    linear-gradient(180deg, rgba(14,26,20,.42) 0%, rgba(14,26,20,0) 26%),
    linear-gradient(0deg, rgba(14,26,20,.34) 0%, rgba(14,26,20,0) 26%);}
}

/* copy */
.copy{position:absolute; inset:0; display:flex; flex-direction:column;
  padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad)
          calc(var(--pad) + env(safe-area-inset-bottom));
  will-change:transform}
.mark{font-weight:700; font-size:clamp(1.05rem,4.2vw,1.35rem); letter-spacing:-.028em}
.mark i{font-style:normal; color:var(--sage)}
.body{margin-top:auto; max-width:min(640px, 92%)}
.eyebrow{font-size:.62rem; letter-spacing:.24em; font-weight:700; color:var(--sage);
  text-transform:uppercase; margin-bottom:clamp(14px,3.4vw,22px)}
h1{font-weight:700; letter-spacing:-.037em; line-height:.92;
  font-size:clamp(2.75rem, 12.4vw, 4.6rem)}
h1 i{font-style:normal; color:var(--gold)}
.deck{margin-top:clamp(16px,3.6vw,22px); max-width:34ch; line-height:1.5;
  font-size:clamp(.92rem,3.7vw,1.02rem); color:rgba(246,243,235,.78)}
.deck q{quotes:"“" "”"; font-style:italic; color:var(--ivory)}

.spec{margin-top:clamp(26px,6vw,40px); display:grid; grid-template-columns:1fr 1fr;
  border-top:1px solid rgba(246,243,235,.20)}
.spec div{padding:11px 0 10px; border-bottom:1px solid rgba(246,243,235,.20);
  font-size:.6rem; letter-spacing:.2em; font-weight:700; color:rgba(246,243,235,.72)}
.spec div:nth-child(odd){border-right:1px solid rgba(246,243,235,.20); padding-right:12px}
.spec div:nth-child(even){padding-left:14px}

.cta{margin-top:clamp(26px,6vw,38px); display:flex; gap:12px}
@media (max-width:1023px){.cta{flex-direction:column; align-items:stretch}.btn{text-align:center}}
.btn{appearance:none; border:0; cursor:pointer; font:inherit; font-weight:700;
  font-size:.86rem; letter-spacing:-.01em; padding:15px 24px; border-radius:2px;
  background:var(--ivory); color:var(--ink); text-decoration:none; display:inline-block;
  transition:transform .18s ease, background .18s ease, color .18s ease}
.btn.ghost{background:transparent; color:var(--ivory); box-shadow:inset 0 0 0 1px rgba(246,243,235,.42)}
.btn:hover{transform:translateY(-1px)}
.btn.ghost:hover{background:rgba(246,243,235,.10)}
.btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

footer{margin-top:clamp(24px,6vw,38px); display:flex; justify-content:space-between;
  align-items:baseline; font-size:.58rem; letter-spacing:.2em; font-weight:700;
  color:rgba(246,243,235,.52)}
footer b{font-weight:700; color:rgba(246,243,235,.72)}

@media (min-width:1024px){
  .body{max-width:600px}
  h1{font-size:clamp(4rem, 5.6vw, 7.4rem)}
  .spec{grid-template-columns:repeat(4,1fr)}
  .spec div{border-right:1px solid rgba(246,243,235,.20); padding:12px 0 11px}
  .spec div:nth-child(even){padding-left:0}
  .spec div:nth-child(n){padding-left:0}
  .spec div+div{padding-left:16px}
  .spec div:last-child{border-right:0}
  .body{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){ .layer,.copy{transform:none !important} }
</style>
</head>
<body>
<div id="stage">

  <div class="layer" id="lSky">
    <picture>
      <source media="(min-width:1024px)" srcset="/nebula-wide.webp">
      <img src="/nebula.webp" alt="" fetchpriority="high">
    </picture>
    <canvas id="stars"></canvas>
  </div>

  <div class="layer" id="lMoon">
    <picture>
      <source media="(min-width:1024px)" srcset="/moon-wide.webp">
      <img src="/moon.webp" alt="">
    </picture>
  </div>

  <div class="layer" id="lFol">
    <picture>
      <source media="(min-width:1024px)" srcset="/foliage-wide.webp">
      <img src="/foliage.webp" alt="">
    </picture>
  </div>

  <div class="scrim"></div>

  <div class="copy" id="lCopy">
    <div class="mark">DEEDS<i>.</i></div>

    <div class="body">
      <div class="eyebrow" id="eyebrow">Anonymous · Person to person</div>
      <h1 id="head">The Art of Doing Good<i>.</i></h1>
      <p class="deck" id="deck">Not for recognition. Not for followers. Simply because good deeds deserve to be seen.</p>

      <div class="spec">
        <div>SEE IT</div><div>DO IT</div><div>PASS IT</div><div>WATCH IT MOVE</div>
      </div>

      <div class="cta">
        <a class="btn" id="ctaMain" href="/">Join DEEDS.</a>
        <a class="btn ghost" id="ctaAlt" href="/">Explore.</a>
      </div>

      <footer>
        <b>deeds.fun</b>
        <span id="foot">TILT THE SKY</span>
      </footer>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var wide = function(){ return window.innerWidth >= 1024; };

  /* ---------- arrival personalisation (c = invite, k = deed, a = the act) ---------- */
  var q = new URLSearchParams(location.search);
  function handle(v){ v = (v||"").replace(/[^A-Za-z0-9]/g,""); return (v.length>=3 && v.length<=24) ? v : ""; }
  var c = handle(q.get("c")), k = handle(q.get("k")), act = (q.get("a")||"").slice(0,120);
  var who = c || k;
  if (who){
    var eb = document.getElementById("eyebrow"),
        hd = document.getElementById("head"),
        dk = document.getElementById("deck");
    eb.textContent = "An invitation · from " + who;
    if (act){
      hd.innerHTML = 'Someone thought of you<i>.</i>';
      dk.innerHTML = 'They logged a deed and put your name on it. <q>' +
        act.replace(/[<>&]/g,"") + '</q>';
    } else if (k){
      hd.innerHTML = who + ' sent you the Forty<i>.</i>';
      dk.textContent = "Forty acts of kindness. No clock. No order. No audience.";
    } else {
      hd.innerHTML = who + ' invited you<i>.</i>';
      dk.textContent = "No deed attached. No clock. Just the door, held open.";
    }
  }
  ["ctaMain","ctaAlt"].forEach(function(id){
    var a = document.getElementById(id);
    a.addEventListener("click", function(){
      try { sessionStorage.setItem("deeds_welcomed","1"); } catch(e){}
      a.href = "/" + location.search;
    });
  });
  if (wide()) document.getElementById("foot").textContent = "SIGNED BY NO ONE";
  window.addEventListener("resize", function(){
    document.getElementById("foot").textContent = wide() ? "SIGNED BY NO ONE" : "TILT THE SKY";
  });

  /* ---------- star field: seeded, procedural, drawn over the nebula ---------- */
  var cv = document.getElementById("stars"), ctx = cv.getContext("2d"), stars = [], dpr = 1;
  function rng(seed){ return function(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }; }

  function seed(){
    var box = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(box.width*dpr));
    cv.height = Math.max(1, Math.round(box.height*dpr));
    var r = rng(20260825), n = Math.min(430, Math.round(box.width*box.height/9200));
    var big = wide() ? 1.25 : 1;
    stars = [];
    for (var i=0;i<n;i++){
      var y = Math.pow(r(), 1.45);                 // crowd the upper sky, thin toward the treeline
      if (y > 0.70 && r() > 0.22) continue;        // the fog band swallows most low stars
      var sharp = r() < 0.38;                    // blinkers vs slow breathers
      stars.push({
        x: r()*box.width,
        y: y*box.height,
        r: (0.75 + r()*1.5) * big,
        p: r()*Math.PI*2,
        s: sharp ? (0.0016 + r()*0.0013) : (0.00075 + r()*0.00085),
        k: sharp ? (4.6 + r()*2.4) : (2.2 + r()*1.1),   // curve: how long it sits dim
        f: r() < 0.10,                             // a few carry four point flares
        a: 0.38 + r()*0.62
      });
    }
  }

  function paint(t){
    var w = cv.width, h = cv.height;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      var v = reduce ? 0.55 : Math.pow(0.5 + 0.5*Math.sin(s.p + t*s.s), s.k);
      var al = Math.min(1, (0.05 + 0.95*v) * s.a);
      var rr = s.r * (0.70 + 0.85*v);
      var gr = rr * (3.4 + 3.6*v);
      var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, gr);
      g.addColorStop(0, "rgba(246,243,235," + (al*0.92).toFixed(3) + ")");
      g.addColorStop(0.34, "rgba(225,214,178," + (al*0.24).toFixed(3) + ")");
      g.addColorStop(1, "rgba(225,214,178,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(250,247,240," + al.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, 6.2832); ctx.fill();
      if (s.f && v > 0.30){
        var L = rr * (5 + 11*v), aw = al*0.5;
        ctx.strokeStyle = "rgba(238,226,190," + aw.toFixed(3) + ")";
        ctx.lineWidth = Math.max(0.5, rr*0.34);
        ctx.beginPath();
        ctx.moveTo(s.x-L, s.y); ctx.lineTo(s.x+L, s.y);
        ctx.moveTo(s.x, s.y-L); ctx.lineTo(s.x, s.y+L);
        ctx.stroke();
      }
    }
  }

  /* ---------- motion: pointer or tilt, plus an ambient drift that never stops ---------- */
  var L = {
    sky:  {el: document.getElementById("lSky"),  d: 5},
    moon: {el: document.getElementById("lMoon"), d: 8},
    fol:  {el: document.getElementById("lFol"),  d: 22},
    copy: {el: document.getElementById("lCopy"), d: 2}
  };
  var tx=0, ty=0, cx=0, cy=0;
  function clamp(v){ return v < -1 ? -1 : v > 1 ? 1 : v; }

  window.addEventListener("mousemove", function(e){
    tx = clamp((e.clientX/window.innerWidth  - 0.5) * 2);
    ty = clamp((e.clientY/window.innerHeight - 0.5) * 2);
  }, {passive:true});

  var dragging=false, sx=0, sy=0, bx=0, by=0;
  window.addEventListener("touchstart", function(e){
    dragging=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; bx=tx; by=ty;
  }, {passive:true});
  window.addEventListener("touchmove", function(e){
    if(!dragging) return;
    tx = clamp(bx + (e.touches[0].clientX - sx)/ (window.innerWidth*0.42));
    ty = clamp(by + (e.touches[0].clientY - sy)/ (window.innerHeight*0.42));
  }, {passive:true});
  window.addEventListener("touchend", function(){
    dragging=false;
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function"){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if (r === "granted") window.addEventListener("deviceorientation", tilt);
      }).catch(function(){});
    }
  }, {passive:true});
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== "function"){
    window.addEventListener("deviceorientation", tilt);
  }
  function tilt(e){
    if (dragging || e.gamma == null) return;
    tx = clamp(e.gamma/12);
    ty = clamp((e.beta - 45)/12);
  }

  var last = 0;
  function frame(t){
    cx += (tx - cx) * 0.075;
    cy += (ty - cy) * 0.075;
    // ambient: two out of phase oscillators, so the sky never sits perfectly still
    var ax = Math.sin(t/9700)*0.56 + Math.sin(t/23100)*0.44;
    var ay = Math.sin(t/13300)*0.58 + Math.cos(t/31700)*0.42;
    var w = wide(), mul = w ? 1.6 : 1, pw = w ? 1 : 1, aw = w ? 0.62 : 0.34;
    if (!reduce){
      for (var kk in L){
        var d = L[kk].d * mul;
        L[kk].el.style.transform =
          "translate3d(" + (-(cx*pw + ax*aw)*d).toFixed(2) + "px," +
                           (-(cy*pw + ay*aw)*d*0.62).toFixed(2) + "px,0)";
      }
    }
    if (t - last > 24){ paint(t); last = t; }
    requestAnimationFrame(frame);
  }

  var rt;
  window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(seed, 160); });
  seed();
  if (reduce){ paint(0); } else { requestAnimationFrame(frame); }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Card. Deedable.</title>
<meta name="theme-color" content="#0B0B0B">
<style>
:root{--ink:#0B0B0B;--cream:#F4F1EA;--gem:#0FA35F;--silver:#E9E5DB;--mute:rgba(244,241,234,.5);--line:rgba(244,241,234,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--cream);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body{position:relative;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.glow{border:1px solid rgba(255,255,255,.07);box-shadow:0 0 60px rgba(255,255,255,.04),inset 0 0 80px rgba(255,255,255,.03)}
.glow.a{width:110vmax;height:110vmax;left:-72vmax;top:-78vmax}
.glow.b{width:120vmax;height:120vmax;right:-70vmax;bottom:-84vmax}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:22px 22px 44px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-top:40px}
.bar a{grid-column:2;display:block;line-height:0}
.bar svg{width:92px;height:27px;color:var(--cream)}
.msg{font-size:14px;color:rgba(244,241,234,.5);text-align:center;margin-top:18px;min-height:18px}
#door{display:flex;flex-direction:column;flex:1;align-items:center;justify-content:center;text-align:center;gap:18px}
#door p{font-size:15px;color:rgba(244,241,234,.6);max-width:260px}
#door .btn{width:min(320px,86%)}
.tr{grid-column:3;justify-self:end;display:flex;align-items:center;gap:18px}
.x{color:rgba(244,241,234,.8);font-size:30px;line-height:1;text-decoration:none;padding:4px 0 4px 6px}
.bar button{background:none;border:0;color:rgba(244,241,234,.38);font:400 14px/1 inherit;font-family:inherit;cursor:pointer;padding:8px 0}
#view{display:flex;flex-direction:column;flex:1}
.btn.wait{opacity:.5;pointer-events:none}
a.btn{text-decoration:none}
#view .stage{margin-top:calc(14vh + 20px)}
.micro{font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:rgba(244,241,234,.62);font-weight:400;margin:44px 0 0;padding-bottom:12px;position:relative;display:inline-block}
.micro:after{content:"";position:absolute;left:0;bottom:0;width:36px;height:1px;background:var(--gem)}
h1{font-size:clamp(42px,13vw,54px);line-height:1;letter-spacing:-.03em;font-weight:600;margin:26px 0 40px}
h1 i,.scan i{font-style:normal;color:var(--gem)}
.stage{perspective:1200px;-webkit-tap-highlight-color:transparent}
.card{position:relative;width:100%;aspect-ratio:1.53;transform-style:preserve-3d;cursor:pointer;outline:none;transition:transform .8s cubic-bezier(.2,.8,.2,1);will-change:transform}
.card.live{transition:transform .12s ease-out}
.card:focus-visible{box-shadow:0 0 0 3px var(--gem);border-radius:22px}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(160deg,#171717 0%,#121212 50%,#0E0E0E 100%);color:#F2F2F0;
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset;border:1px solid rgba(255,255,255,.06)}
.face:before{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 100% 100%,rgba(0,0,0,.3),rgba(0,0,0,0) 60%);pointer-events:none}
.sheen{position:absolute;inset:-40%;background:radial-gradient(circle at var(--sx,30%) var(--sy,25%),rgba(255,255,255,.05),rgba(255,255,255,.015) 22%,rgba(255,255,255,0) 46%);pointer-events:none;mix-blend-mode:screen}
.front{padding:34px 30px 28px;display:flex;flex-direction:column}
.name{position:relative;font-size:12.5px;line-height:1.2;letter-spacing:.34em;text-transform:uppercase;font-weight:400;color:rgba(240,240,238,.78)}
.dmark{position:absolute;right:30px;bottom:28px;width:74px;height:22px;color:rgba(240,240,238,.92)}
.back{transform:rotateY(180deg);display:flex;flex-direction:row;align-items:center;gap:20px;padding:22px}
.qr{position:relative;height:100%;aspect-ratio:1;flex:none;display:flex;background:#fff;border-radius:14px;overflow:hidden;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.qr svg{width:100%;height:100%;display:block}
.scan{position:relative;font-size:clamp(18px,5vw,21px);line-height:1.08;letter-spacing:-.02em;font-weight:600;color:#F5F5F3}
.scan small{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(233,229,219,.55);margin-top:12px;font-weight:500}
.hint{font-size:15px;color:rgba(244,241,234,.5);margin:40px 0 0;text-align:center;font-weight:400}
#view .hint{display:none}
.btns{padding-top:26px;display:flex;flex-direction:column;gap:10px}
#view .btns{padding-top:calc(10vh + 20px);align-items:center}
#view .btn{width:min(320px,86%)}
.btn{display:block;width:100%;border-radius:999px;padding:17px;font:400 16px/1 inherit;font-family:inherit;letter-spacing:.01em;cursor:pointer;border:1px solid rgba(244,241,234,.6);background:none;color:var(--cream);text-align:center}
.btn.pri{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:15px 0}
.row label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:500;flex:none;width:80px}
.row input{flex:1;background:none;border:0;color:var(--cream);font:400 17px/1.2 inherit;font-family:inherit;text-align:right;outline:none;min-width:0}
.row input::placeholder{color:rgba(244,241,234,.25)}
.rows{margin-top:4px}
.rows .row:first-child{border-top:1px solid var(--line)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card,.card.live{transition:none}.sheen{display:none}}
</style>
</head>

  <div class="bar"><a href="/#profile" aria-label="Back to your profile"><svg><use href="#dbl"/></svg></a><span class="tr"><button id="topbtn" type="button" hidden>Edit.</button><a class="x" href="/#profile" aria-label="Close">&times;</a></span></div>

  <section id="view">
    <div class="stage"><div class="card" id="card" tabindex="0" role="button" aria-label="Tap to show your code">
      <div class="face front">
        <div class="sheen"></div>
        <div class="name" id="fName"></div>
        <svg class="dmark" aria-hidden="true"><use href="#dbl"/></svg>
      </div>
      <div class="face back">
        <div class="sheen"></div>
        <div class="qr" id="qr"></div>
        <div><div class="scan">Scan to save my contact<i>.</i><small id="bName"></small></div></div>
      </div>
    </div></div>
    <p class="hint" id="hint">Tap the card to show your code.</p>
    <div class="btns"><button class="btn" id="showbtn" type="button">Show my code.</button></div>
    <p class="msg" id="msg"></p>
  </section>

  <section id="door" hidden>
    <p>Sign in to make your card.</p>
    <a class="btn" href="/">Sign in.</a>
  </section>

  <section id="edit" hidden>
    <div class="micro">The Card</div>
    <h1>Your details<i>.</i></h1>
    <div class="rows">
      <div class="row"><label for="i-name">Name</label><input id="i-name" autocomplete="name" placeholder="First Last"></div>
      <div class="row"><label for="i-title">Title</label><input id="i-title" autocomplete="organization-title" placeholder="President"></div>
      <div class="row"><label for="i-org">Company</label><input id="i-org" autocomplete="organization" placeholder="Company name"></div>
      <div class="row"><label for="i-cell">Cell</label><input id="i-cell" type="tel" autocomplete="tel" placeholder="949 555 0100"></div>
      <div class="row"><label for="i-tel">Office</label><input id="i-tel" type="tel" autocomplete="tel-national" placeholder="Optional"></div>
      <div class="row"><label for="i-email">Email</label><input id="i-email" type="email" autocomplete="email" placeholder="you@company.com"></div>
      <div class="row"><label for="i-url">Website</label><input id="i-url" type="url" autocomplete="url" placeholder="company.com"></div>
    </div>
    <p class="hint">Only you see this. Anyone who scans your code gets it.</p>
    <div class="btns"><button class="btn pri" id="savebtn" type="button">Save card.</button><button class="btn" id="cancelbtn" type="button">Cancel.</button></div>
    <p class="msg" id="emsg"></p>
  </section>

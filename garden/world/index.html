/* ---------- texture cache ---------- */
const TL=new THREE.TextureLoader();
const texCache=new Map();
let pending=0, done=0;
function tex(file,repeat){
  if(texCache.has(file))return texCache.get(file);
  pending++;
  const t=TL.load(BASE+file,()=>{done++;progress()},undefined,()=>{FAIL.push(file);done++;progress()});
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():4);
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}
  texCache.set(file,t);return t;
}
/* a material that shows honest colour until its picture arrives, and keeps that
   colour if the picture never arrives. nothing in this world renders as a black hole. */
function skin(file,fallback,repeat,extra){
  const m=new THREE.MeshBasicMaterial(Object.assign({color:fallback},extra||{}));
  m.userData.base=fallback;
  pending++;
  TL.load(BASE+file,t=>{
    t.encoding=THREE.sRGBEncoding;
    t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():4);
    if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}
    m.map=t;m.userData.base=0xffffff;m.color.setHex(0xffffff);m.needsUpdate=true;
    done++;progress();applyTint();
  },undefined,()=>{FAIL.push(file);done++;progress()});
  return m;
}
function progress(){
  const p=pending?done/pending:1;
  document.getElementById('lbar').style.width=(p*100).toFixed(0)+'%';
  if(p>=1)setTimeout(hideLoad,220);
}
function report(){
  if(FAIL.length)shout(FAIL.length+' file(s) did not load, first: '+FAIL[0]+'\nExpected at '+BASE+FAIL[0]);
}
function hideLoad(){
  report();const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.style.display='none',600)}

/* the country beyond the garden rolls. inside the walls it stays dead flat,

function surroundH(X,Z){
  const ex=Math.max(0,Math.abs(X)-WM/2), ez=Math.max(0,Math.abs(Z)-HM/2);
  const d=Math.hypot(ex,ez);
  if(d<=0)return 0;
  const ramp=Math.min(1,d/30), n=Math.sin(X*0.021)*Math.cos(Z*0.017)+0.5*Math.sin(X*0.041+1.7)*Math.cos(Z*0.033+.6);
  return ramp*ramp*(3.4+n*5.0);
}

  g.beginPath();g.moveTo(2,0);g.quadraticCurveTo(16,-10*up,27,-3*up);g.quadraticCurveTo(16,4-6*up,2,3);g.fill();

function airTick(t,dt){
  let hawk=null;
  for(let i=0;i<air.length;i++){
    const o=air[i];if(!o.alive){continue}
    if(o.hawk){hawk=o;continue}
    const w=o.ph+t*o.sp;
    o.m.position.x=o.hx+Math.cos(w)*o.r+Math.sin(w*1.7)*o.r*0.4;
    o.m.position.z=o.hz+Math.sin(w*0.8)*o.r+Math.cos(w*2.1)*o.r*0.3;
    o.m.position.y=o.hy+Math.sin(w*1.3+o.ph)*(o.blue?1.5:0.4);
    if(BIRDART[o.kind])o.m.material.map=BIRDART[o.kind][Math.sin(t*o.flap+o.ph)>0?0:1];
    o.m.rotation.y=you.yaw;
  }
  /* the hawk: rides, then picks one, then rides again */
  if(hawk){
    hawk.cool-=dt;
    if(hawk.state==='ride'){
      const w=hawk.ph+t*hawk.sp;
      hawk.m.position.set(Math.cos(w)*hawk.r,26+Math.sin(w*0.7)*3,Math.sin(w)*hawk.r);
      if(hawk.cool<=0){
        const prey=air.filter(a=>a.blue&&a.alive);
        if(prey.length){hawk.target=prey[Math.floor(Math.random()*prey.length)];hawk.state='dive'}
        else hawk.cool=30;
      }
    }else if(hawk.state==='dive'){
      const T=hawk.target;
      if(!T||!T.alive){hawk.state='ride';hawk.cool=45+Math.random()*40}
      else{
        const p=hawk.m.position, q=T.m.position;
        const dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z,d=Math.hypot(dx,dy,dz);
        const st=18*dt/Math.max(0.001,d);
        p.x+=dx*st;p.y+=dy*st;p.z+=dz*st;
        if(d<1.4){T.alive=false;T.m.visible=false;
          setTimeout(()=>{T.alive=true;T.m.visible=true;
            T.hx=(Math.random()-.5)*WM*0.7;T.hz=(Math.random()-.5)*HM*0.7;},22000);
          hawk.state='climb'}
      }
    }else{ /* climb back to the ride */
      hawk.m.position.y+=9*dt;
      if(hawk.m.position.y>=26){hawk.state='ride';hawk.cool=50+Math.random()*45;hawk.ph=Math.random()*6.28}
    }
    hawk.m.material.map=BIRDART.hawk[Math.sin(t*hawk.flap)>0?0:1];
    hawk.m.rotation.y=you.yaw;
  }
}

/* ---------- fog and tint ---------- */
function applyTint(){
  const c=new THREE.Color(PH[ph].tint);
  scene.traverse(o=>{
    if(!o.isMesh||!o.material||o===sky||o===orb||clouds.indexOf(o)>=0)return;
    const b=o.material.userData&&o.material.userData.base;
    if(b===undefined)return;
    o.material.color.setHex(b).multiply(c);
  });
}
function applyPhase(){
  const p=PH[ph];
  skyMat.map=skyTexture(p);skyMat.needsUpdate=true;
  scene.fog=new THREE.FogExp2(new THREE.Color(p.hz),p.fog);
  renderer.setClearColor(new THREE.Color(p.hz));
  applyTint();
  clouds.forEach(m=>{m.material.color.copy(c);m.material.opacity=ph==='night'?.30:.70});
  sMat.uniforms.vis.value=ph==='night'?1:(ph==='dusk'?.5:0);
  orb.material.map=tex(p.orb==='sun'?'g2-sun-disc-glow.webp':'g2-moon-waxing-gibbous.webp');
  orb.material.needsUpdate=true;
  shadeMat.opacity=ph==='night'?.30:(ph==='day'?.55:.42);
  document.getElementById('phase').textContent=ph[0].toUpperCase()+ph.slice(1);
}
applyPhase();

/* ---------- where you are ---------- */
const AREAS=[
  {n:'The Fountain Court',x:1600,y:520,r:620},
  {n:'The Glasshouse',x:520,y:580,r:520},
  {n:'The Maze',x:2620,y:790,r:520},
  {n:'The Orchard',x:2680,y:1420,r:620},
  {n:'The Lake',x:560,y:1480,r:640},
  {n:'The Meadow',x:760,y:2060,r:600},
  {n:'The Rose Garden',x:1990,y:2060,r:420},
  {n:'The Pergola',x:2520,y:2060,r:480},
  {n:'The Parterre',x:1600,y:1300,r:640},
  {n:'The Avenue',x:1600,y:2200,r:700}
];
let areaNow='';
function areaAt(px,pz){
  const X=px/GSC+WPX/2, Y=pz/GSC+HPX/2;
  let best=null,bd=1e9;
  AREAS.forEach(a=>{const d=Math.hypot(X-a.x,Y-a.y);if(d<a.r&&d<bd){bd=d;best=a}});
  return best?best.n:'The Garden';
}

/* ---------- you ---------- */
const you={x:wx(1600),z:wz(2280),yaw:0,pitch:-0.02,vx:0,vz:0};
const EYE=1.62, SPEED=4.4, RUN=7.6, ACC=17, DRAG=11;
let mvX=0,mvZ=0;

/* left half: walk. right half: look. desktop: WASD + drag */
const stick=document.getElementById('stick'), knob=document.getElementById('knob');
let sId=null,sx0=0,sy0=0;
stick.addEventListener('pointerdown',e=>{sId=e.pointerId;sx0=e.clientX;sy0=e.clientY;
  knob.style.display='block';knob.style.left=sx0+'px';knob.style.top=sy0+'px';stick.setPointerCapture(sId)});
const RMAX=62, DEAD=7;
stick.addEventListener('pointermove',e=>{if(e.pointerId!==sId)return;
  let dx=e.clientX-sx0,dy=e.clientY-sy0,d=Math.hypot(dx,dy);
  if(d>RMAX){                       /* the ring follows your thumb instead of stopping it */
    sx0+=dx*(1-RMAX/d);sy0+=dy*(1-RMAX/d);
    knob.style.left=sx0+'px';knob.style.top=sy0+'px';
    dx=e.clientX-sx0;dy=e.clientY-sy0;d=RMAX;
  }
  const a=Math.atan2(dy,dx);
  let m=d<DEAD?0:(d-DEAD)/(RMAX-DEAD);
  m=m*m*(3-2*m);                    /* ease in, so a small nudge is a slow step */
  mvX=Math.cos(a)*m;mvZ=Math.sin(a)*m;
  knob.querySelector('i').style.transform=`translate(${Math.cos(a)*m*34}px,${Math.sin(a)*m*34}px)`});
function stickEnd(e){if(e.pointerId!==sId)return;sId=null;mvX=mvZ=0;knob.style.display='none';knob.querySelector('i').style.transform=''}
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);

let lId=null,lx0=0,ly0=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&!locked){cv.requestPointerLock&&cv.requestPointerLock();return}
  lId=e.pointerId;lx0=e.clientX;ly0=e.clientY;cv.setPointerCapture(lId)});
cv.addEventListener('pointermove',e=>{
  if(locked)return;
  if(e.pointerId!==lId)return;
  lookDX+=(e.clientX-lx0);lookDY+=(e.clientY-ly0);lx0=e.clientX;ly0=e.clientY});
function lookEnd(e){if(e.pointerId===lId)lId=null}
cv.addEventListener('pointerup',lookEnd);cv.addEventListener('pointercancel',lookEnd);

/* mouse look without holding the button down, the way a game does it */
let locked=false, lookDX=0, lookDY=0;
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===cv;
  document.getElementById('hint').textContent=locked?'WASD or arrows to walk · shift to run · esc to free the mouse'
    :(matchMedia('(pointer:coarse)').matches?'Drag left to walk · drag right to look':'Click to look · WASD or arrows to walk');
});
document.addEventListener('mousemove',e=>{if(locked){lookDX+=e.movementX;lookDY+=e.movementY}});

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(/^arrow| $/.test(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
if(!matchMedia('(pointer:coarse)').matches)
  document.getElementById('hint').textContent='Click to look · WASD or arrows to walk';

/* ---------- collision ---------- */
const lake=PATCH.find(p=>p.water);
function blocked(px,pz){
  if(lake){const X=px/GSC+WPX/2,Y=pz/GSC+HPX/2;
    if(Math.abs(X-lake.cx)<lake.w/2-30&&Math.abs(Y-lake.cy)<lake.h/2-30)return true}
  for(let i=0;i<blockers.length;i++){const b=blockers[i];
    if((px-b.x)**2+(pz-b.z)**2<b.r*b.r)return true}
  return false;
}

/* ---------- music ---------- */
let audio=null,track=0,playing=false;
document.getElementById('music').onclick=()=>{
  if(!audio){audio=new Audio();audio.volume=.55;audio.addEventListener('ended',next)}
  if(playing){audio.pause();playing=false;document.getElementById('music').classList.remove('on')}
  else{if(!audio.src)next();else audio.play();playing=true;document.getElementById('music').classList.add('on')}
};
function next(){track=track%6+1;audio.src=BASE+'garden-music-'+track+'.mp3';audio.play().catch(()=>{})}
document.getElementById('back').onclick=()=>location.href=BASE;
document.getElementById('phase').onclick=()=>{
  const order=['dawn','day','golden','dusk','night'];
  ph=order[(order.indexOf(ph)+1)%order.length];applyPhase();
};

/* ---------- loop ---------- */
let last=performance.now(), frames=0, cullTick=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=now/1000;

  /* look, smoothed, from whichever device is driving */
  if(lookDX||lookDY){
    you.yaw-=lookDX*(locked?0.0022:0.0042);
    you.pitch=Math.max(-0.55,Math.min(0.6,you.pitch-lookDY*(locked?0.0019:0.0032)));
    lookDX=lookDY=0;
  }

  let ix=mvX, iz=mvZ;
  if(keys['w']||keys['arrowup'])iz-=1;
  if(keys['s']||keys['arrowdown'])iz+=1;
  if(keys['a']||keys['arrowleft'])ix-=1;
  if(keys['d']||keys['arrowright'])ix+=1;
  const run=keys['shift']?RUN:SPEED;
  let mag=Math.hypot(ix,iz);
  if(mag>1){ix/=mag;iz/=mag;mag=1}

  /* momentum: you lean into a walk and you coast out of it */
  const fx=Math.sin(you.yaw),fz=Math.cos(you.yaw);
  const wantX=(iz*fx+ix*fz)*run, wantZ=(iz*fz-ix*fx)*run;
  const k=mag>0.02?ACC:DRAG;
  you.vx+=(wantX-you.vx)*Math.min(1,k*dt);
  you.vz+=(wantZ-you.vz)*Math.min(1,k*dt);
  const sp=Math.hypot(you.vx,you.vz);
  if(sp>0.01){
    const nx=you.x+you.vx*dt, nz=you.z+you.vz*dt;
    const cx=Math.max(-WM/2+1,Math.min(WM/2-1,nx)), cz=Math.max(-HM/2+1,Math.min(HM/2-1,nz));
    if(!blocked(cx,you.z))you.x=cx; else you.vx*=-.15;
    if(!blocked(you.x,cz))you.z=cz; else you.vz*=-.15;
  }
  const bob=Math.sin(t*(7.2+sp*0.5))*0.035*Math.min(1,sp/SPEED);
  camera.position.set(you.x,EYE+bob,you.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(you.yaw);camera.rotateX(you.pitch);
  sky.position.copy(camera.position);
  {const p=PH[ph];
   orb.position.set(camera.position.x+p.ox*230,camera.position.y+p.oy*180,camera.position.z-Math.sqrt(Math.max(0,230*230-(p.ox*230)**2)));
   orb.lookAt(camera.position);}

  for(let i=0;i<bb.length;i++)bb[i].rotation.y=you.yaw;
  sMat.uniforms.t.value=t;
  airTick(t,dt);
  clouds.forEach(c=>{c.position.x+=c.userData.sp*dt;if(c.position.x>230)c.position.x=-230;c.lookAt(camera.position.x,c.position.y,camera.position.z)});

  if(++cullTick%12===0){
    for(let i=0;i<bb.length;i++){const m=bb[i];
      const d=(m.position.x-you.x)**2+(m.position.z-you.z)**2;
      m.visible=d<(m.userData.far?300*300:70*70);}
  }
  const a=areaAt(you.x,you.z);
  if(a!==areaNow){areaNow=a;document.getElementById('area').innerHTML=a+'<span>.</span>'}

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(()=>{if(document.getElementById('load').style.opacity!=='0')hideLoad()},9000);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

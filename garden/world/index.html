canvas{display:block;touch-action:none}
.micro{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}

.btn.on{background:var(--ivory);color:var(--ink)}
#place{text-shadow:0 1px 18px rgba(0,0,0,.55)}

#hint{opacity:.8;text-shadow:0 1px 12px rgba(0,0,0,.6)}
#stick{position:fixed;left:0;bottom:0;width:50%;height:46%;z-index:15;touch-action:none}
#knob{position:absolute;width:104px;height:104px;border-radius:50%;border:1px solid rgba(246,243,235,.45);

#knob i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(246,243,235,.72)}
#load{position:fixed;inset:0;z-index:40;background:#0f1a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#load .bar{width:min(240px,54vw);height:2px;background:rgba(246,243,235,.2)}
#load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
#load h2{margin:0;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:-.04em;font-weight:800}
#load h2 span{color:var(--gold)}

  fragmentShader:`varying float v;
    void main(){vec2 d=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(d));
    if(a*v<0.02)discard;gl_FragColor=vec4(0.93,0.95,1.0,a*v);}`
});
scene.add(new THREE.Points(sGeo,sMat));

/* ---------- texture cache ---------- */
const TL=new THREE.TextureLoader();
const texCache=new Map();
let pending=0, done=0;
function tex(file,repeat){
  if(texCache.has(file))return texCache.get(file);
  pending++;
  const t=TL.load(BASE+file,()=>{done++;progress()},undefined,()=>{done++;progress()});
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():4);
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}
  texCache.set(file,t);return t;
}
function progress(){
  const p=pending?done/pending:1;
  document.getElementById('lbar').style.width=(p*100).toFixed(0)+'%';
  if(p>=1)setTimeout(hideLoad,220);
}
function hideLoad(){const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.style.display='none',600)}

/* ---------- ground ---------- */
const groundGroup=new THREE.Group();scene.add(groundGroup);
function plane(wpx,hpx,texfile,rx,ry,y){
  const g=new THREE.PlaneGeometry(wpx*GSC,hpx*GSC);
  const m=new THREE.MeshBasicMaterial({map:tex(texfile,[rx,ry])});
  const mesh=new THREE.Mesh(g,m);mesh.rotation.x=-Math.PI/2;mesh.position.y=y;return mesh;
}
/* the lawn under everything */
const lawn=plane(WPX,HPX,'g2-tile-lawn-clipped.webp',WPX/210,HPX/210,0);
groundGroup.add(lawn);
/* the regions */
PATCH.forEach(p=>{
  const m=plane(p.w,p.h,'g2-tile-'+p.t+'.webp',p.w/210,p.h/210,0.012);
  m.position.x=wx(p.cx);m.position.z=wz(p.cy);
  m.userData.patch=p;
  groundGroup.add(m);
});
/* the parterre beds, read from the same BEDS + QT the map uses */
const PXC=1600,PYC=1300,PPS=1.18;
function bedWorld(plot){const q=Math.floor(plot/10),b=BEDS[plot%10];const [tx,ty,sx,sy]=QT[q];
  const lx=tx+b.cx*sx,ly=ty+b.cy*sy;return[PXC+(lx-500)*PPS,PYC+(ly-500)*PPS]}
function bedSize(plot){const b=BEDS[plot%10];return (b.k==='c'?2*b.r:b.k==='e'?2*b.rx:1.7*b.s)*.825*PPS}
const bedList=[];
for(let i=0;i<40;i++){
  const [bx,by]=bedWorld(i), d=bedSize(i);
  const g=new THREE.CircleGeometry(d*GSC*0.5,20);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex('g2-tile-soil-dark-bed.webp',[1.6,1.6])}));
  m.rotation.x=-Math.PI/2;m.position.set(wx(bx),0.02,wz(by));
  groundGroup.add(m);bedList.push({x:wx(bx),z:wz(by),r:d*GSC*0.5});
}

/* ---------- props: billboards standing on their own coordinates ---------- */
const bb=[];      /* everything that turns to face you */
const blockers=[];/* what you cannot walk through */
const srcOf=f=>f.g?'g2-'+f.g+'.webp':'garden-'+f.img+'.webp';
function addProp(f){
  const file=srcOf(f), meta=MA[file];
  if(!meta)return;
  const aspect=meta[1];
  const k=kindOf(file), mult=MULT[k];
  const wM=f.w*PSC*mult, hM=wM*aspect;
  const g=new THREE.PlaneGeometry(wM,hM);
  const m=new THREE.MeshBasicMaterial({map:tex(file),transparent:false,alphaTest:0.42,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(g,m);
  const px=wx(f.x), pz=wz(f.y);
  if(f.flat||FLAT.test(file)){       /* art drawn top down lies on the ground */
    mesh.rotation.x=-Math.PI/2;mesh.position.set(px,0.03,pz);
  }else{
    mesh.position.set(px,hM/2,pz);
    bb.push(mesh);
    if(!f.sway && (k==='hedge'||k==='build'||k==='tree'||/statue|urn|bench|obelisk|planter|beehive|sundial|birdbath|lantern/.test(file))){
      blockers.push({x:px,z:pz,r:Math.max(0.5,wM*0.30)});
    }
  }
  mesh.userData.file=file;
  scene.add(mesh);
}
FIXED.forEach(addProp);

/* ---------- Wonderland: mushrooms you could set a cup on ---------- */
function capTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#B23A2E';g.fillRect(0,0,128,128);
  g.fillStyle='rgba(246,243,235,.92)';
  const r=rng(7);
  for(let i=0;i<16;i++){const x=r()*128,y=r()*128,rad=5+r()*9;g.beginPath();g.arc(x,y,rad,0,6.28);g.fill()}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}
const capTex=capTexture();
const capMat=new THREE.MeshBasicMaterial({map:capTex});
const stemMat=new THREE.MeshBasicMaterial({color:0xEDE4D0});
function mushroom(x,z,scale,table){
  const grp=new THREE.Group();
  const h=(table?0.78:0.5)*scale, capR=(table?1.15:0.55)*scale;
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(capR*0.22,capR*0.30,h,10),stemMat);
  stem.position.y=h/2;grp.add(stem);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(capR,16,10,0,Math.PI*2,0,Math.PI*0.52),capMat);
  cap.position.y=h;cap.scale.y=table?0.42:0.72;grp.add(cap);
  grp.position.set(x,0,z);scene.add(grp);
  blockers.push({x,z,r:capR*0.5});
  return grp;
}
/* a tea table in the meadow, seats around it, and a scatter under the trees */
const MUSH=[
  [820,2120,1.35,1],[700,2150,0.8,0],[930,2090,0.85,0],[760,2010,0.75,0],
  [2640,1500,1.25,1],[2520,1560,0.7,0],[2740,1590,0.8,0],
  [330,1300,0.9,0],[430,1210,0.7,0],[250,1150,1.0,0],
  [2870,760,1.15,1],[2760,700,0.72,0]
];
MUSH.forEach(m=>mushroom(wx(m[0]),wz(m[1]),m[2],m[3]));

/* ---------- clouds ---------- */
const clouds=[];
const CLOUDF=['g2-cloud-soft-01.webp','g2-cloud-soft-02.webp','g2-cloud-wisp-01.webp','g2-cloud-wisp-02.webp'];
(function(){const r=rng(23);
  for(let i=0;i<14;i++){
    const f=CLOUDF[i%4], w=40+r()*70;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*0.42),
      new THREE.MeshBasicMaterial({map:tex(f),transparent:true,opacity:.72,depthWrite:false,fog:false}));
    m.position.set((r()-.5)*420,42+r()*46,(r()-.5)*420);
    m.userData.sp=0.35+r()*0.5;
    scene.add(m);clouds.push(m);
  }
})();

/* ---------- fog and tint ---------- */
function applyPhase(){
  const p=PH[ph];
  skyMat.map=skyTexture(p);skyMat.needsUpdate=true;
  scene.fog=new THREE.FogExp2(new THREE.Color(p.hz),p.fog);
  renderer.setClearColor(new THREE.Color(p.hz));
  const c=new THREE.Color(p.tint);
  scene.traverse(o=>{if(o.isMesh&&o.material&&o.material.map&&o!==sky&&!clouds.includes(o))o.material.color.copy(c)});
  clouds.forEach(m=>{m.material.color.copy(c);m.material.opacity=ph==='night'?.35:.72});
  sMat.uniforms.vis.value=ph==='night'?1:(ph==='dusk'?.45:0);
  document.getElementById('phase').textContent=ph[0].toUpperCase()+ph.slice(1);
}
applyPhase();

/* ---------- where you are ---------- */
const AREAS=[
  {n:'The Fountain Court',x:1600,y:520,r:620},
  {n:'The Glasshouse',x:520,y:580,r:520},
  {n:'The Maze',x:2620,y:790,r:520},
  {n:'The Orchard',x:2680,y:1420,r:620},
  {n:'The Lake',x:560,y:1480,r:640},
  {n:'The Meadow',x:760,y:2060,r:600},
  {n:'The Rose Garden',x:1990,y:2060,r:420},
  {n:'The Pergola',x:2520,y:2060,r:480},
  {n:'The Parterre',x:1600,y:1300,r:640},
  {n:'The Avenue',x:1600,y:2200,r:700}
];
let areaNow='';
function areaAt(px,pz){
  const X=px/GSC+WPX/2, Y=pz/GSC+HPX/2;
  let best=null,bd=1e9;
  AREAS.forEach(a=>{const d=Math.hypot(X-a.x,Y-a.y);if(d<a.r&&d<bd){bd=d;best=a}});
  return best?best.n:'The Garden';
}

/* ---------- you ---------- */
const you={x:wx(1600),z:wz(2280),yaw:0,pitch:-0.02};
const EYE=1.62, SPEED=4.4;
let mvX=0,mvZ=0;

/* left half: walk. right half: look. desktop: WASD + drag */
const stick=document.getElementById('stick'), knob=document.getElementById('knob');
let sId=null,sx0=0,sy0=0;
stick.addEventListener('pointerdown',e=>{sId=e.pointerId;sx0=e.clientX;sy0=e.clientY;
  knob.style.display='block';knob.style.left=sx0+'px';knob.style.top=sy0+'px';stick.setPointerCapture(sId)});
stick.addEventListener('pointermove',e=>{if(e.pointerId!==sId)return;
  const dx=e.clientX-sx0,dy=e.clientY-sy0,m=Math.min(1,Math.hypot(dx,dy)/54);
  const a=Math.atan2(dy,dx);mvX=Math.cos(a)*m;mvZ=Math.sin(a)*m;
  knob.querySelector('i').style.transform=`translate(${Math.cos(a)*m*30}px,${Math.sin(a)*m*30}px)`});
function stickEnd(e){if(e.pointerId!==sId)return;sId=null;mvX=mvZ=0;knob.style.display='none';knob.querySelector('i').style.transform=''}
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);

let lId=null,lx0=0,ly0=0;
renderer.domElement.addEventListener('pointerdown',e=>{lId=e.pointerId;lx0=e.clientX;ly0=e.clientY;renderer.domElement.setPointerCapture(lId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lId)return;
  you.yaw-=(e.clientX-lx0)*0.0042; you.pitch=Math.max(-0.5,Math.min(0.55,you.pitch-(e.clientY-ly0)*0.0032));
  lx0=e.clientX;ly0=e.clientY});
function lookEnd(e){if(e.pointerId===lId)lId=null}
renderer.domElement.addEventListener('pointerup',lookEnd);renderer.domElement.addEventListener('pointercancel',lookEnd);

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

/* ---------- collision ---------- */
const lake=PATCH.find(p=>p.water);
function blocked(px,pz){
  if(lake){const X=px/GSC+WPX/2,Y=pz/GSC+HPX/2;
    if(Math.abs(X-lake.cx)<lake.w/2-30&&Math.abs(Y-lake.cy)<lake.h/2-30)return true}
  for(let i=0;i<blockers.length;i++){const b=blockers[i];
    if((px-b.x)**2+(pz-b.z)**2<b.r*b.r)return true}
  return false;
}

/* ---------- music ---------- */
let audio=null,track=0,playing=false;
document.getElementById('music').onclick=()=>{
  if(!audio){audio=new Audio();audio.volume=.55;audio.addEventListener('ended',next)}
  if(playing){audio.pause();playing=false;document.getElementById('music').classList.remove('on')}
  else{if(!audio.src)next();else audio.play();playing=true;document.getElementById('music').classList.add('on')}
};
function next(){track=track%6+1;audio.src=BASE+'garden-music-'+track+'.mp3';audio.play().catch(()=>{})}
document.getElementById('back').onclick=()=>location.href=BASE;
document.getElementById('phase').onclick=()=>{
  const order=['dawn','day','golden','dusk','night'];
  ph=order[(order.indexOf(ph)+1)%order.length];applyPhase();
};

/* ---------- loop ---------- */
let last=performance.now(), frames=0, cullTick=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=now/1000;

  let ix=mvX, iz=mvZ;
  if(keys['w'])iz-=1;if(keys['s'])iz+=1;if(keys['a'])ix-=1;if(keys['d'])ix+=1;
  const mag=Math.hypot(ix,iz);
  if(mag>0.02){
    const s=Math.min(1,mag)*SPEED*dt;
    const fx=Math.sin(you.yaw),fz=Math.cos(you.yaw);
    const nx=you.x+(iz*fx+ix*fz)*s, nz=you.z+(iz*fz-ix*fx)*s;
    const cx=Math.max(-WM/2+1,Math.min(WM/2-1,nx)), cz=Math.max(-HM/2+1,Math.min(HM/2-1,nz));
    if(!blocked(cx,you.z))you.x=cx;
    if(!blocked(you.x,cz))you.z=cz;
  }
  const bob=mag>0.02?Math.sin(t*7.6)*0.035:0;
  camera.position.set(you.x,EYE+bob,you.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(you.yaw);camera.rotateX(you.pitch);
  sky.position.copy(camera.position);

  for(let i=0;i<bb.length;i++)bb[i].rotation.y=you.yaw;
  sMat.uniforms.t.value=t;
  clouds.forEach(c=>{c.position.x+=c.userData.sp*dt;if(c.position.x>230)c.position.x=-230;c.lookAt(camera.position.x,c.position.y,camera.position.z)});

  if(++cullTick%12===0){
    for(let i=0;i<bb.length;i++){const m=bb[i];
      const d=(m.position.x-you.x)**2+(m.position.z-you.z)**2;
      m.visible=d<70*70;}
  }
  const a=areaAt(you.x,you.z);
  if(a!==areaNow){areaNow=a;document.getElementById('area').innerHTML=a+'<span>.</span>'}

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(()=>{if(document.getElementById('load').style.opacity!=='0')hideLoad()},9000);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>

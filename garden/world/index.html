<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="world-build" content="1.5">
<title>The Garden · Walk</title>
<style>
:root{--ink:#15130E;--ivory:#F6F3EB;--gold:#C9A227;--green:#2F4A34}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a12;font-family:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;color:var(--ivory)}
canvas{display:block;touch-action:none}
.micro{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
     padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#hud .row.b{align-items:flex-end}
.btn{pointer-events:auto;background:rgba(21,19,14,.34);border:1px solid rgba(246,243,235,.75);color:var(--ivory);
     padding:8px 12px;border-radius:999px;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;cursor:pointer;font-family:inherit}
.btn.on{background:var(--ivory);color:var(--ink)}
.dc{height:19px;width:auto;vertical-align:-5px;margin-right:5px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#act{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:8px;z-index:12;pointer-events:none;text-align:center}
#act.on{display:flex}
.abtn{pointer-events:auto;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.abtn.quiet{background:rgba(21,19,14,.55);color:var(--ivory);border:1px solid rgba(246,243,235,.5);font-weight:700;cursor:default;box-shadow:none}
#actChips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.chip{background:rgba(21,19,14,.55);border:1px solid rgba(246,243,235,.55);color:var(--ivory);border-radius:999px;padding:6px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;cursor:pointer}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#status{position:fixed;left:50%;top:15%;transform:translateX(-50%);background:rgba(21,19,14,.86);color:var(--ivory);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:40;max-width:86vw;text-align:center;pointer-events:none}
#status.on{opacity:1}
.sheet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(21,19,14,.6);z-index:30;pointer-events:auto;padding:14px}
.sheet.on{display:flex}
.panel{width:min(600px,100%);max-height:88vh;overflow:auto;background:#1a1812;border:1px solid rgba(246,243,235,.28);border-radius:18px;padding:18px 18px 14px;color:var(--ivory);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel.small{width:min(420px,100%)}
.panel h2{margin:2px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.panel h2 span{color:var(--gold)}
.panel p{font-size:15px;line-height:1.5;margin:0 0 14px;color:rgba(246,243,235,.85)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sbal{white-space:nowrap;padding-top:6px}
.sbal.short{color:#f0a08a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 6px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.pk{border:1px solid rgba(246,243,235,.22);border-radius:14px;padding:10px 8px 8px;text-align:center;background:rgba(246,243,235,.05)}
.pk.in{border-color:var(--gold)}
.pk.locked{opacity:.45}
.pk img{width:100%;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 6px}
.pk .nm{font-size:11px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.pk .pr{font-size:12px;color:rgba(246,243,235,.7);margin:2px 0 6px}
.stp{display:flex;justify-content:center;align-items:center;gap:6px}
.stp button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(246,243,235,.5);background:transparent;color:var(--ivory);font-size:18px;line-height:1;cursor:pointer}
.stp b{min-width:22px;font-size:15px}
.sfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.sfoot .btn{padding:10px 18px;font-size:12px}
.sfoot .btn.on{background:var(--ivory);color:var(--ink)}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid rgba(246,243,235,.12);font-size:14px}
.srow .btn{padding:6px 12px;font-size:10px}
.lnk{background:none;border:0;color:var(--gold);font-weight:800;letter-spacing:.1em;font-size:11px;text-transform:uppercase;cursor:pointer;pointer-events:auto;padding:0}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#place{text-shadow:0 1px 18px rgba(0,0,0,.55)}
#place h1{margin:.1em 0 0;font-size:clamp(1.5rem,4.4vw,2.6rem);letter-spacing:-.035em;line-height:.95;font-weight:800}
#place h1 span{color:var(--gold)}
#near{margin-top:.55em;opacity:.92;min-height:1em}
#hint{opacity:.8;text-shadow:0 1px 12px rgba(0,0,0,.6);max-width:60vw}
#stick{position:fixed;left:0;bottom:0;width:52%;height:58%;z-index:15;touch-action:none}
#knob{position:absolute;width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(246,243,235,.32);
      background:rgba(21,19,14,.14);display:none;transform:translate(-50%,-50%);transition:opacity .18s}
#knob i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
        background:rgba(246,243,235,.78);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#jump{display:none;position:fixed;right:18px;bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px));z-index:21;width:64px;height:64px;border-radius:50%;
      pointer-events:auto;background:rgba(21,19,14,.34);border:1px solid rgba(246,243,235,.75);color:var(--ivory);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;touch-action:none;font-family:inherit}
@media(pointer:coarse){#jump{display:block}}
#load{position:fixed;inset:0;z-index:40;background:#0f1a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#load .bar{width:min(240px,54vw);height:2px;background:rgba(246,243,235,.2)}
#load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
#load h2{margin:0;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:-.04em;font-weight:800}
#load h2 span{color:var(--gold)}
@media(prefers-reduced-motion:reduce){#load{transition:none}}
</style>
</head>
<body>

<div id="load"><h2>The Garden<span>.</span></h2><div class="micro" id="lmsg">Clipping the hedges</div><div class="micro" id="srcnote" style="opacity:.5"></div><div class="bar"><i id="lbar"></i></div></div>

<div id="hud">
  <div class="row">
    <div id="place"><div class="micro" id="walkin">You are walking in</div><h1 id="area">The Parterre<span>.</span></h1><div class="micro" id="near"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center">
      <div class="micro" id="purse" style="text-align:right;text-shadow:0 1px 12px rgba(0,0,0,.6)"></div>
      <button class="btn" id="chimes">Chimes</button>
      <button class="btn" id="music">Music</button>
      <button class="btn" id="deed">Log a deed. +200</button>
      <button class="btn" id="garden">Garden</button>
      <button class="btn" id="back">&larr; DEEDS</button>
    </div>
  </div>
  <div class="row b">
    <div class="micro" id="hint">Drag left to walk · drag right to look</div>
    <button class="btn" id="phase">Day</button>
  </div>
</div>

<div id="stick"><div id="knob"><i></i></div></div>
<button id="jump" aria-label="Jump">Jump</button>
<div id="err" style="position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:#7A1F1F;
  color:#fff;font:600 11px/1.5 ui-monospace,monospace;padding:10px 14px;white-space:pre-wrap"></div>

<div id="act"><button class="abtn" id="actMain">Buy seeds.</button><div id="actChips"></div><div class="micro" id="actKey"></div></div>
<div id="status" class="micro"></div>
<div id="store" class="sheet"><div class="panel">
  <div class="shead"><div><div class="micro">THE SEED STAND</div><h2>Seeds<span>.</span></h2></div><div class="sbal micro" id="stBal"></div></div>
  <div class="micro" id="stNote" style="opacity:.75"></div>
  <div class="grid" id="stGrid"></div>
  <div id="stSack"></div>
  <div class="sfoot"><button class="btn" id="stClose">Close.</button><button class="btn on" id="stBuy">Checkout.</button></div>
</div></div>
<div id="short" class="sheet"><div class="panel small"><h2>Not enough Deedcoins<span>.</span></h2><p id="shBody"></p><div class="sfoot"><button class="btn" id="shKeep">Keep shopping.</button><button class="btn on" id="shDeed">Log a deed.</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======================================================================
   THE GARDEN · world 1.0 · the parterre, built
   The 2D game's own plan (BEDS x QT, the parterre SVG) is turned into real
   geometry here: hedges, beds, soil, gravel, piers and the fountain are
   meshes with a collision grid, so nothing floats and nothing can trap you.
   Only two things stay as pictures: the flowers he rendered for each bed,
   and the trees in the wood around the garden. They are billboards, and you
   never collide with a flower.
   ====================================================================== */
const ON_SITE=/(^|\.)deeds\.fun$/.test(location.hostname);
const BASE=ON_SITE?'/garden/':'https://raw.githubusercontent.com/syzygy007/deeds/main/garden/';
const FAIL=[];
function shout(m){const e=document.getElementById('err');e.style.display='block';e.textContent=String(m).slice(0,400)}
addEventListener('error',e=>shout('ERROR: '+(e.message||e.error)));
if(!ON_SITE)document.getElementById('srcnote').textContent='Preview · pictures are blocked here, the drawn stand ins show instead';
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const COARSE=matchMedia('(pointer:coarse)').matches;
const QS=new URLSearchParams(location.search);

/* ---------- the plan, copied from the game ----------
   BEDS are the ten shapes of one quadrant in its own 400 box, QT mirrors that
   box into the four quadrants of a 1000 box. plot = quadrant*10 + bed. */
const BEDS=[
  {k:'e',cx:80,cy:80,rx:58,ry:40},{k:'t',cx:198,cy:76,s:66,rot:0},{k:'c',cx:312,cy:78,r:40},
  {k:'e',cx:100,cy:198,rx:86,ry:46},{k:'c',cx:222,cy:192,r:34},{k:'e',cx:320,cy:204,rx:44,ry:74},
  {k:'e',cx:62,cy:314,rx:34,ry:52},{k:'c',cx:162,cy:320,r:46},{k:'t',cx:268,cy:318,s:70,rot:180},{k:'c',cx:336,cy:326,r:28}];
const QT=[[140,140,.825,.825],[860,140,-.825,.825],[140,860,.825,-.825],[860,860,-.825,-.825]];
/* n = the game's name (singular), p = the bed label (plural); price and tier are the game's defaults until garden_state hands down the catalog */
const CAT={
 rose:{n:'Rose',p:'Roses',img:'rose',price:50,tier:0},lavender:{n:'Lavender',p:'Lavender',img:'lavender',price:50,tier:0},hydrangea:{n:'Hydrangea',p:'Hydrangeas',img:'hydrangea',price:50,tier:0},
 peony:{n:'Peony',p:'Peonies',img:'peony',price:50,tier:0},tulip:{n:'Tulip',p:'Tulips',img:'tulip',price:50,tier:0},daffodil:{n:'Daffodil',p:'Daffodils',img:'daffodil',price:50,tier:0},
 delphinium:{n:'Delphinium',p:'Delphiniums',img:'delphinium',price:50,tier:0},cosmos:{n:'Cosmos',p:'Cosmos',img:'cosmos',price:50,tier:0},hyacinth:{n:'Hyacinth',p:'Hyacinths',img:'hyacinth',price:50,tier:1}
};
const FLOWERS=Object.keys(CAT);

/* ---------- scale ----------
   U metres per plan unit. the plan's 1000 box becomes a 70 m parterre: cross
   paths 4.2 m wide, the big bed 12 m long, the outer hedge 1.8 m thick. */
const U=0.07;
const px2w=(x,y)=>[(x-500)*U,(y-500)*U];   /* plan units -> world metres (x east, z south) */

/* ---------- pictures: plain img tags, each file once, shared ---------- */
const IMGC=new Map();
function loadImg(file,ok,bad){
  let e=IMGC.get(file);
  if(e){if(e.state==='ok')ok(e.img);else if(e.state==='wait'){e.q.push(ok);if(bad)e.b.push(bad)}else if(bad)bad();return}
  e={img:new Image(),q:[ok],b:bad?[bad]:[],state:'wait'};IMGC.set(file,e);
  if(!ON_SITE)e.img.crossOrigin='anonymous';   /* off the site the pictures come from another origin; WebGL needs this to read them. on the site: plain, as the garden loads them */
  e.img.onload=()=>{e.state='ok';e.q.forEach(f=>f(e.img));e.q=[];e.b=[]};
  e.img.onerror=()=>{e.state='bad';FAIL.push(file);e.b.forEach(f=>f());e.q=[];e.b=[]};
  e.img.src=BASE+file;
}
function dress(t,repeat,linear){
  t.encoding=linear?THREE.LinearEncoding:THREE.sRGBEncoding;
  t.anisotropy=ANISO;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}
  return t;
}
/* a texture that shows a drawn stand in until (and unless) the picture lands */
function pic(file,fallbackCanvas,repeat,onSwap){
  const t=new THREE.CanvasTexture(fallbackCanvas);dress(t,repeat);
  loadImg(file,img=>{t.image=img;t.needsUpdate=true;if(onSwap)onSwap(img)});
  return t;
}

/* ---------- little geometry helpers ---------- */
function rrectPath(x0,y0,x1,y1,rr,seg){ /* rr = [tl,tr,br,bl] radii, clockwise in plan */
  const P=[];
  const corner=(cx,cy,r,a0,a1,n)=>{for(let k=0;k<=n;k++){const a=a0+(a1-a0)*k/n;P.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  const n=r=>Math.max(3,Math.round(seg*Math.min(1,r/60)+3));
  corner(x0+rr[0],y0+rr[0],rr[0],Math.PI,Math.PI*1.5,n(rr[0]));
  corner(x1-rr[1],y0+rr[1],rr[1],Math.PI*1.5,Math.PI*2,n(rr[1]));
  corner(x1-rr[2],y1-rr[2],rr[2],0,Math.PI*0.5,n(rr[2]));
  corner(x0+rr[3],y1-rr[3],rr[3],Math.PI*0.5,Math.PI,n(rr[3]));
  return P;
}
function ellipsePath(cx,cy,rx,ry,n){const P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;P.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return P}
/* the rounded triangle, the same construction the game's tri() uses */
function triPath(cx,cy,s,rot){
  const V=[0,1,2].map(i=>{const a=(-90+120*i+rot)*Math.PI/180;return[cx+s*Math.cos(a),cy+s*Math.sin(a)]});
  const k=.38,pts=[];
  const corners=[];
  for(let i=0;i<3;i++){const v=V[i],pr=V[(i+2)%3],nx=V[(i+1)%3];
    corners.push({b:[v[0]+(pr[0]-v[0])*k,v[1]+(pr[1]-v[1])*k],v,a:[v[0]+(nx[0]-v[0])*k,v[1]+(nx[1]-v[1])*k]})}
  for(let i=1;i<=3;i++){const q=corners[i%3];
    pts.push(q.b);
    for(let t=1;t<=12;t++){const u=t/12,w=1-u;
      pts.push([w*w*q.b[0]+2*w*u*q.v[0]+u*u*q.a[0], w*w*q.b[1]+2*w*u*q.v[1]+u*u*q.a[1]])}
  }
  return pts;
}
/* densify a polyline so every segment is short (metres) */
function resample(P,closed,step){
  const out=[];const n=P.length;const segs=closed?n:n-1;
  for(let i=0;i<segs;i++){const a=P[i],b=P[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.ceil(L/step));
    for(let j=0;j<k;j++){const t=j/k;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
  if(!closed)out.push(P[n-1]);
  return out;
}
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p[0]*q[1]-q[0]*p[1]}return Math.abs(a)/2}
function inPoly(P,x,z){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];
  if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function segDist(x,z,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];const L2=dx*dx+dz*dz||1e-9;let t=((x-a[0])*dx+(z-a[1])*dz)/L2;t=t<0?0:t>1?1:t;return Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t)}
function polyDist(P,closed,x,z){let d=1e9;const n=P.length,segs=closed?n:n-1;for(let i=0;i<segs;i++){const v=segDist(x,z,P[i],P[(i+1)%n]);if(v<d)d=v}return d}

/* ---------- the collision grid ----------
   one number per 25 cm cell: how high the thing standing there is. you can
   step up 28 cm, jump 72 cm, and anything taller stops you. if you are ever
   inside something you are simply stood on top of it, so nothing can trap you. */
const CELL=0.25, EXT=64, GN=Math.round(EXT*2/CELL);
const GRID=new Float32Array(GN*GN);
const gi=(x,z)=>{const ix=Math.floor((x+EXT)/CELL),iz=Math.floor((z+EXT)/CELL);return(ix<0||iz<0||ix>=GN||iz>=GN)?-1:iz*GN+ix};
function markCell(x,z,h){const i=gi(x,z);if(i>=0&&GRID[i]<h)GRID[i]=h}
function markDisk(cx,cz,r,h){for(let z=cz-r;z<=cz+r;z+=CELL)for(let x=cx-r;x<=cx+r;x+=CELL){const X=Math.floor((x+EXT)/CELL)*CELL-EXT+CELL/2,Z=Math.floor((z+EXT)/CELL)*CELL-EXT+CELL/2;if(Math.hypot(X-cx,Z-cz)<=r)markCell(X,Z,h)}}
function markRect(x0,z0,x1,z1,h){for(let z=z0;z<=z1;z+=CELL)for(let x=x0;x<=x1;x+=CELL)markCell(x,z,h)}
function markPoly(P,h){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;P.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);z0=Math.min(z0,p[1]);z1=Math.max(z1,p[1])});
  for(let z=z0;z<=z1;z+=CELL)for(let x=x0;x<=x1;x+=CELL){const X=Math.floor((x+EXT)/CELL)*CELL-EXT+CELL/2,Z=Math.floor((z+EXT)/CELL)*CELL-EXT+CELL/2;if(inPoly(P,X,Z))markCell(X,Z,h)}}
function markBand(P,closed,hw,h){const n=P.length,segs=closed?n:n-1;
  /* an open run ends flat, not round, so a gate in the hedge stays as wide as the hedge ends: nothing is marked past either end plane */
  let e0,e1;if(!closed){const a=P[0],b=P[1],c=P[n-2],d=P[n-1];const l0=Math.hypot(b[0]-a[0],b[1]-a[1])||1,l1=Math.hypot(d[0]-c[0],d[1]-c[1])||1;
    e0=[a[0],a[1],(b[0]-a[0])/l0,(b[1]-a[1])/l0];e1=[d[0],d[1],(d[0]-c[0])/l1,(d[1]-c[1])/l1]}
  for(let i=0;i<segs;i++){const a=P[i],b=P[(i+1)%n];
    const x0=Math.min(a[0],b[0])-hw,x1=Math.max(a[0],b[0])+hw,z0=Math.min(a[1],b[1])-hw,z1=Math.max(a[1],b[1])+hw;
    for(let z=z0;z<=z1;z+=CELL)for(let x=x0;x<=x1;x+=CELL){const X=Math.floor((x+EXT)/CELL)*CELL-EXT+CELL/2,Z=Math.floor((z+EXT)/CELL)*CELL-EXT+CELL/2;
      if(!closed&&(((X-e0[0])*e0[2]+(Z-e0[1])*e0[3])<0||((X-e1[0])*e1[2]+(Z-e1[1])*e1[3])>0))continue;
      if(segDist(X,Z,a,b)<=hw)markCell(X,Z,h)}}}
const PR=0.30;                       /* your radius */
function floorAt(x,z){let h=0;const ix=Math.floor((x+EXT)/CELL),iz=Math.floor((z+EXT)/CELL);
  for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){const jx=ix+dx,jz=iz+dz;if(jx<0||jz<0||jx>=GN||jz>=GN)continue;
    const cx=jx*CELL-EXT+CELL/2,cz=jz*CELL-EXT+CELL/2;
    /* the cell counts if the circle overlaps it: nearest point of the cell to you */
    const nx=Math.max(cx-CELL/2,Math.min(x,cx+CELL/2)),nz=Math.max(cz-CELL/2,Math.min(z,cz+CELL/2));
    if(Math.hypot(nx-x,nz-z)<PR){const v=GRID[jz*GN+jx];if(v>h)h=v}}
  return h}

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* draw a mark at 9 offsets so the tile wraps seamlessly */
function wrapped(g,S,x,y,fn){const m=24;const xs=[0],ys=[0];if(x<m)xs.push(S);if(x>S-m)xs.push(-S);if(y<m)ys.push(S);if(y>S-m)ys.push(-S);
  xs.forEach(ox=>ys.forEach(oy=>{g.save();g.translate(x+ox,y+oy);fn(g);g.restore()}))}
function ell(g,rx,ry,rot,col){g.rotate(rot);g.fillStyle=col;g.beginPath();g.ellipse(0,0,rx,ry,0,0,6.2832);g.fill()}
function noise(g,S,n,alpha,r){for(let i=0;i<n;i++){const v=Math.floor(r()*255);g.fillStyle=`rgba(${v},${v},${v},${alpha})`;g.fillRect(r()*S,r()*S,1+r()*2,1+r()*2)}}

function ashlarTex(){
  const S=512,c=cv(S,S),g=c.getContext('2d'),r=rng(29);
  const base=stoneTex();g.drawImage(base,0,0,S,S);
  /* courses of blocks, 4 courses a tile, rows staggered, mortar in between */
  const rows=4,cols=2;const bh=S/rows,bw=S/cols;
  for(let i=0;i<rows;i++){const off=(i%2)*bw/2;for(let j=-1;j<=cols;j++){const x=j*bw+off,y=i*bh;
    g.fillStyle=`rgba(${200+r()*40|0},${185+r()*40|0},${150+r()*40|0},.22)`;g.fillRect(x+2,y+2,bw-4,bh-4);}}

  for(let i=0;i<=rows;i++){g.beginPath();g.moveTo(0,i*bh);g.lineTo(S,i*bh);g.stroke()}
  for(let i=0;i<rows;i++){const off=(i%2)*bw/2;for(let j=0;j<=cols;j++){const x=(j*bw+off)%S;g.beginPath();g.moveTo(x,i*bh);g.lineTo(x,(i+1)*bh);g.stroke()}}
  return c;
}
function waterNormal(){
  const S=256,c=cv(S,S),g=c.getContext('2d'),r=rng(31);
  const H=new Float32Array(S*S);
  const waves=[];for(let i=0;i<7;i++)waves.push([r()*6.28,2+Math.round(r()*5),r()*6.28,0.5+r()]);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){let v=0;waves.forEach(w=>{v+=Math.sin((Math.cos(w[0])*x+Math.sin(w[0])*y)/S*6.2832*w[1]+w[2])*w[3]});H[y*S+x]=v}
  const im=g.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const l=H[y*S+(x+S-1)%S],rr=H[y*S+(x+1)%S],u=H[((y+S-1)%S)*S+x],d=H[((y+1)%S)*S+x];
    let nx=(l-rr)*0.9,ny=(u-d)*0.9,nz=1;const L=Math.hypot(nx,ny,nz);nx/=L;ny/=L;nz/=L;const i=(y*S+x)*4;
    im.data[i]=(nx*.5+.5)*255;im.data[i+1]=(ny*.5+.5)*255;im.data[i+2]=(nz*.5+.5)*255;im.data[i+3]=255}
  g.putImageData(im,0,0);return c;
}

/* ---------- drawn stand ins for his flower renders ---------- */
const PAL={
 rose:{f:['#E8A0B4','#F3C6D3','#D97A96','#F7E6EC','#C9647F'],ctr:'#F9E9EE'},
 peony:{f:['#F2B2C2','#F8D3DD','#EA8FA9','#FBE8EE','#E37A98'],ctr:'#FFF2F6'},
 lavender:{f:['#7C5FB5','#9A80CF','#6A4FA2','#B39BDD'],spike:1},
 hydrangea:{f:['#BFD2EC','#F0EEF7','#D7C2E6','#A9C1E3','#F6E7F0'],ball:1},
 tulip:{f:['#E63946','#F4A261','#F1C453','#E76F9A','#FFFFFF'],cup:1},
 daffodil:{f:['#F5D04A','#FBE58A','#F2C21F'],trumpet:1},
 delphinium:{f:['#3F6FD8','#5B85E8','#2E56B8','#7A9BEE'],spike:1,tall:1},

 hyacinth:{f:['#E48BB4','#8FA8E8','#F2B9D2','#6E86D6'],column:1}
};
function bush(g,r,cx,top,w,h,dark){
  const greens=dark?['#2B4E23','#37602B','#437235','#27461F','#4F8040']:['#3A6B2E','#4B8038','#5A9243','#2F5A27','#6AA24F','#3E7231'];
  for(let i=0;i<150;i++){const t=i/150;const x=cx+(r()-.5)*w*(0.55+0.45*Math.sqrt(t)),y=top+h*(0.15+r()*0.85);
    if(Math.hypot((x-cx)/(w/2),(y-(top+h*0.62))/(h*0.55))>1.05)continue;
    const rx=6+r()*7,ry=3+r()*4,rot=r()*6.28;g.save();g.translate(x,y);ell(g,rx,ry,rot,'rgba(10,30,12,.45)');g.translate(-1,-1.5);ell(g,rx,ry,rot,greens[Math.floor(r()*greens.length)]);g.restore()}
}
function bloom(g,r,x,y,rad,p){
  const f=p.f;
  if(p.cup){g.fillStyle=f[Math.floor(r()*f.length)];g.beginPath();g.moveTo(x-rad*.7,y+rad*.9);g.quadraticCurveTo(x-rad*1.05,y-rad*.6,x-rad*.75,y-rad*1.1);g.quadraticCurveTo(x,y-rad*.55,x+rad*.75,y-rad*1.1);g.quadraticCurveTo(x+rad*1.05,y-rad*.6,x+rad*.7,y+rad*.9);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(x-rad*.25,y-rad*.2,rad*.28,rad*.6,0,0,6.28);g.fill();return}
  if(p.daisy){for(let k=0;k<8;k++){const a=k/8*6.28;g.save();g.translate(x+Math.cos(a)*rad*.62,y+Math.sin(a)*rad*.62);ell(g,rad*.42,rad*.24,a,f[Math.floor(r()*f.length)]);g.restore()}
    g.fillStyle='#F2C23A';g.beginPath();g.arc(x,y,rad*.3,0,6.28);g.fill();return}
  if(p.trumpet){for(let k=0;k<6;k++){const a=k/6*6.28;g.save();g.translate(x+Math.cos(a)*rad*.6,y+Math.sin(a)*rad*.6);ell(g,rad*.45,rad*.3,a,f[Math.floor(r()*f.length)]);g.restore()}
    g.fillStyle='#F09A1C';g.beginPath();g.arc(x,y,rad*.36,0,6.28);g.fill();g.fillStyle='#FFD86B';g.beginPath();g.arc(x-rad*.1,y-rad*.1,rad*.18,0,6.28);g.fill();return}
  if(p.ball){for(let k=0;k<26;k++){const a=r()*6.28,d=r()*rad*.85;g.fillStyle=f[Math.floor(r()*f.length)];g.beginPath();g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,rad*.22,0,6.28);g.fill()}
    g.fillStyle='rgba(255,255,255,.25)';g.beginPath();g.arc(x-rad*.25,y-rad*.3,rad*.45,0,6.28);g.fill();return}
  /* layered petals: rose and peony */
  const n=p===PAL.peony?7:5;
  for(let k=0;k<n;k++){const t=k/(n-1);const rr=rad*(1-t*.75);const ox=(r()-.5)*rad*.25,oy=(r()-.5)*rad*.25;
    g.fillStyle=f[Math.min(f.length-1,Math.floor(t*f.length))];g.beginPath();g.arc(x+ox,y+oy,rr,0,6.28);g.fill();
    g.strokeStyle='rgba(120,40,70,.25)';g.lineWidth=1;g.stroke()}
  g.fillStyle=p.ctr;g.beginPath();g.arc(x,y,rad*.18,0,6.28);g.fill();
}
function flowerCanvas(kind){
  const p=PAL[kind]||PAL.rose;const c=cv(256,256),g=c.getContext('2d'),r=rng(hashStr(kind));
  const cx=128;
  if(p.spike||p.column){
    /* leaves low, spikes up */
    bush(g,r,cx,150,180,100,kind==='lavender');
    const n=p.column?7:p.tall?9:14;
    for(let i=0;i<n;i++){const x=cx+(r()-.5)*(p.column?110:160),base=205-r()*20,top=p.tall?40+r()*40:(p.column?95+r()*30:70+r()*40);
      g.strokeStyle=kind==='lavender'?'#8AA07A':'#4F8038';g.lineWidth=p.column?4:1.6;g.beginPath();g.moveTo(x,base);g.lineTo(x+(r()-.5)*10,top);g.stroke();
      const steps=Math.floor((base-top)/(p.column?7:6));
      for(let k=0;k<steps;k++){const t=k/steps;const y=base-(base-top)*t-8;const w=p.column?(9-t*3):p.tall?(7-t*3):(3.5-t*1.5);
        if(t<0.2&&!p.column)continue;
        g.fillStyle=p.f[Math.floor(r()*p.f.length)];g.beginPath();g.ellipse(x+(r()-.5)*4,y,w,w*.75,0,0,6.28);g.fill()}
      if(p.column){g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(x-3,(base+top)/2,3,(base-top)/2-6,0,0,6.28);g.fill()}
    }
    return c;
  }
  bush(g,r,cx,70,215,180,false);
  const n=p.ball?7:p.cup?12:p.daisy?12:9;
  for(let i=0;i<n;i++){const a=r()*6.28,d=Math.sqrt(r())*84;const x=cx+Math.cos(a)*d*1.1,y=140+Math.sin(a)*d*.62-12;
    const rad=p.ball?22+r()*10:p.cup?11+r()*4:p.daisy?11+r()*4:kind==='peony'?15+r()*7:11+r()*5;
    if(p.cup||p.daisy){g.strokeStyle='#4E8A3A';g.lineWidth=2;g.beginPath();g.moveTo(x,y+rad);g.lineTo(x+(r()-.5)*8,y+rad+30+r()*20);g.stroke()}
    bloom(g,r,x,y,rad,p)}
  return c;
}

}

    if(closed){const a=path[(ii-1+n)%n],b=path[(ii+1)%n];tx=b[0]-a[0];tz=b[1]-a[1]}
    else{const a=path[Math.max(0,ii-1)],b=path[Math.min(n-1,ii+1)];tx=b[0]-a[0];tz=b[1]-a[1]}
    const L=Math.hypot(tx,tz)||1;tx/=L;tz/=L;const nx=-tz,nz=tx;
    if(i>0){const q=path[(ii-1+n)%n];s+=Math.hypot(p[0]-q[0],p[1]-q[1])}

  p.g=Math.min(2,(p.g||0)+1);p.wd=k;save();plantBeds();renderHud();
  setTimeout(()=>{if(p.g>=2)SND.bloom();else SND.grow();const left=Object.values(S.plants).filter(q=>(q.g||0)<2&&(freeWater()||q.wd!==k)).length;if(!left)setTimeout(()=>SND.allWatered(),700)},220);
  toast(p.g>=2?'In bloom. '+CAT[p.t].p+' in bed '+(plot+1)+'.':'Watered. Bed '+(plot+1)+' is growing. Come back tomorrow.')}
/* a shower over a bed, sixty drops, gone in a second and a half */
const RAINS=[];const rainMat=new THREE.PointsMaterial({map:dress(new THREE.CanvasTexture(glowTex())),color:0xdff3ff,size:0.16,transparent:true,opacity:0.9,depthWrite:false,alphaTest:0.2});
function rain(cx,cz,r){const n=70,pos=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){const a=Math.random()*6.28,d=Math.random()*r*0.7;pos[i*3]=cx+Math.cos(a)*d;pos[i*3+1]=1.4+Math.random()*0.9;pos[i*3+2]=cz+Math.sin(a)*d;v.push(1.5+Math.random()*1.5)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(g,rainMat);scene.add(pts);RAINS.push({pts,v,t:0})}
function rainTick(dt){for(let i=RAINS.length-1;i>=0;i--){const R=RAINS[i];R.t+=dt;const a=R.pts.geometry.attributes.position;for(let j=0;j<a.count;j++){let y=a.getY(j)-R.v[j]*dt;if(y<0.12)y=1.9+Math.random()*0.4;a.setY(j,y)}a.needsUpdate=true;
  if(R.t>1.5){scene.remove(R.pts);R.pts.geometry.dispose();RAINS.splice(i,1)}}}

/* ---------- the act bar: what you can do from where you stand ---------- */
let ACT=null,ATSTAND=false;                         /* {mode,plot} */
const actEl=$('#act'),actMain=$('#actMain'),actChips=$('#actChips'),actKey=$('#actKey');
function bedHere(){let best=null,bd=1e9;for(let i=0;i<40;i++){const b=BED[i];const near=Math.hypot(b.cx-you.x,b.cz-you.z)-b.rmax;if(near>2.5)continue;const d=inPoly(b.P,you.x,you.z)?-1:polyDist(b.P,true,you.x,you.z);if(d<bd){bd=d;best=b}}return best&&bd<0.9?best:null}
function showAct(label,mode,plot,chips,say){ACT=mode?{mode,plot}:null;actMain.textContent=label;actMain.classList.toggle('quiet',!mode);
  actChips.innerHTML=(chips||[]).map(t=>'<button class="chip'+(t===SOWT?' on':'')+'" data-t="'+t+'">'+CAT[t].n+' \u00B7 '+S.sack[t]+'</button>').join('');
  $$('#actChips .chip').forEach(b=>b.onclick=e=>{e.stopPropagation();SOWT=b.dataset.t;updateAct()});
  const key=mode&&!COARSE?'press E'+(chips&&chips.length>1?' \u00B7 Q picks the seed':''):'';
  actKey.textContent=say?(say+(key?' \u00B7 '+key:'')):key;actEl.classList.add('on')}
function hideAct(){ACT=null;actEl.classList.remove('on')}
function updateAct(){if(STORE_ON||BLOOM){hideAct();return}
  if(Math.hypot(you.x-STAND.front.x,you.z-STAND.front.z)<2.8){if(!ATSTAND){ATSTAND=true;SND.hello()}showAct('Buy seeds.','stand',null,null,'\u201CSeeds are fifty. Water them and come back tomorrow.\u201D');return}
  ATSTAND=false;
  const b=bedHere();if(!b){hideAct();return}
  const p=S.plants[b.plot];
  if(!p){const types=FLOWERS.filter(t=>S.sack[t]>0);if(!types.length){showAct('Bed '+(b.plot+1)+' is empty. Seeds are at the stand by the gate.');return}
    if(!SOWT||!(S.sack[SOWT]>0))SOWT=types[0];showAct('Sow '+CAT[SOWT].n.toLowerCase()+' seeds in bed '+(b.plot+1)+'.','sow',b.plot,types);return}
  if(p.pending){hideAct();return}
  if((p.g||0)>=2){showAct(CAT[p.t].p+' in bloom.');return}
  if(!freeWater()&&p.wd===today()){showAct('Bed '+(b.plot+1)+' is watered. Come back tomorrow.');return}
  showAct('Water bed '+(b.plot+1)+'.','water',b.plot)}
function act(){if(!ACT)return;if(ACT.mode==='stand')openStore();else if(ACT.mode==='sow')sowAt(ACT.plot,SOWT);else if(ACT.mode==='water')waterAt(ACT.plot);updateAct()}
function cycleSeed(){const types=FLOWERS.filter(t=>S.sack[t]>0);if(types.length<2)return;SOWT=types[(types.indexOf(SOWT)+1)%types.length];updateAct()}
actMain.addEventListener('click',e=>{e.stopPropagation();act()});
actMain.addEventListener('pointerdown',e=>e.stopPropagation());

/* ======================================================================
   YOU
   ====================================================================== */
const EYE=1.62,SPEED=3.4,RUN=6.4,ACC=17,DRAG=11,STEP=0.28,GRAV=20,JUMPV=5.4;
const you={x:SPAWN.x,z:SPAWN.z,yaw:SPAWN.yaw,pitch:-0.02,vx:0,vz:0,feet:0,vy:0,grounded:true,stepOff:0};
camera.rotation.order='YXZ';
function blocked(x,z){return floorAt(x,z)>you.feet+(you.grounded?STEP:0.05)+1e-4}
let mvX=0,mvZ=0,jumpQ=false;

/* the phone stick: left half walks, the ring follows your thumb */
const stick=$('#stick'),knob=$('#knob');
let sId=null,sx0=0,sy0=0;
stick.addEventListener('pointerdown',e=>{sId=e.pointerId;sx0=e.clientX;sy0=e.clientY;knob.style.display='block';knob.style.left=sx0+'px';knob.style.top=sy0+'px'});
const RMAX=62,DEAD=7;
addEventListener('pointermove',e=>{if(e.pointerId!==sId)return;
  let dx=e.clientX-sx0,dy=e.clientY-sy0,d=Math.hypot(dx,dy);
  if(d>RMAX){sx0+=dx*(1-RMAX/d);sy0+=dy*(1-RMAX/d);knob.style.left=sx0+'px';knob.style.top=sy0+'px';dx=e.clientX-sx0;dy=e.clientY-sy0;d=RMAX}
  const a=Math.atan2(dy,dx);let m=d<DEAD?0:(d-DEAD)/(RMAX-DEAD);m=m*m*(3-2*m);
  mvX=Math.cos(a)*m;mvZ=Math.sin(a)*m;knob.querySelector('i').style.transform=`translate(${Math.cos(a)*m*34}px,${Math.sin(a)*m*34}px)`});
function stickEnd(e){if(e.pointerId!==sId)return;sId=null;mvX=mvZ=0;knob.style.display='none';knob.querySelector('i').style.transform=''}
addEventListener('pointerup',stickEnd);addEventListener('pointercancel',stickEnd);
$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQ=true});

/* look: mouse lock on desktop, drag on the right on a phone */
let locked=false,lookDX=0,lookDY=0,lId=null,lx0=0,ly0=0;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&!locked){try{cvs.requestPointerLock&&cvs.requestPointerLock()}catch(x){}return}
  lId=e.pointerId;lx0=e.clientX;ly0=e.clientY});
addEventListener('pointermove',e=>{if(locked||e.pointerId!==lId)return;lookDX+=(e.clientX-lx0);lookDY+=(e.clientY-ly0);lx0=e.clientX;ly0=e.clientY});
function lookEnd(e){if(e.pointerId===lId)lId=null}
addEventListener('pointerup',lookEnd);addEventListener('pointercancel',lookEnd);
const HINT_LOCK='WASD to walk · shift to run · space to jump · E to act · esc frees the mouse';
const HINT_FREE=COARSE?'Drag left to walk · drag right to look · Jump to hop into a bed':'Click to look · WASD to walk · space to jump · E to act';
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cvs;$('#hint').textContent=locked?HINT_LOCK:HINT_FREE});
document.addEventListener('mousemove',e=>{if(locked){lookDX+=e.movementX;lookDY+=e.movementY}});
$('#hint').textContent=HINT_FREE;

const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='escape'){closeStore();return}
  if(STORE_ON)return;
  if(k==='e'&&!e.repeat){act();return}if(k==='q'&&!e.repeat){cycleSeed();return}
  if(k===' '&&!keys[' ']&&!e.repeat)jumpQ=true;keys[k]=1;if(/^arrow| $/.test(k))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});

/* ======================================================================
   THE HOUR, THE HUD, THE MUSIC
   ====================================================================== */
function applyPhase(){const p=PH[ph];
  skyMat.map=skyTexture(p);skyMat.color.set(p.skyTint);skyMat.needsUpdate=true;
  scene.fog.color.set(p.fog);scene.fog.near=p.fogN;scene.fog.far=p.fogF;renderer.setClearColor(new THREE.Color(p.fog));
  sun.color.set(p.sunC);sun.intensity=p.sunI;sun.position.set(p.sun[0]*120,p.sun[1]*120,p.sun[2]*120);sun.target.position.set(0,0,0);
  hemi.intensity=p.hemiI;hemi.color.set(p.hemiS);hemi.groundColor.set(p.hemiG);
  BB_MATS.forEach(m=>{m.uniforms.tint.value.set(p.tint);m.uniforms.fogColor.value.set(p.fog);m.uniforms.fogNear.value=p.fogN;m.uniforms.fogFar.value=p.fogF});
  airMats.forEach(m=>m.color.set(p.tint));
  starMat.uniforms.op.value=p.stars;
  sunSprite.visible=p.orb==='sun';moonSprite.visible=p.orb==='moon';
  LANTERNS.forEach(l=>l.intensity=p.lamp);MAT.lantern.emissiveIntensity=p.lamp*0.9;
  shadowMats.forEach(m=>m.opacity=Math.max(0.3,0.92-p.lamp*0.4));
  ffMat.opacity=p.lamp>=1.2?0.95:p.lamp>0.5?0.4:0;
  CLOUDS.forEach(c=>{c.s.material.color.set(p.cloud);c.s.material.opacity=ph==='night'?0.5:0.9});
  MAT.water.color.set(ph==='night'?0x16324a:ph==='dusk'?0x35507c:0x2c7e98);
  $('#phase').textContent=ph.charAt(0).toUpperCase()+ph.slice(1);
}
$('#phase').onclick=()=>{ph=ORDER[(ORDER.indexOf(ph)+1)%ORDER.length];applyPhase()};
$('#back').onclick=()=>location.href=ON_SITE?'/':'https://deeds.fun/';
function paintChimes(){$('#chimes').classList.toggle('on',!SND.muted())}
$('#chimes').onclick=()=>{SND.setMute(!SND.muted());paintChimes();if(!SND.muted())SND.open()};paintChimes();
$('#garden').onclick=()=>location.href=BASE;
let audio=null,track=0,playing=false;
$('#music').onclick=()=>{
  if(!audio){audio=new Audio();audio.volume=.55;audio.addEventListener('ended',nextTrack)}
  if(playing){audio.pause();playing=false;$('#music').classList.remove('on')}
  else{if(!audio.src)nextTrack();else audio.play().catch(()=>{});playing=true;$('#music').classList.add('on')}};
function nextTrack(){track=track%6+1;audio.src=BASE+'garden-music-'+track+'.mp3';audio.play().catch(()=>{})}

/* ======================================================================
   THE LOOP
   ====================================================================== */
const areaEl=$('#area'),nearEl=$('#near'),walkEl=$('#walkin');
let areaNow='';
function labels(){
  let name='The Parterre';const d0=Math.hypot(you.x,you.z);
  if(d0<6.2)name='The Fountain';
  else if(Math.max(Math.abs(you.x),Math.abs(you.z))>HALF+0.4)name=Math.abs(you.x)<3.6?'The Avenue':'The Wood';
  if(name!==areaNow){areaNow=name;areaEl.innerHTML=name+'<span>.</span>'}
  let best=null,bd=1e9;for(let i=0;i<40;i++){const b=BED[i];const d=Math.hypot(b.cx-you.x,b.cz-you.z)-b.rmax;if(d<bd){bd=d;best=b}}
  if(best&&bd<1.3){const inside=inPoly(best.P,you.x,you.z);nearEl.textContent='Bed '+(best.plot+1)+' · '+(bedLabel[best.plot]||'empty, waiting for a seed')+(inside?' · you are standing in it':'')}
  else nearEl.textContent='';
}
let last=performance.now(),frame=0;
const camDir=new THREE.Vector3();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;frame++;
  if(STORE_ON){lookDX=lookDY=0;mvX=mvZ=0;for(const k in keys)keys[k]=0}
  if(lookDX||lookDY){you.yaw-=lookDX*(locked?0.0022:0.0042);you.pitch=Math.max(-0.7,Math.min(0.7,you.pitch-lookDY*(locked?0.0019:0.0032)));lookDX=lookDY=0}
  let ix=mvX,iz=mvZ;
  if(keys['w']||keys['arrowup'])iz-=1;if(keys['s']||keys['arrowdown'])iz+=1;
  if(keys['a']||keys['arrowleft'])ix-=1;if(keys['d']||keys['arrowright'])ix+=1;
  const run=keys['shift']?RUN:SPEED;let mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag;mag=1}
  const fx=Math.sin(you.yaw),fz=Math.cos(you.yaw);
  const wantX=(iz*fx+ix*fz)*run,wantZ=(iz*fz-ix*fx)*run;
  const k=mag>0.02?ACC:DRAG;
  you.vx+=(wantX-you.vx)*Math.min(1,k*dt);you.vz+=(wantZ-you.vz)*Math.min(1,k*dt);
  const sp=Math.hypot(you.vx,you.vz);
  if(sp>0.01){
    const nx=you.x+you.vx*dt,nz=you.z+you.vz*dt;
    if(!blocked(nx,you.z))you.x=nx;else you.vx*=0.2;
    if(!blocked(you.x,nz))you.z=nz;else you.vz*=0.2;
    const rr=Math.hypot(you.x,you.z);if(rr>61){you.x*=61/rr;you.z*=61/rr}
  }
  /* up and down: stand on whatever is under you, never inside it */
  const fl=floorAt(you.x,you.z);
  if(jumpQ){jumpQ=false;if(you.grounded){you.vy=JUMPV;you.grounded=false}}
  if(you.grounded){if(fl>you.feet+1e-3){you.stepOff-=(fl-you.feet);you.feet=fl}else if(fl<you.feet-1e-3)you.grounded=false}
  if(!you.grounded){you.vy-=GRAV*dt;you.feet+=you.vy*dt;if(you.feet<=fl){if(you.vy<-3)you.stepOff-=Math.min(0.12,(-you.vy-3)*0.02);you.feet=fl;you.vy=0;you.grounded=true}}
  you.stepOff+=(0-you.stepOff)*Math.min(1,12*dt);
  const bob=you.grounded?Math.sin(t*(sp>4?11:8))*0.035*Math.min(1,sp/2.5):0;
  camera.position.set(you.x,you.feet+EYE+bob+you.stepOff,you.z);
  camera.rotation.y=you.yaw;camera.rotation.x=you.pitch;

  /* the sky rides with you, so the horizon never comes closer */
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  const p=PH[ph];camDir.set(p.sun[0],p.sun[1],p.sun[2]).normalize();
  sunSprite.position.copy(camera.position).addScaledVector(camDir,290);moonSprite.position.copy(camera.position).addScaledVector(camDir,290);
  CLOUDS.forEach(c=>{c.a+=c.sp*dt;c.s.position.set(Math.cos(c.a)*c.rad,c.y,Math.sin(c.a)*c.rad)});
  starMat.uniforms.time.value=t;
  BB_MATS.forEach(m=>m.uniforms.time.value=t);
  MAT.water.normalMap.offset.set(t*0.013,t*0.009);
  tickDrops(t);airTick(t,dt,you.yaw);fireflyTick(t);rainTick(dt);
  /* the Keeper: nods to whoever is close, waves as you arrive */
  {const near=Math.hypot(you.x-STAND.x,you.z-STAND.z);KEEPER.head.rotation.x=near<6?Math.sin(t*2.2)*0.1:0;KEEPER.armR.rotation.x=near<4?-1.9+Math.sin(t*7)*0.35:-0.25}
  if(frame%6===0){labels();updateAct()}
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* a hand on the wheel for checks: __walk.go(x,z,yaw,pitch) */
window.__walk={go:(x,z,yaw,pitch)=>{you.x=x;you.z=z;you.yaw=yaw||0;you.pitch=pitch||0;you.feet=floorAt(x,z);you.grounded=true},you,phase:n=>{ph=n;applyPhase()},floorAt,S:()=>S,act,updateAct,openStore,cartAdd,sowAt,waterAt,live:()=>LIVE,setSow:t=>{SOWT=t}};

applyPhase();
you.feet=floorAt(you.x,you.z);plantBeds();renderHud();labels();updateAct();
if(!BLOOM&&!S.flags.whello){S.flags.whello=1;save();setTimeout(()=>toast('Your garden. The seed seller is at the end of the path behind you.'),1400)}
$('#lbar').style.width='100%';$('#lmsg').textContent='Walk in';
requestAnimationFrame(loop);
setTimeout(()=>{const l=$('#load');l.style.opacity='0';setTimeout(()=>l.remove(),650)},350);
/* on the site every picture is expected; say plainly if one is missing */
setTimeout(()=>{if(ON_SITE&&FAIL.length)shout(FAIL.length+' pictures did not load from '+BASE+': '+FAIL.slice(0,6).join(', ')+(FAIL.length>6?' …':''))},9000);
</script>

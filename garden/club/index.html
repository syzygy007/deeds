<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="club-build" content="1.1">
<title>The Club · DEEDS</title>
<style>
:root{--ink:#0b0910;--ivory:#F6F3EB;--pink:#ff2fa8;--cyan:#28e0ff;--violet:#8a5cff;--lime:#b8ff3a;--amber:#ffb02f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07060a;font-family:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;color:var(--ivory)}
canvas{display:block;touch-action:none}
.micro{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
#place h1{margin:.1em 0 0;font-size:clamp(1.5rem,4.4vw,2.6rem);letter-spacing:-.035em;line-height:.95;font-weight:800;text-shadow:0 0 18px rgba(255,47,168,.55)}
#place h1 span{color:var(--pink)}
#near{margin-top:.55em;opacity:.85}
#hint{position:fixed;left:18px;bottom:max(14px,env(safe-area-inset-bottom));opacity:.75;text-shadow:0 1px 12px rgba(0,0,0,.6);max-width:60vw;z-index:20;pointer-events:none}
#status{position:fixed;left:50%;top:15%;transform:translateX(-50%);background:rgba(11,9,16,.86);color:var(--ivory);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:40;max-width:86vw;text-align:center;pointer-events:none;border:1px solid rgba(255,47,168,.35)}
#status.on{opacity:1}
#hype{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:22;width:min(260px,52vw);pointer-events:none}
#hype .lab{display:flex;justify-content:space-between;font:800 10px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;opacity:.85}
#hype .bar{height:6px;border-radius:999px;background:rgba(246,243,235,.12);overflow:hidden}
#hype .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--amber));box-shadow:0 0 14px var(--pink);transition:width .25s}
#act{position:fixed;left:0;top:0;display:none;flex-direction:column;align-items:center;gap:8px;z-index:24;pointer-events:none;text-align:center;transform:translate(-50%,-100%);padding-bottom:16px}
#act.on{display:flex}
.abtn{pointer-events:auto;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:14px 26px;min-height:50px;font-weight:800;font-size:16px;letter-spacing:.02em;cursor:pointer;box-shadow:0 0 24px rgba(40,224,255,.45);touch-action:none;user-select:none;font-family:inherit}
.abtn.quiet{background:rgba(11,9,16,.6);color:var(--ivory);border:1px solid rgba(246,243,235,.45);box-shadow:none;cursor:default}
#stick{position:fixed;left:0;bottom:0;width:46%;height:52%;z-index:15;touch-action:none}
#knob{position:absolute;width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(246,243,235,.32);background:rgba(11,9,16,.14);display:none;transform:translate(-50%,-50%)}
#knob i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(246,243,235,.78);box-shadow:0 0 14px var(--cyan)}
/* THE DECKS: the light up interface */
#deck{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);z-index:30;width:min(760px,96vw);max-height:78vh;overflow:auto;background:rgba(11,9,16,.86);border:1px solid rgba(138,92,255,.45);border-radius:22px;padding:12px 12px 10px;box-shadow:0 0 40px rgba(138,92,255,.35),inset 0 0 60px rgba(40,224,255,.06);transition:transform .35s cubic-bezier(.2,.9,.2,1);pointer-events:auto}
#deck.on{transform:translateX(-50%) translateY(0)}
#deck .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#deck .row+.row{margin-top:8px}
#deck .lab{font:800 9px/1 ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;opacity:.6;width:100%;text-align:center;margin:2px 0 4px}
.pad{flex:1 1 0;min-width:70px;height:58px;border-radius:14px;border:1px solid rgba(246,243,235,.18);background:rgba(246,243,235,.05);color:var(--ivory);font:800 11px/1.2 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;transition:transform .08s}
.pad small{display:block;font-size:8px;opacity:.6;margin-top:5px;letter-spacing:.2em}
.pad.hit{transform:scale(.94)}
.pad[data-c=pink]{box-shadow:inset 0 -3px 0 var(--pink)}.pad[data-c=cyan]{box-shadow:inset 0 -3px 0 var(--cyan)}.pad[data-c=violet]{box-shadow:inset 0 -3px 0 var(--violet)}.pad[data-c=lime]{box-shadow:inset 0 -3px 0 var(--lime)}.pad[data-c=amber]{box-shadow:inset 0 -3px 0 var(--amber)}
.pad.lit[data-c=pink]{background:var(--pink);color:var(--ink);box-shadow:0 0 26px var(--pink)}.pad.lit[data-c=cyan]{background:var(--cyan);color:var(--ink);box-shadow:0 0 26px var(--cyan)}.pad.lit[data-c=violet]{background:var(--violet);color:var(--ivory);box-shadow:0 0 26px var(--violet)}.pad.lit[data-c=lime]{background:var(--lime);color:var(--ink);box-shadow:0 0 26px var(--lime)}.pad.lit[data-c=amber]{background:var(--amber);color:var(--ink);box-shadow:0 0 26px var(--amber)}
.sty{flex:1 1 0;min-width:70px;height:38px;border-radius:999px;border:1px solid rgba(246,243,235,.25);background:transparent;color:var(--ivory);font:800 10px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;user-select:none;font-family:ui-monospace,monospace}
.sty.on{background:var(--ivory);color:var(--ink);box-shadow:0 0 18px rgba(246,243,235,.5)}
#samp{display:flex;gap:10px;align-items:stretch;justify-content:center;margin-top:8px}
#spads{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1 1 0;max-width:330px}
.sp{height:46px;border-radius:12px;border:1px solid rgba(246,243,235,.18);background:rgba(246,243,235,.05);color:var(--ivory);font:800 10px/1.1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .07s}
.sp small{display:block;font-size:7px;opacity:.55;margin-top:3px;letter-spacing:.18em}
.sp.lit{background:var(--lime);color:var(--ink);box-shadow:0 0 22px var(--lime);transform:scale(.95)}
#scratch{flex:0 0 150px;border-radius:14px;border:1px solid rgba(40,224,255,.35);background:radial-gradient(circle at 50% 50%,rgba(40,224,255,.18),rgba(11,9,16,.4) 62%,rgba(11,9,16,.1) 63%);position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden}
#scratch .disc{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(40,224,255,.55);background:repeating-radial-gradient(circle,rgba(246,243,235,.1) 0 2px,transparent 2px 6px);box-shadow:0 0 22px rgba(40,224,255,.35)}
#scratch .disc:after{content:'';position:absolute;left:50%;top:6px;width:4px;height:40px;margin-left:-2px;background:var(--cyan);border-radius:2px}
#scratch .lab{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:800 8px/1 ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
#beat{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
#beat i{width:26px;height:5px;border-radius:999px;background:rgba(246,243,235,.14)}
#beat i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#snd{position:fixed;left:18px;top:max(14px,env(safe-area-inset-top));z-index:22;pointer-events:auto;background:rgba(11,9,16,.5);border:1px solid rgba(246,243,235,.5);color:var(--ivory);padding:8px 12px;border-radius:999px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;display:none}#snd.on{display:block}#snd.warn{border-color:var(--amber);color:var(--amber);animation:nightpulse .9s ease-in-out infinite}
#purse{position:fixed;right:18px;top:calc(max(14px,env(safe-area-inset-top)) + 40px);z-index:22;pointer-events:none;background:rgba(11,9,16,.5);border:1px solid rgba(255,176,47,.45);color:var(--amber);padding:8px 12px;border-radius:999px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;display:none}#purse.on{display:block}
#leave{position:fixed;right:18px;top:max(14px,env(safe-area-inset-top));z-index:22;pointer-events:auto;background:rgba(11,9,16,.5);border:1px solid rgba(246,243,235,.5);color:var(--ivory);padding:8px 12px;border-radius:999px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#load{position:fixed;inset:0;z-index:50;background:#07060a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#load h2{margin:0;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:-.04em;font-weight:800;text-shadow:0 0 30px var(--pink)}
#load h2 span{color:var(--pink)}
#load .btn{pointer-events:auto;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:14px 28px;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 30px rgba(40,224,255,.5);font-family:inherit}
#menu{position:fixed;inset:0;z-index:35;display:none;align-items:flex-end;justify-content:center;background:rgba(7,6,10,.6)}#menu.on{display:flex}
#menu .card{width:min(560px,100%);background:rgba(11,9,16,.96);border:1px solid rgba(255,176,47,.4);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto;box-shadow:0 0 40px rgba(255,176,47,.25)}
#menu h3{margin:0 0 2px;font-size:24px;letter-spacing:-.01em}#menu .sub{font:800 9px/1 ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;opacity:.6;margin-bottom:10px}
#menu .lab{font:800 9px/1 ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;opacity:.55;margin:12px 0 4px}
#menu .it{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid rgba(246,243,235,.08)}#menu .it .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor;background:currentColor}
#menu .it .nm{flex:1;font-size:14px}#menu .it .nm small{display:block;font-size:10px;opacity:.6;margin-top:2px}#menu .it .pr{font:800 12px/1 ui-monospace,monospace;letter-spacing:.06em;opacity:.9;white-space:nowrap}
#menu .it button{border:1px solid rgba(246,243,235,.35);background:transparent;color:var(--ivory);border-radius:999px;padding:8px 12px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#menu .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}#menu .foot .n{font:800 9px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
#menu .close{border:1px solid rgba(246,243,235,.4);background:transparent;color:var(--ivory);border-radius:999px;padding:9px 14px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#dressing{position:fixed;inset:0;z-index:45;display:none;background:#07060a}#dressing.on{display:block}#dressing iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#dressing .x{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));z-index:2;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 20px rgba(255,47,168,.45)}
#err{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;background:#7A1F1F;color:#fff;font:600 11px/1.5 ui-monospace,monospace;padding:10px 14px;white-space:pre-wrap}
@keyframes strobe{0%,100%{opacity:0}50%{opacity:.85}}
#strobe{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:28}
#strobe.on{animation:strobe .09s linear 14}
</style>
</head>
<body>
<div id="load"><h2>The Club<span>.</span></h2><div class="micro" style="opacity:.7">Every night, when the wolves come out</div><button class="btn" id="enter">Walk in · sound on</button></div>
<div id="hud">
  <div id="place"><div class="micro" id="walkin">You are in</div><h1 id="area">The Club<span>.</span></h1><div class="micro" id="near"></div></div>
</div>
<div id="hype"><div class="lab"><span>Hype</span><span id="hypeN">0</span></div><div class="bar"><i id="hypeBar"></i></div></div>
<button id="leave">&larr; The garden</button><button id="snd">Sound</button><div id="purse"></div>
<div id="hint" class="micro">Drag left to walk · drag right to look · walk up to the decks</div>
<div id="act"><button class="abtn" id="actMain">Take the decks.</button></div>
<div id="status" class="micro"></div>
<div id="strobe"></div>
<div id="stick"><div id="knob"><i></i></div></div>
<div id="deck">
  <div id="beat"><i></i><i></i><i></i><i></i></div>
  <div class="row"><div class="lab">THE DECKS · TAP A PAD, THE ROOM ANSWERS</div>
    <button class="pad" data-pad="drop" data-c="pink">Drop<small>everyone jumps</small></button>
    <button class="pad" data-pad="riser" data-c="cyan">Riser<small>hands up</small></button>
    <button class="pad" data-pad="strobe" data-c="amber">Strobe<small>white out</small></button>
    <button class="pad" data-pad="lasers" data-c="lime">Lasers<small>sweep</small></button>
    <button class="pad" data-pad="horn" data-c="violet">Horn<small>the cheer</small></button>
    <button class="pad" data-pad="filter" data-c="cyan">Filter<small>hold it</small></button>
    <button class="pad" data-pad="flames" data-c="amber">Flames<small>light it up</small></button>
    <button class="pad" data-pad="confetti" data-c="pink">Confetti<small>the cannons</small></button>
  </div>
  <div class="row"><div class="lab">THE SOUND</div>
    <button class="sty on" data-sty="deep">Deep</button><button class="sty" data-sty="tech">Tech</button><button class="sty" data-sty="disco">Disco</button><button class="sty" data-sty="melodic">Melodic</button>
  </div>
  <div id="samp">
    <div id="spads">
      <button class="sp" data-s="hey">Hey<small>q</small></button><button class="sp" data-s="oh">Oh<small>w</small></button><button class="sp" data-s="yeah">Yeah<small>e</small></button>
      <button class="sp" data-s="woo">Woo<small>a</small></button><button class="sp" data-s="choir">Choir<small>s</small></button><button class="sp" data-s="brass">Brass<small>d</small></button>
      <button class="sp" data-s="808">808<small>z</small></button><button class="sp" data-s="snare">Snare<small>x</small></button><button class="sp" data-s="rim">Rim<small>c</small></button>
    </div>
    <div id="scratch"><div class="disc"></div><div class="lab">Scratch · drag</div></div>
  </div>
</div>
<div id="menu"><div class="card"><h3 id="mTitle">The bar<span style="color:var(--amber)">.</span></h3><div class="sub" id="mSub">NOTHING HERE IS ALCOHOL. EVERYTHING HERE IS COLD.</div><div id="mRows"></div><div class="foot"><div class="n" id="mNote">THE TILL OPENS WITH PATCH 70</div><button class="close" id="mClose">Close</button></div></div></div>
<div id="dressing"><button class="x" id="dressX">Back to the club</button></div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 0.6 the wardrobe and the figure load by a fallback chain, so the crowd wears the real shape wherever this file sits: /wardrobe.js on the site, ../../ beside the world, then raw */
window.__toyReady=new Promise(function(done){const ON=/(^|\.)deeds\.fun$/.test(location.hostname);const roots=ON?['/','../../','https://raw.githubusercontent.com/syzygy007/deeds/main/']:['../../','https://raw.githubusercontent.com/syzygy007/deeds/main/'];let i=0;
  function tryRoot(){if(i>=roots.length){done(false);return}const r=roots[i++];const a=document.createElement('script');a.src=r+'wardrobe.js?v=3';a.onload=function(){const b=document.createElement('script');b.src=r+'figure.js?v=1';b.onload=function(){done(!!(window.Figure&&window.Wardrobe&&window.Wardrobe.util))};b.onerror=tryRoot;document.head.appendChild(b)};a.onerror=tryRoot;document.head.appendChild(a)}
  if(window.Figure&&window.Wardrobe&&window.Wardrobe.util)done(true);else tryRoot()});
</script>
<script>
/* ======================================================================
   THE CLUB · 0.1 · the room, the crowd, the lights, the house engine and the decks.
   Its own route (garden/club/), nothing loaded from the world file. Every light and every sound is made here in code.
   The crowd is dressed from the same wardrobe the players wear (figure.js + wardrobe.js at the repo root) so they read as peers;
   if the two files do not load, a drawn figure dances instead. Tap a pad on the decks and the room answers: the crowd turns,
   hands go up, the floor lights change, the hype climbs.
   ====================================================================== */
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function shout(m){const e=$('#err');e.style.display='block';e.textContent=String(m).slice(0,400)}
addEventListener('error',e=>shout('ERROR: '+(e.message||e.error)));
const COARSE=matchMedia('(pointer:coarse)').matches;
const ON_SITE=/(^|\.)deeds\.fun$/.test(location.hostname);
let TOY=!!(window.Figure&&window.Wardrobe&&window.Wardrobe.util);
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
let toastT;function toast(m){const t=$('#status');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- the palette ---------- */
const NEON={pink:0xff2fa8,cyan:0x28e0ff,violet:0x8a5cff,lime:0xb8ff3a,amber:0xffb02f,white:0xffffff};
const NEONS=[NEON.pink,NEON.cyan,NEON.violet,NEON.lime,NEON.amber];

/* ======================================================================
   RENDERER, THE ROOM
   ====================================================================== */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07060a);scene.fog=new THREE.FogExp2(0x0b0812,0.022);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.08,120);
const renderer=new THREE.WebGLRenderer({antialias:!COARSE,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,COARSE?1.25:2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const ROOM={w:40,d:30,h:9};   /* x east, z south; the decks at the north end (negative z), the pool through the glass at the south */
const POOL={z0:ROOM.d/2,z1:ROOM.d/2+20,w:34};   /* 0.2: the terrace and the pool beyond the south glass, the XS way */
const M={floor:new THREE.MeshStandardMaterial({color:0x14121a,roughness:0.35,metalness:0.4}),wall:new THREE.MeshStandardMaterial({color:0x0f0d15,roughness:0.9}),ceil:new THREE.MeshStandardMaterial({color:0x0a0810,roughness:1}),
  steel:new THREE.MeshStandardMaterial({color:0x2a2830,roughness:0.4,metalness:0.8}),velvet:new THREE.MeshStandardMaterial({color:0x5a1030,roughness:0.95}),velvet2:new THREE.MeshStandardMaterial({color:0x1c1440,roughness:0.95}),
  wood:new THREE.MeshStandardMaterial({color:0x3a2a20,roughness:0.6}),glass:new THREE.MeshStandardMaterial({color:0x9ad8ff,roughness:0.05,metalness:0.3,transparent:true,opacity:0.35}),
  gold:new THREE.MeshStandardMaterial({color:0xd9ae3c,roughness:0.25,metalness:0.9}),black:new THREE.MeshStandardMaterial({color:0x111015,roughness:0.5})};
const neonMat=(hex,k)=>new THREE.MeshBasicMaterial({color:new THREE.Color(hex).multiplyScalar(k||1)});
function mesh(g,m,x,y,z,parent){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=false;o.receiveShadow=true;(parent||scene).add(o);return o}
/* the shell */
mesh(new THREE.BoxGeometry(ROOM.w,0.2,ROOM.d),M.floor,0,-0.1,0);
mesh(new THREE.BoxGeometry(ROOM.w,0.3,ROOM.d),M.ceil,0,ROOM.h+0.15,0);
mesh(new THREE.BoxGeometry(ROOM.w,ROOM.h,0.4),M.wall,0,ROOM.h/2,-ROOM.d/2-0.2);
/* the south side: a glass wall from the ceiling to head height and two wide openings onto the terrace, the room breathes out to the pool */
mesh(new THREE.BoxGeometry(ROOM.w,ROOM.h-3.2,0.3),M.glass,0,ROOM.h-(ROOM.h-3.2)/2,ROOM.d/2+0.15);mesh(new THREE.BoxGeometry(6,3.2,0.3),M.glass,0,1.6,ROOM.d/2+0.15);[-1,1].forEach(q=>mesh(new THREE.BoxGeometry(8,3.2,0.3),M.glass,q*16,1.6,ROOM.d/2+0.15));
mesh(new THREE.BoxGeometry(0.4,ROOM.h,ROOM.d),M.wall,-ROOM.w/2-0.2,ROOM.h/2,0);mesh(new THREE.BoxGeometry(0.4,ROOM.h,ROOM.d),M.wall,ROOM.w/2+0.2,ROOM.h/2,0);

  if($('#menu').classList.contains('on')||$('#dressing').classList.contains('on')){mvX=mvZ=0;lookDX=lookDY=0}if(!ATDECK)walkTick(dt);else{AV.g.position.set(YOU.x,YOU.y,YOU.z);AV.g.rotation.y=Math.PI;const cd=5.5;camera.position.set(DECK.x+Math.sin(t*0.15)*2.2,3.4,DECK.z-3.2);camera.lookAt(YOU.x,YOU.y+1.2,YOU.z+6);
    const p=BEATPH*6.28;AV.legL.rotation.x=Math.sin(p)*0.12;AV.legR.rotation.x=-Math.sin(p)*0.12;AV.g.position.y=YOU.y+Math.abs(Math.sin(p))*0.04}
  danceTick(t,dt,BEATPH+BEATN,ENERGY*(MUSIC.on()?1:0.35));talkTick(t,dt);runnerTick(t,dt);lightsTick(t,dt);sparkTick(dt);hypeTick(dt);flamesTick(dt);confettiTick(dt);poolTick(t,dt);
  if(!SIM){updateAct();placeAct();renderer.render(scene,camera);requestAnimationFrame(loop)}}
/* 0.9 the sound gate. On a phone the ringer switch silences Web Audio unless a real media element has played, so a silent clip plays on the same tap; every later touch resumes the context; the chip shows the state */
let SILENT=null;
function unlockAudio(){try{if(!SILENT){SILENT=document.createElement('audio');SILENT.setAttribute('playsinline','');SILENT.loop=true;SILENT.volume=0.01;SILENT.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQQAAAAAAAA=';document.body.appendChild(SILENT)}const p=SILENT.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}MUSIC.resume()}
function paintSnd(){const el=$('#snd');const st=MUSIC.state();if(!MUSIC.on()){el.classList.remove('on');return}el.classList.add('on');const ok=st==='running';el.textContent=ok?'Sound on':'Tap for sound';el.classList.toggle('warn',!ok)}
setInterval(paintSnd,800);
function paintPurse(){const el=$('#purse');let gc=null;try{gc=localStorage.getItem('deeds_gc')}catch(e){}if(gc==null||isNaN(+gc)){el.classList.remove('on');return}el.textContent=(+gc).toLocaleString()+' gc';el.classList.add('on')}paintPurse();setInterval(paintPurse,3000);
$('#snd').addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();MUSIC.start();setTimeout(paintSnd,300)});
document.addEventListener('pointerdown',()=>{if(MUSIC.on())MUSIC.resume()},{passive:true});document.addEventListener('touchend',()=>{if(MUSIC.on())MUSIC.resume()},{passive:true});
$('#enter').addEventListener('click',()=>{unlockAudio();MUSIC.start();$('#load').style.opacity='0';setTimeout(()=>{$('#load').style.display='none'},600);toast('Welcome in. Walk up to the decks.');requestAnimationFrame(loop)});
$('#enter').addEventListener('touchend',()=>{unlockAudio()},{passive:true});
$('#leave').addEventListener('click',()=>{location.href=ON_SITE?'/garden/world/':'../world/'});
window.__club={YOU,CROWD,MUSIC,DECK,BOOTHS,VIP,POOL,BAR,DRESS,openDressing,closeDressing,FLAMES,CONFETTI,RIG,rigShow,BLACK,blackout,TALKERS,talk:()=>TALK,confettiFire,DRINKS,PIZZA,BOTTLES,openMenu,closeMenu,runBottle,RUNNER,bottleShow,setDeck,padHit,hypeCrowd,hype:()=>HYPE,floorAt,updateAct,act:()=>ACT,go:(x,z)=>{YOU.x=x;YOU.z=z;YOU.y=YOU.feet=floorAt(x,z)},sim:(secs,step)=>{step=step||0.05;SIM=true;try{for(let s=0;s<secs;s+=step)loop(last+step*1000)}finally{SIM=false;last=performance.now()}},STYLES,TILES,HEADS,toy:TOY};
</script>

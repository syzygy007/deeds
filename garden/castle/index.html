<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="castle-build" content="1.0">
<meta name="theme-color" content="#15130E">
<title>The Castle · DEEDS</title>
<meta property="og:title" content="The Castle.">
<meta property="og:description" content="Through the hedge there is a castle. Start in the fields. Rise.">
<style>
:root{color-scheme:dark;--ink:#15130E;--ivory:#F6F3EB;--gold:#C9A227;--gold2:#E8C24A;--green:#2F4A34;--panel:#1a1812;--blue:#8FB6E8;--amber:#E9A23B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#10150f;font-family:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;color:var(--ivory);overscroll-behavior:none}
canvas{display:block;touch-action:none;cursor:default}
#cv{position:fixed;left:0;top:0}
button{font-family:inherit}
.micro{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 18px max(14px,env(safe-area-inset-bottom))}
#place{position:absolute;left:18px;top:max(14px,env(safe-area-inset-top));text-shadow:0 1px 18px rgba(0,0,0,.6);max-width:30vw}
#place h1{margin:.1em 0 0;font-size:clamp(1.5rem,4.4vw,2.6rem);letter-spacing:-.035em;line-height:.95;font-weight:800}
#place h1 span{color:var(--gold)}
#near{margin-top:.55em;opacity:.92;min-height:1em}
#topr{position:absolute;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#topr .line{display:flex;gap:7px;align-items:center}
.pill{pointer-events:auto;background:rgba(21,19,14,.5);border:1px solid rgba(246,243,235,.5);color:var(--ivory);padding:7px 12px;border-radius:999px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;backdrop-filter:none}
.pill b{font-size:.84rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3,#E0B23A 55%,#9A7210);box-shadow:inset 0 0 0 1.5px rgba(120,84,8,.55),0 1px 3px rgba(0,0,0,.4);flex:none;display:inline-block}
#rankpill{flex-direction:column;align-items:stretch;gap:5px;padding:7px 12px 8px;min-width:150px}
#rankpill .r1{display:flex;justify-content:space-between;gap:12px}
#rankpill .bar{height:3px;border-radius:9px;background:rgba(246,243,235,.2);overflow:hidden}
#rankpill .bar i{display:block;height:100%;width:0;background:var(--gold2);transition:width .5s}
#mana{width:150px;height:4px;border-radius:9px;background:rgba(246,243,235,.16);overflow:hidden;display:none}
#mana i{display:block;height:100%;width:100%;background:var(--blue)}
#gear{width:38px;height:34px;justify-content:center;padding:0;font-size:1rem}
#menu{position:fixed;right:18px;top:calc(max(14px,env(safe-area-inset-top)) + 46px);z-index:34;display:none;flex-direction:column;gap:6px;align-items:stretch;background:rgba(21,19,14,.9);border:1px solid rgba(246,243,235,.25);border-radius:16px;padding:10px;min-width:170px}
#menu.on{display:flex}
.btn{pointer-events:auto;background:rgba(21,19,14,.34);border:1px solid rgba(246,243,235,.75);color:var(--ivory);padding:9px 13px;border-radius:999px;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;cursor:pointer}
.btn.on{background:var(--ivory);color:var(--ink)}
.btn.gold{background:var(--gold2);border-color:var(--gold2);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
#goal{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:21;pointer-events:none;background:rgba(21,19,14,.6);border:1px solid rgba(232,194,74,.55);color:var(--ivory);border-radius:999px;padding:8px 15px;font-size:.72rem;letter-spacing:.04em;font-weight:700;max-width:min(52vw,480px);text-align:center;display:none;line-height:1.3}
#goal.on{display:block}
#goal b{color:var(--gold2);font-weight:800;letter-spacing:.16em;font-size:.58rem;text-transform:uppercase;display:block;margin-bottom:2px}
#act{position:fixed;left:0;top:0;display:none;flex-direction:column;align-items:center;gap:7px;z-index:24;pointer-events:none;text-align:center;will-change:transform;transform:translate(-50%,-100%);padding-bottom:16px}
#act::after{content:"";position:absolute;left:50%;bottom:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ivory);box-shadow:0 2px 8px rgba(0,0,0,.45)}
#act.on{display:flex}
.abtn{pointer-events:auto;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:13px 24px;min-height:48px;font-weight:800;font-size:16px;letter-spacing:.01em;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;white-space:nowrap;transition:transform .09s}
.abtn:active{transform:scale(.94)}
#actSub{background:rgba(21,19,14,.6);border-radius:999px;padding:5px 11px;font-size:.58rem;max-width:74vw;white-space:normal;line-height:1.35}
#actSub:empty{display:none}
#say{position:fixed;left:50%;bottom:max(150px,calc(env(safe-area-inset-bottom) + 138px));transform:translateX(-50%);z-index:39;background:rgba(20,18,16,.62);color:#F6F3EB;border-radius:999px;padding:7px 14px;font:600 12px/1.25 ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;max-width:84vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#say.on{opacity:.95}
#floats{position:fixed;inset:0;z-index:23;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;font-weight:800;font-size:17px;letter-spacing:.01em;color:#F7D774;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 14px rgba(0,0,0,.35);white-space:nowrap;display:flex;align-items:center;gap:6px;will-change:transform,opacity}
.fl.rn{color:#BFD9FF}.fl.item{color:#F6F3EB;font-size:14px}.fl.bad{color:#F3B59E}
.fl .star{width:11px;height:11px;background:#BFD9FF;transform:rotate(45deg);border-radius:2px;display:inline-block}
#speech{position:fixed;left:0;top:0;z-index:22;pointer-events:none;transform:translate(-50%,-100%);background:rgba(246,243,235,.96);color:var(--ink);border-radius:14px;padding:8px 12px;font:600 13px/1.3 Georgia,"Times New Roman",serif;max-width:min(62vw,300px);text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.3);display:none}
#speech.on{display:block}
#speech::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(246,243,235,.96);border-bottom:0}
#speech b{display:block;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8a6d12;margin-bottom:4px}
#stick{position:fixed;left:0;bottom:0;width:46%;height:52%;z-index:15;touch-action:none}
#knob{position:absolute;width:132px;height:132px;border-radius:50%;border:1.5px solid rgba(246,243,235,.34);background:rgba(21,19,14,.14);display:none;transform:translate(-50%,-50%)}
#knob i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(246,243,235,.8)}
.rb{display:none;position:fixed;right:18px;z-index:21;width:64px;height:64px;border-radius:50%;pointer-events:auto;background:rgba(21,19,14,.42);border:1px solid rgba(246,243,235,.75);color:var(--ivory);font:800 .55rem/1 inherit;letter-spacing:.14em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none}
#jump{bottom:max(78px,calc(env(safe-area-inset-bottom) + 64px))}
#sprint{bottom:max(154px,calc(env(safe-area-inset-bottom) + 140px))}
#sprint.on{background:var(--ivory);color:var(--ink)}
@media(pointer:coarse){#jump,#sprint{display:block}}
/* the two action buttons a mode can ask for (strike and guard, draw, cast) */
.ab{display:none;position:fixed;z-index:22;border-radius:50%;pointer-events:auto;border:0;color:var(--ink);font:800 .66rem/1.1 inherit;letter-spacing:.12em;text-transform:uppercase;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.ab.on{display:block}
#abA{right:96px;bottom:max(92px,calc(env(safe-area-inset-bottom) + 78px));width:92px;height:92px;background:var(--gold2)}
#abB{right:200px;bottom:max(70px,calc(env(safe-area-inset-bottom) + 56px));width:74px;height:74px;background:var(--ivory)}
#abA:active,#abB:active,#abA.hold,#abB.hold{transform:scale(.93);filter:brightness(1.12)}
@media(pointer:fine){#abA{right:28px}#abB{right:132px}}
#quick{position:fixed;left:18px;bottom:max(14px,env(safe-area-inset-bottom));z-index:21;display:flex;gap:7px;pointer-events:none}
@media(pointer:coarse){#quick{left:auto;right:18px;bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 96px);flex-direction:column;align-items:flex-end}}
#hint{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;pointer-events:none;opacity:.78;text-shadow:0 1px 12px rgba(0,0,0,.7);text-align:center;max-width:60vw;transition:opacity .6s}
@media(pointer:coarse){#hint{bottom:auto;left:18px;transform:none;text-align:left;top:calc(max(14px,env(safe-area-inset-top)) + 66px);max-width:44vw}}
.sheet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(21,19,14,.62);z-index:30;pointer-events:auto;padding:14px}
.sheet.on{display:flex}
.panel{width:min(600px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid rgba(246,243,235,.28);border-radius:18px;padding:18px 18px 0;color:var(--ivory);box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel.small{width:min(440px,100%)}
.panel h2{margin:2px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.panel h2 span{color:var(--gold)}
.panel p{font-size:14px;line-height:1.5;margin:6px 0 10px;color:rgba(246,243,235,.82)}
.panel p .coin{vertical-align:-2px;margin-right:4px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sbal{white-space:nowrap;padding-top:6px;display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.tabs .btn{padding:8px 12px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(246,243,235,.12)}
.row .ic{width:42px;height:42px;border-radius:11px;flex:none;background:rgba(246,243,235,.07);display:flex;align-items:center;justify-content:center;overflow:hidden}
.row .ic canvas,.row .ic img{width:100%;height:100%;display:block}
.row .nm{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.2}
.row .nm small{display:block;font-size:12px;font-weight:400;opacity:.68;margin-top:3px;line-height:1.35}
.row .pr{font:800 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;gap:5px;opacity:.95}
.row .btn{padding:9px 13px;font-size:.6rem;flex:none}
.row.dim{opacity:.48}
.row.done .nm{color:var(--gold2)}
.lab{font:800 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.55;margin:14px 0 2px}
.sfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;position:sticky;bottom:0;background:var(--panel);padding:11px 0 14px;border-top:1px solid rgba(246,243,235,.12)}
.sfoot .btn{padding:10px 18px;font-size:12px}
.sfoot .note{flex:1;align-self:center;font-size:11px;opacity:.6;line-height:1.35}
/* the ladder */
.rung{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(246,243,235,.12);align-items:flex-start}
.rung .n{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(246,243,235,.4);display:flex;align-items:center;justify-content:center;font:800 12px/1 ui-monospace,monospace;flex:none}
.rung.have .n{background:var(--gold2);border-color:var(--gold2);color:var(--ink)}
.rung.next .n{border-color:var(--gold2);color:var(--gold2)}
.rung .tx{flex:1;font-size:15px;font-weight:700}
.rung .tx small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:3px;line-height:1.4}
.rung.later{opacity:.5}
/* the map */
#mapwrap{position:relative;border-radius:12px;overflow:hidden;margin-top:8px;background:#d8c9a3;touch-action:manipulation}
#mapcv{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);background:rgba(26,24,18,.88);color:var(--ivory);border:1px solid rgba(232,194,74,.8);border-radius:999px;padding:5px 9px;font:800 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.pin.me{background:var(--gold2);color:var(--ink);border-color:var(--ink);padding:4px 7px;pointer-events:none}
/* the yard, the butts, the forge, the cauldron, the stones: the small panels that sit over the world while you work */
#bench{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:26;display:none;flex-direction:column;align-items:center;gap:10px;width:min(560px,94vw);pointer-events:none}
#bench.on{display:flex}
#bench .card{pointer-events:auto;width:100%;background:rgba(21,19,14,.82);border:1px solid rgba(246,243,235,.25);border-radius:18px;padding:12px 14px 13px}
#bench .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
#bench .t b{font-size:16px;letter-spacing:-.01em}
#bench .t span{font:800 9px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7;text-align:right}
.gauge{position:relative;height:26px;border-radius:999px;background:rgba(246,243,235,.1);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:rgba(232,194,74,.34);border-left:2px solid var(--gold2);border-right:2px solid var(--gold2)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#5b1a0c,#c8421a 45%,#f3a431 70%,#fff3c9)}
.gauge .mark{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--ivory);box-shadow:0 0 10px rgba(255,255,255,.8)}
#bench .acts{display:flex;gap:8px;justify-content:center;margin-top:11px;flex-wrap:wrap}
#bench .acts .btn{padding:13px 22px;font-size:.72rem}
#bench .dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
#bench .dots i{width:10px;height:10px;border-radius:50%;background:rgba(246,243,235,.2)}
#bench .dots i.ok{background:var(--gold2)}#bench .dots i.mid{background:#d8cfb8}#bench .dots i.no{background:#8a4a3c}
.shots{display:flex;gap:6px;justify-content:center}
.shots b{width:34px;height:34px;border-radius:50%;background:rgba(246,243,235,.1);display:flex;align-items:center;justify-content:center;font:800 13px/1 ui-monospace,Menlo,monospace}
.shots b.ok{background:var(--gold2);color:var(--ink)}.shots b.mid{background:#d8cfb8;color:var(--ink)}.shots b.no{background:#8a4a3c}
.gauge.thin{height:8px;margin-top:10px}.gauge.thin .fill{background:var(--ivory)}
#bench.top{bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 58px)}
body.busy #place,body.fight #place,body.busy #topr,body.fight #topr{display:none}
.gauge.temper{background:linear-gradient(90deg,#3a3f48,#4b5fae 20%,#d9b64a 38%,#c8421a 68%,#fff3c9)}
.gauge.brew{overflow:visible;background:linear-gradient(90deg,rgba(246,243,235,.08),rgba(246,243,235,.2))}
.gauge .pip{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--ivory);background:rgba(21,19,14,.6)}
.gauge .pip.ok{background:var(--gold2);border-color:var(--gold2)}.gauge .pip.no{opacity:.3}
.pad{position:relative;width:min(250px,60vw);height:min(250px,60vw);margin:4px auto 2px}
.rune{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid var(--c);background:rgba(21,19,14,.72);padding:0;cursor:pointer;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;transition:background .12s,box-shadow .12s}
.rune img{width:24px;height:32px;opacity:.8;pointer-events:none}
.rune.lit{background:var(--c);box-shadow:0 0 24px var(--c)}.rune.lit img{opacity:1;filter:brightness(0)}
.pad .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
#leave{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:27;display:none;background:var(--ivory);color:var(--ink)}
#leave.show{display:block}
#topbar{position:fixed;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 44px);transform:translateX(-50%);z-index:26;display:none;gap:14px;align-items:center;background:rgba(21,19,14,.72);border:1px solid rgba(246,243,235,.22);border-radius:999px;padding:8px 16px;font:800 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#topbar.on{display:flex}
#topbar .hp{display:flex;gap:4px}
#topbar .hp i{width:12px;height:12px;border-radius:3px;background:var(--gold2);transform:rotate(45deg);display:block}
#topbar .hp i.off{background:rgba(246,243,235,.2)}
#topbar .hp.foe i{background:#d8cfb8}
#topbar .hp.foe i.off{background:rgba(246,243,235,.2)}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:21;pointer-events:none;display:none;border:2px solid rgba(246,243,235,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--gold2)}
#cross.on{display:block}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:28;pointer-events:none;text-align:center;opacity:0;transition:opacity .35s}
#big.on{opacity:1}
#big h3{margin:0;font-size:clamp(2rem,8vw,4.4rem);font-weight:800;letter-spacing:-.045em;line-height:.92;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#big h3 span{color:var(--gold2)}
#big div{margin-top:10px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#fade{position:fixed;inset:0;background:#0b0a08;opacity:0;pointer-events:none;z-index:80;transition:opacity .45s}
#fade.on{opacity:1}
#load{position:fixed;inset:0;z-index:90;background:#12150f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s;text-align:center;padding:20px}
#load h2{margin:0;font-size:clamp(2.6rem,11vw,5.6rem);letter-spacing:-.05em;font-weight:800;line-height:.9}
#load h2 span{color:var(--gold)}
#load .bar{width:min(240px,60vw);height:3px;border-radius:9px;background:rgba(246,243,235,.16);overflow:hidden}
#load .bar i{display:block;height:100%;width:8%;background:var(--gold2);transition:width .3s}
#enter{display:none;pointer-events:auto;background:var(--ivory);color:var(--ink);border:0;border-radius:999px;padding:15px 30px;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#err{position:fixed;left:0;right:0;bottom:0;z-index:95;display:none;background:#7A1F1F;color:#fff;font:600 11px/1.5 ui-monospace,monospace;padding:10px 14px;white-space:pre-wrap}
body.busy #stick,body.busy #jump,body.busy #sprint,body.busy #quick,body.busy #hint{display:none!important}
body.busy #act{display:none!important}
body.fight #jump,body.fight #sprint,body.fight #quick,body.fight #hint,body.fight #act{display:none!important}
body.busy #say,body.fight #say{bottom:auto;top:30%}
#hurt{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(122,31,31,.55) 100%)}
#hurt.on{opacity:1;transition:none}
@media(max-width:999px),(pointer:coarse){#goal{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 2px);max-width:min(64vw,420px)}#place{max-width:54vw}}
@media(pointer:fine) and (max-width:999px){#hint{display:none}}
@media(min-width:900px){#bench.side{left:auto;right:18px;transform:none;width:330px}}
@media(max-width:520px){#rankpill{min-width:128px}#mana{width:128px}.pill{padding:6px 10px}.panel h2{font-size:23px}}
</style>

<script>
'use strict';
/* ======================================================================
   THE CASTLE · 1.0 · the world through the hedge.
   Its own route (garden/castle/), nothing loaded from the garden's file. You come through the arch in the great hedge
   and the road runs north: fields, a village on a green, a moat, and the castle. Everyone starts as a peasant.
   Crowns come from trade (the wheat, the forge, the cauldron, the purses). Renown comes from deeds and from the
   challenges (the yard, the butts, the stones). The two together lift you up the ladder, peasant to crown.
   Every surface is drawn here in code, so the world stands with no picture at all; on the site the garden's own
   grass, sky and trees take over. The save lives on this device (deeds_castle) until the server patch.
   ====================================================================== */
const BUILD='1.0';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const ON_SITE=/(^|\.)(deeds|deedable)\.fun$/.test(location.hostname);
const LOCAL=location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)||/github\.io$/.test(location.hostname);
const PREVIEW=!!window.__PICS;            /* the chat preview carries its pictures inside itself */
const PICS=ON_SITE||LOCAL||PREVIEW;   /* anywhere else (the chat preview) outside pictures are blocked, so nothing is asked for and the drawn stand ins show */
const BASE=ON_SITE?'/garden/':'https://raw.githubusercontent.com/syzygy007/deeds/main/garden/';
const QS=new URLSearchParams(location.search);
const COARSE=matchMedia('(pointer:coarse)').matches;
const LITE=QS.get('lite')==='1';
function shout(m){const e=$('#err');e.style.display='block';e.textContent=String(m).slice(0,500)}
addEventListener('error',e=>shout('ERROR: '+(e.message||e.error)+(e.lineno?' @'+e.lineno:'')));
addEventListener('unhandledrejection',e=>{try{console.warn('rejection',e.reason)}catch(_){}});
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const wrapA=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
const TAU=Math.PI*2;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function loadStep(p,msg){const b=$('#lbar');if(b)b.style.width=Math.round(p*100)+'%';if(msg){const m=$('#lmsg');if(m)m.textContent=msg}}

/* ---------- pictures: plain img tags, each file once ---------- */
const IMGC=new Map();
function loadImg(file,ok,bad){
  if(!PICS){if(bad)bad();return}
  let e=IMGC.get(file);
  if(e){if(e.state==='ok')ok(e.img);else if(e.state==='wait'){e.q.push(ok);if(bad)e.b.push(bad)}else if(bad)bad();return}
  e={img:new Image(),q:[ok],b:bad?[bad]:[],state:'wait'};IMGC.set(file,e);
  if(!ON_SITE)e.img.crossOrigin='anonymous';
  e.img.onload=()=>{e.state='ok';e.q.forEach(f=>{try{f(e.img)}catch(_){}});e.q=[];e.b=[]};
  e.img.onerror=()=>{e.state='bad';e.b.forEach(f=>f());e.q=[];e.b=[]};
  e.img.src=(PREVIEW&&window.__PICS[file])||BASE+file;
}

/* ======================================================================
   DRAWN SURFACES. Everything is painted at start up.
   ====================================================================== */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c}
function wrapped(g,S,x,y,fn,m){m=m||28;const xs=[0],ys=[0];if(x<m)xs.push(S);if(x>S-m)xs.push(-S);if(y<m)ys.push(S);if(y>S-m)ys.push(-S);
  xs.forEach(ox=>ys.forEach(oy=>{g.save();g.translate(x+ox,y+oy);fn(g);g.restore()}))}
function ell(g,rx,ry,rot,col){g.rotate(rot);g.fillStyle=col;g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.fill()}
function speck(g,S,n,alpha,r,lo,hi){lo=lo||0;hi=hi==null?255:hi;for(let i=0;i<n;i++){const v=Math.floor(lo+r()*(hi-lo));g.fillStyle='rgba('+v+','+v+','+v+','+alpha+')';g.fillRect(r()*S,r()*S,1+r()*2,1+r()*2)}}
function shade(hex,k){const c=new THREE.Color(hex);if(k>=0)c.lerp(new THREE.Color(0xffffff),k);else c.multiplyScalar(1+k);return '#'+c.getHexString()}
function rgba(hex,a){const c=new THREE.Color(hex);return 'rgba('+Math.round(c.r*255)+','+Math.round(c.g*255)+','+Math.round(c.b*255)+','+a+')'}

/* coursed ashlar: four courses to the tile, every block its own tone, soft mortar, a little weather. One tile is 2 m. */
function ashlarTex(seed,base,warm){
  const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);
  g.fillStyle=shade(base,-0.34);g.fillRect(0,0,S,S);
  const rows=4,bh=S/rows;
  for(let i=0;i<rows;i++){let x=-(r()*90)-20;const y=i*bh;
    while(x<S+20){const w=96+r()*86;const k=(r()-.5)*0.2;let col=new THREE.Color(base);col.offsetHSL((r()-.5)*0.025,(r()-.5)*0.05*(warm||1),k*0.5);
      const draw=(ox)=>{g.fillStyle='#'+col.getHexString();const m=2.2;g.beginPath();const X=x+ox+m,Y=y+m,W=w-m*2,H=bh-m*2,rr=5;
        g.moveTo(X+rr,Y);g.lineTo(X+W-rr,Y);g.quadraticCurveTo(X+W,Y,X+W,Y+rr);g.lineTo(X+W,Y+H-rr);g.quadraticCurveTo(X+W,Y+H,X+W-rr,Y+H);g.lineTo(X+rr,Y+H);g.quadraticCurveTo(X,Y+H,X,Y+H-rr);g.lineTo(X,Y+rr);g.quadraticCurveTo(X,Y,X+rr,Y);g.fill();
        /* a lit top edge and a shaded foot, so each block sits proud of the joint */
        g.fillStyle='rgba(255,250,236,.16)';g.fillRect(X+3,Y+1,W-6,3);g.fillStyle='rgba(40,32,22,.22)';g.fillRect(X+3,Y+H-4,W-6,3)};
      draw(0);if(x+w>S)draw(-S);if(x<0)draw(S);
      x+=w}}
  speck(g,S,9000,.07,r);
  /* stains: soft dark runs under a few joints, pale lichen blooms */
  for(let i=0;i<26;i++){const x=r()*S,y=r()*S;wrapped(g,S,x,y,q=>{const R=18+r()*40;const gr=q.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,r()>.45?'rgba(60,52,40,.20)':'rgba(214,214,180,.20)');gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.fillRect(-R,-R,R*2,R*2)},70)}
  g.strokeStyle='rgba(50,42,30,.20)';g.lineWidth=1;for(let i=0;i<10;i++){g.beginPath();let x=r()*S,y=r()*S;g.moveTo(x,y);for(let k=0;k<4;k++){x+=(r()-.5)*26;y+=r()*22;g.lineTo(x,y)}g.stroke()}
  return c}
/* rubble: fieldstone for cottage feet, the chapel and the well. 1.6 m tile */
function rubbleTex(seed,base){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle=shade(base,-0.4);g.fillRect(0,0,S,S);
  const pts=[];let tries=0;while(pts.length<120&&tries<6000){tries++;const x=r()*S,y=r()*S,R=18+r()*20;let ok=true;for(const p of pts){let dx=Math.abs(p[0]-x),dy=Math.abs(p[1]-y);dx=Math.min(dx,S-dx);dy=Math.min(dy,S-dy);if(Math.hypot(dx,dy)<(p[2]+R)*0.78){ok=false;break}}if(ok)pts.push([x,y,R])}
  pts.forEach(([x,y,R])=>{const col=new THREE.Color(base);col.offsetHSL((r()-.5)*0.03,(r()-.5)*0.06,(r()-.5)*0.16);const rot=r()*3,ry=R*(0.62+r()*0.3);
    wrapped(g,S,x,y,q=>{q.save();q.translate(1.5,2.5);ell(q,R,ry,rot,'rgba(20,15,10,.5)');q.restore();q.save();ell(q,R,ry,rot,'#'+col.getHexString());q.restore();q.save();q.rotate(rot);q.fillStyle='rgba(255,250,235,.18)';q.beginPath();q.ellipse(-R*.2,-ry*.3,R*.55,ry*.4,0,0,TAU);q.fill();q.restore()},50)});
  speck(g,S,6000,.06,r);return c}
/* cobbles for the ward. 2 m tile */
function cobbleTex(seed){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle='#4f4a40';g.fillRect(0,0,S,S);
  const n=17,st=S/n;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=(i+0.5+(j%2?0.5:0)+(r()-.5)*0.3)*st,y=(j+0.5+(r()-.5)*0.3)*st;const col=new THREE.Color(0x9a927f);col.offsetHSL((r()-.5)*0.03,(r()-.5)*0.05,(r()-.5)*0.17);
    const rx=st*(0.42+r()*0.08),ry=st*(0.36+r()*0.1),rot=r()*3;
    wrapped(g,S,x%S,y%S,q=>{q.save();q.translate(1,2);ell(q,rx,ry,rot,'rgba(15,12,8,.5)');q.restore();q.save();ell(q,rx,ry,rot,'#'+col.getHexString());q.restore();q.save();q.rotate(rot);q.fillStyle='rgba(255,252,240,.20)';q.beginPath();q.ellipse(-rx*.2,-ry*.28,rx*.5,ry*.38,0,0,TAU);q.fill();q.restore()},40)}
  speck(g,S,5000,.06,r);return c}
/* flagstones for the hall. 3 m tile, big slabs */
function flagTex(seed,base){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle=shade(base,-0.45);g.fillRect(0,0,S,S);
  const rows=4,bh=S/rows;for(let i=0;i<rows;i++){let x=-r()*80;while(x<S){const w=110+r()*90;const col=new THREE.Color(base);col.offsetHSL(0,(r()-.5)*0.04,(r()-.5)*0.12);
    [0,-S,S].forEach(ox=>{g.fillStyle='#'+col.getHexString();g.fillRect(x+ox+2,i*bh+2,w-4,bh-4);g.fillStyle='rgba(255,250,240,.10)';g.fillRect(x+ox+3,i*bh+3,w-6,3)});x+=w}}
  speck(g,S,8000,.06,r);for(let i=0;i<18;i++){const x=r()*S,y=r()*S;wrapped(g,S,x,y,q=>{const R=30+r()*50;const gr=q.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'rgba(30,24,16,.16)');gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.fillRect(-R,-R,R*2,R*2)},90)}return c}
/* packed earth for the road. 3 m tile */
function dirtTex(seed){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle='#9a7f58';g.fillRect(0,0,S,S);
  for(let i=0;i<90;i++){const x=r()*S,y=r()*S;wrapped(g,S,x,y,q=>{const R=30+r()*70;const gr=q.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,r()>.5?'rgba(120,96,62,.4)':'rgba(176,150,108,.38)');gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.fillRect(-R,-R,R*2,R*2)},110)}
  const cols=['#b89c70','#86683f','#a58a5e','#c7ad82','#70563a'];for(let i=0;i<2600;i++){const x=r()*S,y=r()*S,rx=1+r()*3,ry=1+r()*2,col=cols[Math.floor(r()*cols.length)];wrapped(g,S,x,y,q=>{q.save();q.translate(.7,1);ell(q,rx,ry,r()*3,'rgba(50,34,16,.35)');q.restore();ell(q,rx,ry,r()*3,col)})}
  speck(g,S,7000,.06,r);return c}
function sandTex(seed){const S=256,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle='#d6c08c';g.fillRect(0,0,S,S);for(let i=0;i<40;i++){const x=r()*S,y=r()*S;wrapped(g,S,x,y,q=>{const R=20+r()*50;const gr=q.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,r()>.5?'rgba(190,164,112,.35)':'rgba(232,214,168,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');q.fillStyle=gr;q.fillRect(-R,-R,R*2,R*2)},80)}speck(g,S,7000,.09,r);return c}
/* thatch: long straw laid down the slope, cut in courses. v runs down the roof */
function thatchTex(seed){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle='#8f7338';g.fillRect(0,0,S,S);
  const cols=['#c9ab62','#b3924a','#d8bd78','#9c7d3c','#bfa056','#a9893f','#e0c888','#86692f'];g.lineCap='round';
  for(let i=0;i<5200;i++){const x=r()*S,y=r()*S,L=26+r()*46;g.strokeStyle=cols[Math.floor(r()*cols.length)];g.lineWidth=1+r()*1.6;const dx=(r()-.5)*5;
    [0,-S,S].forEach(oy=>{g.beginPath();g.moveTo(x,y+oy);g.lineTo(x+dx,y+oy+L);g.stroke()})}
  for(let k=0;k<4;k++){const y=k*S/4+S/8;const gr=g.createLinearGradient(0,y-16,0,y+10);gr.addColorStop(0,'rgba(60,42,14,0)');gr.addColorStop(.75,'rgba(60,42,14,.42)');gr.addColorStop(1,'rgba(60,42,14,0)');g.fillStyle=gr;g.fillRect(0,y-16,S,26)}
  return c}
/* slates in fish scale courses. v runs down the roof */
function slateTex(seed,base){const S=512,c=cv(S),g=c.getContext('2d'),r=rng(seed);g.fillStyle=shade(base,-0.5);g.fillRect(0,0,S,S);
  const rows=8,rh=S/rows,cols=8,cw=S/cols;
  for(let j=rows-1;j>=0;j--)for(let i=-1;i<=cols;i++){const x=(i+(j%2?0.5:0))*cw,y=j*rh;const col=new THREE.Color(base);col.offsetHSL((r()-.5)*0.02,(r()-.5)*0.06,(r()-.5)*0.13);
    g.fillStyle='#'+col.getHexString();g.beginPath();g.moveTo(x+1,y-rh*0.25);g.lineTo(x+cw-1,y-rh*0.25);g.lineTo(x+cw-1,y+rh*0.62);g.quadraticCurveTo(x+cw/2,y+rh*1.12,x+1,y+rh*0.62);g.closePath();g.fill();
    g.strokeStyle='rgba(10,12,18,.42)';g.lineWidth=1.4;g.stroke();g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x+3,y-rh*0.2,cw-6,3)}
  /* the top row wraps */
  speck(g,S,3000,.05,r);return c}
/* limewash and oak: two bays to the tile (4.8 m by 2.7 m), a brace each way */
function timberTex(seed,plaster){const W=1024,H=512,c=cv(W,H),g=c.getContext('2d'),r=rng(seed);g.fillStyle=plaster||'#e8dfc8';g.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){const x=r()*W,y=r()*H,R=30+r()*90;const gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,r()>.5?'rgba(160,140,100,.16)':'rgba(255,252,240,.2)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2)}
  /* damp at the foot */
  const gr=g.createLinearGradient(0,H*0.7,0,H);gr.addColorStop(0,'rgba(90,78,54,0)');gr.addColorStop(1,'rgba(90,78,54,.28)');g.fillStyle=gr;g.fillRect(0,H*0.7,W,H*0.3);
  const beam=(x0,y0,x1,y1,w)=>{const L=Math.hypot(x1-x0,y1-y0),a=Math.atan2(y1-y0,x1-x0);g.save();g.translate(x0,y0);g.rotate(a);const bg=g.createLinearGradient(0,-w/2,0,w/2);bg.addColorStop(0,'#5a4028');bg.addColorStop(.5,'#3f2b19');bg.addColorStop(1,'#2c1d10');g.fillStyle=bg;g.fillRect(0,-w/2,L,w);
    g.strokeStyle='rgba(20,12,6,.35)';g.lineWidth=1;for(let k=0;k<5;k++){const yy=-w/2+r()*w;g.beginPath();g.moveTo(0,yy);g.lineTo(L,yy+(r()-.5)*3);g.stroke()}g.restore()};
  const bw=30;
  beam(0,bw/2,W,bw/2,bw);beam(0,H-bw/2,W,H-bw/2,bw);beam(0,H*0.5,W,H*0.5,bw*0.8);
  [0,W/2,W].forEach(x=>beam(x,0,x,H,bw));[W/4,W*3/4].forEach(x=>beam(x,0,x,H,bw*0.7));
  beam(bw/2,H*0.5,W/4,bw,bw*0.7);beam(W/2-bw/2,H*0.5,W/4,H-bw,bw*0.7);beam(W/2+bw/2,H*0.5,W*3/4,H-bw,bw*0.7);beam(W-bw/2,H*0.5,W*3/4,bw,bw*0.7);
  return c}
function plankTex(seed,base){const S=256,c=cv(S),g=c.getContext('2d'),r=rng(seed);const n=5,w=S/n;
  for(let i=0;i<n;i++){const col=new THREE.Color(base);col.offsetHSL(0,(r()-.5)*0.05,(r()-.5)*0.1);g.fillStyle='#'+col.getHexString();g.fillRect(i*w,0,w,S);
    g.strokeStyle='rgba(30,18,8,.22)';g.lineWidth=1;for(let k=0;k<9;k++){const x=i*w+r()*w;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+(r()-.5)*8,S*0.3,x+(r()-.5)*8,S*0.7,x,S);g.stroke()}
    g.fillStyle='rgba(20,12,5,.55)';g.fillRect(i*w,0,2,S);g.fillStyle='rgba(255,240,210,.10)';g.fillRect(i*w+2,0,2,S)}

const MUSIC=(()=>{let on=false,timer=null,step=0,nextT=0,el=null,usingFile=false,want=true;try{want=localStorage.getItem('castle_music')!=='0'}catch(e){}

              D5,_,C5,B4,A4,G4, A4,_,F4,E4,_,D4, E4,F4,G4,A4,G4,E4, D4,_,_,D4,_,_,
              F4,_,A4,C5,_,A4, G4,_,B4,D5,_,B4, A4,B4,C5,D5,C5,A4, G4,_,_,E4,_,_,
              F4,_,A4,C5,B4,A4, G4,A4,B4,C5,D5,E5, F5,_,D5,C5,A4,G4, A4,_,_,D4,_,_];

function reapAt(x,z,r,cap){let n=0;const now=Date.now()/1000,R=Math.ceil(r);for(let dj=-R;dj<=R;dj++)for(let di=-R;di<=R;di++){const k=wheatIdx(x+di,z+dj);if(k<0||WHEAT.cutAt[k]>0)continue;const it=WHEAT.items[k];if(Math.hypot(it.x-x,it.z-z)>r)continue;if(n>=cap)return n;WHEAT.cutAt[k]=now;it.k=0.16;layOne(WHEAT.im,k);n++}
  if(n)WHEAT.im.instanceMatrix.needsUpdate=true;return n}
let wheatScan=0;
function wheatTick(t,dt){const f=FIELD,inField=you.x>f.x0-1&&you.x<f.x1+1&&you.z>f.z0-1&&you.z<f.z1+1&&!BUSYMODE;
  if(inField!==WHEAT.sickle){WHEAT.sickle=inField;hold(AV,'R',inField?'sickle':null)}
  if(inField&&you.sp>1){const room=WHEAT_CAP-have('wheat');if(room<=0){if(t-WHEAT.full>6){WHEAT.full=t;SND.knock();say('Your arms are full: sixty sheaves. Hugh buys them at the mill.')}}
    else{const n=reapAt(you.x,you.z,1.3,room);if(n){give('wheat',n);S.stats.cut=(S.stats.cut||0)+n;WHEAT.acc+=n;SND.cut();PARTS.emit(you.x,0.7,you.z,{n:Math.min(6,n*2),col:[0xe4c466,0xc9a23c,0xf0d98c],sp:1.6,up:2.4,life:0.7,size:0.09})}}}

  /* it grows back: a sweep of the field a slice at a time */
  const now=Date.now()/1000;let touched=false;const N=WHEAT.items.length,step=Math.ceil(N/40);for(let c=0;c<step;c++){const i=wheatScan=(wheatScan+1)%N;const ca=WHEAT.cutAt[i];if(!ca)continue;const age=now-ca;if(age>=WHEAT.regrow){WHEAT.cutAt[i]=0;WHEAT.items[i].k=1;layOne(WHEAT.im,i);touched=true}else if(age>WHEAT.regrow-12){const k=0.16+0.84*(age-(WHEAT.regrow-12))/12;if(Math.abs(k-WHEAT.items[i].k)>0.05){WHEAT.items[i].k=k;layOne(WHEAT.im,i);touched=true}}}

/* the hands you hire: each keeps to a strip of the field and cuts what is ripe in it */

/* ---------- WHAT GROWS WILD: kingsfoil in the meadow, redcaps under the trees, moonpetals after dark, iron stone by the water ---------- */
const NODES=[];let NODE_IM={},ORE_IM=null,GLINT=null;
function buildWild(){const r=rng(808);const lists={kingsfoil:[],redcap:[],moonpetal:[]};
  const ok=(x,z)=>cellAt(x,z)<0.05&&x>WORLD.x0+3&&x<WORLD.x1-3&&z>WORLD.z0+3&&z<157&&!(Math.abs(x)<3.4&&z>48)&&wheatIdx(x,z)<0&&Math.hypot(x-GREEN.x,z-GREEN.z)>GREEN.r+2&&!(x>ISLE.x0&&x<ISLE.x1&&z>ISLE.z0&&z<ISLE.z1);

  n=0;t=0;while(n<9&&t<4000){t++;const a=r()*TAU,d=POND.r+1.5+r()*14;const x=POND.x+Math.cos(a)*d,z=POND.z+Math.sin(a)*d;if(!ok(x,z))continue;if(NODES.some(o=>Math.hypot(o.x-x,o.z-z)<4))continue;add('moonpetal',x,z);n++}
  Object.keys(lists).forEach(k=>{NODE_IM[k]=placeStand(kindOf('herb-'+k,null,()=>herbCv(k),0.03,0.35),lists[k])});
  /* iron stone: rusty rocks along the moat's outer bank and at the wood's edge */
  const ore=[];[[-68,40],[-70,8],[-69,-30],[68,30],[70,-4],[69,-44],[-30,54.2],[34,54.6],[-80,60],[84,96],[-96,120],[98,146]].forEach(([x,z])=>{if(cellAt(x,z)<0.05)ore.push({x,z})});
  ORE_IM=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.34,0),new THREE.MeshStandardMaterial({color:lin(0x7a5a48),roughness:0.75,metalness:0.3,flatShading:true}),Math.max(1,ore.length));ORE_IM.castShadow=true;ORE_IM.receiveShadow=true;ORE_IM.frustumCulled=false;scene.add(ORE_IM);
  ore.forEach((o,i)=>{NODES.push({kind:'ore',x:o.x,z:o.z,i,at:0,rot:r()*6});oreLay(NODES[NODES.length-1],1)});ORE_IM.instanceMatrix.needsUpdate=true;
  /* a glint over everything worth picking, so the eye finds it */
  const pos=new Float32Array(NODES.length*3),ph=new Float32Array(NODES.length);NODES.forEach((o,i)=>{pos[i*3]=o.x;pos[i*3+1]=o.kind==='ore'?0.9:1.0;pos[i*3+2]=o.z;ph[i]=i*1.7});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('ph',new THREE.BufferAttribute(ph,1));g.setAttribute('on',new THREE.BufferAttribute(new Float32Array(NODES.length).fill(1),1));
  GLINT=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:{time:TIMEU,px:{value:renderer.getPixelRatio()*innerHeight*0.8}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:'attribute float ph,on;uniform float time,px;varying float vA;void main(){float s=pow(max(0.,sin(time*1.7+ph)),6.);vA=s*on;vec3 p=position;p.y+=0.12*sin(time*1.1+ph);vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;gl_PointSize=(0.16+0.34*s)*on*px/max(0.2,-mv.z);}',

const _om=new THREE.Matrix4(),_oq=new THREE.Quaternion(),_oe=new THREE.Euler(),_op=new THREE.Vector3(),_os=new THREE.Vector3();

function duelPaint(){if(!DUEL)return;const d=DUEL,t=$('#topbar');const pips=(n,max,cls)=>'<div class="hp '+cls+'">'+Array.from({length:max},(_,i)=>'<i class="'+(i<n?'':'off')+'"></i>').join('')+'</div>';

function duelBlock(on){if(!DUEL||DUEL.over)return;if(on&&!ARM.block)DUEL.blockAt=performance.now()/1000;ARM.block=on}
function duelStrike(){const d=DUEL;if(!d||d.over||d.cool>0||ARM.block)return;d.cool=0.5;ARM.t=0;SND.swish();
  /* he may get his shield up, if he is not already committed */

  setTimeout(()=>{if(!DUEL||DUEL!==d||d.over)return;const dist=Math.hypot(d.x-you.x,d.z-you.z);if(dist>2.5)return;
    if(d.st==='guard'){SND.clang();PARTS.emit((d.x+you.x)/2,1.3,(d.z+you.z)/2,{n:8,col:[0xfff2b0,0xffb040],sp:3,up:2,life:0.3,size:0.07});return}

    floatAt(open?'A clean blow':'Hit','item',d.x,2.5,d.z);const kx=(d.x-you.x)/Math.max(0.1,dist),kz=(d.z-you.z)/Math.max(0.1,dist);d.x+=kx*0.5;d.z+=kz*0.5;

    duelPaint()},150)}
/* the bout is watched from the side, so you see his blade go up: the camera keeps square to the line between you */
function duelCam(d,snap){const mx=(you.x+d.x)/2,mz=(you.z+d.z)/2,dist=Math.hypot(d.x-you.x,d.z-you.z),la=Math.atan2(d.z-you.z,d.x-you.x),c1=la+Math.PI/2,c2=la-Math.PI/2,want=Math.abs(wrapA(c1-d.cam))<Math.abs(wrapA(c2-d.cam))?c1:c2;
  d.cam+=wrapA(want-d.cam)*(snap?1:0.04);const R=(innerWidth<innerHeight?8.0:4.3)+dist*0.6,cx=mx+Math.cos(d.cam)*R,cz=mz+Math.sin(d.cam)*R;if(!CAMFIX)return;CAMFIX.x=cx;CAMFIX.z=cz;CAMFIX.y=2.3;CAMFIX.yaw=Math.atan2(cx-mx,cz-mz);CAMFIX.pitch=-Math.atan2(1.2,R);you.yaw=CAMFIX.yaw}
function duelTick(t,dt){const d=DUEL;if(!d)return;d.cool-=dt;d.grace-=dt;armTick(dt);if(CAMK>1&&d.stT>0.5)CAMK=1;duelCam(d);if(d.over){d.stT+=dt;toyTick(d.f,t,dt,0,d.won?'kneel':'cheer');return}

  const R=YARD.ring,cl=(o)=>{const dx=o.x-R.x,dz=o.z-R.z,r=Math.hypot(dx,dz);if(r>R.r-0.5){o.x=R.x+dx/r*(R.r-0.5);o.z=R.z+dz/r*(R.r-0.5)}};cl(you);
  if(ARM.block){you.vx*=0.9;you.vz*=0.9}

    if(d.t<=0&&dist<2.5){if(d.F.feint&&Math.random()<d.F.feint){d.st='feint';d.t=d.F.tell*0.55}else{d.st='tell';d.t=d.F.tell}SND.tick();PARTS.emit(d.x,2.1,d.z,{n:5,col:[0xffffff,0xfff2b0],sp:1.0,up:1.2,life:0.3,size:0.09,grav:0});d.strafe=Math.random()<0.5?1:-1}else if(d.t<=0)d.t=0.2}

  else if(d.st==='feint'){armWant=-2.75;if(d.t<=0){d.st='idle';d.t=0.25+Math.random()*0.3}}
  else if(d.st==='strike'){armWant=0.4;if(d.t<=0){/* the blow lands */
      if(dist<2.45&&d.grace<=0){const now=performance.now()/1000;
        if(ARM.block&&now-d.blockAt<1.15){if(now-d.blockAt<0.3){SND.parry();PARTS.emit((d.x+you.x)/2,1.4,(d.z+you.z)/2,{n:18,col:[0xffffff,0xfff2b0,0xffd24a],sp:4,up:3,life:0.45,size:0.09});d.st='stagger';d.t=1.35;floatAt('Parried','rn',you.x,you.feet+2.3,you.z);duelPaint();return}
          SND.clang();PARTS.emit((d.x+you.x)/2,1.3,(d.z+you.z)/2,{n:7,col:[0xfff2b0,0xffb040],sp:3,up:2,life:0.3,size:0.07});you.vx+=ux*5;you.vz+=uz*5}

  else if(d.st==='recover'){armWant=-0.2;if(d.t<=0){d.st='idle';d.t=(0.35+Math.random()*0.9)*(1.15-d.i*0.1)}}

function onPresence(state){state=state||{};const seen={};Object.keys(state).forEach(k=>{if(k===ME)return;const p=(state[k]||[])[0];if(!p||!p.id)return;seen[k]=Object.assign(PRESENCE[k]||{},p)});PRESENCE=seen;syncFriends()}

<html lang="en">

<style>
:root{--cream:#fbf6ea;--gold:#ffd98a;--line:rgba(255,255,255,.2)}

canvas{display:block}

.cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}

#line small{display:block;font-size:11px;opacity:.7;margin-top:4px;letter-spacing:.12em;text-transform:uppercase}

#jump{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-size:12px;letter-spacing:.08em;z-index:15;display:none;touch-action:none}

#act small{display:block;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-top:2px}

#gate h1 em{font-style:normal;color:var(--gold)}

<body>
<div id="gate"><div class="cap" style="margin-bottom:14px">Deedable · the lobby</div><h1>The Cave<em>.</em></h1><p>Everyone starts here. Walk the gallery, find a world, and go in together.</p><button id="walkin">Walk in</button></div>

<script>
/* ======================================================================
   THE CAVE. The lobby for every game on deedable: a warm crystal cave you walk through.
   Everyone arrives in a carve-out of their own round the first chamber (the Hollow), then the gallery winds on
   past seven more carve-outs, one for each world. Stand in a world's ring and it takes you; friends in the cave
   see where you went and can follow. Every game comes back here (?from=<game> puts you outside its carve-out).
   Route garden/cave/. Music is made in the page; cave.mp3 beside this file plays instead if it is there.
   ====================================================================== */
const $=s=>document.querySelector(s);
const QS=new URLSearchParams(location.search);
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
let TOY=!!(window.Figure&&window.Wardrobe&&window.Wardrobe.util);
const WORLDS=[
  {k:'world',n:'The Garden',s:'grow it, build it, walk it',hex:0x6fe08a,g:'✿',url:'../world/?from=cave'},
  {k:'blast',n:'Wolf Blast',s:'a shotgun and a lot of wolves',hex:0xffd84a,g:'✸',url:'../blast/'},
  {k:'casino',n:'The Card Room',s:'blackjack · hold’em · pai gow',hex:0x3fe0b0,g:'♠',url:'../casino/'},
  {k:'flag',n:'The Flag',s:'four teams, one flag',hex:0xff6b93,g:'⚑',url:'../flag/'},
  {k:'castle',n:'The Castle',s:'knights, potions, quests',hex:0xa99bff,g:'♜',url:'../castle/'},
  {k:'chess',n:'The Study',s:'chess by the fire',hex:0x7fd4ff,g:'♞',url:'../chess/?from=cave'},
  {k:'club',n:'The Club',s:'music and neon',hex:0xff7bf2,g:'♫',url:'../club/'}];

/* ---------- the plan: every place you can stand is inside one of these circles ---------- */
const ZONES=[];const add=(x,z,r,kind,o)=>{const c=Object.assign({x,z,r,kind},o||{});ZONES.push(c);return c};
const HOLLOW=add(0,0,9.5,'hollow');
const NICHES=[];for(let i=0;i<8;i++){const a=Math.PI*(1.08+i*0.12);NICHES.push(add(Math.cos(a)*10.3,Math.sin(a)*10.3,2.7,'niche',{a,i}))}
const PATH=[];for(let k=1;k<=11;k++){PATH.push(add(Math.sin(k*0.62)*6.5,7+k*5.6,5.6,'path',{k}))}
const SLOTS=[[1,-1],[2,1],[4,-1],[5,1],[7,-1],[8,1],[10,-1]];
WORLDS.forEach((w,i)=>{const [k,side]=SLOTS[i];const p=PATH[k-1];const q=PATH[Math.min(PATH.length-1,k)];const o=PATH[Math.max(0,k-2)];
  let tx=q.x-o.x,tz=q.z-o.z;const L=Math.hypot(tx,tz);tx/=L;tz/=L;const nx=-tz*side,nz=tx*side;   /* the normal to the gallery, on its side */

const END=add(PATH[10].x,PATH[10].z+7.5,6.5,'end');
function inside(x,z,m){for(const c of ZONES){if(Math.hypot(x-c.x,z-c.z)<c.r-m)return true}return false}
function clampIn(x,z,m){if(inside(x,z,m))return [x,z];let b=null,bd=1e9;for(const c of ZONES){const d=Math.hypot(x-c.x,z-c.z)-(c.r-m);if(d<bd){bd=d;b=c}}const d=Math.hypot(x-b.x,z-b.z)||1;const k=(b.r-m-0.001)/d;return [b.x+(x-b.x)*k,b.z+(z-b.z)*k]}

/* ---------- the scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;

{const d=new THREE.DirectionalLight(0xffe0b8,0.3);d.position.set(-8,30,-6);scene.add(d)}

const mesh=(g,m,x,y,z,p)=>{const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);(p||scene).add(o);return o};
const R=rng(20261011);

/* the floor: one big slab with a painted stone grain, lighter along the way through */
{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#2a2148';g.fillRect(0,0,512,512);const r=rng(5);
  for(let i=0;i<2600;i++){const x=r()*512,y=r()*512,s=1+r()*5;g.fillStyle=r()>0.5?'rgba(255,240,255,'+(0.02+r()*0.05)+')':'rgba(10,5,30,'+(0.05+r()*0.1)+')';g.beginPath();g.ellipse(x,y,s*2,s,r()*3,0,7);g.fill()}
  for(let i=0;i<26;i++){g.strokeStyle='rgba(15,8,40,.35)';g.lineWidth=1+r()*2;g.beginPath();let x=r()*512,y=r()*512;g.moveTo(x,y);for(let k=0;k<6;k++){x+=(r()-0.5)*90;y+=(r()-0.5)*90;g.lineTo(x,y)}g.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(26,26);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  const f=mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({map:t}),0,0,35);f.rotation.x=-Math.PI/2}
/* the roof, far up in the dark */
{const c=mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshBasicMaterial({color:0x120c26}),0,13,35);c.rotation.x=Math.PI/2}

/* the walls: boulders along every edge of the plan, two rows, the back row taller */
{const pts=[];for(const c of ZONES){const n=Math.ceil(c.r*6.283/1.25);for(let i=0;i<n;i++){const a=i/n*6.283+c.r;const x=c.x+Math.cos(a)*(c.r+0.55),z=c.z+Math.sin(a)*(c.r+0.55);if(!inside(x,z,-0.45))pts.push([x,z,Math.cos(a),Math.sin(a)])}}
  const geo=new THREE.IcosahedronGeometry(1,1);{const p=geo.attributes.position;const r=rng(9);for(let i=0;i<p.count;i++){const k=1+(Math.sin(p.getX(i)*7.1+p.getY(i)*3.3)+Math.cos(p.getZ(i)*5.7))*0.09;p.setXYZ(i,p.getX(i)*k,p.getY(i)*k,p.getZ(i)*k)}geo.computeVertexNormals()}
  const m=new THREE.MeshLambertMaterial({color:0xffffff});const inst=new THREE.InstancedMesh(geo,m,pts.length*3);const d=new THREE.Object3D(),col=new THREE.Color();let n=0;
  const cols=[0x4a3a7c,0x3f3270,0x54438a,0x372b62,0x5b4a94];
  for(const [x,z,ox,oz] of pts){for(let row=0;row<3;row++){const off=0.75+row*1.5+R()*0.5;const h=row===0?2.2+R()*2.6:row===1?5+R()*3:8+R()*4;d.position.set(x+ox*off+(R()-0.5)*0.5,h*0.36,z+oz*off+(R()-0.5)*0.5);d.scale.set(1.15+R()*0.9+row*0.5,h,1.15+R()*0.9+row*0.5);d.rotation.set((R()-0.5)*0.3,R()*6.28,(R()-0.5)*0.3);d.updateMatrix();inst.setMatrixAt(n,d.matrix);col.setHex(cols[Math.floor(R()*cols.length)]);if(row)col.multiplyScalar(0.7-row*0.12);inst.setColorAt(n,col);n++}}
  inst.count=n;inst.instanceMatrix.needsUpdate=true;if(inst.instanceColor)inst.instanceColor.needsUpdate=true;inst.frustumCulled=false;scene.add(inst)}
/* stalactites over the way, and a few stalagmites at the edges */
{const geo=new THREE.ConeGeometry(0.5,1,7).toNonIndexed();geo.computeVertexNormals();const m=new THREE.MeshLambertMaterial({color:0x3b2f66});const N=260;const inst=new THREE.InstancedMesh(geo,m,N);const d=new THREE.Object3D();let n=0;
  for(let i=0;i<N;i++){const c=ZONES[Math.floor(R()*ZONES.length)];const a=R()*6.28,rr=Math.sqrt(R())*c.r;const x=c.x+Math.cos(a)*rr,z=c.z+Math.sin(a)*rr;const h=1.5+R()*4.5;d.position.set(x,13-h/2,z);d.scale.set(0.6+R()*1.1,h,0.6+R()*1.1);d.rotation.set(Math.PI,R()*6,0);d.updateMatrix();inst.setMatrixAt(n++,d.matrix)}
  inst.count=n;inst.frustumCulled=false;scene.add(inst)}

/* crystals: clusters that glow, and the soft light they throw */
const CRYS=[];const cgeo=new THREE.ConeGeometry(0.28,1,6).toNonIndexed();cgeo.computeVertexNormals();
function cluster(x,z,hex,s,light){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const n=4+Math.floor(R()*4);const c=new THREE.Color(hex);
  for(let i=0;i<n;i++){const h=(0.7+R()*1.8)*s;const m=new THREE.MeshBasicMaterial({color:c.clone().multiplyScalar(0.55+R()*0.45),toneMapped:false});const k=mesh(cgeo,m,(R()-0.5)*0.9*s,h*0.42,(R()-0.5)*0.9*s,g);k.scale.set(s*(0.7+R()*0.7),h,s*(0.7+R()*0.7));k.rotation.set((R()-0.5)*0.9,R()*6,(R()-0.5)*0.9);}
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:HALO,color:hex,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));halo.scale.set(5*s,5*s,1);halo.position.y=1*s;g.add(halo);CRYS.push({m:halo.material,ph:R()*6,base:0.3});
  if(light){const p=new THREE.PointLight(hex,light,15,1.6);p.position.set(0,1.6,0);g.add(p)}return g}
const HALO=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.3,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
/* along the gallery: gold and teal and violet, tucked against the walls */
{const pal=[0xffb347,0x2fe6cf,0xa56bff,0xff6fb5,0x5fb4ff];
  for(const c of ZONES){if(c.kind==='world'||c.kind==='niche')continue;const n=c.kind==='hollow'?7:3;for(let i=0;i<n;i++){let tries=0;while(tries++<12){const a=R()*6.28;const x=c.x+Math.cos(a)*(c.r+0.2),z=c.z+Math.sin(a)*(c.r+0.2);if(!inside(x,z,0.1)){cluster(x,z,pal[Math.floor(R()*pal.length)],0.7+R()*0.6,0);break}}}}}
/* way lights: little glowing caps down both sides of the gallery, so the way on is always in sight */
{const geo=new THREE.SphereGeometry(0.075,8,6);const inst=new THREE.InstancedMesh(geo,new THREE.MeshBasicMaterial({color:0xffc35a,toneMapped:false}),PATH.length*6);const d=new THREE.Object3D();let n=0;
  const pts=[[0,4]].concat(PATH.map(p=>[p.x,p.z]));for(let i=0;i<pts.length-1;i++){const [ax,az]=pts[i],[bx,bz]=pts[i+1];const L=Math.hypot(bx-ax,bz-az);const nx=-(bz-az)/L,nz=(bx-ax)/L;for(let s=0;s<3;s++){const t=s/3;for(const side of[-1,1]){const x=ax+(bx-ax)*t+nx*side*1.7,z=az+(bz-az)*t+nz*side*1.7;d.position.set(x,0.1,z);d.scale.setScalar(1);d.updateMatrix();inst.setMatrixAt(n++,d.matrix)}}}
  inst.count=n;scene.add(inst)}

/* ---------- the Hollow: the pool, the light from above, the eight carve-outs ---------- */
const POOL={x:0,z:0,r:2.6};
{mesh(new THREE.CylinderGeometry(POOL.r+0.5,POOL.r+0.8,0.35,36),new THREE.MeshLambertMaterial({color:0x54438a}),0,0.17,0);
  const w=mesh(new THREE.CircleGeometry(POOL.r,40),new THREE.MeshBasicMaterial({color:0x2fd6c8,toneMapped:false}),0,0.36,0);w.rotation.x=-Math.PI/2;
  const p=new THREE.PointLight(0x7ff0e0,1.3,24,1.5);p.position.set(0,2.2,0);scene.add(p);
  /* the shaft of day from a crack in the roof */
  for(let i=0;i<3;i++){const s=mesh(new THREE.CylinderGeometry(0.6+i*0.9,2.2+i*1.3,13,24,1,true),new THREE.MeshBasicMaterial({color:0xfff1c4,transparent:true,opacity:0.055-i*0.013,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}),0.6,6.5,-0.3);s.rotation.z=0.07}
  const sun=new THREE.PointLight(0xffe2ac,0.9,34,1.4);sun.position.set(0.5,9,0);scene.add(sun)}
function label(lines,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.textAlign='center';g.textBaseline='middle';

  function out(){const a=AC;if(!musG){musG=a.createGain();musG.gain.value=0.9;musG.connect(a.destination);dly=a.createDelay(1.5);dly.delayTime.value=0.45;const fb=a.createGain();fb.gain.value=0.38;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;dly.connect(lp);lp.connect(fb);fb.connect(dly);lp.connect(musG)}return musG}
  function tone(f,t,d,type,g0,dest,att){const a=ctx();if(!a||a.state!=='running')return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(att){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(g0,t+att)}else g.gain.setValueAtTime(g0||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(dest||a.destination);o.start(t);o.stop(t+d+0.05);return o}
  function noise(t,d,freq,q,g0,dest){const a=ctx();if(!a||a.state!=='running')return;const n=a.createBufferSource(),nb=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*d)),a.sampleRate),dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,2);n.buffer=nb;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=g0;n.connect(f);f.connect(g);g.connect(dest||a.destination);n.start(t)}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  /* D major, one bar each of D, A, B minor, G, at 104. A pad, a plucked run with an echo, a soft kick, and a bell tune every other time round */
  const CH=[[50,62,66,69,74],[45,61,64,69,73],[47,62,66,71,74],[43,62,67,71,74]];
  const ARP=[1,2,3,4,3,2,3,4];const TUNE=[[78,0],[81,1],[83,1.5],[81,2.5],[78,4],[76,5],[74,5.5],[76,6.5],[78,8],[83,9],[86,9.5],[85,10.5],[81,12],[78,13],[76,13.5],[74,14.5]];

    /* the pad */
    c.slice(1,4).forEach(m=>{[-6,6].forEach(det=>{const os=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();os.type='sawtooth';os.frequency.value=hz(m);os.detune.value=det;f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(0.022,t0+beat);g.gain.linearRampToValueAtTime(0.0001,t0+beat*4.4);os.connect(f);f.connect(g);g.connect(o);os.start(t0);os.stop(t0+beat*4.5)})});
    /* the bass and the kick */
    [0,1.5,2.5].forEach(b=>tone(hz(c[0]-12),t0+b*beat,beat*0.9,'sine',0.2,o));tone(hz(c[0]),t0,beat*0.5,'triangle',0.05,o);
    [0,2].forEach(b=>{const os=a.createOscillator(),g=a.createGain();os.frequency.setValueAtTime(120,t0+b*beat);os.frequency.exponentialRampToValueAtTime(45,t0+b*beat+0.12);g.gain.setValueAtTime(0.3,t0+b*beat);g.gain.exponentialRampToValueAtTime(0.0001,t0+b*beat+0.22);os.connect(g);g.connect(o);os.start(t0+b*beat);os.stop(t0+b*beat+0.25)});
    for(let b=0;b<8;b++){if(b%2)noise(t0+b*beat/2,0.05,8000,1,0.02,o)}

    ARP.forEach((ix,i)=>{const m=c[ix]+12;const t=t0+i*beat/2;const os=tone(hz(m),t,0.32,'triangle',0.06,o);tone(hz(m),t,0.28,'triangle',0.035,dly)});
    /* the tune */
    if(lap%2===1||lap===0&&k>=2){const base=(k%4)*4;TUNE.forEach(([m,b])=>{if(b>=base&&b<base+4){const t=t0+(b-base)*beat;tone(hz(m),t,0.9,'sine',0.07,o);tone(hz(m)*2,t,0.5,'sine',0.018,o);tone(hz(m),t,0.7,'sine',0.03,dly)}})}}
  /* the music is a real track: cave.mp3 beside this file if there is one, else the flag lobby track he made. No track, no music */
  const TRACKS=['cave.mp3','../flag/lobby.mp3'];let ti=0;

    if(!mp3){mp3=new Audio();mp3.loop=true;mp3.volume=0.55;mp3.preload='auto';mp3.setAttribute('playsinline','');mp3.addEventListener('error',()=>{ti++;if(ti<TRACKS.length){mp3.src=TRACKS[ti];if(on){const p=mp3.play();if(p&&p.catch)p.catch(()=>{})}}});mp3.src=TRACKS[0]}
    const p=mp3.play();if(p&&p.catch)p.catch(()=>{})}

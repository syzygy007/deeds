<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="blast-build" content="1.1">
<title>Wolf Blast</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#050814;color:#fff;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:46px;line-height:1;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 18px rgba(255,200,60,.55);color:#ffd84a}
#time{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;font-size:30px;text-shadow:0 2px 0 #000}
#time.low{color:#ff9a3c;animation:pulse .5s infinite}
#combo{line-height:48px;height:48px;position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(1);font-size:30px;color:#7df9ff;text-shadow:0 2px 0 #000,0 0 14px rgba(80,220,255,.8);opacity:0;transition:opacity .15s}
#cbar{position:absolute;top:calc(110px + env(safe-area-inset-top));left:50%;width:150px;height:6px;margin-left:-75px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;opacity:0}
#cbar i{display:block;height:100%;width:100%;background:#7df9ff;transform-origin:left}
#pick{position:absolute;top:calc(126px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:2px;padding:6px 14px;border-radius:20px;background:rgba(0,0,0,.55);border:2px solid #ffd84a;color:#ffd84a;display:none;white-space:nowrap}
#boss{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;width:min(60vw,420px);transform:translateX(-50%);display:none;text-align:center;font-size:13px;letter-spacing:3px}
#boss b{display:block;height:12px;margin-top:5px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.5)}
#boss b i{display:block;height:100%;background:linear-gradient(90deg,#b455ff,#ff4dd2);transform-origin:left}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff}
#cross.hit{border-color:#ffd84a;transform:scale(1.35)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:44px;letter-spacing:1px;text-shadow:0 4px 0 #000,0 0 24px rgba(255,255,255,.4);opacity:0;transition:opacity .2s;padding:0 12px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,90,40,0) 45%,rgba(255,90,40,.7) 100%);opacity:0;transition:opacity .25s}
.fl{position:absolute;left:0;top:0;font-size:26px;color:#ffd84a;text-shadow:0 2px 0 #000;white-space:nowrap;will-change:transform,opacity;opacity:0}
.fl.big{font-size:40px;color:#fff}
.chip{position:fixed;pointer-events:auto;top:calc(12px + env(safe-area-inset-top));right:12px;font:700 12px Arial,sans-serif;letter-spacing:2px;padding:9px 13px;border-radius:20px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);color:#fff;z-index:30}
#snd{right:92px}
#stick{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none;z-index:20}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.4)}
#fire{position:fixed;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:4px solid #ffd84a;background:rgba(255,216,74,.22);color:#ffd84a;font-size:22px;letter-spacing:2px;display:none;z-index:20;align-items:center;justify-content:center}
#fire.on{background:rgba(255,216,74,.6);color:#000}
.card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:40;background:radial-gradient(ellipse at 50% 40%,rgba(20,30,70,.82),rgba(3,5,14,.96))}
.card h1{margin:0;font-size:min(19vw,150px);line-height:.86;letter-spacing:-2px;color:#fff;text-shadow:0 6px 0 #000}
.card h1 em{font-style:normal;color:#ffd84a}
.card h2{margin:0 0 6px;font-size:min(13vw,96px);line-height:.9;color:#ffd84a;text-shadow:0 5px 0 #000}
.card p{font:700 15px/1.5 Arial,sans-serif;letter-spacing:2px;color:#b9c4ff;margin:16px 0 0;max-width:520px}
.lab{font:700 12px Arial,sans-serif;letter-spacing:4px;color:#8fa0e6;margin-bottom:10px}
.btn{pointer-events:auto;margin-top:26px;font:900 26px "Arial Black",Arial,sans-serif;letter-spacing:2px;padding:18px 44px;border-radius:60px;border:0;background:#ffd84a;color:#141414;box-shadow:0 7px 0 #a67c00;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #a67c00}
.lnk{pointer-events:auto;margin-top:20px;font:700 13px Arial,sans-serif;letter-spacing:3px;color:#b9c4ff;text-decoration:none;border-bottom:1px solid rgba(185,196,255,.5);padding-bottom:3px;cursor:pointer}
.rows{margin-top:18px;font:700 14px Arial,sans-serif;letter-spacing:2px;color:#dfe5ff;min-width:270px}
.rows div{display:flex;justify-content:space-between;gap:30px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.rows b{color:#ffd84a}
#end{display:none}
#newbest{display:none;margin-top:10px;font-size:20px;color:#7df9ff;letter-spacing:3px;animation:pulse .6s infinite}
#err{position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;font:12px monospace;padding:6px;z-index:99;display:none}
@media(max-width:620px){#score{font-size:38px}#snd{right:12px;top:calc(52px + env(safe-area-inset-top))}#banner{font-size:32px}}
@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="vig"></div>
  <div id="time">1:00</div>
  <div id="score">0</div>
  <div id="combo">×2</div>
  <div id="cbar"><i></i></div>
  <div id="pick"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="boss">THE WEREWOLF<b><i></i></b></div>
  <div id="floats"></div>
</div>
<div id="stick"><i></i></div>
<div id="fire">FIRE</div>
<div class="chip" id="leave">LEAVE</div>
<div class="chip" id="snd">SOUND ON</div>

<div class="card" id="title">
  <div class="lab">STAGE 1 · THE GARDEN AT NIGHT</div>
  <h1>WOLF<br><em>BLAST.</em></h1>
  <p id="how">60 SECONDS. BLAST EVERYTHING WITH EYES.</p>
  <button class="btn" id="play">PLAY</button>
  <a class="lnk" id="home1">BACK TO THE GARDEN</a>
</div>

<div class="card" id="end">
  <div class="lab" id="endlab">TIME.</div>
  <h2 id="endscore">0</h2>
  <div id="newbest">NEW BEST.</div>
  <div class="rows">
    <div><span>BLASTED</span><b id="r1">0</b></div>
    <div><span>BEST COMBO</span><b id="r2">×1</b></div>
    <div><span>WEREWOLF</span><b id="r3">GOT AWAY</b></div>
    <div><span>YOUR BEST</span><b id="r4">0</b></div>
  </div>
  <p id="endnote"></p>
  <button class="btn" id="again">RUN IT BACK</button>
  <a class="lnk" id="home2">BACK TO THE GARDEN</a>
</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){var b=document.getElementById('err');b.style.display='block';b.textContent=(e.message||'error')+' @'+(e.lineno||'')});
var QS=new URLSearchParams(location.search);
var TEST=QS.get('test')==='1';
var $=function(id){return document.getElementById(id)};
var TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var HOME='../world/';
$('home1').href=HOME;$('home2').href=HOME;
$('how').textContent=TOUCH?'60 SECONDS. LEFT THUMB RUNS. RIGHT THUMB AIMS AND FIRES.':'60 SECONDS. WASD RUNS. MOUSE AIMS. CLICK OR SPACE FIRES.';

/* ---------- constants ---------- */
var ROUND=60,BOSS_AT=40,ARENA=38,RING=47,FOUNT_R=3.5,EYE=1.65,SPEED=9.5;
var RANGE=42,CONE=0.2,COOL=0.42,COMBO_S=2.6,MAXW=44;
var HOUSE={x:0,z:-54},GATE={x:15,z:-45.5};

/* ---------- renderer ---------- */
var canvas=$('c');
var R=new THREE.WebGLRenderer({canvas:canvas,antialias:!TOUCH,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,TOUCH?1.5:2));
var scene=new THREE.Scene();
var SKY=0x0b1230;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,18,78);
var cam=new THREE.PerspectiveCamera(74,1,0.08,400);
cam.rotation.order='YXZ';
scene.add(cam);
function resize(){var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?86:74;cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0x7f96ff,0x1a2a1c,0.95));
var moonL=new THREE.DirectionalLight(0xbfd0ff,0.75);moonL.position.set(-30,60,-40);scene.add(moonL);

function L(c){return new THREE.MeshLambertMaterial({color:c})}
function B(c,o){var m=new THREE.MeshBasicMaterial({color:c});if(o){for(var k in o)m[k]=o[k]}return m}
function box(w,h,d,m,x,y,z,p){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x||0,y||0,z||0);(p||scene).add(o);return o}
function rnd(a,b){return a+Math.random()*(b-a)}
var _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler();
function part(geo,col,x,y,z,rx,rz,s){return {g:geo,c:col,x:x||0,y:y||0,z:z||0,rx:rx||0,rz:rz||0,s:s||1}}
function bx(w,h,d,col,x,y,z,o){var p=part(new THREE.BoxGeometry(w,h,d),col,x,y,z);if(o)for(var k in o)p[k]=o[k];return p}
function merge(parts){var pos=[],nor=[],col=[],c=new THREE.Color();
 parts.forEach(function(p){var g=p.g.index?p.g.toNonIndexed():p.g.clone();_e.set(p.rx||0,p.ry||0,p.rz||0);_q.setFromEuler(_e);
  _m4.compose(new THREE.Vector3(p.x,p.y,p.z),_q,new THREE.Vector3(p.sx||p.s||1,p.sy||p.s||1,p.sz||p.s||1));g.applyMatrix4(_m4);
  var a=g.attributes.position.array,n=g.attributes.normal.array;c.set(p.c);for(var i=0;i<a.length;i+=3){pos.push(a[i],a[i+1],a[i+2]);nor.push(n[i],n[i+1],n[i+2]);col.push(c.r,c.g,c.b)}});
 var o=new THREE.BufferGeometry();o.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));o.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));o.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return o}
var STAT=[],GLOWS=[];

/* ---------- textures ---------- */
function canv(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);return t}
var grassT=canv(256,256,function(g,w,h){g.fillStyle='#17361f';g.fillRect(0,0,w,h);for(var i=0;i<2600;i++){g.fillStyle=['#1d4427','#143019','#22502c','#0f2614'][i&3];g.fillRect(Math.random()*w,Math.random()*h,2,3+Math.random()*4)}});
grassT.wrapS=grassT.wrapT=THREE.RepeatWrapping;grassT.repeat.set(34,34);
var dotT=canv(64,64,function(g){var r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.55,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
var glowT=canv(64,64,function(g){var r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});

/* ---------- the garden at night ---------- */
var ground=new THREE.Mesh(new THREE.CircleGeometry(120,48),new THREE.MeshLambertMaterial({map:grassT}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
var gravel=L(0x5d5a66);
(function(){var a=new THREE.Mesh(new THREE.PlaneGeometry(4.2,96),gravel);a.rotation.x=-Math.PI/2;a.position.y=.02;scene.add(a);
var b=a.clone();b.rotation.z=Math.PI/2;scene.add(b);
var c=new THREE.Mesh(new THREE.CircleGeometry(7.2,32),gravel);c.rotation.x=-Math.PI/2;c.position.y=.03;scene.add(c)})();

/* moon and stars */
var moon=new THREE.Mesh(new THREE.SphereGeometry(13,24,16),B(0xf4f1dc,{fog:false}));moon.position.set(-70,95,-190);scene.add(moon);
var halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0x9fb4ff,fog:false,transparent:true,opacity:.55,depthWrite:false}));halo.scale.set(110,110,1);halo.position.copy(moon.position);scene.add(halo);
(function(){var n=500,p=new Float32Array(n*3);for(var i=0;i<n;i++){var a=Math.random()*6.283,e=rnd(.08,1.4),r=300;p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r}
var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false})))})();

/* fountain */
var stone=L(0x8d8fa3),FG=new THREE.Group();scene.add(FG);
(function(){var a=new THREE.Mesh(new THREE.CylinderGeometry(3.3,3.5,.8,24),stone);a.position.y=.4;FG.add(a);
var w=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.1,24),B(0x2f6fd0,{transparent:true,opacity:.85}));w.position.y=.78;FG.add(w);
var c=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,2.6,10),stone);c.position.y=1.7;FG.add(c);
var d=new THREE.Mesh(new THREE.CylinderGeometry(1.3,.3,.35,16),stone);d.position.y=3.05;FG.add(d);
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0x66b4ff,transparent:true,opacity:.7,depthWrite:false}));s.scale.set(9,9,1);s.position.y=2.2;FG.add(s);FG.glow=s})();
var geyser=new THREE.Mesh(new THREE.CylinderGeometry(1.1,2.2,1,14,1,true),B(0x8fd0ff,{transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false}));
geyser.visible=false;scene.add(geyser);

/* hedges: four box framed gardens, low enough to hop */
var HEDGES=[],FLG=new THREE.SphereGeometry(.22,6,5);
function hedge(x0,z0,x1,z1){var w=Math.abs(x1-x0)+.9,d=Math.abs(z1-z0)+.9,cx=(x0+x1)/2,cz=(z0+z1)/2;
  STAT.push(bx(w,.9,d,0x1e5a2a,cx,.45,cz),bx(w-.12,.12,d-.12,0x2a7437,cx,.93,cz));
  HEDGES.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2})}
[[1,1],[-1,1],[1,-1],[-1,-1]].forEach(function(q){var cx=q[0]*15.5,cz=q[1]*15.5,h=8,g=2.4;
  [[-h,-h,-g,-h],[g,-h,h,-h],[-h,h,-g,h],[g,h,h,h],[-h,-h,-h,-g],[-h,g,-h,h],[h,-h,h,-g],[h,g,h,h]].forEach(function(s){hedge(cx+s[0],cz+s[1],cx+s[2],cz+s[3])});
  var bed=new THREE.Mesh(new THREE.CircleGeometry(3.2,18),L(0x2b2030));bed.rotation.x=-Math.PI/2;bed.position.set(cx,.03,cz);scene.add(bed);
  for(var i=0;i<14;i++){var a=Math.random()*6.283,r=Math.random()*2.8;var fx0=cx+Math.cos(a)*r,fz0=cz+Math.sin(a)*r;GLOWS.push(part(FLG,[0xff6fae,0xffd84a,0xc58bff,0xffffff][i&3],fx0,.45+Math.random()*.25,fz0));STAT.push(bx(.05,.45,.05,0x1e5a2a,fx0,.22,fz0))}
});
function hedgeH(x,z){for(var i=0;i<HEDGES.length;i++){var h=HEDGES[i];if(x>h.x0&&x<h.x1&&z>h.z0&&z<h.z1)return 1}return 0}

/* the dark wood */
(function(){var N=110,tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.5,3,6),L(0x2a1e18),N),
 cn=new THREE.InstancedMesh(new THREE.ConeGeometry(2.6,7.5,7),L(0x0f2a1a),N),m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
 for(var i=0;i<N;i++){var a=i/N*6.283+rnd(-.03,.03),r=rnd(RING+2,RING+16);var x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(z<-40&&Math.abs(x)<24){r+=22;x=Math.cos(a)*r;z=Math.sin(a)*r}
  var k=rnd(.8,1.5);s.set(k,k,k);p.set(x,1.5*k,z);m.compose(p,q,s);tr.setMatrixAt(i,m);p.set(x,(3+3.4)*k,z);m.compose(p,q,s);cn.setMatrixAt(i,m)}
 scene.add(tr);scene.add(cn)})();

/* lamps */
var LAMPS=[];
[[6,6],[-6,6],[6,-6],[-6,-6],[2.6,26],[-2.6,26],[2.6,-26],[-2.6,-26],[26,2.6],[26,-2.6],[-26,2.6],[-26,-2.6]].forEach(function(p){
  STAT.push(bx(.14,3.2,.14,0x15151c,p[0],1.6,p[1]));
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xffc56a,transparent:true,opacity:.9,depthWrite:false}));s.scale.set(3.4,3.4,1);s.position.set(p[0],3.3,p[1]);scene.add(s);LAMPS.push(s)});

/* the house with the lights on */
(function(){var w=L(0x3a3550);box(22,9,10,w,HOUSE.x,4.5,HOUSE.z);
 var roof=new THREE.Mesh(new THREE.ConeGeometry(15,5,4),L(0x1d1a2c));roof.rotation.y=Math.PI/4;roof.scale.set(1.1,1,.55);roof.position.set(HOUSE.x,11.5,HOUSE.z);scene.add(roof);
 for(var i=-3;i<=3;i++){if(i===0)continue;GLOWS.push(bx(1.5,2.1,.1,0xffd27a,HOUSE.x+i*2.9,6.3,HOUSE.z+5.06),bx(1.5,2.1,.1,0xffd27a,HOUSE.x+i*2.9,2.4,HOUSE.z+5.06))}
 box(2,3.6,.1,B(0x5a3a22),HOUSE.x,1.8,HOUSE.z+5.06);
 for(var c=-1;c<=1;c+=2)box(.6,9,.6,L(0x8d8fa3),HOUSE.x+c*2,4.5,HOUSE.z+6.4)})();

/* the graveyard gate, chained */
var gate={open:0,leaves:[]};
(function(){var gm=L(0x4a4a58),iron=L(0x16161d);
 box(1,5,1,gm,GATE.x-2.6,2.5,GATE.z);box(1,5,1,gm,GATE.x+2.6,2.5,GATE.z);
 box(6.4,.6,1,gm,GATE.x,5.2,GATE.z);
 for(var s=-1;s<=1;s+=2){var piv=new THREE.Group();piv.position.set(GATE.x+s*2.1,0,GATE.z);scene.add(piv);
  for(var i=0;i<6;i++)box(.1,4.2,.1,iron,-s*(.2+i*.34),2.1,0,piv);box(2.05,.12,.12,iron,-s*1.05,3.9,0,piv);box(2.05,.12,.12,iron,-s*1.05,.5,0,piv);
  piv.s=s;gate.leaves.push(piv)}
 gate.chain=box(1.1,.22,.22,B(0xc9c9d6),GATE.x,2.2,GATE.z+.12);
 gate.glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0x4dff7a,transparent:true,opacity:0,depthWrite:false,fog:false}));gate.glow.scale.set(16,16,1);gate.glow.position.set(GATE.x,2.6,GATE.z-1.5);scene.add(gate.glow);
 for(var k=0;k<5;k++)STAT.push(bx(.9,1.4,.25,0x6b6b78,GATE.x+rnd(-6,6),.7,GATE.z-rnd(5,12),{rz:rnd(-.15,.15)}));
 for(var f=-9;f<=9;f++){if(Math.abs(f)<2)continue;STAT.push(bx(.12,2.4,.12,0x16161d,GATE.x+f*1.3,1.2,GATE.z))}})();

 for(var i=0;i<WOLVES.length;i++){var w=WOLVES[i];if(!w.alive||w.wait>0)continue;var dx=w.x-ex,dz=w.z-ez,dist=Math.sqrt(dx*dx+dz*dz);if(dist>RANGE||dist<.01)continue;

function spread(){for(var i=0;i<WOLVES.length;i++){var a=WOLVES[i];if(!a.alive||a.wait>0||a.state)continue;for(var j=i+1;j<WOLVES.length;j++){var b=WOLVES[j];if(!b.alive||b.wait>0||b.state)continue;
  var dx=b.x-a.x,dz=b.z-a.z,m=(a.T.r+b.T.r)*.8,d2=dx*dx+dz*dz;if(d2<m*m&&d2>.0001){var d=Math.sqrt(d2),k=(m-d)/d*.5;if(a.t!=='boss'){a.x-=dx*k;a.z-=dz*k}if(b.t!=='boss'){b.x+=dx*k;b.z+=dz*k}}}}}
function wolfTick(dt){var frozen=S.freeze>0;if(!frozen)spread();
 for(var i=WOLVES.length-1;i>=0;i--){var w=WOLVES[i],g=w.g;
  if(!w.alive){w.dying-=dt;w.x+=w.kx*dt;w.z+=w.kz*dt;g.position.set(w.x,w.y+(.22-w.dying)*6,w.z);var s=(w.t==='boss'?1:w.T.sc)*(1+(.22-w.dying)*3);g.scale.setScalar(s);g.rotation.x-=dt*14;
   if(w.dying<=0){g.visible=false;WOLVES.splice(i,1);POOL[w.t].push(w)}continue}
  if(w.flash>0){w.flash-=dt;g.mat.emissive.setHex(w.flash>0?0xffffff:(S.freeze>0?FRZ:0))}
  if(w.wait>0){w.wait-=dt;g.position.set(w.x,0,w.z);g.rotation.y=Math.atan2(S.x-w.x,S.z-w.z);continue}
  var dx=S.x-w.x,dz=S.z-w.z,d=Math.sqrt(dx*dx+dz*dz)||1,ux=dx/d,uz=dz/d;
  if(w.t==='boss'&&w.state==='roof'){w.life+=dt;g.position.set(w.x,w.y,w.z);g.rotation.y=Math.atan2(ux,uz);g.legs[0].rotation.x=g.legs[2].rotation.x=-2.6+Math.sin(w.life*9)*.2;
   if(w.life>2.1){w.state='jump';w.life=0;w.jx=w.x;w.jz=w.z}continue}
  if(w.t==='boss'&&w.state==='jump'){w.life+=dt;var k=Math.min(1,w.life/.95),tz=-34;w.x=w.jx;w.z=w.jz+(tz-w.jz)*k;w.y=11.5*(1-k)+Math.sin(k*Math.PI)*5;g.position.set(w.x,w.y,w.z);
   if(k>=1){w.state='';w.y=0;boomFx(w.x,.4,w.z,5,0xb455ff);SND.boom();S.shake=.7}continue}
  if(w.stun>0){w.stun-=dt;w.vy=(w.vy||0)-22*dt;w.y=Math.max(0,w.y+w.vy*dt);g.position.set(w.x,w.y,w.z);g.rotation.z=w.t==='boss'?.5:1.45;if(w.stun<=0){g.rotation.z=0;w.y=0}continue}

    if(Math.random()<dt*.6)w.wob=-w.wob;var fl=Math.sqrt(fxv*fxv+fzv*fzv)||1;ux=fxv/fl;uz=fzv/fl;

   else{var side=Math.sin(w.ph+S.t*1.7)*.35*Math.min(1,d/10);var sx=ux-uz*side,sz=uz+ux*side,sl=Math.sqrt(sx*sx+sz*sz);ux=sx/sl;uz=sz/sl}

   else{g.legs[0].rotation.x=sw;g.legs[3].rotation.x=sw;g.legs[1].rotation.x=-sw;g.legs[2].rotation.x=-sw}

   for(var j=0;j<WOLVES.length;j++){var o=WOLVES[j];if(!o.alive)continue;var ox=o.x-S.x,oz=o.z-S.z,od=Math.sqrt(ox*ox+oz*oz)||1;if(od<6){o.kx=ox/od*24;o.kz=oz/od*24}}}
 }}

function reset(){for(var i=WOLVES.length-1;i>=0;i--){var w=WOLVES[i];w.g.visible=false;POOL[w.t].push(w)}WOLVES.length=0;

 S.t=0;S.left=ROUND;S.score=0;S.combo=1;S.ct=0;S.best=1;S.kills=0;S.cool=.3;S.x=0;S.z=9;S.yaw=0;S.pitch=0;S.grace=1.5;S.geyser=true;S.gt=0;S.pick=null;S.pt=0;S.freeze=0;

  S.bob+=il*dt*11;S.hop+=((hedgeH(S.x,S.z)?1.15:0)-S.hop)*Math.min(1,dt*10);

  if(TOUCH&&S.firing){var nb=null,na=.5;for(var q=0;q<WOLVES.length;q++){var W=WOLVES[q];if(!W.alive||W.wait>0)continue;var ax=W.x-S.x,az=W.z-S.z;if(ax*ax+az*az>RANGE*RANGE)continue;
    var df=Math.atan2(-ax,-az)-S.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<na){na=Math.abs(df);nb=df}}
   if(nb!==null)S.yaw+=nb*Math.min(1,dt*4)}

  if(S.pt>0){S.pt-=dt;if(S.pt<=0)S.pick=null}

 }else{wolfTick(dt);if(S.mode==='title'){S.yaw+=dt*.12;S.x=Math.sin(S.yaw)*14;S.z=Math.cos(S.yaw)*14}}
 /* camera, gun, fx */

}

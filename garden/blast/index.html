<style>

.wb.on{border-color:#ffd84a;background:rgba(255,216,74,.14)}.wb.on u{color:#ffd84a}
.wb.lock{opacity:.38}
.btn.small{font-size:16px;padding:12px 28px;background:transparent;color:#ffd84a;border:2px solid #ffd84a;box-shadow:none;margin-top:14px}

#boss b{display:block;height:12px;margin-top:5px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.5)}

.lab{font:700 12px Arial,sans-serif;letter-spacing:4px;color:#8fa0e6;margin-bottom:10px}

#end{display:none}
#newbest{display:none;margin-top:10px;font-size:20px;color:#7df9ff;letter-spacing:3px;animation:pulse .6s infinite}

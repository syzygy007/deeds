<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="blast-build" content="2.1">
<title>Wolf Blast</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#050814;color:#fff;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:46px;line-height:1;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 18px rgba(255,200,60,.55);color:#ffd84a}
#time{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;font-size:30px;text-shadow:0 2px 0 #000}
#time{color:#ff5a7a;letter-spacing:3px;font-size:28px}
#time.low{animation:pulse .5s infinite}
#obj{position:absolute;top:calc(50px + env(safe-area-inset-top));left:14px;font:700 12px Arial,sans-serif;letter-spacing:2px;color:#ffe9a8;text-shadow:0 1px 0 #000;display:flex;align-items:center;gap:8px}
#arr{font-style:normal;font-size:20px;display:inline-block;transition:opacity .3s}
#combo{line-height:48px;height:48px;position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(1);font-size:30px;color:#7df9ff;text-shadow:0 2px 0 #000,0 0 14px rgba(80,220,255,.8);opacity:0;transition:opacity .15s}
#cbar{position:absolute;top:calc(110px + env(safe-area-inset-top));left:50%;width:150px;height:6px;margin-left:-75px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;opacity:0}
#cbar i{display:block;height:100%;width:100%;background:#7df9ff;transform-origin:left}
#pick{position:absolute;top:calc(126px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:2px;padding:6px 14px;border-radius:20px;background:rgba(0,0,0,.55);border:2px solid #ffd84a;color:#ffd84a;display:none;white-space:nowrap}
#boss{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;width:min(60vw,420px);transform:translateX(-50%);display:none;text-align:center;font-size:13px;letter-spacing:3px}
#boss b{display:block;height:12px;margin-top:5px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.5)}
#boss b i{display:block;height:100%;background:linear-gradient(90deg,#b455ff,#ff4dd2);transform-origin:left}
#cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff}
#cross.hit{border-color:#ffd84a;transform:scale(1.35)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:44px;letter-spacing:1px;text-shadow:0 4px 0 #000,0 0 24px rgba(255,255,255,.4);opacity:0;transition:opacity .2s;padding:0 12px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,90,40,0) 45%,rgba(255,90,40,.7) 100%);opacity:0;transition:opacity .25s}
.fl{position:absolute;left:0;top:0;font-size:26px;color:#ffd84a;text-shadow:0 2px 0 #000;white-space:nowrap;will-change:transform,opacity;opacity:0}
.fl.big{font-size:40px;color:#fff}
.chip{position:fixed;pointer-events:auto;top:calc(12px + env(safe-area-inset-top));right:12px;font:700 12px Arial,sans-serif;letter-spacing:2px;padding:9px 13px;border-radius:20px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);color:#fff;z-index:30}
#snd{right:92px}
#stick{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none;z-index:20}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.4)}
#fire{position:fixed;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:4px solid #ffd84a;background:rgba(255,216,74,.22);color:#ffd84a;font-size:22px;letter-spacing:2px;display:none;z-index:20;align-items:center;justify-content:center}
#fire.on{background:rgba(255,216,74,.6);color:#000}
.card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:40;background:radial-gradient(ellipse at 50% 40%,rgba(20,30,70,.82),rgba(3,5,14,.96))}
.card h1{margin:0;font-size:min(19vw,150px);line-height:.86;letter-spacing:-2px;color:#fff;text-shadow:0 6px 0 #000}
.card h1 em{font-style:normal;color:#ffd84a}
.card h2{margin:0 0 6px;font-size:min(13vw,96px);line-height:.9;color:#ffd84a;text-shadow:0 5px 0 #000}
.card p{font:700 15px/1.5 Arial,sans-serif;letter-spacing:2px;color:#b9c4ff;margin:16px 0 0;max-width:520px}
.lab{font:700 12px Arial,sans-serif;letter-spacing:4px;color:#8fa0e6;margin-bottom:10px}
.btn{pointer-events:auto;margin-top:26px;font:900 26px "Arial Black",Arial,sans-serif;letter-spacing:2px;padding:18px 44px;border-radius:60px;border:0;background:#ffd84a;color:#141414;box-shadow:0 7px 0 #a67c00;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #a67c00}
.lnk{pointer-events:auto;margin-top:20px;font:700 13px Arial,sans-serif;letter-spacing:3px;color:#b9c4ff;text-decoration:none;border-bottom:1px solid rgba(185,196,255,.5);padding-bottom:3px;cursor:pointer}
.rows{margin-top:18px;font:700 14px Arial,sans-serif;letter-spacing:2px;color:#dfe5ff;min-width:270px}
.rows div{display:flex;justify-content:space-between;gap:30px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.rows b{color:#ffd84a}
#end{display:none}
#newbest{display:none;margin-top:10px;font-size:20px;color:#7df9ff;letter-spacing:3px;animation:pulse .6s infinite}
#err{position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;font:12px monospace;padding:6px;z-index:99;display:none}
@media(max-width:620px){#time{font-size:19px;letter-spacing:1px;top:calc(16px + env(safe-area-inset-top))}#obj{top:calc(44px + env(safe-area-inset-top));font-size:10px}#score{font-size:34px}#snd{right:12px;top:calc(52px + env(safe-area-inset-top))}#banner{font-size:32px}}
@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="vig"></div>
  <div id="time"></div>
  <div id="obj"><i id="arr">▲</i><span id="objt"></span></div>
  <div id="score">0</div>
  <div id="combo">×2</div>
  <div id="cbar"><i></i></div>
  <div id="pick"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="boss">THE WEREWOLF<b><i></i></b></div>
  <div id="floats"></div>
</div>
<div id="stick"><i></i></div>
<div id="fire">FIRE</div>
<div class="chip" id="leave">LEAVE</div>
<div class="chip" id="snd">SOUND ON</div>

<div class="card" id="title">
  <div class="lab">STAGE 1 · THE HOLLOW</div>
  <h1>WOLF<br><em>BLAST.</em></h1>
  <p id="how">60 SECONDS. BLAST EVERYTHING WITH EYES.</p>
  <button class="btn" id="play">PLAY</button>
  <a class="lnk" id="home1">BACK TO THE GARDEN</a>
</div>

<div class="card" id="end">
  <div class="lab" id="endlab">TIME.</div>
  <h2 id="endscore">0</h2>
  <div id="newbest">NEW BEST.</div>
  <div class="rows">
    <div><span>BLASTED</span><b id="r1">0</b></div>
    <div><span>BEST COMBO</span><b id="r2">×1</b></div>
    <div><span>TIME</span><b id="r3">0:00</b></div>
    <div><span>TIMES CAUGHT</span><b id="r5">0</b></div>
    <div><span>YOUR BEST</span><b id="r4">0</b></div>
  </div>
  <p id="endnote"></p>
  <button class="btn" id="again">RUN IT BACK</button>
  <a class="lnk" id="home2">BACK TO THE GARDEN</a>
</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){var b=document.getElementById('err');b.style.display='block';b.textContent=(e.message||'error')+' @'+(e.lineno||'')});
var QS=new URLSearchParams(location.search);
var TEST=QS.get('test')==='1';
var $=function(id){return document.getElementById(id)};
var TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var HOME='../world/?from=blast';
$('home1').href=HOME;$('home2').href=HOME;
$('how').textContent=TOUCH?'FOLLOW THE LIGHT UP THE HOLLOW. THREE PACKS ARE WAITING. LEFT THUMB RUNS, RIGHT THUMB AIMS AND FIRES.':'FOLLOW THE LIGHT UP THE HOLLOW. THREE PACKS ARE WAITING. WASD RUNS, MOUSE AIMS, CLICK OR SPACE FIRES.';

/* ---------- constants ---------- */
var EYE=1.65,SPEED=8.6,RANGE=30,CONE=0.2,COOL=0.36,COMBO_S=3,MAXW=40,HEARTS=5,PAR=300;
function rnd(a,b){return a+Math.random()*(b-a)}
function ss(t){t=t<0?0:t>1?1:t;return t*t*(3-2*t)}

/* ---------- the land: a hollow way that winds and climbs to the house ---------- */
function PX(z){return 26*Math.sin(z*.03)+9*Math.sin(z*.085+1)}
function pathH(z){return 24*ss((150-z)/300)+3.2*Math.sin(z*.1+.6)}
var CLR=[{z:88,r:16,n:'THE DRY FOUNTAIN'},{z:12,r:16,n:'THE STONES'},{z:-64,r:17,n:'THE BONFIRE'},{z:-138,r:20,n:'THE HOUSE'}];
CLR.forEach(function(c){c.x=PX(c.z);c.y=pathH(c.z)});
var START={x:PX(152),z:152};
function pathDist(x,z){var d=Math.abs(x-PX(z));for(var i=0;i<4;i++){var c=CLR[i],dc=Math.sqrt((x-c.x)*(x-c.x)+(z-c.z)*(z-c.z))-c.r;if(dc<d)d=dc<0?0:dc}return d}
function hAt(x,z){var d=pathDist(x,z),f=ss((d-3)/9);
 var base=pathH(z);for(var i=0;i<4;i++){var c=CLR[i],dc=Math.sqrt((x-c.x)*(x-c.x)+(z-c.z)*(z-c.z))-c.r,w=1-ss(dc/9);if(w>0)base=base*(1-w)+c.y*w}
 var hills=4.2*Math.sin(x*.05+1.3)*Math.cos(z*.043)+2.6*Math.sin(x*.093-z*.071+2)+1.6*Math.sin(z*.17+x*.06)+5.6;hills*=1.15;if(hills<3.2)hills=3.2;
 var ax=Math.abs(x)-80,wall=ax>0?ax*ax*.07:0,az=z>158?z-158:(z<-164?-164-z:0);wall+=az*az*.07;
 return base+f*hills+wall}
function clampWorld(o){if(o.x>82)o.x=82;if(o.x<-82)o.x=-82;if(o.z>158)o.z=158;if(o.z<-162)o.z=-162}
/* can you see it, or is there a hill in the way */
function los(x0,y0,z0,x1,y1,z1){for(var i=1;i<8;i++){var t=i/8;if(hAt(x0+(x1-x0)*t,z0+(z1-z0)*t)>y0+(y1-y0)*t+.25)return false}return true}

/* ---------- renderer ---------- */
var canvas=$('c');
var R=new THREE.WebGLRenderer({canvas:canvas,antialias:!TOUCH,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,TOUCH?1.5:2));
var scene=new THREE.Scene(),SKY=0x070c22;
scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,10,60);
var cam=new THREE.PerspectiveCamera(74,1,0.08,500);cam.rotation.order='YXZ';scene.add(cam);
function resize(){var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?86:74;cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0x6f86e8,0x0e1812,.62));
var moonL=new THREE.DirectionalLight(0xbfd0ff,.55);moonL.position.set(-40,60,-70);scene.add(moonL);
/* the torch on the gun: you only see well where you point */
var torch=new THREE.SpotLight(0xfff0cc,1.9,52,.5,.55,1.1);torch.position.set(.15,-.1,0);cam.add(torch);
var torchT=new THREE.Object3D();torchT.position.set(0,-.08,-1);cam.add(torchT);torch.target=torchT;

function L(c){return new THREE.MeshLambertMaterial({color:c})}
function B(c,o){var m=new THREE.MeshBasicMaterial({color:c});if(o){for(var k in o)m[k]=o[k]}return m}
function box(w,h,d,m,x,y,z,p){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x||0,y||0,z||0);(p||scene).add(o);return o}
var _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler();
function part(geo,col,x,y,z,rx,rz,s){return {g:geo,c:col,x:x||0,y:y||0,z:z||0,rx:rx||0,rz:rz||0,s:s||1}}
function bx(w,h,d,col,x,y,z,o){var p=part(new THREE.BoxGeometry(w,h,d),col,x,y,z);if(o)for(var k in o)p[k]=o[k];return p}
function merge(parts){var pos=[],nor=[],col=[],c=new THREE.Color();
 parts.forEach(function(p){var g=p.g.index?p.g.toNonIndexed():p.g.clone();_e.set(p.rx||0,p.ry||0,p.rz||0);_q.setFromEuler(_e);
  _m4.compose(new THREE.Vector3(p.x,p.y,p.z),_q,new THREE.Vector3(p.sx||p.s||1,p.sy||p.s||1,p.sz||p.s||1));g.applyMatrix4(_m4);
  var a=g.attributes.position.array,n=g.attributes.normal.array;c.set(p.c);for(var i=0;i<a.length;i+=3){pos.push(a[i],a[i+1],a[i+2]);nor.push(n[i],n[i+1],n[i+2]);col.push(c.r,c.g,c.b)}});
 var o=new THREE.BufferGeometry();o.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));o.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));o.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return o}
var STAT=[],GLOWS=[];
function canv(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c)}
var noiseT=canv(128,128,function(g,w,h){g.fillStyle='#c8c8c8';g.fillRect(0,0,w,h);for(var i=0;i<1800;i++){var v=150+Math.random()*105|0;g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(Math.random()*w,Math.random()*h,2,2+Math.random()*3)}});
noiseT.wrapS=noiseT.wrapT=THREE.RepeatWrapping;noiseT.repeat.set(68,121);
var dotT=canv(64,64,function(g){var r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.55,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
var glowT=canv(64,64,function(g){var r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
var beamT=canv(16,128,function(g){var r=g.createLinearGradient(0,0,0,128);r.addColorStop(0,'rgba(255,255,255,0)');r.addColorStop(.7,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,.9)');g.fillStyle=r;g.fillRect(3,0,10,128)});

/* the ground itself */
var GROUND=null,TREES=[];
(function(){var g=new THREE.PlaneGeometry(204,364,92,164);g.rotateX(-Math.PI/2);g.translate(0,0,-2);
 var p=g.attributes.position,col=new Float32Array(p.count*3);
 for(var i=0;i<p.count;i++){var x=p.getX(i),z=p.getZ(i),d=pathDist(x,z),k=ss((d-1.6)/2.6),j=.82+Math.random()*.3;
  p.setY(i,hAt(x,z));col[i*3]=(.50*(1-k)+.13*k)*j;col[i*3+1]=(.47*(1-k)+.30*k)*j;col[i*3+2]=(.56*(1-k)+.16*k)*j}
 g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
 GROUND=new THREE.Mesh(g,new THREE.MeshPhongMaterial({vertexColors:true,map:noiseT,shininess:0,specular:0x000000}));scene.add(GROUND)})();

/* moon and stars */
var moon=new THREE.Mesh(new THREE.SphereGeometry(15,24,16),B(0xf4f1dc,{fog:false}));moon.position.set(-60,120,-260);scene.add(moon);
var halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0x9fb4ff,fog:false,transparent:true,opacity:.5,depthWrite:false}));halo.scale.set(130,130,1);halo.position.copy(moon.position);scene.add(halo);
(function(){var n=500,p=new Float32Array(n*3);for(var i=0;i<n;i++){var a=Math.random()*6.283,e=rnd(.1,1.4),r=380;p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r}
var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false})))})();

/* the wood: thick everywhere but the hollow way and the clearings */
(function(){var N=950,tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,.48,3.4,6),L(0x2a1e18),N),
 cn=new THREE.InstancedMesh(new THREE.ConeGeometry(2.5,7.5,7),L(0x12301d),N),m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3(),n=0,guard=0;
 while(n<N&&guard++<20000){var x=rnd(-100,100),z=rnd(-182,176),d=pathDist(x,z);if(d<6.5)continue;if(d<16&&Math.random()<.55)continue;
  var k=rnd(.8,1.6),y=hAt(x,z);s.set(k,k,k);p.set(x,y+1.6*k,z);m.compose(p,q,s);tr.setMatrixAt(n,m);p.set(x,y+(3.2+3.5)*k,z);m.compose(p,q,s);cn.setMatrixAt(n,m);n++}
 tr.count=cn.count=n;scene.add(tr);scene.add(cn);TREES=[tr,cn]})();

/* lamps down the way: a few, far apart, flickering */
var LAMPS=[];
(function(){var i=0;for(var z=140;z>-122;z-=26,i++){var x=PX(z)+(i%2?3.6:-3.6),y=hAt(x,z);STAT.push(bx(.14,3.2,.14,0x15151c,x,y+1.6,z));
 var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xffc56a,transparent:true,opacity:.85,depthWrite:false}));s.scale.set(3.2,3.2,1);s.position.set(x,y+3.3,z);scene.add(s);LAMPS.push(s)}})();

/* the three clearings, each with its own thing in the middle, and a checkpoint lantern that lights when the pack is down */
var PROPS=[],LANT=[];
function barrel(x,z){var y=hAt(x,z),g=new THREE.Group();var b=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.3,12),L(0xd8342a));b.position.y=.65;g.add(b);
 var r=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.14,12),L(0xffd84a));r.position.y=.65;g.add(r);g.position.set(x,y,z);scene.add(g);PROPS.push({k:'barrel',g:g,x:x,z:z,y:y+.7,r:.8,on:true})}
function pumpkin(x,z){var y=hAt(x,z),g=new THREE.Group();var b=new THREE.Mesh(new THREE.SphereGeometry(.6,10,8),L(0xff8a1f));b.scale.y=.78;b.position.y=.48;g.add(b);
 box(.12,.25,.12,L(0x2a7437),0,1,0,g);var e=B(0xffe27a);box(.16,.14,.05,e,-.2,.58,.56,g);box(.16,.14,.05,e,.2,.58,.56,g);box(.4,.08,.05,e,0,.36,.58,g);
 g.position.set(x,y,z);scene.add(g);PROPS.push({k:'pumpkin',g:g,x:x,z:z,y:y+.5,r:.85,on:true})}
var bonf=null;
CLR.forEach(function(c,i){
 if(i<3){var lx=c.x+4,lz=c.z-2,ly=c.y;STAT.push(bx(.2,3.6,.2,0x15151c,lx,ly+1.8,lz),bx(.7,.12,.7,0x15151c,lx,ly+3.65,lz));

   if(w.t==='boss'){g.legs[0].rotation.x=sw;g.legs[2].rotation.x=-sw;g.legs[1].rotation.x=-sw*.8;g.legs[3].rotation.x=sw*.8;g.rotation.z=Math.sin(w.ph)*.06}
   else{g.legs[0].rotation.x=sw;g.legs[3].rotation.x=sw;g.legs[1].rotation.x=-sw;g.legs[2].rotation.x=-sw}
  }
  g.position.set(w.x,w.y,w.z);
  if(w.t!=='gold'&&!frozen&&d<w.T.r+.85&&S.grace<=0&&S.mode==='play'){S.grace=1.5;S.combo=1;S.ct=0;S.hp-=(w.t==='boss'?2:1);S.shake=.32;SND.bite();
   $('vig').style.opacity=1;setTimeout(function(){$('vig').style.opacity=0},220);
   for(var j=0;j<WOLVES.length;j++){var o=WOLVES[j];if(!o.alive)continue;var ox=o.x-S.x,oz=o.z-S.z,od=Math.sqrt(ox*ox+oz*oz)||1;if(od<6){o.kx=ox/od*22;o.kz=oz/od*22}}
   if(S.hp<=0)caught()}

 if(S.mode==='play')e.preventDefault()},{passive:false});
function tEnd(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===stickId){stickId=null;mv.x=mv.y=0;knob.style.transform=''}
  var l=lookId[t.identifier];if(l){if(l.f){S.firing=false;fireB.className=''}else if(l.m<12&&performance.now()-l.t0<260)S.tap=true;delete lookId[t.identifier]}}}

/* ---------- flow ---------- */
function reset(){for(var i=WOLVES.length-1;i>=0;i--){var w=WOLVES[i];w.g.visible=false;POOL[w.t].push(w)}WOLVES.length=0;

 S.t=0;S.score=0;S.combo=1;S.ct=0;S.best=1;S.kills=0;S.cool=.3;S.x=START.x;S.z=START.z;S.yaw=Math.atan2(-(PX(140)-START.x),12);S.pitch=0;S.grace=2;S.hp=HEARTS;S.deaths=0;S.stage=0;S.amb=null;S.cp={x:START.x,z:START.z};

$('play').onclick=start;$('again').onclick=start;
$('leave').onclick=function(){location.href=HOME};

/* ---------- the loop ---------- */
var last=0,camY=0;
function step(dt){
 if(S.slowT>0){S.slowT-=dt;if(S.slowT<=0)S.slow=1}
 var rdt=dt;dt*=S.slow;
 if(S.mode==='play'){
  S.t+=dt;
  var ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+mv.x,iy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0)+mv.y,il=Math.sqrt(ix*ix+iy*iy);
  if(il>1){ix/=il;iy/=il;il=1}
  var fx=-Math.sin(S.yaw),fz=-Math.cos(S.yaw),rx=Math.cos(S.yaw),rz=-Math.sin(S.yaw);
  var nx=S.x+(rx*ix-fx*iy)*SPEED*dt,nz=S.z+(rz*ix-fz*iy)*SPEED*dt;
  /* steep banks slow you: the hollow is the fast way, the ridge is the long way */
  var up=hAt(nx,nz)-hAt(S.x,S.z),run=Math.sqrt((nx-S.x)*(nx-S.x)+(nz-S.z)*(nz-S.z));if(run>0&&up/run>.55){var kk=Math.max(.3,1-(up/run-.55)*1.6);nx=S.x+(nx-S.x)*kk;nz=S.z+(nz-S.z)*kk}
  S.x=nx;S.z=nz;clampWorld(S);
  for(var ci=0;ci<3;ci++){var c=CLR[ci];if(c.solid){var cx=S.x-c.x,cz=S.z-c.z,cd=Math.sqrt(cx*cx+cz*cz);if(cd<c.solid+.6&&cd>0){S.x=c.x+cx/cd*(c.solid+.6);S.z=c.z+cz/cd*(c.solid+.6)}}}
  /* the pack holds you in the clearing until it is down */
  if(S.amb){var ac=CLR[S.amb.k],ax=S.x-ac.x,az=S.z-ac.z,ad=Math.sqrt(ax*ax+az*az);if(ad>ac.r+3){S.x=ac.x+ax/ad*(ac.r+3);S.z=ac.z+az/ad*(ac.r+3)}}
  S.bob+=il*dt*11;
  if(S.grace>0)S.grace-=dt;if(dragging>0)dragging-=dt;
  if(TOUCH){/* thumbs: the view follows the slope, and holding FIRE pulls the aim onto the nearest one you can see */
   if(dragging<=0){var sl=(hAt(S.x+fx*7,S.z+fz*7)-hAt(S.x,S.z))/7;S.pitch+=(Math.atan(sl)*.8-S.pitch)*Math.min(1,dt*2.5)}
   if(S.firing){var nb=null,na=.5;for(var q=0;q<WOLVES.length;q++){var W=WOLVES[q];if(!W.alive||W.state==='roof')continue;var wx=W.x-S.x,wz=W.z-S.z;if(wx*wx+wz*wz>RANGE*RANGE)continue;
     var df=Math.atan2(-wx,-wz)-S.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<na){na=Math.abs(df);nb=df}}
    if(nb!==null)S.yaw+=nb*Math.min(1,dt*4)}}
  if(S.cool>0)S.cool-=rdt;if(S.firing||S.tap){fire();S.tap=false}
  if(S.ct>0){S.ct-=dt;if(S.ct<=0)S.combo=1}
  if(S.pt>0){S.pt-=dt;if(S.pt<=0)S.pick=null}
  if(S.freeze>0){S.freeze-=dt;if(S.freeze<=0)WOLVES.forEach(function(w){w.g.mat.emissive.setHex(0)})}
  if(!S.bossDead)waves(dt);
  wolfTick(dt);
  if(S.hp<=2&&!S.bossDead){S.beat-=dt;if(S.beat<=0){S.beat=.85;thump()}}
  if(S.endT>0){S.endT-=rdt;if(S.endT<=0)finish()}
  else if(S.t>720)finish();
 }else{wolfTick(dt);if(S.mode==='title'){S.z-=dt*3;if(S.z<-110)S.z=150;S.x=PX(S.z);S.yaw=Math.atan2(-(PX(S.z-8)-S.x),8);S.pitch=.05}}
 S.y=hAt(S.x,S.z);camY+=(S.y-camY)*Math.min(1,rdt*12);if(Math.abs(S.y-camY)>4)camY=S.y;

 var sh=S.shake*S.shake*.5;

 if(S.recoil>0)S.recoil=Math.max(0,S.recoil-rdt*4.5);
 gun.position.set(GUN_AT.x+Math.cos(S.bob*.5)*.012,GUN_AT.y+Math.abs(Math.sin(S.bob*.5))*.014,GUN_AT.z+S.recoil*.16);gun.rotation.x=.02+S.recoil*.3;
 gun.visible=S.mode==='play';
 if(flash.material.opacity>0)flash.material.opacity=Math.max(0,flash.material.opacity-rdt*14);
 if(flashL.intensity>0)flashL.intensity=Math.max(0,flashL.intensity-rdt*30);
 for(var b=0;b<BOOMS.length;b++){var bm=BOOMS[b];if(bm.t>0){bm.t-=rdt;var k=1-bm.t/.38;bm.scale.setScalar(bm.r*(.3+k*.8));bm.material.opacity=(1-k)*.85;if(bm.t<=0)bm.visible=false}}
 if(gate.open>0&&gate.open<1){gate.open=Math.min(1,gate.open+rdt*.7);gate.leaves.forEach(function(l){l.rotation.y=l.s*gate.open*1.35});gate.glow.material.opacity=gate.open*.9}
 var tt=performance.now()*.001;for(var l=0;l<LAMPS.length;l++)LAMPS[l].material.opacity=.7+Math.sin(tt*9+l*2.3)*.14*(Math.sin(tt*1.3+l)>.5?2:1);
 if(bonf){var fk=.8+Math.sin(tt*11)*.12+Math.sin(tt*23)*.08;bonf.s.material.opacity=fk;bonf.l.intensity=1.6*fk;if(Math.random()<.3)puff(bonf.x+rnd(-.3,.3),bonf.y,bonf.z+rnd(-.3,.3),1,0xffb24a,.6,2.2,-1,.9)}
 var T=target();beacon.position.set(T.x,T.y+35,T.z);beacon.material.opacity=(S.amb||S.bossSpawned)?0:.42+Math.sin(tt*2)*.08;
 partTick(dt);floatTick(rdt);
 if(bannerT>0){bannerT-=rdt;if(bannerT<=0)$('banner').style.opacity=0}
 if(S.mode==='play')hud();

}

 else if(avg>.036&&Q.lvl===1){Q.lvl=2;GROUND.material=new THREE.MeshLambertMaterial({vertexColors:true,map:noiseT});TREES.forEach(function(t){t.count=Math.floor(t.count*.6)});R.setPixelRatio(.8);resize()}}

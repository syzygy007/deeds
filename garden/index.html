<style>
:root{--ivory:#F6F3EB;--paper:#EFE9DA;--ink:#15130E;--forest:#1F4B3A;--sage:#A0B0A4;--gold:#BE9A4E;--hair:rgba(21,19,14,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;-webkit-user-select:none;user-select:none;background:#3F6D35;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.micro{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
button{font:inherit;cursor:pointer}
/* the bar */
#bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:rgba(246,243,235,.96);border-bottom:1px solid var(--hair)}
#bar .mark{font-weight:800;letter-spacing:-.04em;font-size:1.1rem;white-space:nowrap;color:inherit;text-decoration:none}
#bar .mark b{color:var(--forest)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ivory);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.btn.quiet{border-color:var(--hair)}
.btn:disabled{opacity:.5;cursor:default}
#bar .back svg{width:13px;height:13px}
#bar .sp{flex:1}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;border:0;background:transparent;padding:4px 6px;color:inherit;text-align:right}
.stat b{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.stat .sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#6E6A5E;font-weight:700}
#bSack{border:1px solid var(--hair);border-radius:12px;padding:5px 10px}
#bSack:hover{border-color:var(--ink)}
@media(max-width:560px){#bar .mark{display:none}#bar .back span{display:none}}
/* the map */
#stage{position:fixed;inset:0;top:52px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#4B7B3E 0%,#3E6A33 60%,#2E5228 100%)}
#map{width:min(100vw,calc(100vh - 52px));height:min(100vw,calc(100vh - 52px));max-width:1100px;max-height:1100px;display:block}
.bed{cursor:pointer}
.bed .ring{fill:none;stroke:var(--gold);stroke-width:5;stroke-dasharray:9 7;opacity:0;pointer-events:none}
.bed.can .ring,.bed.thirsty .ring{opacity:.95}
.bed.thirsty .ring{stroke:#8CC5E8;stroke-dasharray:none;stroke-width:4}
.bed:hover .edge{stroke:#7EB86F}
.showcase .bed{cursor:default}
/* the floor: buttons and the sowing chip */
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:30;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}
#hud .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto}
#hud .col.r{align-items:flex-end}
#pick{position:fixed;z-index:31;display:none;gap:6px;background:var(--ivory);border:1px solid var(--forest);border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#pick.on{display:flex}
#pick .btn{padding:7px 12px;font-size:.62rem}
.note{width:40px;height:40px;border-radius:50%;border:1px solid var(--ivory);background:rgba(21,19,14,.45);color:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:18px}
.note.on{background:var(--ivory);color:var(--ink)}
/* toasts and sheets */
#status{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#status.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(21,19,14,.45);padding:0}
.sheet.on{display:flex}
.panel{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--ivory);border-radius:20px 20px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.35)}
@media(min-width:700px){.sheet{align-items:center;padding:20px}.panel{border-radius:20px;padding-bottom:16px}}
.panel h2{margin:2px 0 4px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.panel h2 span{color:var(--forest)}
.panel p{font-size:.95rem;line-height:1.5;margin:0 0 14px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sbal{white-space:nowrap;padding-top:6px;display:flex;align-items:center;gap:6px}
.sbal img{height:20px;width:auto}
.sbal.short{color:#B3412B}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.pk{border:1px solid var(--hair);border-radius:14px;padding:10px 8px 8px;text-align:center;background:#FBF9F3}
.pk.in{border-color:var(--forest);box-shadow:0 0 0 1px var(--forest) inset}
.pk.locked{opacity:.5}
.pk .art{width:100%;aspect-ratio:1;display:block;margin:0 auto 6px;position:relative}
.pk .art img{width:100%;height:100%;object-fit:contain;display:block}
.pk .art svg{position:absolute;inset:0;width:100%;height:100%;display:none}
.pk .art.drawn img{display:none}.pk .art.drawn svg{display:block}
.pk .nm{font-size:11px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.pk .pr{font-size:12px;color:#6E6A5E;margin:2px 0 6px}
.stp{display:flex;justify-content:center;align-items:center;gap:6px}
.stp button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:18px;line-height:1}
.stp b{min-width:22px;font-size:15px}
.sfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--hair);font-size:.9rem}
.srow .btn{padding:6px 10px;font-size:.62rem}
</style>
</head>
<body>
<div id="bar">
  <a class="btn back quiet" href="../" title="Back to DEEDS."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Back to DEEDS.</span></a>
  <a class="mark" href="../">DEEDS<b>.</b> THE GARDEN</a>
  <div class="sp"></div>
  <button class="stat" id="bSack" title="Your sack"><b id="hSack">0 Deedcoins · 0 seeds</b><span class="sub" id="hSackSub">Your sack · tap to buy</span></button>

<div id="stage"><svg id="map" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" aria-label="Your parterre, forty beds"></svg></div>
<div id="hud">
  <div class="col"><button class="btn primary" id="bDeed">Log a deed. +200</button><a class="btn" id="bWalk" href="world/">Walk in.</a><button class="btn quiet" id="bClear">Start over.</button></div>
  <div class="col r"><button class="note" id="bMute" title="Chimes">&#128276;</button><button class="note" id="bMusic" title="Music">&#9835;</button></div>
</div>
<button class="btn" id="whole">Whole garden.</button>
<div id="pick"></div>
<div id="status"></div>
<div id="store" class="sheet"><div class="panel">
  <div class="shead"><div><div class="micro">THE SEED STORE</div><h2>Seeds<span>.</span></h2></div><div class="sbal micro" id="stBal"></div></div>
  <div class="micro" id="stNote" style="opacity:.7"></div>
  <div class="grid" id="stGrid"></div>
  <div id="stSack"></div>
  <div class="sfoot"><button class="btn" id="stClose">Close.</button><button class="btn primary" id="stBuy">Checkout.</button></div>
</div></div>
<div id="short" class="sheet"><div class="panel"><h2>Not enough Deedcoins<span>.</span></h2><p id="shBody"></p><div class="sfoot"><button class="btn" id="shKeep">Keep shopping.</button><button class="btn primary" id="shDeed">Log a deed.</button></div></div></div>
<div id="confirm" class="sheet"><div class="panel"><h2>Start over<span>?</span></h2><p>Every plant goes back in the sack as a seed, so you can plant it your way. Your Deedcoins stay where they are.</p><div class="sfoot"><button class="btn" id="cNo">Keep it.</button><button class="btn primary" id="cYes">Start over.</button></div></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const QS=new URLSearchParams(location.search);
const BLOOM=QS.get('bloom')==='1';
const TESTING=false;                                  /* signed out demo watering: once a day, like live */
const SB_URL='https://helqqdygwaihrliglbvw.supabase.co',SB_KEY='sb_publishable_CHuCkjbmFzvDIAgrbwoyhA_R-8T-DHA';
let sb=null,LIVE=false,ADMIN=false,ME=null,HYDRATED=false,BUSY=false;
const APP='../';
const freeWater=()=>LIVE?ADMIN:TESTING;
function rpcFail(e,fallback){const m=String(e&&e.message||e||'');return /not find|function|schema cache/i.test(m)?'Run patch 42 on DEEDS first.':/sign in/i.test(m)?'Sign in on DEEDS first.':(fallback||('Not done: '+m))}
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
let toastT;function toast(m){const t=$('#status');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000)}
const store={g:{},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this.g[k]=v}},get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):this.g[k]}catch(e){return this.g[k]}}};

/* ---------- catalogue: the game's names, prices and tiers; garden_state may hand down others ---------- */
const CAT={
 rose:{n:'Rose',p:'Roses',img:'rose',price:30,tier:0,c:['#E8798F','#F6C1CB']},
 lavender:{n:'Lavender',p:'Lavender',img:'lavender',price:20,tier:0,c:['#8E7CC3','#B9A9E0']},
 hydrangea:{n:'Hydrangea',p:'Hydrangeas',img:'hydrangea',price:35,tier:0,c:['#7FA6D9','#E3B7D6']},
 peony:{n:'Peony',p:'Peonies',img:'peony',price:50,tier:0,c:['#F19AB0','#F9D8E0']},
 tulip:{n:'Tulip',p:'Tulips',img:'tulip',price:20,tier:0,c:['#E8533B','#F4C244']},
 daffodil:{n:'Daffodil',p:'Daffodils',img:'daffodil',price:15,tier:0,c:['#F3D24B','#F7EBA0']},
 delphinium:{n:'Delphinium',p:'Delphiniums',img:'delphinium',price:25,tier:0,c:['#4C6FD0','#8FA6E6']},
 cosmos:{n:'Cosmos',p:'Cosmos',img:'cosmos',price:10,tier:0,c:['#EE7FB1','#F9F2E6']},
 hyacinth:{n:'Hyacinth',p:'Hyacinths',img:'hyacinth',price:40,tier:1,c:['#7C6FD6','#E6A3C2']}};
const FLOWERS=Object.keys(CAT);
const TIERS=[0,10,50,100];
const tierOf=d=>{let t=0;TIERS.forEach((x,i)=>{if(d>=x)t=i});return t};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

/* ---------- state: the same save the walk and the profile door read ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const DEED_PAY=200,START_COINS=100;
const fresh=()=>({deeds:0,coins:START_COINS,sack:{},bank:0,plants:{},pads:{},flags:{},ledger:[{t:Date.now(),l:'Starter coins',w:'the purse opens',a:START_COINS}],earned:0,sent:0,gifts:[]});
let S=store.get('garden')||null;
if(!S||typeof S!=='object')S=fresh();
if(S.daily!==undefined||S.water!==undefined||S.grewOn!==undefined)S=fresh();
if(S.coins===undefined){S.coins=(S.bank||0)*50;S.sack={}}
if(!S.sack)S.sack={};if(!S.plants)S.plants={};if(!S.flags)S.flags={};if(!S.pads)S.pads={};if(!S.ledger)S.ledger=[];
if(S.earned===undefined)S.earned=S.deeds*DEED_PAY;if(S.sent===undefined)S.sent=0;if(!S.gifts)S.gifts=[];
function ledger(l,a,w,u){S.ledger.unshift({t:Date.now(),l,a,w:w||'',u:u||''});if(S.ledger.length>60)S.ledger.length=60}
const sackTotal=()=>Object.values(S.sack).reduce((a,b)=>a+b,0);
function save(){S.bank=sackTotal();store.set('garden',S)}
const thirsty=()=>Object.entries(S.plants).filter(([k,p])=>(p.g||0)<2&&!p.pending&&(freeWater()||p.wd!==today())).map(([k])=>+k);

/* ---------- the sounds: one family, synthesized in the browser. ticks for actions, bells for confirmations,
   cascades for rewards that grow with the win. voice limited, under the music, muted with one tap (remembered). ---------- */
const SND=(()=>{
  let AC=null,BUS=null,NOISE=null,MUTE=false;try{MUTE=localStorage.getItem('garden_mute')==='1'}catch(e){}
  const ctx=()=>{if(MUTE)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});
    if(!BUS){BUS=AC.createGain();BUS.gain.value=0.85;const c=AC.createDynamicsCompressor();c.threshold.value=-16;c.knee.value=12;c.ratio.value=4;c.attack.value=0.003;c.release.value=0.2;BUS.connect(c);c.connect(AC.destination)}return AC};
  const noise=a=>{if(NOISE)return NOISE;const n=a.sampleRate,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NOISE=b;return b};
  const LAST={};const gate=(k,ms)=>{const t=performance.now();if(LAST[k]&&t-LAST[k]<ms)return false;LAST[k]=t;return true};
  function tone(f,t0,dur,gain,type,f1){const a=ctx();if(!a)return;const T=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,T);if(f1)o.frequency.exponentialRampToValueAtTime(f1,T+dur);
    g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(gain,T+0.006);g.gain.exponentialRampToValueAtTime(0.0001,T+dur);o.connect(g);g.connect(BUS);o.start(T);o.stop(T+dur+0.05)}
  /* a bell: four inharmonic partials, the high ones dying first */
  function bell(f,t0,dur,gain){const a=ctx();if(!a)return;const T=a.currentTime+(t0||0);
    [[1,1],[2.76,0.45],[5.4,0.2],[8.93,0.08]].forEach(([m,w])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*m;
      g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(gain*w,T+0.005);g.gain.exponentialRampToValueAtTime(0.0001,T+dur/(1+m*0.3));o.connect(g);g.connect(BUS);o.start(T);o.stop(T+dur+0.1)})}
  /* a run of bells up a pentatonic scale, the count set by the size of the win */
  const PENTA=[0,2,4,7,9];
  function cascade(n,base,gain,step,down){n=Math.max(1,Math.min(16,n|0));for(let i=0;i<n;i++){const k=down?n-1-i:i;const semi=PENTA[k%5]+12*Math.floor(k/5);bell(base*Math.pow(2,semi/12),i*(step||0.07),0.8,gain*(0.65+0.35*i/n))}}
  function chord(fs,t0,dur,gain){fs.forEach((f,i)=>bell(f,(t0||0)+i*0.01,dur,gain))}
  function puff(t0,dur,gain,lo,hi,q){const a=ctx();if(!a)return;const T=a.currentTime+(t0||0),s=a.createBufferSource();s.buffer=noise(a);const f=a.createBiquadFilter();f.type=lo?'bandpass':'lowpass';f.frequency.value=hi||1800;f.Q.value=q||0.7;
    const g=a.createGain();g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(gain,T+0.01);g.gain.exponentialRampToValueAtTime(0.0001,T+dur);s.connect(f);f.connect(g);g.connect(BUS);s.start(T);s.stop(T+dur+0.05)}
  const vibe=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
  /* the iPhone silent switch mutes everything the sound engine makes unless the page is also playing a media track;
     a silent loop through a media element, made here in code, keeps the chimes audible with the music off. Off with the chimes. */
  let KEEP=null;
  function silentWav(){const rate=8000,n=800,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
  function keepAlive(on){try{if(on){if(MUTE)return;if(!KEEP){KEEP=new Audio(silentWav());KEEP.loop=true;KEEP.volume=0.01;KEEP.setAttribute('playsinline','')}KEEP.play().catch(()=>{})}else if(KEEP){KEEP.pause()}}catch(e){}}
  let combo=0,comboT=0;
  return{
    muted:()=>MUTE,
    setMute(v){MUTE=!!v;try{localStorage.setItem('garden_mute',v?'1':'0')}catch(e){}if(!v){ctx();keepAlive(true)}else keepAlive(false)},
    unlock(){ctx();keepAlive(true)},
    /* small */
    tickUp(i){if(!gate('tick',40))return;tone(740*Math.pow(2,((i||0)%10)/12),0,0.07,0.07,'triangle')},
    tickDown(){if(!gate('tick',40))return;tone(520,0,0.07,0.06,'triangle')},
    rustle(){puff(0,0.14,0.05,false,2600,0.5)},
    sow(){const t=performance.now();combo=t-comboT<2500?combo+1:0;comboT=t;puff(0,0.09,0.09,false,600,0.8);tone(160,0,0.08,0.08,'sine',90);tone(880*Math.pow(2,PENTA[combo%5]/12+Math.floor(combo/5)),0.04,0.12,0.06,'triangle');vibe(10)},
    lastSeed(){bell(1046.5,0,0.5,0.09);bell(1318.5,0.1,0.6,0.08)},
    splash(){puff(0,0.4,0.16,true,2200,0.6)},
    knock(){if(!gate('knock',120))return;puff(0,0.06,0.06,false,900,1);tone(190,0,0.09,0.07,'sine',120)},
    nope(){tone(260,0,0.14,0.07,'triangle',200);tone(196,0.12,0.18,0.07,'triangle',150)},
    chip(){if(!gate('chip',60))return;puff(0,0.05,0.14,true,3400,1.4);tone(1480,0,0.045,0.05,'square');tone(3100,0.01,0.03,0.03,'square')},
    carved(){cascade(7,659.3,0.1,0.075);chord([1318.5,1568,2093],0.55,1.3,0.07);vibe([15,40,15])},
    /* medium */
    open(){bell(1046.5,0,0.35,0.05)},
    hello(){bell(880,0,0.45,0.07);bell(1174.7,0.13,0.55,0.07)},
    clink(){bell(1568,0,0.3,0.08);bell(2093,0.05,0.25,0.04)},
    grow(){bell(784,0,0.5,0.08);bell(987.8,0.12,0.6,0.08)},
    buy(n){cascade(Math.min(12,(n|0)+1),659.3,0.09,0.065);vibe(15)},
    /* big */
    bloom(){cascade(6,523.3,0.1,0.08);chord([1046.5,1318.5,1568],0.5,1.2,0.07)},
    allWatered(){cascade(8,659.3,0.09,0.07);chord([1318.5,1568,1975.5],0.6,1.1,0.06)},
    deed(){cascade(12,523.3,0.11,0.06);chord([1046.5,1318.5,1568,2093],0.8,1.6,0.08);vibe([15,40,15])},
    tier(){chord([523.3,659.3,784],0,0.9,0.09);cascade(10,784,0.1,0.06);chord([1046.5,1318.5,1568,2093],0.7,1.5,0.09);vibe([20,60,20])},
    allPlanted(){cascade(16,523.3,0.1,0.06);chord([1046.5,1318.5,1568,2093,2637],1.1,1.8,0.09);vibe([20,60,20,60,20])},
    undo(n){cascade(Math.min(12,(n|0)+1),1318.5,0.07,0.06,true)}
  }})();

  {k:'e',cx:80,cy:80,rx:58,ry:40},{k:'t',cx:198,cy:76,s:66,rot:0},{k:'c',cx:312,cy:78,r:40},
  {k:'e',cx:100,cy:198,rx:86,ry:46},{k:'c',cx:222,cy:192,r:34},{k:'e',cx:320,cy:204,rx:44,ry:74},
  {k:'e',cx:62,cy:314,rx:34,ry:52},{k:'c',cx:162,cy:320,r:46},{k:'t',cx:268,cy:318,s:70,rot:180},{k:'c',cx:336,cy:326,r:28}];
const QT=[[140,140,.825,.825],[860,140,-.825,.825],[140,860,.825,-.825],[860,860,-.825,-.825]];
function tri(cx,cy,s,rot){const V=[0,1,2].map(i=>{const a=(-90+120*i+rot)*Math.PI/180;return[cx+s*Math.cos(a),cy+s*Math.sin(a)]});const k=.38;const p=[];for(let i=0;i<3;i++){const v=V[i],pr=V[(i+2)%3],nx=V[(i+1)%3];p.push({b:[v[0]+(pr[0]-v[0])*k,v[1]+(pr[1]-v[1])*k],v,a:[v[0]+(nx[0]-v[0])*k,v[1]+(nx[1]-v[1])*k]})}let d='M'+p[0].a;for(let i=1;i<=3;i++){const q=p[i%3];d+=' L'+q.b+' Q'+q.v+' '+q.a}return d+'Z'}
function shape(b){if(b.k==='c')return `M${b.cx-b.r},${b.cy} a${b.r},${b.r} 0 1,0 ${2*b.r},0 a${b.r},${b.r} 0 1,0 ${-2*b.r},0Z`;if(b.k==='e')return `M${b.cx-b.rx},${b.cy} a${b.rx},${b.ry} 0 1,0 ${2*b.rx},0 a${b.rx},${b.ry} 0 1,0 ${-2*b.rx},0Z`;return tri(b.cx,b.cy,b.s,b.rot)}
/* a bed's centre and size in map units, for the plants */
const bedInfo=plot=>{const q=Math.floor(plot/10),b=BEDS[plot%10];const [tx,ty,sx,sy]=QT[q];const rx=(b.k==='c'?b.r:b.k==='e'?b.rx:b.s*.62)*.825,ry=(b.k==='c'?b.r:b.k==='e'?b.ry:b.s*.62)*.825;return{cx:tx+b.cx*sx,cy:ty+b.cy*sy,rx,ry}};

function defs(){return `<defs>

  <radialGradient id="water" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#BFE0EC"/><stop offset=".55" stop-color="#5FA3BF"/><stop offset="1" stop-color="#2E6B86"/></radialGradient>
  <radialGradient id="stone" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#EDE6D3"/><stop offset="1" stop-color="#B9AF98"/></radialGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".28"/></filter>
</defs>`}
function parterre(){
  const hedgeD='M12,0 H388 A12,12 0 0 1 400,12 V290 A110,110 0 0 1 290,400 H12 A12,12 0 0 1 0,388 V12 A12,12 0 0 1 12,0Z';

    BEDS.forEach((b,i)=>{const plot=q*10+i,d=shape(b);
      beds+=`<g class="bed" data-plot="${plot}"><path d="${d}" fill="url(#soil)" stroke="#2E5533" stroke-width="11" filter="url(#sh)"/><path d="${d}" fill="none" stroke="#4B7A45" stroke-width="7" class="edge"/><path d="${d}" fill="none" stroke="#7DAA6E" stroke-width="2" opacity=".55"/><path d="${d}" class="wet" fill="#1A1008" opacity="0"/><path d="${d}" class="ring"/></g>`});

  <rect x="485" y="0" width="30" height="1000" fill="url(#grav)"/>

  <g fill="url(#stone)" stroke="#9E937B" stroke-width="2" filter="url(#sh)"><rect x="78" y="78" width="44" height="44" rx="3"/><rect x="878" y="78" width="44" height="44" rx="3"/><rect x="78" y="878" width="44" height="44" rx="3"/><rect x="878" y="878" width="44" height="44" rx="3"/></g>
  ${beds}
  <g><circle cx="500" cy="500" r="72" fill="none" stroke="#2E5533" stroke-width="13" filter="url(#sh)"/><circle cx="500" cy="500" r="72" fill="none" stroke="url(#hedge)" stroke-width="10"/><circle cx="500" cy="500" r="58" fill="url(#grav)"/>
   <circle cx="500" cy="500" r="46" fill="url(#stone)" stroke="#9E937B" stroke-width="2" filter="url(#sh)"/><circle cx="500" cy="500" r="38" fill="url(#water)"/><circle cx="500" cy="500" r="11" fill="url(#stone)" stroke="#9E937B"/><g id="jet" fill="#EAF6FB" opacity=".9"></g></g>
  <g id="plants"></g>`}
$('#map').innerHTML=defs()+parterre();
/* the jet: a few drops that rise and fall */
{const g=$('#jet');let s='';for(let i=0;i<9;i++)s+=`<circle cx="500" cy="500" r="${1.6+(i%3)}" data-i="${i}"/>`;g.innerHTML=s;
 const drops=Array.from(g.children);const step=()=>{const t=performance.now()/1000;drops.forEach((c,i)=>{const u=(t*0.9+i*0.17)%1.6;const a=i*0.7;c.setAttribute('cx',(500+Math.cos(a)*u*10).toFixed(1));c.setAttribute('cy',(500-(u*22-u*u*14)).toFixed(1))});requestAnimationFrame(step)};requestAnimationFrame(step)}

/* the plants: seeds, tufts and blooms drawn from the state */
function plantSVG(plot,p){const {cx,cy,rx,ry}=bedInfo(plot);const r=rng(900+plot);const g=Math.min(2,p.g||0);let s='';
  const in_=(k)=>{const a=r()*6.283,d=Math.sqrt(r())*k;return[cx+Math.cos(a)*d*rx*0.62,cy+Math.sin(a)*d*ry*0.62]};
  if(g===0){for(let i=0;i<9;i++){const [x,y]=in_(1);s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4" ry="2.5" transform="rotate(${(r()*180)|0} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#E9DCC2" stroke="#8E7A52" stroke-width=".8"/>`}return s}
  const leaves=g===2?12:7,lk=g===2?1:0.75;
  for(let i=0;i<leaves;i++){const [x,y]=in_(lk);const rr=(g===2?9:6)+r()*4;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rr.toFixed(1)}" ry="${(rr*0.6).toFixed(1)}" transform="rotate(${(r()*180)|0} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${r()>.5?'#3F7A3A':'#5A9450'}"/>`}
  if(g===2){const c=CAT[p.t].c;for(let i=0;i<15;i++){const [x,y]=in_(0.98);const rr=5+r()*4;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="${r()>.4?c[0]:c[1]}"/><circle cx="${(x-rr*0.3).toFixed(1)}" cy="${(y-rr*0.3).toFixed(1)}" r="${(rr*0.35).toFixed(1)}" fill="rgba(255,255,255,.35)"/>`}}
  return s}

let SOW=null;try{SOW=localStorage.getItem('garden_sow')||null}catch(e){}
function nextKind(){if(SOW&&S.sack[SOW]>0)return SOW;const alt=FLOWERS.find(t=>S.sack[t]>0)||null;setSow(alt);return alt}
function setSow(id){SOW=id;try{if(id)localStorage.setItem('garden_sow',id);else localStorage.removeItem('garden_sow')}catch(e){}renderHud();renderPlants()}
function sowAt(plot,id){id=id||nextKind();const c=CAT[id];if(!c)return;if(S.plants[plot]){SND.knock();toast('Bed '+(plot+1)+' is taken.');return}
  if(!(S.sack[id]>0)){SND.knock();toast('No '+c.n.toLowerCase()+' seeds left.');return}
  if(LIVE){S.plants[plot]={t:id,g:0,pending:1};sb.rpc('garden_sow',{p_plot:plot,p_type:id}).then(r=>{if(r.error){delete S.plants[plot];S.sack[id]=(S.sack[id]||0)+1;save();renderPlants();renderHud();toast(rpcFail(r.error,'That bed did not take the seed.'));return}if(S.plants[plot])delete S.plants[plot].pending;save();renderPlants()}).catch(()=>{delete S.plants[plot];S.sack[id]=(S.sack[id]||0)+1;save();renderPlants();renderHud()})}
  else S.plants[plot]={t:id,g:0};
  S.sack[id]--;if(!S.sack[id])delete S.sack[id];save();SND.sow();
  if(Object.keys(S.plants).length>=40)setTimeout(()=>SND.allPlanted(),300);
  const left=S.sack[id]||0;
  if(left){setSow(id);toast('Sowed '+c.n.toLowerCase()+' in bed '+(plot+1)+' \u00B7 '+plural(left,'seed')+' left.')}
  else{const alt=FLOWERS.find(t=>S.sack[t]>0)||null;setSow(alt);setTimeout(()=>SND.lastSeed(),140);
    toast('Sowed '+c.n.toLowerCase()+' in bed '+(plot+1)+' \u00B7 that was the last '+c.n.toLowerCase()+' seed.'+(alt?' Next: '+CAT[alt].n.toLowerCase()+'.':' Log a deed for more.'))}}

/* ---------- watering: tap a planted bed, once a day ---------- */
function waterAt(plot){const p=S.plants[plot];if(!p||p.pending)return;const k=today();
  if((p.g||0)>=2){SND.knock();toast('Bed '+(plot+1)+' · '+CAT[p.t].p+' in bloom.');return}
  if(!freeWater()&&p.wd===k){SND.knock();toast('Bed '+(plot+1)+' was watered today. Come back tomorrow.');return}
  SND.splash();
  if(LIVE){const g0=p.g||0,wd0=p.wd;sb.rpc('garden_water',{p_plot:plot,p_day:k}).then(r=>{const d=r.data;
    if(r.error||!d||!d.ok){if(r.error)toast(rpcFail(r.error,'The water did not reach bed '+(plot+1)+'.'));if(d&&d.reason==='watered'){p.wd=k;save();renderPlants()}else if(r.error){p.g=g0;p.wd=wd0;save();renderPlants()}return}
    p.g=+d.g;p.wd=k;save();renderPlants()}).catch(()=>{})}
  p.g=Math.min(2,(p.g||0)+1);p.wd=k;save();renderPlants();
  const left=thirsty().length;
  setTimeout(()=>{if(p.g>=2)SND.bloom();else SND.grow();if(!left&&Object.keys(S.plants).length)setTimeout(()=>SND.allWatered(),700)},220);
  toast(p.g>=2?'In bloom. '+CAT[p.t].p+' in bed '+(plot+1)+'.'+(left?' '+left+' still thirsty.':''):'Watered. Bed '+(plot+1)+' is growing.'+(left?' '+left+' still thirsty.':' Come back tomorrow.'))}

/* on a phone the whole parterre is small, so a tap on a quadrant zooms to it; the pill or the fountain zooms back out */
const NARROW=()=>innerWidth<700;
const VB={whole:'90 90 820 820',q:[[92,92,420,420],[488,92,420,420],[92,488,420,420],[488,488,420,420]]};
let ZOOM=-1;
function setView(){const m=$('#map');if(!NARROW()){m.setAttribute('viewBox','0 0 1000 1000');$('#whole').classList.remove('on');return}
  m.setAttribute('viewBox',ZOOM<0?VB.whole:VB.q[ZOOM].join(' '));$('#whole').classList.toggle('on',ZOOM>=0)}
function quadrantAt(e){const m=$('#map'),r=m.getBoundingClientRect(),vb=m.getAttribute('viewBox').split(' ').map(Number);
  const x=vb[0]+(e.clientX-r.left)/r.width*vb[2],y=vb[1]+(e.clientY-r.top)/r.height*vb[3];
  if(Math.hypot(x-500,y-500)<90)return-1;if(x<100||x>900||y<100||y>900)return-2;return(x<500?0:1)+(y<500?0:2)}
$('#whole').onclick=()=>{ZOOM=-1;setView()};
addEventListener('resize',setView);setView();
/* a tap on a bed does the one thing that makes sense there */
$('#map').addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.bed');
  if(!el){if(!NARROW())return;const q=quadrantAt(e);if(q===-1){ZOOM=-1;setView()}else if(q>=0&&ZOOM<0){ZOOM=q;setView()}return}
  if(BLOOM)return;const plot=+el.dataset.plot;
  if(S.plants[plot]){waterAt(plot);return}
  const kinds=FLOWERS.filter(t=>S.sack[t]>0);
  if(!kinds.length){openStore();toast('Bed '+(plot+1)+' is empty. Buy a seed for it.');return}
  if(kinds.length>1&&!(SOW&&S.sack[SOW]>0)){askKind(plot,e.clientX,e.clientY);return}
  sowAt(plot,nextKind())});

/* ---------- deeds, start over, the walk ---------- */
$('#bDeed').onclick=()=>{if(LIVE){location.href=APP+'?log=1';return}
  const t0=tierOf(S.deeds);S.deeds++;S.coins+=DEED_PAY;S.earned+=DEED_PAY;ledger('Deed '+S.deeds,DEED_PAY,'earned');save();renderHud();if(STORE_ON)renderStore();SND.deed();if(tierOf(S.deeds)>t0)setTimeout(()=>SND.tier(),1400);toast('Deed '+S.deeds+'. '+DEED_PAY+' Deedcoins. Sign in on DEEDS to log real ones.')};
function clearLocal(){let back=0;Object.values(S.plants).forEach(p=>{S.sack[p.t]=(S.sack[p.t]||0)+1;back++});S.plants={};nextKind();save();renderPlants();renderHud();SND.undo(back);return back}
$('#bClear').onclick=()=>{if(BLOOM)return;if(!Object.keys(S.plants).length){toast('Nothing planted yet.');return}$('#confirm').classList.add('on')};
$('#cNo').onclick=()=>$('#confirm').classList.remove('on');
$('#confirm').addEventListener('click',e=>{if(e.target===e.currentTarget)$('#confirm').classList.remove('on')});
$('#cYes').onclick=()=>{$('#confirm').classList.remove('on');
  if(LIVE){if(BUSY)return;BUSY=true;sb.rpc('garden_clear').then(r=>{BUSY=false;if(r.error){toast(rpcFail(r.error,'The garden did not clear.'));return}const back=clearLocal();toast(back+(back===1?' seed is':' seeds are')+' back in the sack. Plant it your way.')}).catch(()=>{BUSY=false;toast('The garden did not answer.')});return}
  const back=clearLocal();toast(back+(back===1?' seed is':' seeds are')+' back in the sack. Plant it your way.')};
if(BLOOM){$('#bWalk').href='world/?bloom=1'}

/* ---------- music: his six tracks, The Seed Theme first ---------- */
const PLAYLIST=['garden-music-1.mp3','garden-music-2.mp3','garden-music-3.mp3','garden-music-4.mp3','garden-music-5.mp3','garden-music-6.mp3'];
let MTRACK=0,MFAILS=0;const AU=new Audio();AU.volume=.35;
function mPlay(){AU.src=PLAYLIST[MTRACK];AU.play().catch(()=>{})}
AU.addEventListener('ended',()=>{MTRACK=(MTRACK+1)%PLAYLIST.length;mPlay()});
AU.addEventListener('error',()=>{if(++MFAILS<PLAYLIST.length){MTRACK=(MTRACK+1)%PLAYLIST.length;mPlay()}else{$('#bMusic').classList.remove('on')}});
$('#bMusic').onclick=()=>{if(AU.paused){if(!AU.src)mPlay();else AU.play().catch(()=>{});$('#bMusic').classList.add('on')}else{AU.pause();$('#bMusic').classList.remove('on')}};

/* the chimes switch, remembered across the map and the walk */
function paintMute(){$('#bMute').classList.toggle('on',!SND.muted());$('#bMute').innerHTML=SND.muted()?'&#128277;':'&#128276;'}
$('#bMute').onclick=()=>{SND.setMute(!SND.muted());paintMute();if(!SND.muted())SND.open()};paintMute();
/* ---------- live: the same server as the walk ---------- */
const KINDW={starter:'the purse opens',deed:'earned',buy:'seed store',sell:'seed store',send:'sent',receive:'a gift',return:'unopened',adjust:''};
function hydrate(d){LIVE=true;ADMIN=!!d.admin;
  (d.catalog||[]).forEach(c=>{if(CAT[c.t]){CAT[c.t].price=+c.price;CAT[c.t].tier=Math.max(0,TIERS.indexOf(+c.min_deeds))}});
  S.coins=+d.balance||0;S.earned=+d.earned||0;S.sent=+d.sent||0;S.deeds=+d.deeds||0;S.sack={};Object.entries(d.sack||{}).forEach(([t,q])=>{if(q>0)S.sack[t]=+q});
  S.plants={};(d.plots||[]).forEach(p=>{if(CAT[p.t])S.plants[p.plot]={t:p.t,g:+p.g||0,wd:p.wd||undefined}});
  S.ledger=(d.ledger||[]).map(l=>({t:l.at?new Date(l.at).getTime():Date.now(),l:l.note||l.kind,a:+l.amount||0,w:KINDW[l.kind]||l.kind||''}));
  HYDRATED=true;save();nextKind();renderPlants();renderHud();if(STORE_ON)renderStore()}
function goLive(){try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){return}
  sb.auth.getSession().then(r=>{const s=r.data&&r.data.session;if(!s)return;ME=s.user.id;
    return sb.rpc('garden_state').then(r2=>{if(r2.error){toast(rpcFail(r2.error,'The garden could not load your sack.'));return}hydrate(r2.data||{});
      try{sb.channel('garden-wallet-'+ME).on('postgres_changes',{event:'UPDATE',schema:'public',table:'coin_wallets',filter:'profile_id=eq.'+ME},pl=>{const w=pl&&pl.new;if(!w)return;S.coins=+w.balance;S.earned=+w.earned;S.sent=+w.sent;save();renderHud();if(STORE_ON)renderStore()}).subscribe()}catch(e){}})}).catch(()=>{})}
if(!BLOOM){const c=document.createElement('script');c.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';c.onload=goLive;c.onerror=()=>{};document.head.appendChild(c)}

/* boot */
renderPlants();renderHud();
if(BLOOM)toast('The parterre in bloom. Walk in to see it up close.');
else if(!S.flags.hello){S.flags.hello=1;save();setTimeout(()=>toast(LIVE?'Your garden. Tap the sack to buy seeds, then tap a bed.':'Your garden. Sign in on DEEDS to keep it and earn Deedcoins.'),900)}
window.__garden={S:()=>S,sowAt,waterAt,openStore,cartAdd,live:()=>LIVE,sow:()=>SOW,snd:SND,setSow};
})();
</script>
</body>
</html>

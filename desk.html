/* the industry every card in this drop starts with: what was typed in the batch bar, else the client's industry */
function batchIndustry(){ return BATCH.industry || (BATCH.company_id ? String(F(company(BATCH.company_id) || {}, 'industry') || '') : ''); }
function batchCamp(){ return BATCH.campaign_id ? byId(S.campaigns, BATCH.campaign_id) : null; }
function batchId(){ if(!BATCH.id) BATCH.id = uuid(); return BATCH.id; }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16); })); }
function industryTags(){ return S.tags.filter(t => String(F(t,'kind')).toLowerCase() === 'industry').map(t => F(t,'name','label')).filter(Boolean); }
const digits = v => String(v || '').replace(/\D+/g, '');
const norm = v => String(v || '').trim().toLowerCase().replace(/\s+/g, ' ');
async function hashFile(blob){
  try{
    const buf = await blob.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return ''; }
}
/* the stamp travels with the row so a reloaded tray remembers where the batch came from */
function stampRow(){ return clean({ batch_id: batchId(), company_id: BATCH.company_id || undefined,
  search_id: BATCH.search_id || undefined, source: BATCH.source || undefined,
  role_type: BATCH.role_type || undefined, campaign: BATCH.campaign || undefined }); }
async function queueWrite(x, row){

async function stampAll(){
  const row = stampRow();

/* rehydrate an unfinished tray from the queue table */
function intakeRestore(){
  if(INTAKE.length) return;
  let rows = (S.intake_queue || []).filter(r => ['pending','reading','read','error'].indexOf(String(F(r,'status'))) >= 0);
  if(!rows.length) return;
  const when = r => String(F(r,'created_at') || '');
  rows.sort((a,b) => when(a) < when(b) ? -1 : when(a) > when(b) ? 1 : 0);
  /* one tray at a time. the newest unfinished batch comes back, older orphans stay in the table. */
  const newest = F(rows[rows.length - 1], 'batch_id');
  rows = rows.filter(r => String(F(r,'batch_id')) === String(newest));
  for(const r of rows){
    const p = r.parsed || null;
    INTAKE.push({ qid: idOf(r), file: F(r,'filename') || 'Resume', blob: null, path: F(r,'path'),
      hash: F(r,'file_hash') || '', parsed: p, source: p ? (p.source || 'model') : '',
      fields: p ? fieldsFrom(p) : null, existing: p ? matchExisting(p) : null,
      maybe: p ? matchMaybe(p) : null, same: false,
      status: p ? 'ready' : (String(F(r,'status')) === 'error' ? 'error' : 'held'),
      error: F(r,'error') || '' });
  }
  if(rows.length){
    const r0 = rows[rows.length - 1];
    BATCH = { id: F(r0,'batch_id') || null, company_id: r0.company_id || '', search_id: r0.search_id || '',
      source: F(r0,'source') || '', role_type: F(r0,'role_type') || '', campaign: F(r0,'campaign') || '', campaign_id: '' };
    const hit = BATCH.campaign ? S.campaigns.find(x => campLabel(x) === BATCH.campaign && String(x.search_id) === String(BATCH.search_id)) : null;
    if(hit) BATCH.campaign_id = idOf(hit);
    BATCH.ack = false; BATCH.ack_role = '';
  }
}
function fieldsFrom(p){
  return { name: p.name || '', title: p.title || '', email: String(p.email || '').toLowerCase(),
    phone: p.phone || '', location: p.location || '', summary: p.summary || '', industry: batchIndustry() };
}
function matchExisting(p){
  const em = String(p.email || '').toLowerCase();
  if(em){ const c = S.candidates.find(c => String(F(c,'email')||'').toLowerCase() === em); if(c) return c; }
  const ph = digits(p.phone);
  if(ph.length >= 10 && p.name){
    const c = S.candidates.find(c => norm(F(c,'name')) === norm(p.name) && digits(F(c,'phone')).slice(-10) === ph.slice(-10));
    if(c) return c;
  }
  return null;
}
/* a name on its own is never enough to merge. flag it and let a person decide. */
function matchMaybe(p){
  if(!p.name || matchExisting(p)) return null;
  return S.candidates.find(c => norm(F(c,'name')) === norm(p.name)) || null;
}

async function intakeAdd(files){
  const list = Array.from(files || []).filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if(!list.length) return toast('PDF only for now.', true);
  const room = INTAKE_CAP - INTAKE.filter(x => x.status !== 'saved' && x.status !== 'skipped').length;
  if(list.length > room) toast('A hundred at a time. Taking the first ' + room + '.', true);
  const take = list.slice(0, Math.max(0, room));
  if(!take.length) return;
  batchId();
  let dupFile = 0, dupOld = 0;
  for(const f of take){
    const x = { file: f.name, blob: f, status: 'uploading', fields: null, hash: '' };
    INTAKE.push(x); draw();
    x.hash = await hashFile(f);
    const twice = x.hash && INTAKE.some(y => y !== x && y.hash === x.hash);
    const old = x.hash && S.candidates.find(c => F(c,'file_hash') === x.hash);
    if(twice || old){
      x.status = 'skipped';
      x.note = twice ? 'Same file twice in this drop' : 'Already on file as ' + pname(idOf(old)) + '.';
      if(old && BATCH.search_id){
        const on = S.pipeline.some(p => String(p.search_id) === String(BATCH.search_id) && String(p.candidate_id) === String(idOf(old)));
        if(on) x.note += ' Already on ' + sname(BATCH.search_id) + '.';
        else {
          const row = await tryWrite(() => insert('pipeline', clean({ [MAP.pipeline.search]: BATCH.search_id, [MAP.pipeline.candidate]: idOf(old),
            [MAP.pipeline.stage]: 'sourced', [MAP.pipeline.released]: false, [MAP.pipeline.added_by]: meId(), [MAP.pipeline.campaign]: BATCH.campaign_id || undefined })));
          if(row){ S.pipeline.push(row); x.note += ' Added to ' + sname(BATCH.search_id) + ' at Sourced.'; }
        }
      } else if(old) x.note += ' Pick the role above and drop it again, or open the candidate and press Add to a role.';
      twice ? dupFile++ : dupOld++;
      draw(); continue;
    }
    try{
      await alive();
      const safe = f.name.replace(/[^A-Za-z0-9._-]+/g, '-').slice(0, 60);
      const path = 'originals/' + Date.now() + '-' + Math.random().toString(36).slice(2,6) + '-' + safe;
      const up = await fetch(LW.url + '/storage/v1/object/resumes/' + path, { method:'POST',
        headers:{ apikey: LW.anon, Authorization:'Bearer ' + LWAuth.token(), 'content-type':'application/pdf', 'x-upsert':'true' }, body: f });
      if(!up.ok) throw new Error('upload refused. ' + (await up.text()).slice(0, 120));
      x.path = path;
      const q = await insert('intake_queue', Object.assign({ filename: f.name, path: path, file_hash: x.hash, status: 'pending' }, stampRow()));
      x.qid = idOf(q);
      x.status = 'held';
    }catch(err){ x.status = 'error'; x.error = 'Upload failed. ' + err.message; console.error(err); }
    draw();
  }
  if(dupFile || dupOld) toast((dupFile + dupOld) + ' already on file. See the note on each.');
}

async function intakeRead(x){
  try{
    if(!x.path) throw new Error('no file on the server');
    await queueWrite(x, { status: 'reading' });
    const j = await Promise.race([fnCall('resume-read', { path: x.path }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('No answer from the reader in two minutes.')), 120000))]);
    const p = j.parsed || {};
    x.parsed = p; x.source = p.source || 'model';
    x.fields = fieldsFrom(p);
    x.existing = matchExisting(p);
    x.maybe = matchMaybe(p);
    x.status = 'ready';
    await queueWrite(x, { status: 'read', parsed: p, read_at: new Date().toISOString(), error: null });
  }catch(err){
    x.status = 'error'; x.error = err.message; console.error(err);
    await queueWrite(x, { status: 'error', error: String(err.message).slice(0, 300) });
  }
  if(VIEW === 'intake') draw();
}
let INTAKE_BUSY = false;
async function intakeReadAll(){
  if(INTAKE_BUSY) return;
  INTAKE_BUSY = true;
  try{
    for(;;){
      const x = INTAKE.find(y => y.status === 'held');
      if(!x) break;
      x.status = 'reading'; if(VIEW === 'intake') draw();
      await intakeRead(x);
    }
  } finally { INTAKE_BUSY = false; if(VIEW === 'intake') draw(); }
}
async function intakeTag(cid, industry){
  if(!industry) return;
  let tag = S.tags.find(t => String(F(t,'name','label')).toLowerCase() === industry.toLowerCase());
  if(!tag){ tag = await insert('tags', { name: industry, kind: 'industry' }); S.tags.push(tag); }
  const dup = S.candidate_tags.find(t => String(t.candidate_id) === String(cid) && String(t.tag_id) === String(idOf(tag)));
  if(!dup) await insert('candidate_tags', { candidate_id: cid, tag_id: idOf(tag) });
}
/* a reapply never overwrites what a recruiter typed. blanks only, plus a new document and a line on the file. */
function fillBlanks(existing, f, x){
  const want = { name: f.name, title: f.title, email: f.email, phone: f.phone, location: f.location,
    summary: f.summary, linkedin: (x.parsed || {}).linkedin || '' };
  const row = {};

/* the ladder. days is negative before the due date, positive after. */
function invDays(i){ const d = F(i,'due_at','due_on'); if(!d) return null;
  return Math.round((Date.now() - new Date(d).getTime()) / 86400000); }
function sendKind(i){
  if(!F(i,'sent_at')) return 'send';
  const d = invDays(i);
  if(d === null) return 'courtesy';
  if(d >= 30) return 'final';
  if(d >= 1) return 'past';
  if(d === 0) return 'due';
  return 'courtesy';
}
function sendLabel(i){
  const k = sendKind(i);
  return k === 'send' ? 'Send' : k === 'final' ? 'Final notice' : k === 'past' ? 'Chase' : 'Remind';
}
/* what the desk thinks needs doing today, invoice side */
function invDue(){
  return S.invoices.filter(i => {
    if(String(F(i,'status')).toLowerCase() === 'paid') return false;
    if(!F(i,'sent_at')) return true;
    const d = invDays(i); if(d === null) return false;
    const stage = num(F(i,'reminder_stage'));
    if(d >= 30) return stage < 4;
    if(d >= 15) return stage < 3;
    if(d >= 7)  return stage < 2;
    if(d >= 0)  return stage < 1;
    return d >= -7 && stage < 1;
  });
}

  return head('Reports.', '') +

    '<div class="sec"><h2>Commission payable.</h2>' +

      later.length + ' not due yet.</span></div>' +

      perCo.map(x => '<div class="r" style="grid-template-columns:2fr 120px 120px 1fr">' +

        '<div><span class="muted small">' + x.pct + '%</span><div class="gbar"><i style="width:' + x.pct + '%"></i></div></div></div>'),
      '2fr 120px 120px 1fr') +
    '<div class="sec"><h2>Team scorecard.</h2></div>' +

        '<b>' + esc(t.name) + '</b><span>' + t.calls + '</span><span>' + t.visits + '</span><span>' + t.notes + '</span><span>' + t.placed + '</span></div>'),
      '2fr 100px 100px 150px 120px');
}

/* ---------- People ----------
   Who is in the system and what they can reach. An owner sees
   everyone. An admin sees everyone but the owner, and cannot hand
   out the owner tier. Nobody demotes themselves by accident. ---------- */
function vPeople(){
  if(!isAdmin()) return head('People.', '') +
    '<div class="tbl"><div class="empty">This screen is for admins.</div></div>';

  const list = S.staff.slice().sort((a,b) =>
    ROLES.indexOf(roleOf(a)) - ROLES.indexOf(roleOf(b)) ||
    String(F(a,'name','email')).localeCompare(String(F(b,'name','email'))));

  const openAM  = id => S.searches.filter(x => isOpen(x) && String(x.am_id) === String(id)).length;
  const openRec = id => S.searches.filter(x => isOpen(x) && String(x.recruiter_id) === String(id)).length;
  const ytd = id => (S.lw_payable || []).filter(x => String(x.staff_id) === String(id) &&
    String(x.plan_year) === String(new Date().getFullYear()));
  const grantable = who => ROLES.filter(r => r !== 'owner' || isOwner())
    .map(r => '<option value="' + r + '"' + (roleOf(who) === r ? ' selected' : '') + '>' +
      roleLabel(r) + '</option>').join('');
  /* status: Off if switched off, Pending until the desk agreement is accepted, else Active */
  const statusOf = x => x.active === false ? 'off' : (accRows(F(x,'email')).length ? 'active' : 'pending');
  const STATUS = { active:'Active', pending:'Pending', off:'Off' };
  const initials = n => String(n || '?').trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();

  const q = String(Q.people || '').trim().toLowerCase();
  const tab = Q.peopleTab || 'all';
  const shown = list.filter(x => {
    if(tab !== 'all' && statusOf(x) !== tab) return false;
    if(!q) return true;
    return [F(x,'name'), F(x,'email'), roleLabel(roleOf(x))].join(' ').toLowerCase().includes(q);
  });
  const counts = { all: list.length };
  list.forEach(x => { const k = statusOf(x); counts[k] = (counts[k] || 0) + 1; });

  const GRID = '2.2fr 1.6fr 150px 110px 70px 70px 120px 130px';
  const rows = shown.map(x => {
    const id = idOf(x), self = String(id) === String(meId());
    const lines = ytd(id);
    const fees = lines.reduce((t,l) => t + Number(l.fee_net || 0), 0);
    const comm = lines.reduce((t,l) => t + Number(l.commission || 0), 0);
    const st = statusOf(x);
    return '<div class="r pp" style="grid-template-columns:' + GRID + '">' +
      '<div class="pp-who"><span class="pp-av">' + esc(initials(F(x,'name','email'))) + '</span>' +
        '<div><b>' + esc(F(x,'name','email')) + '</b>' +
        '<span class="pp-sub">' + (self ? 'You' : esc(roleLabel(roleOf(x)))) + '</span>' +
        accDot(F(x,'email')) + '</div></div>' +
      '<span class="muted">' + esc(F(x,'email')) + '</span>' +
      (canSetRole(x) ? '<select class="rolesel" data-staff="' + id + '">' + grantable(x) + '</select>'
                     : '<span class="chip" title="' + (self ? 'You cannot change your own role' : 'Only a Root can change a Root') + '">' +
                       esc(roleLabel(roleOf(x))) + '</span>') +
      '<span class="pp-st ' + st + '"><i></i>' + STATUS[st] + '</span>' +
      '<span class="muted">' + openAM(id) + '</span>' +
      '<span class="muted">' + openRec(id) + '</span>' +
      '<span class="muted">' + usd(fees) + '</span>' +
      '<b>' + usd(comm) + '</b></div>';
  });

  const unstaffed = S.searches.filter(x => isOpen(x) && (!x.am_id || !x.recruiter_id)).length;
  const chip = (k, label) => '<button class="pp-chip' + (tab === k ? ' on' : '') + '" data-ptab="' + k + '">' +
    (k === 'all' ? '' : '<i class="' + k + '"></i>') + label + (counts[k] ? ' <em>' + counts[k] + '</em>' : '') + '</button>';

  return head('Who is in the system.', '') +
    '<div class="pp-lede">' + (isOwner() ? 'You can change anyone but yourself.' : 'Root accounts are visible but locked.') + '</div>' +
    (unstaffed ? '<div class="sec" style="margin-top:8px"><h2>' + unstaffed + ' open ' + (unstaffed === 1 ? 'role is' : 'roles are') +
      ' missing a name.</h2><span class="muted small">A role with no AM or no Recruiter is invisible to everyone but an admin.</span></div>' : '') +
    '<div class="tools pp-tools"><div class="search">' + SRCH + '<input id="qpeople" placeholder="Search people, email, or tier" value="' + esc(Q.people || '') + '"></div>' +
      '<div class="pp-chips">' + chip('all','All') + chip('active','Active') + chip('pending','Pending') + chip('off','Off') + '</div>' +
      '<button class="btn ghost" id="ppExport">Export</button></div>' +
    table(['Person','Email','Tier','Status','As AM','As Rec','Net fees YTD','Commission YTD'], rows, GRID,
      { empty: q ? 'Nobody matches that.' : 'Nobody here.' }) +
    '<div class="pp-foot">' + shown.length + (shown.length === 1 ? ' person' : ' people') + (shown.length !== list.length ? ' of ' + list.length : '') + '</div>' +
    '<div class="sec"><h2>What each tier reaches.</h2></div>' +
    '<div class="spec" style="background:var(--white);border:1px solid var(--line);padding:0 20px">' +
      '<div class="row"><b>Root</b><span>The permanent tier the desk is built on. Everything, always. Only another Root can change a Root</span></div>' +
      '<div class="row"><b>Admin</b><span>Every role and every commission line. Can change anyone except a Root, and cannot grant the Root tier</span></div>' +
      '<div class="row"><b>Recruiter</b><span>Only roles where they are the AM or the Recruiter, and only their own commission</span></div>' +
      '<div class="row"><b>Coordinator</b><span>Same reach as a recruiter. No commission credit unless named on a role</span></div>' +
    '</div>';
}
/* People wiring: search, the status chips and the CSV export */
function wirePeople(m){
  const qi = m.querySelector('#qpeople');
  if(qi) qi.oninput = () => { Q.people = qi.value; const p = qi.selectionStart; draw();
    const n = document.getElementById('qpeople'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  m.querySelectorAll('[data-ptab]').forEach(b => b.onclick = () => { Q.peopleTab = b.dataset.ptab; draw(); });
  const ex = m.querySelector('#ppExport');
  if(ex) ex.onclick = () => {
    const keys = ['name','email','role','active'];
    const acc = e => accRows(e)[0] || {};
    const csv = ['name,email,tier,active,agreement_accepted_at,agreement_version,agreement_ip'].concat(S.staff.map(x => {
      const a = acc(F(x,'email'));
      return [F(x,'name'), F(x,'email'), roleLabel(roleOf(x)), x.active === false ? 'no' : 'yes', a.accepted_at || '', a.version || '', a.ip || '']
        .map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',');
    })).join('\n');
    const b = new Blob([csv], { type:'text/csv' }); const u = URL.createObjectURL(b);
    const t = document.createElement('a'); t.href = u; t.download = 'livework-people.csv';
    document.body.appendChild(t); t.click(); t.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  };
}

/* ---------- Settings ---------- */
function vSettings(){
  const srcs = S.import_sources.length ? S.import_sources :
    [{name:'Indeed', status:'Key not set'},{name:'LinkedIn', status:'Key not set'}];
  return head('Settings.', '') +
    '<div class="sec"><h2>Roles.</h2></div>' +
    table(['Person','Email','Role'],
      S.staff.map(s => '<div class="r" style="grid-template-columns:1.4fr 1.8fr 140px">' +
        '<b>' + esc(F(s,'name','email')) + '</b><span class="muted">' + esc(F(s,'email')) + '</span>' +
        '<span class="chip">' + esc(roleLabel(F(s,'role'))) + '</span></div>'),
      '1.4fr 1.8fr 140px') +
    '<div class="sec"><h2>Import sources.</h2><span class="muted small">Keys land here when the accounts are open</span></div>' +
    table(['Source','Status'],
      srcs.map(s => '<div class="r" style="grid-template-columns:1fr 2fr">' +
        '<b>' + esc(F(s,'name')) + '</b><span class="muted">' + esc(F(s,'status') || 'Key not set') + '</span></div>'),
      '1fr 2fr') +
    '<div class="sec"><h2>Promised terms.</h2></div>' +
    '<div class="spec" style="background:var(--white);border:1px solid var(--line);padding:0 20px">' +
      '<div class="row"><b>Placement fee</b><span>20% of first year base salary, contingent</span></div>' +
      '<div class="row"><b>Retained search</b><span>$10,000 deposit up front, credited against the fee</span></div>' +
      '<div class="row"><b>Guarantee</b><span>90 day replacement search on every placement</span></div>' +
      '<div class="row"><b>Billing entity</b><span>GERMANN INC dba LIVEWORK, on invoices only</span></div>' +
      '<div class="row"><b>Terms</b><span><a href="engagement.html">Client engagement agreement</a></span></div>' +
    '</div>';
}

<script>
/* ============================ sheets ============================ */
let SHEET = { kind:null, id:null, tab:0 };
function closeSheet(){ $('#sheet').classList.remove('on'); $('#veil').classList.remove('on'); SHEET = { kind:null, id:null, tab:0 }; }
function openSheet(kind, id, tab){ SHEET = { kind, id, tab: tab || 0 }; paintSheet(); }
function shell(title, sub, body){
  $('#sheet').innerHTML = '<button class="x" id="sx">Close</button>' +
    '<div><h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + body;
  $('#sheet').classList.add('on'); $('#veil').classList.add('on');
  $('#sx').onclick = closeSheet;
  wireSheet();
  labelCells($('#sheet'));
}
function tabs(names){
  return '<div class="tabs">' + names.map((n,i) => '<button data-tab="' + i + '" class="' + (SHEET.tab===i?'on':'') + '">' + n + '</button>').join('') + '</div>';
}
function spec(rows){
  return '<div class="spec">' + rows.filter(Boolean).map(([k,v]) => '<div class="row"><b>' + k + '</b><span>' + (v==null||v===''?'<span class="muted">Not set</span>':v) + '</span></div>').join('') + '</div>';
}
function logList(items){
  return items.length ? '<div class="log">' + items.map(([w,t]) => '<div class="e"><span>' + w + '</span><span>' + t + '</span></div>').join('') + '</div>'
    : '<p class="muted small">Nothing logged yet.</p>';
}
function paintSheet(){
  const k = SHEET.kind;
  if(k === 'company') return sheetCompany();
  if(k === 'search') return sheetSearch();
  if(k === 'candidate') return sheetCandidate();
  if(k === 'pool') return sheetPool();
  if(k === 'form') return;
}
function sheetCompany(){
  const c = company(SHEET.id); if(!c) return closeSheet();
  const ss = S.searches.filter(s => String(s.company_id)===String(idOf(c)));
  const ids = ss.map(s => String(idOf(s)));
  const acts = S.activity.filter(a => String(a.company_id)===String(idOf(c)) || ids.includes(String(a.search_id)));
  const inv = S.invoices.filter(i => String(i.company_id)===String(idOf(c)));
  const pl = S.placements.filter(p => String(p.company_id)===String(idOf(c)));
  const docs = S.documents.filter(d => String(d.company_id)===String(idOf(c)));
  const T = SHEET.tab;
  let body = '';
  if(T===0) body = gateBanner(idOf(c)) + spec([
      ['Status', esc(F(c,'status') || 'Active')],
      ['Engagement', esc(F(c,'kind','engagement') || 'Contingent')],
      ['Location', esc(F(c,'city','location'))],
      ['Industry', esc(F(c,'industry'))],
      ['Fee', esc(F(c,'fee','fee_pct') || '20% of first year base')],
      ['Guarantee', '90 days'],
      ['Owner', esc(ownerName(F(c,'owner_id')))],
      ['Legal name', esc(F(c,'legal_name') || 'Not on file')],
      ['Address', esc(F(c,'address') || 'Not on file')],
      ['Notices to', esc(F(c,'notice_email') || 'Not on file')],
      ['Notes', esc(F(c,'notes','bio'))]
    ]) + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-edit="company:' + idOf(c) + '">Edit</button><button class="btn ghost" data-mail="co:' + idOf(c) + '">Email</button><button class="btn ghost" data-new="visit" data-co="' + idOf(c) + '">Visit note</button><button class="btn ghost" data-new="search" data-co="' + idOf(c) + '">Open a search</button>' +
      (isAdmin() ? '<button class="btn ghost del" data-delco="' + idOf(c) + '">Delete client</button>' : '') + '</div>';
  if(T===1) body = '<div class="clist">' + contactsOf(idOf(c)).map(ct => {
      const cid = idOf(ct);
      const ph = String(F(ct,'phone') || '').replace(/[^0-9+]/g,'');
      const em = F(ct,'email');
      const last = S.activity.filter(a => String(a.contact_id) === String(cid))
        .map(a => F(a,'created_at','occurred_at')).filter(Boolean).sort().pop();
      const marks = [ct[MAP.contact.room] === true ? 'Client room' : '',
                     ct[MAP.contact.billing] === true ? 'Billing' : ''].filter(Boolean).join(' · ');
      return '<div class="c">' +
        '<div class="ch"><b>' + esc(F(ct,'name')) + '</b>' +
          (marks ? '<span class="pill">' + esc(marks) + '</span>' : '') + '</div>' +
        (F(ct,'title') ? '<div class="m">' + esc(F(ct,'title')) + '</div>' : '') +
        '<div class="t">' + (last ? 'Last contacted ' + ago(last) : 'No contact yet') + '</div>' +
        '<div class="a">' +
          (ph ? '<a href="tel:' + esc(ph) + '" data-touch="ct:' + cid + '|call">' + CALLI + 'Call</a>'
              : '<a data-logcall="|' + idOf(c) + '">' + CALLI + 'Log a call</a>') +
          (em ? '<a href="mailto:' + esc(em) + '" data-touch="ct:' + cid + '|email">' + MAILI + 'Email</a>'
              : '<a data-mail="co:' + idOf(c) + '">' + MAILI + 'Email</a>') +
          '<a data-edit="contact:' + cid + '">' + OPENI + 'Edit</a>' +
        '</div>' +
        '<div class="ctsw">' +
          '<span class="muted small">Client room</span>' +
          '<button class="sw ' + (ct[MAP.contact.room]===true?'on':'') + '" data-room="' + cid + '" aria-label="Client room access"></button>' +
          '<span class="muted small">Billing</span>' +
          '<button class="sw ' + (ct[MAP.contact.billing]===true?'on':'') + '" data-bill="' + cid + '" aria-label="Billing contact"></button>' +
        '</div></div>';
    }).join('') + '</div>' +
      (needsBilling(idOf(c)) ? '<p class="small" style="margin:0 0 10px"><span class="pill warn">No billing contact</span> Turn Billing on for the AP person, or invoices and reminders go to the first contact with an email, usually the hiring manager.</p>' : '') +
      '<p class="muted small">Room lets them sign in at the client room with a code. Billing sends invoices and payment reminders to them. One billing contact per client.</p>' +
      '<button class="btn" data-new="contact" data-co="' + idOf(c) + '">Add a contact</button>';
  if(T===2) body = (ss.length ? ss.map(s => '<div class="toggle"><div><b>' + esc(F(s,'title','role')) + '</b><small>' + esc(F(s,'location')) + ' · ' + (isOpen(s)?'Open':'Closed') + '</small></div><button class="btn sm ghost" data-se="' + idOf(s) + '">Open</button></div>').join('') : '<p class="muted small">No searches yet.</p>') +
      '<button class="btn" data-new="search" data-co="' + idOf(c) + '">Open a search</button>';
  if(T===3) body = logList(acts.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,40)
      .map(a => [short(a.created_at) + ' ' + esc(F(a,'kind')), esc(F(a,'body','note'))]));
  if(T===4){
    const fees = inv.reduce((n,i) => n + num(F(i,'amount')), 0);
    const te = exOnCo(idOf(c)), teSum = exSum(te), camp = campSpendOnCo(idOf(c));
    const spend = teSum + camp;
    body = spec([
      ['Placements', pl.length],
      ['Fees billed', money(fees)],
      ['Outstanding', money(inv.filter(i => String(F(i,'status')).toLowerCase()!=='paid').reduce((n,i) => n + num(F(i,'amount')), 0))],
      ['Campaign spend', camp ? money(camp) : '<span class="muted">None</span>'],
      ['T&amp;E on the card', teSum ? money(teSum) : '<span class="muted">None</span>'],
      ['Spend, all in', spend ? money(spend) : '<span class="muted">None</span>'],
      ['Margin', fees || spend ? '<b>' + (fees - spend < 0 ? '\u2212' : '') + money(Math.abs(fees - spend)) + '</b>' + (fees ? ' <span class="muted small">' + Math.round(100 * (fees - spend) / fees) + '% of fees</span>' : '') : '<span class="muted">Nothing yet</span>']
    ]) + (inv.length ? logList(inv.map(i => [esc(F(i,'invoice_no','number') || 'Draft'), money(F(i,'amount')) + ' · ' + esc(F(i,'status') || 'draft')])) : '') +
    (te.length ? '<div class="sec" style="margin-top:22px"><h2>On the card.</h2><span class="muted">' + te.length + (te.length === 1 ? ' expense' : ' expenses') + ' on this client.</span></div>' +
      '<div class="xlist">' + te.slice().sort((a,b) => String(F(b,'spent_on','created_at')).localeCompare(String(F(a,'spent_on','created_at')))).slice(0, 30).map(exRow).join('') + '</div>' : '') +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn ghost" data-new="invoice" data-co="' + idOf(c) + '">Raise an invoice</button>' +
    '<button class="btn ghost" data-new="expense" data-co="' + idOf(c) + '">Log an expense here</button></div>';
  }
  if(T===5) body = gateBanner(idOf(c)) +
    (docs.length
      ? '<div class="clist">' + docs.slice().sort((a,b) => String(F(b,'created_at')).localeCompare(String(F(a,'created_at')))).map(docRow).join('') + '</div>'
      : '<p class="muted small">Nothing on file yet. The client recruiting agreement is the one that counts, it is signed once and covers every contingent role.</p>') +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<button class="btn" data-new="agreement" data-co="' + idOf(c) + '">Draw up an agreement</button>' +
    '<button class="btn ghost" data-new="document" data-co="' + idOf(c) + '">Upload a signed copy</button></div>';
  shell(esc(F(c,'name')) + '.', esc(F(c,'city','location','industry')) + (needsBilling(idOf(c)) ? ' · <span class="pill warn">No billing contact</span>' : ''),
    tabs(['Profile','Contacts','Searches','Activity','Money','Documents']) + body);
}
function sheetSearch(){
  const s = search(SHEET.id); if(!s) return closeSheet();
  const rows = S.pipeline.filter(p => String(p.search_id)===String(idOf(s)));
  const acts = S.activity.filter(a => String(a.search_id)===String(idOf(s)));
  const T = SHEET.tab;
  let body = '';
  if(T===0) body = spec([
      ['Client', esc(cname(s.company_id))],
      ['Status', isOpen(s) ? 'Open' : 'Closed'],
      ['Engagement', esc(F(s,'kind','engagement') || 'Contingent')],
      ['Location', esc(F(s,'location'))],
      ['Compensation', [money(F(s,'comp_min')), money(F(s,'comp_max'))].filter(Boolean).join(' to ') || esc(F(s,'comp'))],
      ['Opened', day(F(s,'opened_at','created_at'))],
      ['Client told', F(s,'launch_sent_at') ? day(F(s,'launch_sent_at')) + ' · ' + esc(F(s,'launch_sent_to'))
        : '<span class="muted">Not announced yet</span>'],
      ['Days open', daysBetween(F(s,'opened_at','created_at'))],
      ['Fee', esc(F(s,'fee') || '20% of first year base')],
      ['Must haves', skView(skSplit(F(s,'must_haves')), 'must')],
      ['Nice to haves', skView(skSplit(F(s,'nice_to_haves')), '')],
      ['The brief', esc(F(s,'notes','brief','description'))]
    ]) + '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-new="pipeline" data-se="' + idOf(s) + '">Submit a candidate</button>' +
      '<button class="btn ghost" data-edit="search:' + idOf(s) + '">Edit</button>' +
      '<button class="btn ghost" data-close="' + idOf(s) + '">' + (isOpen(s)?'Close the search':'Reopen') + '</button>' +
      (F(s,'launch_sent_at')
        ? '<button class="btn ghost" data-launch="' + idOf(s) + '" data-again="1">Send the notice again</button>'
        : '<button class="btn" data-launch="' + idOf(s) + '">Start the search</button>') + '</div>';
  if(T===1){
    /* the campaign view. best fit rides the top, and every percent opens up. */
    const ranked = [...rows].sort((a,b) => {
      const x = matchOf(a), y = matchOf(b);
      if(x === null && y === null) return 0;
      if(x === null) return 1;
      if(y === null) return -1;
      return y - x;
    });
    const scored = rows.filter(p => matchOf(p) !== null).length;
    body = (ranked.length ? ranked.map(p => {
        const c = cand(p.candidate_id) || {};
        const prem = c[MAP.candidate.premier] === true;
        return '<div class="mrow"><div class="mh">' +
          '<div><b class="' + (prem ? 'premier' : '') + '" data-cand="' + p.candidate_id + '">' +

/* drafts. plain, short, and always editable before it goes. */
function mailDraft(tpl, ctx){
  const c = ctx && ctx.cand ? cand(ctx.cand) : null;
  const s = ctx && ctx.se ? search(ctx.se) : null;
  const role = s ? F(s,'title','role') : 'the role';
  const co = s ? cname(s.company_id) : (ctx && ctx.co ? cname(ctx.co) : 'the client');
  const who = c ? F(c,'name') : 'the candidate';
  const title = c ? F(c,'title') : '';
  const sel = $('#f_who');
  const toName = sel && sel.value ? sel.value.split('|')[1] : '';
  if(tpl === 'presentation') return { subject: who + ' for ' + role,
    body: firstName(toName) + ',\n\nI am sending you ' + who + ' for the ' + role + ' search.' +
      (title ? ' They are currently ' + title + '.' : '') + '\n\nWhat stands out:\n\nTheir profile is attached. If you want time with them, send me two windows that work and I will set it up.' };
  if(tpl === 'reachout' && !s) return { subject: 'A role worth a look',
    body: firstName(who) + ',\n\nI am working a search that looks close to your background' + (title ? ' as ' + title : '') + '.' +
      '\n\nAre you open to a short call this week? If the timing is wrong, tell me what you are looking for and I will keep it in mind.' };
  if(tpl === 'reachout') return { subject: role + ' search',
    body: firstName(who) + ',\n\nI am running a ' + role + ' search for a client' + (co && co !== 'the client' ? ' in ' + (F(company(s ? s.company_id : ctx.co) || {}, 'city') || 'the area') : '') +
      '.' + (title ? ' With your background as ' + title + ', it looks worth a conversation.' : '') +
      '\n\nAre you open to a short call this week? If the timing is wrong, tell me what you are looking for and I will keep it in mind.' };
  if(tpl === 'followup') return { subject: 'Following up on ' + who,
    body: firstName(toName) + ',\n\nThanks for seeing ' + who + '. What did you think?' +
      '\n\nIf you want to move forward I will get the next step on the calendar. If it is a no, tell me what missed and I will adjust the search.' };
  return { subject: '', body: '' };
}
function wireMailForm(ctx){
  const tpl = $('#f_tpl'), who = $('#f_who'), subj = $('#f_subj'), body = $('#f_body');
  if(ctx && ctx.tpl && tpl) tpl.value = ctx.tpl;
  /* a presentation goes to the client, a reach out goes to the candidate */
  const pick = () => {
    const want = tpl.value === 'reachout' ? 'cand' : 'contact';
    for(let i = 1; i < who.options.length; i++){ if(who.options[i].dataset.kind === want){ who.selectedIndex = i; return; } }
    if(who.options.length > 1) who.selectedIndex = 1;
  };
  pick();
  const fill = () => { const d = mailDraft(tpl.value, ctx); subj.value = d.subject; body.value = d.body; };
  fill();
  tpl.onchange = () => { pick(); fill(); };
  who.onchange = () => { if(!body.value.trim() || confirm('Rewrite the draft for this person?')) fill(); };
}

/* the candidate list on a placement follows the search picked above it: only the people in that
   pipeline (not Passed), A to Z, then the typed name narrows it further. No search picked = everyone. */
function wirePlacementForm(ctx){
  const se = $('#f_se'), cq = $('#f_cq'), cs = $('#f_cand'), n = $('#f_candn');
  if(!se || !cs) return;
  const paint = () => {
    const seId = se.value, q = norm(cq ? cq.value : '');
    const keep = cs.value || ctx.cand || '';
    let list = S.candidates;
    if(seId){
      const ids = S.pipeline.filter(p => String(p.search_id) === String(seId) && stageOf(p) !== 'Passed').map(p => String(p.candidate_id));
      list = S.candidates.filter(c => ids.indexOf(String(idOf(c))) >= 0);
    }
    if(q) list = list.filter(c => norm(F(c,'name','full_name')).includes(q));
    list = list.slice().sort((a,b) => String(F(a,'name','full_name')).localeCompare(String(F(b,'name','full_name')), undefined, { sensitivity:'base' }));
    cs.innerHTML = opts(list, c => F(c,'name','full_name'), keep);
    if(keep && cs.value !== String(keep)) cs.value = '';
    if(list.length === 1 && !cs.value) cs.value = String(idOf(list[0]));
    if(n) n.textContent = seId ? (list.length + (list.length === 1 ? ' person' : ' people') + ' on this search') : (list.length + ' in the pool. Pick the search to narrow it.');
  };
  se.onchange = paint;
  if(cq) cq.oninput = paint;
  paint();
}
/* the skills a role is matched on. must haves score full, nice to haves half.
   a dropped brief fills both lists through role-skills, and every chip can go. */
const SK = { must: [], nice: [], was: '' };
function skSplit(t){ return String(t || '').split(/[\n;]+/).map(x => x.trim()).filter(Boolean); }
function skView(list, cls){ return list.length ? '<div class="skv">' + list.map(x => '<b class="' + cls + '">' + esc(x) + '</b>').join('') + '</div>' : ''; }
function skPaint(){
  const box = k => document.getElementById(k === 'must' ? 'skmust' : 'sknice');

    el.innerHTML = SK[k].map((x, i) => '<span class="sk ' + (k === 'must' ? 'must' : '') + '">' + esc(x) +

async function xShrink(f){
  if(!/^image\//i.test(f.type)) return null;
  const url = URL.createObjectURL(f);
  try{
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82).split(',')[1];
  }finally{ try{ URL.revokeObjectURL(url); }catch(e){} }
}

    body: 'Attached is the ' + F(d,'title') + ', already signed on our side.\n\n' +
      'Print it, sign the client block, and send a scan back to this address. If you would rather sign it online, say the word and I will send a link instead.' });

/* one place that mints a request and mails the link */
async function sendSignature(d, o){
  const tok = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()) + String(Math.random())).replace(/-/g, '');
  const until = new Date(Date.now() + (Number(o.days) || 14) * 86400000).toISOString();
  const rq = await tryWrite(() => insert('signature_requests', clean({ document_id: idOf(d), party: 'client',
    signer_name: o.name, signer_title: o.title || '', signer_email: String(o.email).toLowerCase(),
    notify_email: F(ME || {}, 'email'), token: tok, expires_at: until })), null);
  if(!rq) return false;
  const link = SITE + '/sign.html?t=' + tok;
  const co = company(d.company_id) || {};
  try{
    await fnCall('mail-send', clean({ to_email: String(o.email).toLowerCase(), to_name: o.name,
      subject: F(d,'title') + ' for ' + (F(co,'legal_name') || F(co,'name')),
      body: (o.note || '') + '\n\nSign it here: ' + link + '\n\nThe link works until ' +
        new Date(until).toLocaleDateString() + '. Your executed copy comes by email the moment you sign.',
      template: 'note', company_id: d.company_id }));
    await insert('activity', clean({ [MAP.activity.kind]: 'note', [MAP.activity.title]: 'Sent ' + F(d,'title') + ' for signature',
      [MAP.activity.company]: d.company_id, [MAP.activity.staff]: meId() }));
    toast('Sent to ' + o.email + '.');
  }catch(err){
    console.error(err);
    toast('Made the link. The email did not go: ' + ((err && err.message) || 'no reason given') + '. Copy it from the row.', true);
  }
  await loadAll(); drawNav(); draw(); paintSheet();
  return true;
}

async function docUrl(d){
  await alive();
  const r = await fetch(LW.url + '/storage/v1/object/sign/documents/' + F(d,'storage_path'), {
    method:'POST', headers:{ apikey: LW.anon, Authorization:'Bearer ' + LWAuth.token(), 'content-type':'application/json' },
    body: JSON.stringify({ expiresIn: 3600 }) });
  const j = await r.json().catch(() => null);
  if(!r.ok || !j || !j.signedURL) throw new Error((j && j.message) || 'That file would not open.');
  return LW.url + '/storage/v1' + j.signedURL;
}

function wireInvoiceForm(ctx){

    const co = document.getElementById('f_co');

/* ============================ wiring ============================ */
function wireSheet(){
  const sh = $('#sheet');
  sh.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { SHEET.tab = +b.dataset.tab; paintSheet(); });
  sh.querySelectorAll('[data-room]').forEach(b => b.onclick = async () => {
    const ct = byId(S.contacts, b.dataset.room);
    const r = await tryWrite(() => patch('contacts', b.dataset.room, { [MAP.contact.room]: !(ct[MAP.contact.room] === true) }),
      ct[MAP.contact.room] === true ? 'Room access off.' : 'Room access on.');
    if(r){ await loadAll(); paintSheet(); }
  });
  sh.querySelectorAll('[data-prof]').forEach(b => b.onclick = async () => {
    const lbl = b.textContent; b.disabled = true; b.textContent = 'Building';
    try{ const j = await fnCall('profile-pdf', { candidate_id: b.dataset.prof, redact: b.dataset.redact === '1' });
      if(j.url) openUrl(j.url); toast('Profile ' + j.ref + ' ready.'); }
    catch(err){ toast('No PDF. ' + err.message, true); }
    b.disabled = false; b.textContent = lbl;
  });
  sh.querySelectorAll('[data-bill]').forEach(b => b.onclick = async () => {
    const ct = byId(S.contacts, b.dataset.bill); if(!ct) return;
    const on = !(ct[MAP.contact.billing] === true);
    if(on && !F(ct,'email')) return toast('That contact needs a work email first.', true);
    const others = contactsOf(ct.company_id).filter(x => String(idOf(x)) !== String(idOf(ct)) && x[MAP.contact.billing] === true);
    const r = await tryWrite(async () => {
      if(on) for(const o of others) await patch('contacts', idOf(o), { [MAP.contact.billing]: false });
      return patch('contacts', idOf(ct), { [MAP.contact.billing]: on });
    }, on ? 'Invoices go to ' + F(ct,'name') + '.' : 'Billing contact cleared.');
    if(r){ await loadAll(); paintSheet(); }
  });
  sh.querySelectorAll('[data-prem]').forEach(b => b.onclick = async () => {
    const c = cand(b.dataset.prem);
    if(c[MAP.candidate.premier] === true){
      const r = await tryWrite(() => patch('candidates', idOf(c), { [MAP.candidate.premier]: false, [MAP.candidate.premier_reason]: null, [MAP.candidate.premier_by]: null }), 'Premier off.');
      if(r){ await loadAll(); paintSheet(); }
    } else form('premier', { cand: idOf(c) });
  });
  sh.querySelectorAll('[data-close]').forEach(b => b.onclick = async () => {
    const s = search(b.dataset.close);
    /* searches.status only takes open, on_hold, filled or cancelled. A search with a placement closes as filled, the rest as cancelled. */
    const filled = S.placements.some(p => String(p.search_id) === String(idOf(s)));
    const next = isOpen(s) ? (filled ? 'filled' : 'cancelled') : 'open';
    if(isOpen(s) && !confirm('Close ' + F(s,'title','role','job_title') + '? It leaves the open list and the client room.')) return;
    const r = await tryWrite(() => patch('searches', idOf(s), { [MAP.search.status]: next }), next === 'open' ? 'Reopened.' : (filled ? 'Closed as filled.' : 'Closed.'));
    if(r){ await loadAll(); drawNav(); paintSheet(); draw(); }
  });
  sh.querySelectorAll('[data-pooladd]').forEach(b => b.onclick = async () => {
    const c = val('poolAdd'); if(!c) return toast('Pick someone first.', true);
    const r = await tryWrite(() => insert('pool_members', { [MAP.poolmem.pool]: b.dataset.pooladd, [MAP.poolmem.candidate]: c }), 'Added to the pool.');
    if(r){ await loadAll(); paintSheet(); }
  });
  common(sh);
}
/* deleting a client. Money records are never deleted: a client with a placement, an invoice or an expense
   stays and the button says so. Otherwise the client goes with its contacts, searches, pipeline rows,
   campaigns, notes, tasks, activity and documents. Candidates stay in the pool. */
async function deleteClient(coId, btn){
  const c = company(coId); if(!c) return;
  const name = F(c,'name') || 'this client';
  const ss = S.searches.filter(s => String(s.company_id) === String(coId));
  const seIds = ss.map(s => String(idOf(s)));
  const money_ = S.placements.filter(p => String(p.company_id) === String(coId)).length
    + S.invoices.filter(i => String(i.company_id) === String(coId)).length
    + S.expenses.filter(x => String(x.company_id) === String(coId)).length;
  if(money_) return toast(name + ' has placements, invoices or expenses on it. Those records stay, so the client cannot be deleted. Mark it inactive instead.', true);
  const pipe = S.pipeline.filter(p => seIds.indexOf(String(p.search_id)) >= 0).length;
  const cts = contactsOf(coId).length;
  const what = 'Delete ' + name + '?\n\nGone with it: ' + cts + (cts === 1 ? ' contact, ' : ' contacts, ') + ss.length + (ss.length === 1 ? ' search, ' : ' searches, ') + pipe + ' pipeline ' + (pipe === 1 ? 'row' : 'rows') + ', and its notes, tasks and documents.\nCandidates stay in the pool. This cannot be undone.';
  if(!confirm(what)) return;
  if(prompt('Type DELETE to confirm.') !== 'DELETE') return toast('Not deleted.');
  const lbl = btn ? btn.textContent : ''; if(btn){ btn.disabled = true; btn.textContent = 'Deleting'; }
  const inSe = 'search_id=in.(' + seIds.map(encodeURIComponent).join(',') + ')';
  const onCo = 'company_id=eq.' + encodeURIComponent(coId);
  /* child rows first. a table that lacks the column just skips */
  const steps = [];
  if(seIds.length) steps.push(['pipeline_log', inSe], ['interview_notes', inSe], ['interview_guides', inSe], ['campaigns', inSe],
    ['activity', inSe], ['tasks', inSe], ['intake_queue', inSe], ['pipeline', inSe]);
  steps.push(['signature_requests', onCo], ['documents', onCo], ['activity', onCo], ['tasks', onCo], ['intake_queue', onCo], ['contacts', onCo], ['searches', onCo]);
  for(const [t, f] of steps){
    try{ await del(t, f); }
    catch(e){ if(!/column|does not exist|42703/i.test(e.message)){ toast('Stopped at ' + t + '. ' + e.message, true); if(btn){ btn.disabled = false; btn.textContent = lbl; } return; } }
  }
  const ok = await tryWrite(() => del('companies', 'id=eq.' + encodeURIComponent(coId)), name + ' deleted.');
  if(!ok){ if(btn){ btn.disabled = false; btn.textContent = lbl; } await loadAll(); draw(); return; }
  closeSheet(); await loadAll(); drawNav(); draw();
}
/* the search launch notice. One press, and only ever a press. */
async function startSearch(btn, seId, again){
  const s = search(seId) || {};
  const msg = again
    ? 'Send the launch notice again for ' + (F(s,'title') || 'this search') + '?'
    : 'Tell the client we have started this search?\n\nThis sets the opened date and emails the notice.';
  if(!confirm(msg)) return;
  const lbl = btn.textContent; btn.disabled = true; btn.textContent = 'Sending';
  try{
    const j = await fnCall('search-launch', { search_id: seId, again: again === true });
    toast('Announced to ' + j.to + '.');
    await loadAll(); drawNav(); paintSheet(); draw();
  }catch(err){ toast('Not sent. ' + err.message, true); }
  btn.disabled = false; btn.textContent = lbl;
}

function writeInto(w, doc){ w.document.open(); w.document.write(doc); w.document.close(); }
function openGuide(j, w){
  const t = w || window.open('', '_blank');
  if(!t) return toast('Allow pop ups on this site to see the guide.', true);
  writeInto(t, guideDoc(j));
}
async function buildGuide(btn, candId, seId, pipeId){
  /* the tab opens on the click, so the pop up blocker never sees it as
     a background open and there is something to watch while it writes */
  const w = window.open('', '_blank');
  if(w) writeInto(w, guideWait(pname(candId)));
  const lbl = btn.textContent; btn.disabled = true;
  let n = 0; btn.textContent = 'Writing';
  const tick = setInterval(() => { n++; btn.textContent = 'Writing ' + n + 's'; }, 1000);
  try{
    const j = await fnCall('interview-guide', { candidate_id: candId, search_id: seId || null, pipeline_id: pipeId || null });
    openGuide(j, w);
    toast('Guide ready. It is on the candidate file now.');
    try{ await loadAll(); if(SHEET) paintSheet(); }catch(e){}
  }catch(err){
    if(w) writeInto(w, guideFail(err.message));
    toast('No guide. ' + err.message, true);
  }
  clearInterval(tick);
  btn.disabled = false; btn.textContent = lbl;
}
/* the recruiter PDF. The read and the probes are in this one. */
async function guidePdf(btn, candId, seId, redact){
  const lbl = btn.textContent; btn.disabled = true; btn.textContent = 'Building';
  try{
    const j = await fnCall('guide-pdf', { candidate_id: candId, search_id: seId || null, redact: redact === true });
    if(j.url) openUrl(j.url);
    toast('Guide PDF ready.');
  }catch(err){ toast('No PDF. ' + err.message, true); }
  btn.disabled = false; btn.textContent = lbl;
}
/* the courtesy send. Client copy only, and only ever on a press. */
async function sendGuide(btn, candId, seId){
  if(!confirm('Send the client copy of the interview guide to the client contact on this search?\n\nThe read and the probes stay on our side.')) return;
  const lbl = btn.textContent; btn.disabled = true; btn.textContent = 'Sending';
  try{
    const j = await fnCall('guide-mail', { candidate_id: candId, search_id: seId || null });
    toast('Guide sent to ' + j.to + '.');
    await loadAll(); draw();
  }catch(err){ toast('Not sent. ' + err.message, true); }
  btn.disabled = false; btn.textContent = lbl;
}

  m.querySelectorAll('[data-send]').forEach(b => b.onclick = async e => { e.stopPropagation();

                                 : 'Send a payment reminder to ' + co + '?';
    if(!confirm(what + '\n\nThe PDF goes with it and the send is logged.')) return;
    const lbl = b.textContent; b.disabled = true; b.textContent = 'Sending';
    try{

  m.querySelectorAll('[data-stab]').forEach(b => b.onclick = () => { Q.searchTab = b.dataset.stab; draw(); });

    const r = row

$('#veil').onclick = closeSheet;

/* ---------- desk access agreement: nobody enters before accepting ---------- */
const ACC_FILE = 'desk-agreement.txt';
let ACC_CUR = '';
/* the dot on People: green on the current text, amber on an older version, grey if never */
function accRows(email){
  const em = String(email || '').toLowerCase();
  return (S.desk_acceptances || []).filter(a => String(a.email || '').toLowerCase() === em)
    .sort((a,b) => new Date(b.accepted_at) - new Date(a.accepted_at));
}
const accWhen = d => new Date(d).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit', timeZoneName:'short' });
function accDot(email){
  const rows = accRows(email);
  if(!rows.length) return '<span class="agdot"><i class="no"></i>Agreement not accepted</span>';
  const a = rows[0], cur = !ACC_CUR || a.text_hash === ACC_CUR;
  return '<a class="agdot" data-acc="' + esc(String(email || '').toLowerCase()) + '" title="Open the acceptance record"><i class="' + (cur ? 'ok' : 'old') + '"></i>' +
    (cur ? 'Agreement accepted ' : 'Older version accepted ') + esc(accWhen(a.accepted_at)) + '</a>';
}
/* the record behind the dot. everything a court asks for, in one card */
function accSheet(email){
  const rows = accRows(email);
  const staff = S.staff.find(x => String(F(x,'email')).toLowerCase() === String(email).toLowerCase()) || {};
  const row = (k, v) => '<div class="accrow"><span>' + k + '</span><b>' + (v == null || v === '' ? '<i class="muted">not recorded</i>' : esc(v)) + '</b></div>';
  const one = (a, i) => {
    const cur = !ACC_CUR || a.text_hash === ACC_CUR;
    return '<div class="accrec">' +
      '<div class="micro">' + (i === 0 ? 'Current record' : 'Earlier record') + ' · <i class="' + (cur ? 'ok' : 'old') + '"></i> ' + (cur ? 'current agreement text' : 'older agreement text') + '</div>' +
      row('Signer', a.full_name) +
      row('Account', a.email) +
      row('Accepted', accWhen(a.accepted_at)) +
      row('Network address', a.ip) +
      row('Device', a.agent) +
      row('Agreement version', a.version) +
      row('Document fingerprint (SHA-256)', a.text_hash) +
      row('Method', 'Electronic acceptance: full agreement displayed, consent box ticked, legal name typed, button pressed while signed in with a verified email code') +
      row('Record ID', a.id) +
      '</div>';
  };
  const v = document.createElement('div'); v.className = 'accpop';
  v.innerHTML = '<div class="accpop-in">' +
    '<div class="accpop-head"><div><div class="micro">Desk access agreement</div><h2>' + esc(F(staff,'name','email') || email) + '</h2></div>' +
    '<a class="accx" title="Close">Close</a></div>' +
    (rows.length ? rows.map(one).join('') : '<div class="accrec"><div class="muted">No acceptance on record for ' + esc(email) + '. They will see the agreement the next time they sign in.</div></div>') +
    '<div class="accfoot"><a href="' + ACC_FILE + '" target="_blank" rel="noopener">Open the agreement text</a>' +
    (rows.length ? ' · <a data-acccsv="' + esc(email) + '">Download this record</a>' : '') + '</div>' +
    '</div>';
  document.body.appendChild(v);
  const close = () => v.remove();
  v.onclick = e => { if(e.target === v) close(); };
  v.querySelector('.accx').onclick = close;
  const dl = v.querySelector('[data-acccsv]');
  if(dl) dl.onclick = () => {
    const keys = ['id','email','full_name','accepted_at','ip','agent','version','text_hash','staff_id'];
    const csv = [keys.join(',')].concat(rows.map(a => keys.map(k => '"' + String(a[k] == null ? '' : a[k]).replace(/"/g,'""') + '"').join(','))).join('\n');
    const b = new Blob([csv], { type:'text/csv' }); const u = URL.createObjectURL(b);
    const t = document.createElement('a'); t.href = u; t.download = 'desk-agreement-' + String(email).replace(/[^a-z0-9]+/gi,'-') + '.csv';
    document.body.appendChild(t); t.click(); t.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  };
}
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('[data-acc]'); if(a){ e.preventDefault(); e.stopPropagation(); if(isAdmin()) accSheet(a.dataset.acc); } }, true);
async function sha256(text){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
function accRender(text){
  const lines = text.replace(/\r/g,'').split('\n'); let out = '', ul = false, n = 0;
  const close = () => { if(ul){ out += '</ul>'; ul = false; } };
  for(const raw of lines){
    const l = raw.trim(); if(!l){ close(); continue; }
    if(/^- /.test(l)){ if(!ul){ out += '<ul>'; ul = true; } out += '<li>' + esc(l.slice(2)) + '</li>'; continue; }
    close(); n++;
    if(n === 1){ out += '<p class="cap">' + esc(l) + '</p>'; continue; }
    if(n === 2){ out += '<h2>' + esc(l) + '</h2>'; continue; }
    if(n === 3){ out += '<p class="cap">' + esc(l) + '</p>'; continue; }
    if(/^(\d+\. )?[A-Z][A-Z ,.'§()·]+$/.test(l) && l.length < 80){ out += '<h3>' + esc(l) + '</h3>'; continue; }
    out += '<p>' + esc(l) + '</p>';
  }
  close(); return out;
}
function accVersion(text){ const m = text.match(/^Version\s+(\S+)/m); return m ? m[1] : 'unversioned'; }
/* resolves once this account holds an acceptance of the current agreement text */
async function acceptGate(staff){
  const email = String(F(staff,'email') || '').toLowerCase();
  const r = await fetch(ACC_FILE + '?v=' + Date.now());
  if(!r.ok) throw new Error('The desk agreement could not be loaded.');
  const text = await r.text();
  const ver = accVersion(text), hash = await sha256(text);
  ACC_CUR = hash;
  const have = await rest('desk_acceptances?select=id&email=eq.' + encodeURIComponent(email) + '&text_hash=eq.' + hash + '&limit=1').catch(() => []);
  if(Array.isArray(have) && have.length) return;
  const gate = document.getElementById('gate');
  gate.style.display = '';
  gate.innerHTML = '<div class="acc"><div class="acc-in">' +
    '<div class="micro">Confidential · Authorized access only</div>' +
    '<h1>Before you enter.</h1>' +
    '<div class="acc-doc" id="accDoc">' + accRender(text) + '</div>' +
    '<label class="tick"><input type="checkbox" id="accTick"><span>I have read and agree to the LIVEWORK Desk Access, Confidentiality and Proprietary Rights Agreement.</span></label>' +
    '<div class="field"><label for="accName">Full legal name</label><input type="text" id="accName" autocomplete="name" placeholder="As it appears on your ID"></div>' +
    '<button class="go" id="accGo" disabled>Agree and enter the desk</button>' +
    '<div class="foot">Account ' + esc(email) + ' · Agreement version ' + esc(ver) + ' · Your acceptance, name, time, network address and this document\u2019s fingerprint are recorded.</div>' +
    '</div></div>';
  const tick = $('#accTick'), name = $('#accName'), go = $('#accGo');
  const check = () => { go.disabled = !(tick.checked && name.value.trim().length > 2); };
  tick.onchange = check; name.oninput = check;
  await new Promise(resolve => {
    go.onclick = async () => {
      go.disabled = true; go.textContent = 'Recording';
      try{
        await fnCall('desk-accept', { full_name: name.value.trim(), version: ver, text_hash: hash });
        gate.innerHTML = '';
        resolve();
      }catch(err){
        go.disabled = false; go.textContent = 'Agree and enter the desk';
        toast('Not recorded. ' + err.message, true);
      }
    };
  });
}

/* ============================ boot ============================ */
LWAuth.gate(document.getElementById('gate'), async function(staff){
  ME = staff;
  try{ await acceptGate(staff); }catch(e){ toast(e.message, true); return; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('meName').textContent = F(staff,'name','email');
  document.getElementById('meRole').textContent = 'The Desk · ' + roleLabel(F(staff,'role'));
  document.getElementById('signout').onclick = e => { e.preventDefault(); LWAuth.signOut(); };
  
  $('#scrim').onclick = closeDrawer;
  const jump = (location.hash || '').replace('#','');
  if(NAV.some(([k]) => k === jump)) VIEW = jump;
  try{ await loadAll(); }catch(e){ toast('Could not load. ' + e.message, true); }
  try{ intakeRestore(); }catch(e){ console.warn('tray', e.message); }
  drawNav(); draw();
});

/* ---------- help: answers from help.md through desk-help, nothing stored ---------- */
(function(){
  const P = $('#helpPanel'), L = $('#helpLog'), Qi = $('#helpQ'), G = $('#helpGo');
  if(!P) return;
  let hist = [], busy = false;
  const add = (cls, t) => { const d = document.createElement('div'); d.className = 'hmsg ' + cls; d.textContent = t; L.appendChild(d); L.scrollTop = L.scrollHeight; return d; };
  const open = on => { P.classList.toggle('on', on); if(on) setTimeout(() => Qi.focus(), 50); };
  $('#helpBtn').onclick = () => open(!P.classList.contains('on'));
  $('#helpClose').onclick = () => open(false);
  async function ask(){
    const q = Qi.value.trim(); if(!q || busy) return;
    Qi.value = ''; busy = true; G.disabled = true;
    add('me', q); const w = add('bot wait', 'Thinking');
    try{
      const viewName = (NAV.find(([k]) => k === VIEW) || [VIEW, VIEW])[1];
      const r = await fnCall('desk-help', { q, view: viewName, history: hist.slice(-8) });
      w.className = 'hmsg bot'; w.textContent = r.text || 'No answer came back.';
      hist.push({ role: 'user', text: q }, { role: 'assistant', text: w.textContent });
    }catch(e){ w.className = 'hmsg bot'; w.textContent = 'That did not go through: ' + e.message; }
    busy = false; G.disabled = false; Qi.focus();
  }
  G.onclick = ask; Qi.onkeydown = e => { if(e.key === 'Enter') ask(); };
})();

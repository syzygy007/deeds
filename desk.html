<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Desk. LIVEWORK</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000" id="tc">
<script>(function(){try{var s=localStorage.getItem("lw_skin");if(!s)s=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.skin=s;var m=document.getElementById("tc");if(m)m.content=s==="dark"?"#000000":"#000000";}catch(e){}})();</script>
<link rel="manifest" href="desk.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk">
<link rel="stylesheet" href="lw.css?v=6">
<script src="lw-config.js?v=3"></script>
<script src="lw-auth.js?v=6"></script>
<script src="lw-app.js?v=1" defer></script>
<style>
body{background:var(--paper)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--panel);color:var(--panel-ink);border-right:1px solid var(--panel-line);padding:28px 20px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;overflow:hidden}
.rail .mark{height:22px;margin-left:4px;flex:none}
.rail nav{display:grid;gap:2px;align-content:start;flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:none}
.rail nav::-webkit-scrollbar{width:0;height:0}
.rail nav button{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:var(--panel-dim);font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.rail nav button:hover{color:var(--panel-ink);background:#151515}
.rail nav button.on{color:#000;background:var(--yellow)}
.rail nav button .n{font-size:12px;font-weight:600;opacity:.7}
.rail nav button.on .n{opacity:1}
.rail nav button.tool{margin-top:10px;border-top:1px solid var(--panel-line, #282828);border-radius:0;padding-top:10px;height:50px}
.rail .me{flex:none;margin-top:0;font-size:13px;color:var(--panel-dim);line-height:1.4;padding-top:20px;border-top:1px solid var(--panel-line);display:grid;gap:12px}
.rail .me .who b{display:block;color:var(--panel-ink)}
.rail .me a{color:var(--panel-dim);font-size:12px;font-weight:600}
.rail .skin{justify-self:start}
.main{padding:32px 40px 96px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}
.top h1{font-size:44px}
.top .acts{display:flex;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);width:min(420px,100%)}
.search input{border:0;background:transparent;width:100%;height:100%;outline:0}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.tbl{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl .r{display:grid;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.tbl .r:last-child{border-bottom:0}
.tbl .r:hover{background:var(--paper)}
.tbl .h{font-size:12px;font-weight:600;color:var(--stone);cursor:default;background:var(--paper)}
.tbl .h:hover{background:var(--paper)}
.tbl .r b{font-weight:600}
.tbl .tags{display:flex;gap:6px;flex-wrap:wrap}
.tbl .tags .chip{height:24px;font-size:12px;padding:0 8px}
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--s-draft);flex:none}
/* the one status set, used by every dot in the product */
.st.draft::before{background:var(--s-draft)}
.st.sent::before{background:var(--s-sent)}
.st.paid::before,.st.placed::before,.st.signed::before{background:var(--s-paid)}
.st.past_due::before,.st.overdue::before,.st.passed::before{background:var(--s-due)}
/* void reads as a ring, otherwise it is just another grey dot */
.st.void::before{background:transparent;border:2px solid var(--s-void);width:11px;height:11px}
.st.open::before,.st.released::before,.st.interview::before,.st.client_interview::before{background:var(--yellow-deep)}
.st.offer::before{background:var(--ink)}
.empty{padding:26px 20px;color:var(--stone)}
.sec{margin:44px 0 12px;display:block}
.sec h2{font-size:30px}
.sec .muted{display:block;margin-top:7px;font-size:15px}
/* the stat row. Hairlines divide it, nothing boxes it. */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:transparent;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:36px}
.stat{background:transparent;padding:24px 24px 24px 0;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--stone)}
/* the accent is a dot beside the number, never a filled cell */
.stat.y b::after,.stat.flag b::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--yellow-deep);vertical-align:top;margin:5px 0 0 7px}
.stat.flag b::after{background:var(--s-due)}
.stat.flag.zero b::after,.stat.y.zero b::after{display:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--wall);border-radius:var(--r);padding:12px;min-height:320px}
.col h4{font-size:13px;font-weight:600;color:var(--stone);margin:4px 4px 12px;display:flex;justify-content:space-between}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer}
.card b{font-weight:600;display:block}
.card .m{display:block;font-size:13px;color:var(--stone)}
.card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .acts button{height:28px;padding:0 10px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer}
.card .acts button:hover{background:var(--solid);color:var(--solid-ink);border-color:var(--solid)}
.card.rel{border-left:4px solid var(--yellow)}
.veil{position:fixed;inset:0;background:var(--veil);display:none;z-index:20}
.veil.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--white);z-index:21;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:32px 36px 64px;display:grid;gap:22px;align-content:start}
.sheet.on{transform:none}
.sheet .x{position:absolute;top:20px;right:20px;width:40px;height:40px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);cursor:pointer;font-size:18px}
.sheet h2{font-size:34px;padding-right:48px}
.sheet .sub{color:var(--stone);margin-top:6px}
.sheet h3{font-size:13px;font-weight:600;color:var(--stone);margin-bottom:10px}
.sheet .spec .row{padding:12px 0}
.sheet .tags{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{height:38px;padding:0 14px;border:0;background:transparent;font-weight:600;font-size:14px;color:var(--stone);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--yellow)}
.log{display:grid;gap:10px;font-size:14px}
.log div.e{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start}
.log span{color:var(--stone);font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r)}
.toggle b{font-weight:600;display:block}
.toggle small{color:var(--stone)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.sw.on{background:var(--solid)}
.sw.on::after{left:23px;background:var(--yellow)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--solid);color:var(--solid-ink);padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:14px;display:none;z-index:30;max-width:min(680px,90vw);text-align:center}
.toast.on{display:block}
.toast.bad{background:var(--warn)}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.doc{background:var(--white);border:1px solid var(--line);padding:24px;display:grid;gap:12px;align-content:start;min-height:200px}
.doc h3{font-size:22px;color:var(--ink)}
.doc p{font-size:14px;color:var(--stone)}
.doc .btn{justify-self:start;margin-top:auto}
.auto{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.auto .toggle{background:var(--white);border:0;border-radius:0;padding:18px 20px}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:160px 1fr 52px;gap:12px;align-items:center;font-size:14px}
.barrow .t{height:14px;background:var(--wall);border-radius:var(--r);overflow:hidden}
.barrow .t i{display:block;height:100%;background:var(--ink)}
.barrow .t i.y{background:var(--yellow)}
.gbar{height:10px;background:var(--wall);border-radius:var(--r);overflow:hidden;margin-top:8px}
.gbar i{display:block;height:100%;background:var(--yellow)}
.sig{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.sig i{display:block;width:34px;height:6px;background:var(--wall);border-radius:2px;position:relative;overflow:hidden}
.sig i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.lwdoor{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:var(--paper)}
.lwdoor-in{width:min(460px,100%);background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:40px}
.lwdoor h1{font-size:48px}
.lwerr{color:var(--warn);font-weight:600;font-size:14px;margin-bottom:14px}
.load{padding:80px 0;color:var(--stone)}

/* ------------------------------------------------------------
   The one list on Today. Hairlines, no cards, the action sits
   on the right as a ring you can hit with a thumb.
   ------------------------------------------------------------ */
.feed{border-top:1px solid var(--line)}
.feed .f{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
  padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.feed .fm{display:flex;align-items:center;gap:9px;margin-bottom:7px;
  font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--stone)}
.feed .fm i{width:8px;height:8px;border-radius:50%;background:var(--yellow-deep);flex:none}
.feed .fm.hot{color:var(--s-due)}
.feed .fm.hot i{background:var(--s-due)}
.feed .f b{display:block;font-weight:600;font-size:17px;letter-spacing:-.012em;line-height:1.3}
.feed .f .why{display:block;margin-top:4px;font-size:14px;color:var(--stone)}
.ract{display:grid;justify-items:center;gap:6px;width:66px;padding:0;border:0;background:transparent;
  color:var(--stone);cursor:pointer}
.ract .rc{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.ract svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ract .rl{font-size:11px;font-weight:600;letter-spacing:.01em}
.ract:hover{color:var(--ink)}
.ract:hover .rc{border-color:var(--ink)}
.place{display:inline-flex;align-items:center;gap:6px}
.mag{width:19px;height:19px;flex:none;stroke:var(--stone);fill:none;stroke-width:1.7;stroke-linecap:round}
.pin{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round}

/* one primary action in the header, the rest behind it */
.add{position:relative}
.add .cv{width:15px;height:15px;display:block;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;margin-left:2px}
.add .menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:14;min-width:212px;padding:6px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.add.on .menu{display:grid}
.add .menu button{height:44px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;
  color:var(--ink);font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.add .menu button:hover{background:var(--wall)}

/* ------------------------------------------------------------
   Phone shell. Black bar on top, five tabs on the bottom, the
   full rail as a drawer behind More. Everything clears the
   notch and the home indicator so it reads as an app, not a
   page squeezed onto a phone.
   ------------------------------------------------------------ */
.topbar,.tabbar,.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;position:fixed;top:0;left:0;right:0;z-index:22;align-items:center;justify-content:space-between;
    gap:12px;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);
    height:calc(54px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 16px 0}
  .topbar .mark{height:17px}
  .topbar b{margin-right:auto}
  .on-dark{display:none}
  html[data-skin="dark"] .on-light{display:none}
  html[data-skin="dark"] .on-dark{display:block}
  .topbar b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .topbar .skin{margin-left:4px;flex:none}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(286px,84vw);height:100dvh;z-index:24;
    transform:translateX(-100%);transition:transform .22s ease;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
  .rail.on{transform:none}
  .rail nav{display:grid}
  .scrim{display:block;position:fixed;inset:0;background:var(--veil);z-index:23;opacity:0;
    pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .main{padding:calc(72px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:22;
    background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{position:relative;height:62px;border:0;background:transparent;color:var(--stone);
    font-weight:600;font-size:11px;letter-spacing:.01em;cursor:pointer;padding:6px 2px 0;
    display:grid;gap:5px;justify-items:center;align-content:center}
  .tabbar button svg{width:22px;height:22px;display:block;stroke:currentColor;fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button .d{display:block;position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
    width:20px;height:2px;background:transparent;border-radius:2px}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on .d{background:var(--yellow)}
  .tabbar button .n{position:absolute;top:6px;right:calc(50% - 24px);min-width:17px;height:17px;padding:0 4px;
    border-radius:9px;background:var(--solid);color:var(--solid-ink);font-size:10px;line-height:17px;font-weight:600}
  .sheet{width:100%;padding:calc(20px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
  .sheet .x{position:sticky;top:0;float:right;margin:-4px -4px 0 12px;width:auto;padding:0 14px;height:38px;font-size:13px;font-weight:600;z-index:2}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .stats{grid-template-columns:1fr 1fr;margin-bottom:30px}
  .stat{padding:20px 16px;min-width:0;overflow:hidden}
  .stat:nth-child(odd){padding-left:0}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stat b{font-size:38px;letter-spacing:-.04em}
  .stat span{font-size:13px;display:block;margin-top:5px}
  .stat.y b::after,.stat.flag b::after{width:8px;height:8px;margin:4px 0 0 6px}
  .sec h2{font-size:26px}
  .sec .muted{font-size:14px}
  .docs{grid-template-columns:1fr}
  .top{flex-flow:row wrap;align-items:center;gap:12px 14px}
  .top h1{font-size:40px}
  .form .two{grid-template-columns:1fr}
  .barrow{grid-template-columns:110px 1fr 44px}
  .board{grid-auto-columns:minmax(78vw,1fr);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .rail .mark{height:16px}
  .sec{flex-direction:column;align-items:flex-start;gap:6px}

  /* a table row becomes a card: the name on its own line, the rest
     in two columns, each carrying its column heading */
  .tbl .h{display:none}
  .tbl{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
  .tbl .r{grid-template-columns:1fr 1fr!important;gap:12px 14px;padding:16px 0;align-items:start}
  .tbl .r:last-child{border-bottom:1px solid var(--line)}
  .tbl .r:hover{background:transparent}
  .empty{padding:22px 0}
  /* a metric row: name on its line, the numbers under it in a divided strip */
  .tbl.strip .r{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:16px 0;padding:20px 34px 20px 0;position:relative}
  .tbl.strip .r > *:not(:first-child){display:flex;flex-direction:column-reverse;align-items:flex-start;
    justify-content:flex-start;gap:4px;padding-left:12px;border-left:1px solid var(--line);
    color:var(--ink);font-weight:600;font-size:16px;line-height:1.2}
  .tbl.strip .r > *:nth-child(2){padding-left:0;border-left:0}
  .tbl.strip .r > *:not(:first-child)::before{margin:0;letter-spacing:.01em}
  .tbl.strip .r::after{content:"";position:absolute;right:10px;top:26px;width:8px;height:8px;
    border-right:1.7px solid var(--stone);border-top:1.7px solid var(--stone);transform:rotate(45deg)}
  .feed .f{padding:18px 0}
  .add .menu{min-width:min(280px,80vw)}
  .search{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;
    height:52px;padding:0;width:100%}
  .search input{font-size:16px}
  .tools{margin-bottom:6px}
  .tbl .r > *{min-width:0}
  .tbl .r > *:empty{display:none}
  .tbl .r > *:first-child{grid-column:1 / -1;font-size:17px;font-weight:600}
  /* the status pill draws its dot on ::before, so it opts out of the
     column label here and lets the status word speak for itself */
  .tbl .r > *:not(:first-child):not(.st)::before{content:attr(data-l);display:block;font-size:11px;font-weight:600;
    color:var(--stone);letter-spacing:.02em;margin-bottom:3px}
  .tbl .r .btn{width:100%}
}
@media (max-width:900px) and (display-mode:standalone){
  .main{padding-top:calc(76px + env(safe-area-inset-top))}
}

/* ------------------------------------------------------------
   The Candidates list. A row per person, the verbs on the face
   of it, the follow up underneath in the status colour.
   ------------------------------------------------------------ */
.clist{border-top:1px solid var(--line)}
.clist .c{padding:20px 0;border-bottom:1px solid var(--line)}
.clist .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.clist .ch b{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;cursor:pointer}
.clist .ch .pill{font-size:12px;font-weight:600;background:var(--wall);color:var(--ink);
  padding:5px 12px;border-radius:999px;white-space:nowrap;flex:none}
.clist .ch .pill.warn{background:var(--s-due);color:#fff}
.tbl .r .muted.warn{color:var(--s-due,#b4552a);font-weight:700}
.tbl .r select.rolesel{font:inherit;font-size:13px;font-weight:600;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);color:var(--ink);max-width:140px}
.agwrap{margin-bottom:14px}
.agnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.agnav .btn{padding:4px 10px;font-size:12px;width:auto}
.agnav .agbtns{display:flex;gap:6px;align-items:center}
.agview{display:block;width:100%;height:min(72vh,860px);border:1px solid var(--line);background:var(--paper)}
.agseen{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);background:var(--white);font-size:14px}
.agseen:empty{display:none}
.agseen b{font-weight:600}
.agseen span{color:var(--stone);font-size:13px}
.agseen a{margin-top:6px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.docgate{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:18px;font-size:14px;line-height:1.5;color:var(--stone)}
.docgate.bad{border-color:var(--s-due);color:var(--s-due);font-weight:600}
.docgate.bad a{color:var(--s-due);text-decoration:underline;cursor:pointer}
.clist .m{margin-top:4px;font-size:14px;color:var(--stone)}

/* ---------- Pipeline on a phone ----------
   Six board columns cannot be read on a 390px screen, so the phone gets
   stage tiles that filter one list. The rows match Clients and Candidates,
   with one verb menu per row instead of a strip of buttons. */
.pphone{display:none}
.pfil{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pfil .search{grid-column:1 / -1;width:100%;height:50px}

  .pfil{grid-template-columns:240px 300px minmax(220px,380px);align-items:center;margin-bottom:22px}
  .pfil .search{grid-column:auto}
}
/* the Search page: one poster line, then the subject filters */
.fbar{margin-bottom:12px}
.fbar .search.big{width:100%;height:64px;padding:0 20px;gap:14px}
.fbar .search.big input{font-size:22px;font-weight:700;letter-spacing:-.02em}
.fbar .search.big .mag{width:24px;height:24px;flex:none}
.pfil.ffil{grid-template-columns:1fr 1fr;margin-bottom:12px}
.pfil.ffil .search{grid-column:auto;padding:0 15px}
.pfil.ffil .search input{font:600 15px/1 Manrope,Arial,sans-serif}
.fsort{display:inline-flex;gap:6px;margin-left:14px;padding-left:14px;border-left:1px solid var(--line)}
@media (min-width:901px){ .pfil.ffil{grid-template-columns:repeat(6,minmax(0,1fr))} }
@media (max-width:900px){ .fsort{margin-left:0;padding-left:0;border-left:0;width:100%} }
@media (max-width:900px){ .fbar .search.big{height:56px;padding:0 4px} .fbar .search.big input{font-size:19px} }
.pfil select{-webkit-appearance:none;appearance:none;width:100%;height:50px;padding:0 36px 0 15px;
  border:1px solid var(--line);border-radius:var(--r);background-color:var(--white);color:var(--ink);
  font:600 15px/1 Manrope,Arial,sans-serif;cursor:pointer;text-overflow:ellipsis;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E6961' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9.5 12 15.5 18 9.5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:17px}
.pstage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 28px}

  background:var(--white);color:var(--ink);text-align:left;cursor:pointer;min-width:0}

.phead{display:flex;align-items:baseline;justify-content:space-between;gap:14px}

.plist{display:grid;gap:12px;margin-top:16px}
.plist .p{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--white)}
.plist .p.rel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--yellow);border-radius:var(--r) 0 0 var(--r)}

<body>

<script>
/* ============================================================
   LIVEWORK desk, live layer.
   Reads and writes go straight to PostgREST with the signed in
   staff member's token. RLS staff_all via is_staff() is the guard.
   Every write column name lives in MAP so a schema rename is a
   one line fix here, not a hunt through the file.
   ============================================================ */
/* locked to schema v2 (column dump Sep 2026) */
const MAP = {
  company:   { name:'name', status:'status', kind:'engagement_type', city:'city', industry:'industry', notes:'notes', owner:'owner_id',
               legal:'legal_name', address:'address', notice:'notice_email' },
  contact:   { company:'company_id', name:'name', email:'email', title:'title', phone:'phone', room:'room_access', billing:'is_billing' },
  search:    { company:'company_id', title:'title', location:'location', kind:'engagement_type', status:'status',
               comp_min:'comp_low', comp_max:'comp_high', opened:'opened_at', notes:'notes', owner:'owner_id',
               am:'am_id', recruiter:'recruiter_id', ad:'ad_spend', must:'must_haves', nice:'nice_to_haves' },
  candidate: { name:'name', email:'email', phone:'phone', title:'title', location:'location',
               premier:'premier', premier_reason:'premier_reason', premier_by:'premier_by', notes:'summary' },
  pipeline:  { search:'search_id', candidate:'candidate_id', stage:'stage', released:'released', released_at:'released_at', added_by:'added_by', campaign:'campaign_id' },
  campaign:  { search:'search_id', channel:'channel', name:'name', status:'status', started:'started_on', ended:'ended_on', spend:'spend', note:'spend_note', by:'created_by' },
  activity:  { kind:'type', title:'title', body:'body', outcome:'outcome', company:'company_id', contact:'contact_id',
               candidate:'candidate_id', search:'search_id', staff:'staff_id' },
  task:      { title:'title', due:'due_on', done:'done', company:'company_id', candidate:'candidate_id', search:'search_id',
               staff:'owner_id', created_by:'created_by' },
  note:      { candidate:'candidate_id', search:'search_id', kind:'kind', strong:'strong_at', concerns:'concerns',
               comp:'compensation', availability:'availability', next:'next_step', staff:'staff_id',
               scheduled:'scheduled_at', completed:'completed', completed_at:'completed_at' },
  pool:      { name:'name', note:'description', owner:'owner_id' },
  poolmem:   { pool:'pool_id', candidate:'candidate_id' },
  placement: { pipeline:'pipeline_id', start:'start_date', salary:'base_salary', fee:'fee_amount', fee_pct:'fee_pct',
               guarantee_ends:'guarantee_ends', status:'status' },
  invoice:   { company:'company_id', placement:'placement_id', amount:'amount', status:'status',
               issued:'issued_at', due:'due_at', description:'description', po:'po_number' },
  automation:{ name:'name', trigger:'trigger', enabled:'enabled' },
  expense:   { staff:'staff_id', company:'company_id', search:'search_id', kind:'kind', amount:'amount', spent:'spent_on',
               category:'category', merchant:'merchant', note:'note', receipt:'receipt_path', status:'status',
               approved_by:'approved_by', approved_at:'approved_at', reason:'rejected_reason' }
};
const STAGES = ['Sourced','Submitted','Interview','Offer','Placed','Passed'];
const DBSTAGE = { Sourced:'sourced', Submitted:'submitted', Interview:'client_interview', Offer:'offer', Placed:'placed', Passed:'passed' };
const DISPLAYSTAGE = { sourced:'Sourced', screened:'Sourced', submitted:'Submitted', client_interview:'Interview', interview:'Interview', offer:'Offer', placed:'Placed', passed:'Passed' };
const dbStage = st => DBSTAGE[st] || String(st || 'sourced').toLowerCase();
const AUTOS = [
  ['candidate_released','Candidate released','The client room gets an email the moment you release someone.'],
  ['interview_set','Interview set','Candidate and client both get the time and the address.'],
  ['weekly_digest','Weekly client digest','Monday morning, one email per open search.'],
  ['stale_search','Stale search nudge','Tells you when a search has gone seven days without movement.'],
  ['candidate_checkin','Candidate check in','Keeps a submitted candidate warm while the client decides.'],
  ['placement_day_one','Day one note','Goes out to the placed candidate on their start date.'],
  ['guarantee_close','Guarantee closed','Tells the client when the ninety days are clear.']
];

/* The three agreements, and what each one proves.
   gate:true means a signed copy satisfies the account.
   scoped:true means it only covers the one search it names. */
const DOCK = [
  ['recruiting', 'Client recruiting agreement', 'Account wide. Signed once, covers every contingent role.', true, false],
  ['retained',   'Retained search agreement',   'Role specific. It is its own search order.',                true, true],
  ['nda',        'Mutual NDA',                  'Optional. Usually the first thing signed.',                 false, false],
  ['other',      'Other document',              'Anything else the account should carry.',                   false, false]
];
const dockRow   = k => DOCK.filter(d => d[0] === k)[0] || ['other','Document','',false,false];
const dockLabel = k => dockRow(k)[1];

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = (o,...keys) => { for(const k of keys){ if(o && o[k]!=null && o[k]!=='') return o[k]; } return ''; };
const num = v => { const n = Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const money = n => n ? '$' + Math.round(num(n)).toLocaleString('en-US') : '';
const day = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const short = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const ago = d => { if(!d) return ''; const n = Math.floor((Date.now()-new Date(d))/86400000);
  return n<=0?'today':n===1?'yesterday':n+' days ago'; };
const daysBetween = (a,b) => Math.max(0, Math.round((new Date(b||Date.now()) - new Date(a))/86400000));
const idOf = x => x && (x.id != null ? x.id : x.uuid);
let toastT; function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className='toast on'+(bad?' bad':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast', bad?6000:2400); }

/* ---------- data layer ---------- */
async function alive(){
  const s = LWAuth.ensure ? await LWAuth.ensure() : LWAuth.session;
  if(!s){ toast('Your sign in expired. Opening the door.', true); setTimeout(() => location.reload(), 1200); throw new Error('signed out'); }
  return s;
}
async function rest(path, opts){
  opts = opts || {};
  await alive();
  const h = { apikey: LW.anon, Authorization: 'Bearer ' + LWAuth.token(), 'content-type':'application/json' };
  if(opts.prefer) h.Prefer = opts.prefer;
  const r = await fetch(LW.url + '/rest/v1/' + path, { method: opts.method || 'GET', headers: h, body: opts.body });
  const text = await r.text();
  let j = null; try{ j = text ? JSON.parse(text) : null; }catch(e){ j = null; }
  if(!r.ok){
    const msg = (j && (j.message || j.hint || j.details)) || text || ('HTTP ' + r.status);
    throw new Error(msg);
  }
  return j;
}
const readAll = t => rest(t + '?select=*&limit=2000').catch(e => { console.warn(t, e.message); return []; });
async function insert(t, row){
  const out = await rest(t, { method:'POST', body: JSON.stringify(row), prefer:'return=representation' });
  return Array.isArray(out) ? out[0] : out;
}
async function patch(t, id, row){
  const out = await rest(t + '?id=eq.' + encodeURIComponent(id), { method:'PATCH', body: JSON.stringify(row), prefer:'return=representation' });
  return Array.isArray(out) ? out[0] : out;
}
/* filter is a PostgREST query string, e.g. company_id=eq.<id> or search_id=in.(a,b) */
async function del(t, filter){
  await rest(t + '?' + filter, { method:'DELETE', prefer:'return=minimal' });
  return true;
}
async function fnCall(name, body){
  await alive();
  const r = await fetch(LW.url + '/functions/v1/' + name, { method:'POST',
    headers:{ apikey: LW.anon, Authorization:'Bearer ' + LWAuth.token(), 'content-type':'application/json' },
    body: JSON.stringify(body || {}) });
  const t = await r.text();
  let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
  if(!r.ok || !j || j.ok === false) throw new Error((j && j.error) || t || ('HTTP ' + r.status));
  return j;
}
function openUrl(u){ const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove(); }
function clean(o){ const x = {}; for(const k in o){ if(o[k] !== undefined && o[k] !== '') x[k] = o[k]; } return x; }
async function tryWrite(fn, okMsg){
  try{ const r = await fn(); if(okMsg) toast(okMsg); return r; }
  catch(e){ toast('Did not save. ' + e.message, true); console.error(e); return null; }
}

/* ---------- store ---------- */
const S = { staff:[], companies:[], contacts:[], searches:[], tags:[], search_tags:[], candidates:[],
  candidate_tags:[], pipeline:[], pipeline_log:[], placements:[], invoices:[], documents:[],
  automations:[], outbound:[], import_sources:[], activity:[], tasks:[], interview_notes:[], interview_guides:[],
  pools:[], pool_members:[], intake_queue:[], signature_requests:[], campaigns:[], lw_payable:[], desk_acceptances:[], expenses:[] };
let ME = null;

async function loadAll(){
  const keys = Object.keys(S);
  const rows = await Promise.all(keys.map(readAll));
  keys.forEach((k,i) => S[k] = rows[i] || []);
  enrich();
}
/* read side aliases so every screen sees one vocabulary */
function enrich(){
  S.placements.forEach(p => { const pp = byId(S.pipeline, p.pipeline_id) || {};
    p.candidate_id = pp.candidate_id; p.search_id = pp.search_id; p.staff_id = pp.added_by;
    p.company_id = (search(pp.search_id) || {}).company_id;
    if(p.salary == null) p.salary = p.base_salary; if(p.fee == null) p.fee = p.fee_amount; });
  S.activity.forEach(a => { if(a.kind == null) a.kind = a.type; if(!a.created_at) a.created_at = a.occurred_at; });
  S.tasks.forEach(t => { if(t.due_at == null) t.due_at = t.due_on; if(t.staff_id == null) t.staff_id = t.owner_id; });
  S.outbound.forEach(o => { if(!o.created_at) o.created_at = o.sent_at || o.queued_at; });
  S.import_sources.forEach(x => { x.name = x.label || x.provider; x.status = x.enabled ? 'On' : (x.api_key ? 'Key set, off' : 'Key not set'); });
  S.automations.forEach(a => { a.key = a.trigger || a.name; });
  S.searches.forEach(x => { if(x.comp_min == null) x.comp_min = x.comp_low; if(x.comp_max == null) x.comp_max = x.comp_high;
    if(x.kind == null) x.kind = x.engagement_type; });
  S.companies.forEach(c => { if(c.kind == null) c.kind = c.engagement_type; if(c.fee == null && c.fee_pct != null) c.fee = c.fee_pct + '% of first year base'; });
  S.pools.forEach(p => { if(p.note == null) p.note = p.description; });
  S.interview_notes.forEach(n => { if(n.comp == null) n.comp = n.compensation; });
  S.candidates.forEach(c => { if(c.notes == null) c.notes = c.summary; });
}

/* ---------- lookups ---------- */
const byId = (arr,id) => arr.filter(x => String(idOf(x)) === String(id))[0] || null;
const company = id => byId(S.companies, id);
const cand = id => byId(S.candidates, id);
const search = id => byId(S.searches, id);
const cname = id => F(company(id) || {}, 'name','company_name','title') || 'No client';
const sname = id => F(search(id) || {}, 'title','role','job_title','name') || 'Search';
const pname = id => F(cand(id) || {}, 'name','full_name') || 'Candidate';
const stageOf = p => { const s = String(F(p,'stage','status') || '').toLowerCase(); return DISPLAYSTAGE[s] || 'Sourced'; };
const stageIx = p => Math.max(0, STAGES.indexOf(stageOf(p)));
const isReleased = p => p[MAP.pipeline.released] === true || p.release === true || p.released_at != null;
const isOpen = s => ['open','on_hold'].indexOf(String(F(s,'status') || 'open').toLowerCase()) >= 0;
const tagNames = cid => S.candidate_tags.filter(t => String(t.candidate_id) === String(cid))
  .map(t => { const tag = byId(S.tags, t.tag_id); return tag ? F(tag,'name','label') : ''; }).filter(Boolean);
const rowsFor = cid => S.pipeline.filter(p => String(p.candidate_id) === String(cid));
const contactsOf = coid => S.contacts.filter(c => String(c.company_id) === String(coid));
/* a client that is being worked needs a billing contact, so invoices and
   reminders never fall to the hiring manager */
function needsBilling(coId){
  if(contactsOf(coId).some(ct => ct[MAP.contact.billing] === true)) return false;
  return S.searches.some(s => String(s.company_id) === String(coId) && isOpen(s)) ||
         S.invoices.some(i => String(i.company_id) === String(coId));
}

/* outcome only. submit to interview, interview to offer, placement history, recency. never sentiment. */
function signal(c){
  const rows = rowsFor(idOf(c));
  const sub = rows.filter(p => stageIx(p) >= 1).length;
  if(!sub) return null;
  const int = rows.filter(p => stageIx(p) >= 2 && stageOf(p) !== 'Passed').length;
  const off = rows.filter(p => stageIx(p) >= 3 && stageOf(p) !== 'Passed').length;
  const plc = S.placements.filter(p => String(p.candidate_id) === String(idOf(c))).length;
  const s2i = int / sub;
  const i2o = int ? off / int : 0;
  const last = [...S.activity.filter(a => String(a.candidate_id) === String(idOf(c))).map(a => a.created_at),
                F(c,'last_touch_at','created_at')].filter(Boolean).sort().pop();
  const d = last ? daysBetween(last) : 400;
  const rec = d <= 14 ? 1 : d <= 45 ? .7 : d <= 120 ? .4 : .1;
  return Math.round(40*s2i + 25*i2o + 20*Math.min(plc,2)/2 + 15*rec);
}
const sigBar = v => v == null ? '<span class="muted small">Not submitted yet</span>'
  : '<span class="sig"><i><b style="width:' + v + '%"></b></i>' + v + '</span>';
</script>

<script>
/* ============================ views ============================ */
const NAV = [
  ['today','Today'],['companies','Clients'],['searches','Roles'],['candidates','Candidates'],['find','Search'],['intake','Intake'],
  ['pools','Pools'],['pipeline','Pipeline'],['activity','Activity'],['placements','Placements'],
  ['invoices','Invoices'],['expenses','Expenses'],['mail','Mail'],['reports','Reports'],['people','People'],['settings','Settings']
];
let VIEW = 'today';
let Q = { cand:'', co:'', tag:'', prem:'', se:'', searchTab:'open', coTab:'open', pipeCo:'', pipeSe:'', pipeQ:'', stage:'Submitted',
  fq:'', fCo:'', fSe:'', fCamp:'', fRole:'', fInd:'', fSkill:'', fState:'', fSort:'best' };

function counts(k){
  if(k==='today') return S.tasks.filter(t => !t.done).length;
  if(k==='companies') return S.companies.length;
  if(k==='searches') return S.searches.filter(isOpen).length;
  if(k==='candidates') return S.candidates.length;
  if(k==='pools') return S.pools.length;
  if(k==='pipeline') return S.pipeline.filter(p => stageOf(p)!=='Placed' && stageOf(p)!=='Passed').length;
  if(k==='placements') return S.placements.length;
  if(k==='invoices') return S.invoices.filter(i => String(F(i,'status')).toLowerCase()!=='paid').length;

function myNumbers(){
  const me = meId(); if(!me) return '';
  const since = Date.now() - 30 * 86400000;
  const recent = (d) => d && new Date(d).getTime() >= since;
  const mine = a => String(F(a,'staff_id')) === String(me);
  const acts = S.activity.filter(a => mine(a) && recent(F(a,'created_at','occurred_at')));
  const callsMade = acts.filter(a => String(F(a,'kind','type')) === 'call').length;
  const visits = acts.filter(a => String(F(a,'kind','type')) === 'visit').length;
  const mail = S.outbound.filter(o => String(F(o,'staff_id')) === String(me) && recent(F(o,'sent_at','created_at','queued_at'))).length;
  const sent = S.outbound.filter(o => String(F(o,'staff_id')) === String(me)
    && String(F(o,'template')) === 'presentation' && recent(F(o,'sent_at','created_at','queued_at'))).length;
  const myCos = S.companies.filter(c => String(F(c,'owner_id')) === String(me));
  const myIds = myCos.map(c => String(idOf(c)));
  const mySearch = S.searches.filter(s => String(F(s,'owner_id')) === String(me) || myIds.indexOf(String(s.company_id)) >= 0);
  const openMine = mySearch.filter(isOpen).length;
  const searchIds = mySearch.map(s => String(idOf(s)));
  const inter = S.pipeline.filter(p => searchIds.indexOf(String(p.search_id)) >= 0 && stageIx(p) >= 2 && stageOf(p) !== 'Passed').length;
  const placed = S.placements.filter(p => searchIds.indexOf(String(p.search_id)) >= 0);
  const fees = placed.reduce((n, p) => n + num(F(p,'fee','fee_amount')), 0);
  const cell = (v, l, y) => '<div class="stat' + (y ? ' y' : '') + '"><b>' + v + '</b><span>' + l + '</span></div>';
  return '<div class="sec"><h2>My numbers.</h2><span class="muted">Last thirty days.</span></div>' +
    '<div class="stats">' +
      cell(callsMade + visits, 'Calls and visits logged') +
      cell(mail, 'Emails sent') +
      cell(sent, 'Candidates sent', true) +
      cell(inter, 'Interviews reached') +
    '</div>' +
    '<div class="stats">' +
      cell(myCos.length, 'My clients') +
      cell(openMine, 'My open searches') +
      cell(placed.length, 'My placements') +
      cell(money(fees), 'Fees on my placements') +
    '</div>';
}

/* ------------------------------------------------------------
   The agreement gate. A client is complete when it holds a
   signed recruiting agreement, or a signed retained agreement
   for every open role. Anything else with a search running is
   incomplete and says so.
   ------------------------------------------------------------ */
function docsOf(coId){ return S.documents.filter(d => String(d.company_id) === String(coId)); }
function docSigned(d){ return d.signed === true || d[MAP.doc && MAP.doc.signed] === true || d.signed_at != null; }
function docState(coId){
  const open = S.searches.filter(s => String(s.company_id) === String(coId) && isOpen(s));
  const ds = docsOf(coId);
  if(ds.filter(d => F(d,'kind') === 'recruiting' && docSigned(d)).length)
    return { ok:true, why:'Client recruiting agreement signed and on file' };
  const ret = ds.filter(d => F(d,'kind') === 'retained' && docSigned(d));
  const covered = id => ret.some(d => String(d.search_id) === String(id));
  const bare = open.filter(s => !covered(idOf(s)));
  if(!open.length) return { ok:true, quiet:true, why: ds.length ? 'No open role right now' : 'No agreement yet, and no open role' };
  if(!bare.length) return { ok:true, why:'Every open role has a signed retained agreement' };
  return { ok:false, need:bare,
    why: bare.length === open.length
      ? 'No signed agreement, and ' + open.length + (open.length === 1 ? ' open role' : ' open roles')
      : bare.length + (bare.length === 1 ? ' open role has' : ' open roles have') + ' no signed agreement' };
}
function gateBanner(coId){
  const st = docState(coId);
  if(st.ok && st.quiet) return '';
  return '<div class="docgate ' + (st.ok ? 'ok' : 'bad') + '">' +
    (st.ok ? 'Complete. ' : 'Incomplete. ') + esc(st.why) +
    (st.ok ? '' : ' <a data-new="agreement" data-co="' + coId + '">Draw up the agreement</a>') + '</div>';
}

function needsYou(sc){
  const out = [];
  const push = (days, tag, hot, what, why, open, act) => out.push({ days, tag, hot, what, why, open, act });

  sc.ses.filter(isOpen).forEach(s => {
    const rows = sc.pipe.filter(p => String(p.search_id) === String(idOf(s)) && stageIx(p) >= 1);
    if(rows.length) return;
    const d = daysBetween(F(s,'opened_at','created_at'));
    if(d < 3) return;
    push(d, 'NOBODY SUBMITTED', d >= 14, esc(F(s,'title','role')) + ' · ' + esc(cname(s.company_id)),
      'The search is open and empty', 'se:' + idOf(s), null);
  });

  sc.pipe.filter(p => stageIx(p) >= 1 && stageOf(p) !== 'Placed' && stageOf(p) !== 'Passed').forEach(p => {
    const d = daysBetween(F(p,'since','created_at'));
    if(d < 7) return;
    push(d, 'SITTING', d >= 14, esc(pname(p.candidate_id)) + ' · ' + esc(sname(p.search_id)),
      'Still at ' + stageOf(p), 'cand:' + p.candidate_id,
      { k:'nudge', l:'Nudge', a:'data-mail="pipe:' + idOf(p) + '"' });
  });

  sc.notes.filter(noteOpen).forEach(n => {
    const d = daysBetween(noteWhen(n));
    if(new Date(noteWhen(n)) > new Date()) return;
    push(d, 'NOTES DUE', true, esc(pname(n.candidate_id)) + (n.search_id ? ' · ' + esc(sname(n.search_id)) : ''),
      'Interviewed ' + short(noteWhen(n)) + ', nothing written', 'cand:' + n.candidate_id,
      { k:'write', l:'Write up', a:'data-fillnote="' + idOf(n) + '"' });
  });

  sc.cos.forEach(c => {
    const openSe = sc.ses.filter(s => String(s.company_id) === String(idOf(c)) && isOpen(s)).length;
    if(!openSe) return;
    const last = lastTouch(idOf(c));
    const d = last ? daysBetween(last) : 999;
    if(d < 14) return;
    push(d, last ? 'NO CONTACT' : 'NEVER CONTACTED', d >= 30, esc(F(c,'name')),
      'An open search is running here', 'co:' + idOf(c),
      { k:'call', l:'Log', a:'data-logcall="|' + idOf(c) + '"' });
  });

  sc.cos.forEach(c => {
    const st = docState(idOf(c));
    if(st.ok) return;
    const d = daysBetween(F(st.need[0],'opened_at','created_at'));
    push(d, 'NO AGREEMENT', true, esc(F(c,'name')), st.why, 'co:' + idOf(c),
      { k:'doc', l:'Draw up', a:'data-new="agreement" data-co="' + idOf(c) + '"' });
  });

  const seIds = sc.ses.map(x => String(idOf(x)));
  (amCampaigns() ? S.campaigns : []).filter(x => seIds.indexOf(String(x.search_id)) >= 0 && campNoSpend(x)).forEach(x => {
    const d = daysBetween(F(x,'started_on','created_at'));
    if(d < 3) return;
    push(d, 'NO SPEND', d >= 14, esc(campLabel(x)) + ' · ' + esc(sname(x.search_id)),
      'Running ' + d + ' days with no cost on it', 'se:' + x.search_id,
      { k:'spend', l:'Add it', a:'data-camp="' + idOf(x) + '"' });
  });

  /* money asked for and money owed a receipt */
  if(amAdmin()) S.expenses.filter(x => exStatus(x) === 'requested').forEach(x => {
    const d = daysBetween(F(x,'created_at'));
    push(d, 'ASKING', d >= 3, exMoney(x) + ' \u00b7 ' + esc(cname(x.company_id)),
      esc(exWho(x)) + ' wants to spend it' + (F(x,'merchant') ? ' at ' + esc(F(x,'merchant')) : '') + (F(x,'note') ? '. ' + esc(F(x,'note')) : ''),
      'ex:' + idOf(x), { k:'ok', l:'Approve', a:'data-exok="' + idOf(x) + '"' });
  });
  S.expenses.filter(x => String(x.staff_id) === String(meId()) && exStatus(x) === 'approved' && x.kind === 'request' && !F(x,'receipt_path')).forEach(x => {
    const d = daysBetween(F(x,'approved_at','created_at'));
    if(d < 1) return;
    push(d, 'NO RECEIPT', d >= 7, exMoney(x) + ' \u00b7 ' + esc(cname(x.company_id)),
      'Approved, the receipt is still owed', 'ex:' + idOf(x),
      { k:'receipt', l:'Attach', a:'data-ex="' + idOf(x) + '"' });
  });

  sc.tasks.filter(t => F(t,'due_at','due_on') && new Date(F(t,'due_at','due_on')) < new Date(new Date().setHours(0,0,0,0))).forEach(t => {
    const d = daysBetween(F(t,'due_at','due_on'));
    push(d, 'OVERDUE', true, esc(F(t,'title','body')), 'Waiting for action',
      t.candidate_id ? 'cand:' + t.candidate_id : t.company_id ? 'co:' + t.company_id : '',
      { k:'done', l:'Done', a:'data-done="' + idOf(t) + '"' });
  });

  return out.sort((a,b) => b.days - a.days);
}

function vToday(){
  const sc = myScope();
  const openS = sc.ses.filter(isOpen);
  const live = sc.pipe.filter(p => stageOf(p) !== 'Placed' && stageOf(p) !== 'Passed');

      '<div class="stat"><b>' + openS.length + '</b><span>Open roles</span></div>' +

      '<div class="stat flag' + (work.length ? '' : ' zero') + '"><b>' + work.length + '</b><span>Needs attention</span></div>' +
    '</div>' +

    '<div class="sec"><h2>What needs you.</h2><span class="muted">Longest sitting first. Nothing here was typed by hand.</span></div>' +
    '<div class="feed">' + (work.length ? work.slice(0, 15).map(w =>
      '<div class="f"' + (w.open ? ' data-' + w.open.split(':')[0] + '="' + w.open.split(':')[1] + '"' : '') + '>' +
        '<div><div class="fm' + (w.hot ? ' hot' : '') + '"><i></i>' + sat(w) + '</div>' +

        ract(w.act) + '</div>').join('')
      : '<div class="empty">Nothing is sitting. Go find work.</div>') + '</div>' +

    '<div class="sec"><h2>Interviews booked.</h2><span class="muted">The meeting lives in Outlook. The notes live here.</span></div>' +
    table(['When','Candidate','Search','Kind','Notes'],
      booked.slice(0, 10).map(n => '<div class="r" style="grid-template-columns:180px 1.2fr 1.4fr 130px 140px" data-cand="' + n.candidate_id + '">' +
        '<b>' + esc(when(noteWhen(n))) + '</b>' +
        '<span>' + esc(pname(n.candidate_id)) + '</span>' +
        '<span class="muted">' + esc(n.search_id ? sname(n.search_id) + ' · ' + cname(coOfSearch(n.search_id)) : 'No search') + '</span>' +
        '<span class="muted small">' + esc(String(F(n,'kind') || 'interview').replace(/_/g,' ')) + '</span>' +
        '<span><button class="btn sm ghost" data-fillnote="' + idOf(n) + '">Write it up</button></span></div>'),
      '180px 1.2fr 1.4fr 130px 140px', { empty:'No interviews scheduled.' }) +

    (amAdmin() && invDue().length ? '<div class="sec"><h2>Billing.</h2><span class="muted">' + invDue().length + ' need a send.</span></div>' +
      table(['Invoice','Client','Amount','Where it stands','Action'],

/* ---------- Companies ---------- */
/* ---------- Clients ----------
   A company does not answer a phone, so the row names the person you
   actually deal with. Who that is comes out of the log: whoever was
   last spoken to, then whoever holds the client room, then the first
   contact on file. The billing contact is skipped because that is
   accounts payable, not who you call about a search. */
function keyContact(coId){
  const list = contactsOf(coId);
  if(!list.length) return null;
  const spoken = S.activity.filter(a => String(a.company_id) === String(coId) && a.contact_id)
    .sort((a,b) => String(F(a,'created_at','occurred_at') || '').localeCompare(String(F(b,'created_at','occurred_at') || '')))
    .map(a => a.contact_id).pop();
  const order = [];
  const add = x => { if(x && order.indexOf(x) < 0) order.push(x); };
  if(spoken) add(list.filter(x => String(idOf(x)) === String(spoken))[0]);
  add(list.filter(x => x[MAP.contact.room] === true)[0]);
  list.filter(x => x[MAP.contact.billing] !== true).forEach(add);
  list.forEach(add);
  /* whoever is callable wins. a contact with no number cannot be tapped,
     so the row falls to the next person who has one. */
  const hasPhone = x => String(F(x,'phone') || '').replace(/[^0-9+]/g,'').length >= 7;
  return order.filter(hasPhone)[0] || order.filter(x => F(x,'email'))[0] || order[0];
}
/* the last touch on a client, and the name it went to if we know it */
function coTouch(coId){
  const acts = S.activity.filter(a => String(a.company_id) === String(coId))
    .sort((a,b) => String(F(a,'created_at','occurred_at') || '').localeCompare(String(F(b,'created_at','occurred_at') || '')));
  const last = acts[acts.length - 1];
  if(!last) return null;
  const ct = last.contact_id ? byId(S.contacts, last.contact_id) : null;
  return { when: F(last,'created_at','occurred_at'), who: ct ? F(ct,'name') : '' };
}
/* open searches drive the order. a client with work running and nobody
   spoken to in weeks sits at the top. quiet clients fall to the bottom. */
function coRank(c){
  const id = idOf(c);
  const open = S.searches.filter(x => String(x.company_id) === String(id) && isOpen(x)).length;
  const t = coTouch(id);
  const d = t ? daysBetween(t.when) : 999;
  return open ? -d : 1000 - d;
}
function coRow(c){
  const id = idOf(c);
  const ct = keyContact(id);
  const open = S.searches.filter(x => String(x.company_id) === String(id) && isOpen(x)).length;
  const t = coTouch(id);
  const d = t ? daysBetween(t.when) : null;
  const ph = ct ? String(F(ct,'phone') || '').replace(/[^0-9+]/g, '') : '';
  const em = ct ? F(ct,'email') : '';
  const line = ct ? [F(ct,'name'), F(ct,'title')].filter(Boolean).join(' \u00b7 ')
                  : 'No contact on file';
  const touched = !t ? 'No contact yet'
    : 'Last contacted ' + (t.who ? esc(t.who) + ' ' : '') + ago(t.when);
  const stale = open && (d === null || d >= 14);
  return '<div class="c">' +
    '<div class="ch"><b data-co="' + id + '">' + esc(F(c,'name')) + '</b>' +
      '<span class="pill">' + (open ? open + (open === 1 ? ' open role' : ' open roles') : 'No open role') + '</span>' +
      (docState(id).ok ? '' : '<span class="pill warn">No agreement</span>') +
      (needsBilling(id) ? '<span class="pill warn">No billing contact</span>' : '') + '</div>' +
    '<div class="m">' + esc(line) + (F(c,'city','location') ? ' \u00b7 ' + esc(F(c,'city','location')) : '') + '</div>' +
    '<div class="t">' + touched + '</div>' +
    '<div class="a">' +
      (ph ? '<a href="tel:' + esc(ph) + '" data-touch="ct:' + idOf(ct) + '|call">' + CALLI + 'Call</a>'
          : '<a data-logcall="|' + id + '">' + CALLI + 'Log a call</a>') +
      (em ? '<a href="mailto:' + esc(em) + '" data-touch="ct:' + idOf(ct) + '|email">' + MAILI + 'Email</a>'
          : '<a data-mail="co:' + id + '">' + MAILI + 'Email</a>') +
      '<a data-co="' + id + '">' + OPENI + 'Open</a>' +
    '</div>' +
    (stale ? '<div class="f hot">' + CLOCKI +
      (d === null ? 'A search is open and nobody has been called'
                  : 'A search is open, ' + d + ' days since anyone was called') + '</div>' : '') +
    '</div>';
}

function vCompanies(){
  const q = Q.co.toLowerCase();
  const hay = c => (F(c,'name') + ' ' + contactsOf(idOf(c)).map(x => F(x,'name') + ' ' + F(x,'title')).join(' ')).toLowerCase();

/* ---------- Candidates ---------- */
/* ---------- Candidates ----------
   One row per person with the verbs on it. Pressing Call or Email
   writes the activity itself, so the last contacted line stays true
   without anybody typing. The follow up is the next open task on
   that candidate, and the list is sorted by it: overdue at the top,
   then due, then the people nobody has touched at all. */
const dayDiff = d => Math.round((new Date(new Date(d).setHours(0,0,0,0))
  - new Date(new Date().setHours(0,0,0,0))) / 86400000);

function candTouch(c){
  const id = idOf(c);
  return [...S.activity.filter(a => String(a.candidate_id) === String(id))
            .map(a => F(a,'created_at','occurred_at')), F(c,'last_touch_at')]
         .filter(Boolean).sort().pop();
}
function candFollow(c){
  const id = idOf(c);
  return S.tasks.filter(t => !t.done && String(t.candidate_id) === String(id))
    .map(t => F(t,'due_at','due_on')).filter(Boolean).sort()[0];
}
function candRank(c){
  const f = candFollow(c);
  if(f) return dayDiff(f);
  if(!candTouch(c)) return 900 + dayDiff(F(c,'created_at') || new Date());
  return 9000 - dayDiff(candTouch(c));
}

const CALLI  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 4.6h3l1.5 3.7-2 1.4a10.4 10.4 0 0 0 5.6 5.6l1.4-2 3.7 1.5v3a1.6 1.6 0 0 1-1.8 1.6C11.3 18.9 5.1 12.7 4.6 6.4a1.6 1.6 0 0 1 1.6-1.8Z"/></svg>';
const MAILI  = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.6 6.6 12 12.6l8.4-6"/></svg>';
const OPENI  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M13.5 6.5 20 12l-6.5 5.5"/></svg>';
const CLOCKI = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.3V12l3.2 2"/></svg>';

function followLine(c){
  const f = candFollow(c);
  if(!f) return '';
  const d = dayDiff(f);
  const w = d < -1 ? 'Overdue ' + Math.abs(d) + ' days'
    : d === -1 ? 'Overdue since yesterday'
    : d === 0 ? 'Follow up today'
    : d === 1 ? 'Follow up tomorrow'
    : d <= 6 ? 'Follow up ' + new Date(f).toLocaleDateString('en-US', { weekday:'long' })
    : 'Follow up ' + short(f);
  return '<div class="f' + (d <= 0 ? ' hot' : '') + '">' + CLOCKI + w + '</div>';
}

function candRow(c){
  const id = idOf(c);
  const stages = rowsFor(id).map(stageOf).filter(x => x !== 'Passed');
  const st = stages.length ? stages[stages.length - 1] : 'New';
  const t = candTouch(c);
  const ph = String(F(c,'phone') || '').replace(/[^0-9+]/g, '');

        esc(F(c,'name','full_name')) + '</b>' +
      '<span class="pill">' + esc(st) + '</span></div>' +
    (line ? '<div class="m">' + esc(line) + '</div>' : '') +
    '<div class="t">' + (t ? 'Last contacted ' + ago(t) : 'No contact yet') + '</div>' +

          : '<a data-logcall="' + id + '|">' + CALLI + 'Call</a>') +
      (em ? '<a href="mailto:' + esc(em) + '" data-touch="cand:' + id + '|email">' + MAILI + 'Email</a>'
          : '<a data-mail="cand:' + id + '">' + MAILI + 'Email</a>') +
      '<a data-cand="' + id + '">' + OPENI + 'Open</a>' +
    '</div>' +
    followLine(c) + '</div>';
}

/* the whole parsed resume is searchable, not just the name line, because the
   pool is only worth having if a phrase from page two can find somebody */
function candHay(c){
  if(c.__hay) return c.__hay;
  const pj = c.profile_json || {};
  const secs = (pj.sections || []).map(x =>
    (x.heading || '') + ' ' + (Array.isArray(x.lines) ? x.lines.join(' ') : (x.body || ''))).join(' ');
  c.__hay = [F(c,'name','full_name'), F(c,'title','headline'), F(c,'location'),
    F(c,'summary'), (pj.tags || []).join(' '), secs].join(' ').toLowerCase();
  return c.__hay;
}
function vCandidates(){
  const q = Q.cand.toLowerCase();
  const all = S.candidates.filter(c => {
    if(q && !candHay(c).includes(q)) return false;
    if(Q.prem && c[MAP.candidate.premier] !== true) return false;
    if(Q.tag && !tagNames(idOf(c)).includes(Q.tag)) return false;
    return true;
  });
  const tags = S.tags.map(t => F(t,'name','label')).filter(Boolean);
  const rows = all.map(c => ({ c, r: candRank(c) })).sort((a,b) => a.r - b.r).map(x => candRow(x.c));
  return head('Candidates.',
      '<button class="btn ghost" data-new="candidate">Add candidate</button>' +
      '<button class="btn" data-v="intake">Import r\u00e9sum\u00e9s</button>') +
    '<div class="tools"><div class="search">' + SRCH + '<input id="qcand" placeholder="Name, title, or any word in the resume" value="' + esc(Q.cand) + '"></div>' +
      '<button class="chip ' + (Q.prem?'on':'') + '" data-prem="' + (Q.prem?'':'1') + '">Premier</button>' +
      '<button class="chip ' + (Q.tag?'':'on') + '" data-tag="">All</button>' +
      tags.map(t => '<button class="chip ' + (Q.tag===t?'on':'') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>').join('') +
    '</div>' +
    (rows.length ? '<div class="clist">' + rows.join('') + '</div>'
                 : '<div class="tbl"><div class="empty">Nobody here yet. Add a candidate, or drop resumes in.</div></div>');
}

/* ---------- Search ----------
   One line over the whole pool, then narrow by subject. Every filter is
   derived from what is already on file: a candidate belongs to a client or a
   role through their pipeline rows or the search they came in on, to a
   campaign through pipeline.campaign_id or the campaign written on intake,
   to a skill through the tags the reader pulled off the resume. */
function skillsOf(c){ return ((c.profile_json || {}).tags || []).map(x => String(x).toLowerCase()); }
function candSearchIds(c){
  const id = idOf(c);
  const ids = S.pipeline.filter(p => String(p.candidate_id) === String(id)).map(p => String(p.search_id));
  if(F(c,'source_search_id')) ids.push(String(F(c,'source_search_id')));
  return ids;
}
function vFind(){
  const terms = Q.fq.toLowerCase().split(/\s+/).filter(Boolean);
  const skill = Q.fSkill.trim().toLowerCase();
  const camp = Q.fCamp ? byId(S.campaigns, Q.fCamp) : null;
  const campName = camp ? String(F(camp,'name') || '').toLowerCase() : '';
  const hit = c => {
    if(terms.length){ const h = candHay(c); if(!terms.every(t => h.includes(t))) return false; }
    if(Q.fInd && !tagNames(idOf(c)).includes(Q.fInd)) return false;
    if(Q.fRole && String(F(c,'role_type') || '') !== Q.fRole) return false;
    if(skill && !skillsOf(c).some(x => x.includes(skill)) && !candHay(c).includes(skill)) return false;
    const seIds = candSearchIds(c);
    if(Q.fSe && seIds.indexOf(String(Q.fSe)) < 0) return false;
    if(Q.fCo && !seIds.some(x => String((search(x) || {}).company_id) === String(Q.fCo))) return false;
    if(Q.fCamp){
      const onCamp = S.pipeline.some(p => String(p.candidate_id) === String(idOf(c)) && String(p.campaign_id) === String(Q.fCamp))
        || (campName && String(F(c,'campaign') || '').toLowerCase() === campName);
      if(!onCamp) return false;
    }
    if(Q.fState){
      const live = rowsFor(idOf(c)).filter(p => stageOf(p) !== 'Passed' && stageOf(p) !== 'Placed');
      const placed = rowsFor(idOf(c)).some(p => stageOf(p) === 'Placed');
      if(Q.fState === 'play' && !live.length) return false;
      if(Q.fState === 'pool' && (live.length || placed)) return false;
      if(Q.fState === 'placed' && !placed) return false;
    }
    return true;
  };
  const found = S.candidates.filter(hit);
  const byName = (a,b) => String(F(a,'name','full_name')).localeCompare(String(F(b,'name','full_name')), undefined, { sensitivity:'base' });
  const byDate = (a,b) => String(F(b,'created_at') || '').localeCompare(String(F(a,'created_at') || ''));
  const sorted = Q.fSort === 'az' ? found.slice().sort(byName)
    : Q.fSort === 'date' ? found.slice().sort(byDate)
    : found.map(c => ({ c, r: candRank(c) })).sort((a,b) => a.r - b.r).map(x => x.c);
  const rows = sorted.slice(0, 200).map(candRow);
  const seList = S.searches.filter(x => !Q.fCo || String(x.company_id) === String(Q.fCo));
  const campList = S.campaigns.filter(x => !Q.fSe || String(x.search_id) === String(Q.fSe))
    .filter(x => !Q.fCo || String((search(x.search_id) || {}).company_id) === String(Q.fCo));
  const roles = ROLETYPES.slice();
  S.candidates.forEach(c => { const r = F(c,'role_type'); if(r && roles.indexOf(r) < 0) roles.push(r); });
  const inds = S.tags.map(t => F(t,'name','label')).filter(Boolean);
  const skillCount = {};
  S.candidates.forEach(c => skillsOf(c).forEach(x => { skillCount[x] = (skillCount[x] || 0) + 1; }));
  const skills = Object.keys(skillCount).sort((a,b) => skillCount[b] - skillCount[a]).slice(0, 400);
  const sel = (id, first, list, val, label) => '<select id="' + id + '"><option value="">' + first + '</option>' +
    list.map(x => { const v = label ? String(idOf(x)) : x, l = label ? label(x) : x;
      return '<option value="' + esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';
  const on = !!(terms.length || skill || Q.fCo || Q.fSe || Q.fCamp || Q.fRole || Q.fInd || Q.fState);
  const chip = (v, l) => '<button class="chip ' + (Q.fState === v ? 'on' : '') + '" data-fstate="' + v + '">' + l + '</button>';
  return head('Search.', on ? '<button class="btn ghost" id="fclear">Clear</button>' : '') +
    '<p class="lede" style="margin-bottom:22px">One line over the whole pool. Every word in every resume counts, then narrow it down by subject.</p>' +
    '<div class="fbar"><div class="search big">' + SRCH + '<input id="fq" placeholder="Name, title, company, a phrase from page two" value="' + esc(Q.fq) + '"></div></div>' +
    '<div class="pfil ffil">' +
      sel('fco', 'Any client', S.companies, Q.fCo, x => F(x,'name')) +
      sel('fse', 'Any job', seList, Q.fSe, x => F(x,'title','role','job_title') + (Q.fCo ? '' : ' · ' + cname(x.company_id))) +
      sel('fcamp', 'Any campaign', campList, Q.fCamp, x => (F(x,'name') || F(x,'channel') || 'Campaign') + ' · ' + sname(x.search_id)) +
      sel('frole', 'Any role type', roles, Q.fRole) +
      sel('find', 'Any industry', inds, Q.fInd) +
      '<div class="search"><input id="fskill" list="skilllist" placeholder="Skill" value="' + esc(Q.fSkill) + '"></div>' +
      '<datalist id="skilllist">' + skills.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>' +
    '</div>' +
    '<div class="tools" style="margin-top:2px">' + chip('', 'Everyone') + chip('play', 'In a search now') + chip('pool', 'Open pool') + chip('placed', 'Placed') +
      '<span class="muted small" style="margin-left:auto">' + found.length.toLocaleString() + ' of ' + S.candidates.length.toLocaleString() +
      (found.length > 200 ? ', showing the first 200' : '') + '</span>' +
      '<span class="fsort">' + [['best','Needs you'],['date','Newest'],['az','A to Z']].map(([v,l]) =>
        '<button class="chip ' + (Q.fSort === v ? 'on' : '') + '" data-fsort="' + v + '">' + l + '</button>').join('') + '</span></div>' +
    (rows.length ? '<div class="clist">' + rows.join('') + '</div>'
                 : '<div class="tbl"><div class="empty">' + (on ? 'Nobody matches that. Take a filter off.' : 'Nobody in the pool yet.') + '</div></div>');
}

/* ---------- Pipeline ----------
   Desktop keeps the six column board. Under 900px the board is replaced by
   stage tiles that filter one list, because six columns of cards cannot be
   read on a phone. Both are drawn, CSS picks. */
const CALI = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="1.6"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/></svg>';
const RCHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6 15.5 12 9.5 18"/></svg>';

/* what this row is waiting on. the follow up task wins, then the stage clock. */
function pipeStatus(p){
  const c = cand(p.candidate_id);
  const f = c ? candFollow(c) : null;
  if(f){
    const n = dayDiff(f);
    const w = n < -1 ? 'Overdue ' + Math.abs(n) + ' days'
      : n === -1 ? 'Overdue since yesterday'
      : n === 0 ? 'Follow up today'
      : n === 1 ? 'Follow up tomorrow'
      : n <= 6 ? 'Follow up ' + new Date(f).toLocaleDateString('en-US', { weekday:'long' })
      : 'Follow up ' + short(f);
    return { hot: n <= 0, icon: CALI, text: w };
  }
  const st = stageOf(p);
  const d = daysBetween(F(p,'since','created_at'));
  if(d <= 0) return { hot:false, icon: CALI, text: st + ' today' };
  if(st === 'Submitted') return { hot: d >= 7, icon: CLOCKI, text: 'Awaiting feedback \u00b7 ' + d + 'd' };
  return { hot: d >= 14, icon: CLOCKI, text: st + ' \u00b7 ' + d + 'd' };
}

/* ---------- Campaigns ----------
   A campaign is one paid or sourced push at a role, never the role itself.
   Applicants that came another way carry no campaign and are counted as
   the unpaid line, split by where they came from. */
const MID_ = '\u00b7';
const CHANNELS = ['Indeed','LinkedIn','ZipRecruiter','Glassdoor','Craigslist','Sourced list','Other'];
const campsOf = seId => S.campaigns.filter(x => String(x.search_id) === String(seId));
const campLive = x => String(F(x,'status') || 'live') !== 'ended';
const campLabel = x => [F(x,'channel'), F(x,'name')].filter(Boolean).join(' ' + '\u00b7' + ' ');
const campRows = id => S.pipeline.filter(p => String(p.campaign_id) === String(id));
function campStats(rows){
  const scored = rows.map(matchOf).filter(n => n !== null);
  const avg = scored.length ? Math.round(scored.reduce((a,b) => a + b, 0) / scored.length) : null;
  const strong = scored.filter(n => n >= 70).length;
  const sub = rows.filter(p => stageIx(p) >= 1).length;
  const placed = rows.filter(p => stageOf(p) === 'Placed').length;
  return { n: rows.length, avg, strong, sub, placed };
}
function campNoSpend(x){ return F(x,'spend') === '' || F(x,'spend') === null || F(x,'spend') === undefined; }
function spendPill(x){
  return campNoSpend(x) ? '<span class="pill warn">No spend entered</span>' : '<span class="pill">' + money(F(x,'spend')) + '</span>';
}
function campRow(x){
  const st = campStats(campRows(idOf(x)));
  const cps = (!campNoSpend(x) && st.sub) ? money(num(F(x,'spend')) / st.sub) : '';
  const cpa = (!campNoSpend(x) && st.n) ? money(num(F(x,'spend')) / st.n) : '';
  return '<div class="mrow"><div class="mh">' +
      '<div><b>' + esc(campLabel(x) || 'Campaign') + '</b>' +
        '<small>' + (campLive(x) ? 'Live since ' : 'Ended ' + MID_ + ' ran from ') + day(F(x,'started_on')) +
        (F(x,'ended_on') ? ' to ' + day(F(x,'ended_on')) : '') + '</small></div>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' + spendPill(x) +
        '<button class="btn sm ghost" data-camp="' + idOf(x) + '">' + (campNoSpend(x) ? 'Add the spend' : 'Edit') + '</button>' +
        (campLive(x) ? '<button class="btn sm ghost" data-campend="' + idOf(x) + '">End it</button>' : '') +
      '</div></div>' +
    '<div class="cstat">' +
      '<div><b>' + st.n + '</b><span>Applicants</span></div>' +
      '<div><b>' + (st.avg === null ? '' : st.avg + '%') + '</b><span>Average match</span></div>' +
      '<div><b>' + st.strong + '</b><span>Over 70</span></div>' +
      '<div><b>' + st.sub + '</b><span>Reached submit</span></div>' +
      '<div><b class="' + (cpa ? '' : 'muted') + '">' + cpa + '</b><span>Per applicant</span></div>' +
      '<div><b class="' + (cps ? '' : 'muted') + '">' + (cps || '') + '</b><span>Per submitted</span></div>' +
    '</div></div>';
}
function unpaidRows(seId){
  const rows = S.pipeline.filter(p => String(p.search_id) === String(seId) && !p.campaign_id);
  const by = {};
  rows.forEach(p => { const c = cand(p.candidate_id) || {}; const k = F(c,'source') || 'Unknown'; (by[k] = by[k] || []).push(p); });
  return Object.keys(by).sort().map(k => ({ source: k, rows: by[k] }));
}
function campaignsTab(s){
  const seId = idOf(s);
  const camps = campsOf(seId).sort((a,b) => String(F(b,'started_on')).localeCompare(String(F(a,'started_on'))));
  const unpaid = unpaidRows(seId);
  return (camps.length ? camps.map(campRow).join('')
      : '<p class="muted small">No paid push on this role yet.</p>') +
    (unpaid.length ? '<h4 class="micro" style="margin:22px 0 4px">Came another way</h4>' + unpaid.map(u => {
        const st = campStats(u.rows);
        return '<div class="mrow"><div class="mh"><div><b>' + esc(u.source) + '</b><small>No spend</small></div></div>' +
          '<div class="cstat"><div><b>' + st.n + '</b><span>People</span></div>' +
          '<div><b>' + (st.avg === null ? '' : st.avg + '%') + '</b><span>Average match</span></div>' +
          '<div><b>' + st.strong + '</b><span>Over 70</span></div>' +
          '<div><b>' + st.sub + '</b><span>Reached submit</span></div></div></div>';
      }).join('') : '') +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">' +
      '<button class="btn" data-new="campaign" data-se="' + seId + '">New campaign</button></div>';
}
/* ---------- Match against the role ----------
   The percent lives on the pipeline row, never on the person. Coverage is
   counted from the evidence rows so the number can always be opened up. */
let MOPEN = {};
function matchOf(p){ const n = F(p,'match_pct'); return (n === 0 || n) ? Number(n) : null; }
function matchRows(p){ const m = p.match_json; return (m && Array.isArray(m.rows)) ? m.rows : []; }
function matchCount(p){ const r = matchRows(p); if(!r.length) return '';
  const m = r.filter(x => x.kind !== 'nice'), n = r.filter(x => x.kind === 'nice');
  return m.filter(x => x.status === 'met').length + ' of ' + m.length + ' must haves' +
    (n.length ? ', ' + n.filter(x => x.status === 'met').length + ' of ' + n.length + ' nice' : ''); }
function matchChip(p){ const n = matchOf(p); if(n === null) return '';
  return '<button class="mch' + (n >= 80 ? ' hi' : '') + '" data-mopen="' + idOf(p) + '">' +
    '<b>' + n + '%</b><span>' + esc(matchCount(p)) + '</span></button>'; }
function matchPanel(p){ if(!MOPEN[idOf(p)]) return '';
  const r = matchRows(p); if(!r.length) return '';
  const note = (p.match_json && p.match_json.note) ? p.match_json.note : '';
  const ord = [...r].sort((a,b) => (a.kind === 'nice') - (b.kind === 'nice'));
  return '<div class="mev">' + ord.map(x =>
      '<div class="e"><span class="s ' + esc(x.status) + (x.kind === 'nice' ? ' nice' : '') + '">' + esc(x.status) + '</span>' +
      '<span><b>' + esc(x.req) + '</b>' + (x.kind === 'nice' ? '<span class="k">nice to have</span>' : '') +
      (x.evidence ? '<div class="q">' + esc(x.evidence) + '</div>' : '') + '</span></div>').join('') +
    (note ? '<p class="muted small" style="margin-top:10px">' + esc(note) + '</p>' : '') + '</div>'; }
async function runMatch(search_id, candidate_id){
  toast('Reading everyone against the role.');
  try{
    const b = candidate_id ? { search_id, candidate_id } : { search_id };
    const r = await fnCall('match-score', b);
    await loadAll(); paintSheet(); drawNav(); draw();
    toast('Matched ' + r.scored + (r.scored === 1 ? ' candidate.' : ' candidates.'));
  }catch(e){ toast(e.message, true); }
}

function vPipeline(){
  /* the two filters narrow everything below them, tiles included */
  const inCo = p => { const se = search(p.search_id) || {};
    return !Q.pipeCo || String(se.company_id) === String(Q.pipeCo); };
  const inSe = p => !Q.pipeSe || String(p.search_id) === String(Q.pipeSe);
  const pq = Q.pipeQ.trim().toLowerCase();
  const inQ = p => !pq || (pname(p.candidate_id) + ' ' + sname(p.search_id) + ' ' + cname((search(p.search_id)||{}).company_id)).toLowerCase().includes(pq);
  const shown = S.pipeline.filter(p => inCo(p) && inSe(p) && inQ(p));
  const coIds = [...new Set(S.pipeline.map(p => String((search(p.search_id) || {}).company_id)).filter(x => x && x !== 'undefined'))];
  const seList = S.searches.filter(x => S.pipeline.some(p => String(p.search_id) === String(idOf(x)))
    && (!Q.pipeCo || String(x.company_id) === String(Q.pipeCo)));
  const stage = STAGES.indexOf(Q.stage) < 0 ? 'Submitted' : Q.stage;
  /* whatever is waiting on somebody rides the top, longest wait first */
  const prank = p => { const st = pipeStatus(p);
    return (st.hot ? 0 : 1000) - daysBetween(F(p,'since','created_at')); };
  const rows = shown.filter(p => stageOf(p) === stage)
    .map(p => ({ p, r: prank(p) })).sort((a,b) => a.r - b.r).map(x => x.p);

  /* the filter bar sits above both layouts, so the board narrows the same way the phone does */
  const fil =
    '<div class="pfil">' +
      '<select id="pco"><option value="">All clients</option>' +
        coIds.map(id => '<option value="' + esc(id) + '"' + (String(Q.pipeCo) === id ? ' selected' : '') + '>' +
          esc(cname(id)) + '</option>').join('') + '</select>' +
      '<select id="pse"><option value="">All roles</option>' +
        seList.map(x => '<option value="' + esc(idOf(x)) + '"' + (String(Q.pipeSe) === String(idOf(x)) ? ' selected' : '') + '>' +
          esc(F(x,'title','role','job_title')) + '</option>').join('') + '</select>' +
      '<div class="search">' + SRCH + '<input id="pq" placeholder="Candidate name" value="' + esc(Q.pipeQ) + '"></div>' +
    '</div>';

  const phone =
    '<div class="pstage">' + STAGES.map(st => '<button class="' + (st === stage ? 'on' : '') +
      '" data-pstage="' + st + '"><b>' + shown.filter(p => stageOf(p) === st).length + '</b>' +
      '<span>' + st + '</span></button>').join('') + '</div>' +
    '<div class="phead"><h2>' + stage + '</h2><span>' + rows.length +
      (rows.length === 1 ? ' candidate' : ' candidates') + '</span></div>' +
    (rows.length ? '<div class="plist">' + rows.map(pipeRow).join('') + '</div>'
                 : '<div class="tbl"><div class="empty">Nobody sits at ' + stage.toLowerCase() + ' right now.</div></div>');

  const cols = STAGES.map(st => {
    const rows = shown.filter(p => stageOf(p) === st);
    return '<div class="col"><h4><span>' + st + '</span><span>' + rows.length + '</span></h4>' +
      rows.map(p => '<div class="card ' + (isReleased(p)?'rel':'') + '" data-pipe="' + idOf(p) + '">' +
        '<b>' + esc(pname(p.candidate_id)) + '</b>' +
        '<span class="m">' + esc(sname(p.search_id)) + '</span>' +
        '<span class="m">' + esc(cname((search(p.search_id)||{}).company_id)) + '</span>' +
        '<span class="m" style="margin-top:6px">' + (isReleased(p) ? 'Released to the client' : 'Held') + '</span>' +
        (matchOf(p) === null ? '' : '<div style="margin-top:8px">' + matchChip(p) + '</div>') +
        '<div class="acts">' +
          (stageIx(p) < 4 ? '<button data-adv="' + idOf(p) + '">Advance</button>' : '') +
          '<button data-rel="' + idOf(p) + '">' + (isReleased(p)?'Hold':'Release') + '</button>' +
          (stageOf(p) !== 'Passed' && stageOf(p) !== 'Placed' ? '<button data-pass="' + idOf(p) + '">Pass</button>' : '') +
          '<button data-mail="pipe:' + idOf(p) + '">Present</button>' +
          '<button data-note="' + p.candidate_id + '|' + p.search_id + '">Interview note</button>' +
          '<button data-guide="' + p.candidate_id + '|' + p.search_id + '|' + idOf(p) + '">Guide</button>' +
          (isReleased(p) ? '<button data-guidemail="' + p.candidate_id + '|' + p.search_id + '">Send guide</button>' : '') +
          (stageOf(p) !== 'Placed' ? '<button data-mvrole="' + idOf(p) + '">Move to role</button>' : '') +
        '</div></div>').join('') + '</div>';
  }).join('');
  return head('Pipeline.', '<button class="btn pill" data-new="pipeline"><span class="p">+</span>Submit</button>') +
    fil +
    '<div class="pphone">' + phone + '</div>' +
    '<p class="lede pdesk" style="margin-bottom:20px">A yellow edge means released. Released is exactly what the client sees in their room, nothing else.</p>' +
    '<div class="board">' + cols + '</div>';
}

      '<div class="stat"><b>' + money(S.placements.length ? S.placements.reduce((n,p) => n + num(F(p,'salary')), 0) / S.placements.length : 0) + '</b><span>Average salary placed</span></div>' +
    '</div>' +
    table(['Candidate','Client','Started','Salary','Fee','Campaign cost','Time to fill','Guarantee'],
      S.placements.slice().sort((a,b) => String(F(b,'start_date','created_at')).localeCompare(String(F(a,'start_date','created_at')))).map(p => {
        const d = daysBetween(F(p,'start_date','created_at'));
        const pct = Math.min(100, Math.round(d / 90 * 100));
        const cost = campSpendOnSe(p.search_id), ttf = timeToFill(p);
        return '<div class="r" style="grid-template-columns:' + PL_GRID + '" data-place="' + idOf(p) + '">' +
          '<b>' + esc(pname(p.candidate_id)) + '</b>' +

          '<span class="muted" title="Spend on every campaign run for this search">' + (cost === null ? '<span class="small">No campaign</span>' : money(cost)) + '</span>' +
          '<span class="muted" title="From the search opening to the placement being recorded">' + (ttf === null ? '<span class="small">No open date</span>' : ttf + (ttf === 1 ? ' day' : ' days')) + '</span>' +
          '<div><span class="muted small">' + (d >= 90 ? 'Cleared' : (90 - d) + (90 - d === 1 ? ' day left' : ' days left')) + '</span><div class="gbar"><i style="width:' + pct + '%"></i></div></div></div>';
      }), PL_GRID);
}
const PL_GRID = '1.2fr 1.2fr 110px 105px 100px 115px 100px 1fr';
/* campaign cost on one search: the spend on every campaign tied to it. null when no campaign was run */
function campSpendOnSe(seId){
  const xs = S.campaigns.filter(x => String(x.search_id) === String(seId));
  if(!xs.length) return null;
  return xs.reduce((n, x) => n + num(F(x,'spend')), 0);
}
/* days from the search opening to the day the placement was recorded (the start date can be weeks later) */
function timeToFill(p){
  const s = search(p.search_id) || {};
  const from = F(s,'opened_at','created_at'), to = F(p,'created_at') || F(p,'start_date');
  if(!from || !to) return null;
  return daysBetween(from, to);
}
